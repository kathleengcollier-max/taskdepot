// A person can send task emails from more than one address — a shared AP or purchasing
// mailbox, an old address, a phone account. Without this, intake sees a stranger and drops it.
function AltEmails({person,invitee,canEdit,showToast}){
  const key = invitee ? {col:"invitee_email", val:String(invitee).toLowerCase()} : {col:"profile_id", val:person.id};
  const [rows,setRows] = useState(null);
  const [adding,setAdding] = useState(false);
  const [addr,setAddr] = useState(""); const [note,setNote] = useState("");
  const load = useCallback(()=>{
    sb.from("person_emails").select("*").eq(key.col,key.val).order("created_at")
      .then(({data,error})=>{ if(error){ showToast(error.message); return; } setRows(data||[]); });
  },[key.col,key.val,showToast]);
  useEffect(()=>{load();},[load]);
  const add = async () => {
    const e = addr.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e)){ showToast("That doesn't look like an email address"); return; }
    const row = invitee ? {invitee_email:key.val, email:e, note:note.trim()||null}
                        : {profile_id:person.id, email:e, note:note.trim()||null};
    const {error} = await sb.from("person_emails").insert(row);
    if(error){ showToast(/duplicate|unique/i.test(error.message) ? "That address is already on somebody" : error.message); return; }
    setAddr(""); setNote(""); setAdding(false); load();
    showToast(invitee ? "Added — it starts working the day they sign up" : "Added — email from there will land as their task");
  };
  const drop = async (r) => {
    const {error} = await sb.from("person_emails").delete().eq("id",r.id);
    if(error){ showToast(error.message); return; }
    load(); showToast("Removed");
  };
  if(!rows) return null;
  return <div style={{marginTop:6}}>
    {rows.length>0 && <div style={{fontSize:13,color:"var(--muted)"}}>
      Also sends from: {rows.map((r,i)=><span key={r.id}>{i>0?", ":""}
        <b>{r.email}</b>{r.note?` (${r.note})`:""}
        {canEdit && <button className="btn q" title="Remove this address"
          style={{padding:"0 4px",color:"var(--muted)"}} onClick={()=>drop(r)}>&times;</button>}</span>)}
      {invitee && <span> — live once they sign up</span>}
    </div>}
    {canEdit && (adding
      ? <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
          <input value={addr} onChange={e=>setAddr(e.target.value)} placeholder="ap@johnstoneoc.com" autoFocus
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } }}
            style={{flex:"1 1 200px",border:"1px solid var(--line)",borderRadius:8,padding:"6px 9px"}}/>
          <input value={note} onChange={e=>setNote(e.target.value)} placeholder="what it is (optional)"
            style={{flex:"1 1 140px",border:"1px solid var(--line)",borderRadius:8,padding:"6px 9px"}}/>
          <button className="btn sm p" onClick={add}>Add</button>
          <button className="btn sm" onClick={()=>{setAdding(false);setAddr("");setNote("");}}>Cancel</button>
        </div>
      : <button className="btn q" style={{padding:"2px 0",color:"var(--navy)",fontSize:13}}
          onClick={()=>setAdding(true)}>+ another email address they send from</button>)}
  </div>;
}

// A dropdown you can tick several things in. The button says what is chosen, so a
// filter that is on never hides behind a closed panel.
function MultiPick({allLabel, options, value, onChange}){
  const [open,setOpen] = useState(false);
  const box = useRef(null);
  useEffect(()=>{
    if(!open) return;
    const away = (e)=>{ if(box.current && !box.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", away);
    return ()=>document.removeEventListener("mousedown", away);
  },[open]);
  const sel = value||[];
  const toggle = (k) => onChange(sel.includes(k) ? sel.filter(x=>x!==k) : [...sel,k]);
  const text = !sel.length ? allLabel
    : sel.length===1 ? ((options.find(o=>o.k===sel[0])||{}).label || "1 selected")
    : `${sel.length} selected`;
  return <div className="multipick" ref={box}>
    <button type="button" className={"mp-btn"+(sel.length?" on":"")} onClick={()=>setOpen(!open)}>
      <span className="mp-text">{text}</span><span className="mp-caret">{open?"\u25B4":"\u25BE"}</span>
    </button>
    {open && <div className="mp-panel">
      {sel.length>0 && <button type="button" className="mp-clear" onClick={()=>onChange([])}>{"Clear \u2014 show all"}</button>}
      {options.map(o=>o.header
        ? <div key={"h"+o.header} className="mp-head">{o.header}</div>
        : <label key={o.k} className="mp-row">
            <input type="checkbox" checked={sel.includes(o.k)} onChange={()=>toggle(o.k)}/>
            <span>{o.label}</span></label>)}
    </div>}
  </div>;
}

// ---------- all tasks ----------
function AllTasks(ctx){
  const {tasks,people,today,isMgr,me} = ctx;
  // The filters stick. Resetting to "everything" every visit meant narrowing the list
  // was work you redid each time, so nobody did it. The search box deliberately does
  // NOT persist \u2014 coming back to a stale search term reads as missing data.
  const KEY = "td_all_filters_" + ((me&&me.id)||"anon");
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e){ return null; } })();
  const [q,setQ] = useState("");
  // The box used to look only at the title, context and details of tasks already
  // loaded. It now asks the server, which also reads comments, steps, the definition of
  // done and standing notes \u2014 about a fifth of real matches live there. The local
  // test still runs while the answer is on its way, so typing never feels laggy.
  const [found,setFound] = useState(null);
  useEffect(()=>{
    const text = q.trim();
    if(text.length < 2){ setFound(null); return; }
    let live = true;
    const h = setTimeout(async ()=>{
      const {data,error} = await sb.rpc("search_all",{q:text, include_closed:true});
      if(!live) return;
      setFound(error ? new Map() : new Map((data||[]).map(r=>[r.task_id,{hit:r.hit_kind, snippet:r.snippet}])));
    }, 250);
    return ()=>{ live=false; clearTimeout(h); };
  },[q]);
  const searching = q.trim().length >= 2;
  const [st,setSt] = useState(saved ? saved.st : "open");
  const [who,setWho] = useState(saved ? (saved.who||[]) : []);
  // First visit for a manager opens on the work they handed out, which is the question
  // this screen usually answers. Everything else is one tick away and the banner says so.
  const [origin,setOrigin] = useState(saved ? cleanOrigin(saved.origin) : (isMgr ? ["delegated"] : []));
  useEffect(()=>{ try{ localStorage.setItem(KEY, JSON.stringify({st,who,origin})); }catch(e){} },[KEY,st,who,origin]);
  const filtered = st!=="open" || who.length>0 || origin.length>0;
  const clearAll = () => { setSt("open"); setWho([]); setOrigin([]); setQ(""); };
  const peopleOpts = [
    ...people.filter(p=>p.active).map(p=>({k:p.id, label:p.full_name})),
    ...((INVITEES||[]).length ? [{header:"Not signed up yet"}] : []),
    ...(INVITEES||[]).map(i=>({k:"email:"+i.email, label:i.full_name||i.email})),
  ];
  const match = (t) => {
    if(st==="open") return !CLOSED(t.status);
    if(st==="blocked") return !CLOSED(t.status) && t.status==="waiting" && !t.need_help && !t.need_manager;
    if(st==="needsyou") return !CLOSED(t.status) && ASKING_ANY(t)
                                && (ASKING(t) || t.assignee_id===(ME&&ME.id));
    if(st==="done") return t.status==="done";
    if(st==="skipped") return t.status==="skipped";
    return true;
  };
  const openCount = tasks.filter(t=>!CLOSED(t.status)).length;
  const list = tasks.filter(match)
    .filter(t=>!origin.length || origin.includes(startedAs(t)))
    .filter(t=>!who.length || who.some(w => String(w).startsWith("email:")
        ? String(t.assignee_email||"").toLowerCase() === String(w).slice(6)
        : t.assignee_id === w))
    .filter(t=>!searching ? true
      : found ? found.has(t.id)
      : (t.title+" "+t.context+" "+t.details).toLowerCase().includes(q.trim().toLowerCase()))
    .map(t=>{ const f = found && found.get(t.id);
              return f ? {...t, __hit:f.hit, __snippet:f.snippet} : t; });
  return <>
    <div className="h"><h2>{isMgr?"All tasks":"All my tasks"}</h2>
      <span className="sub">{list.length} shown{filtered?` of ${openCount} open`:""}</span></div>
    <div className="filters" style={{marginBottom:10}}>
      <input placeholder="Search titles, notes, comments and steps" value={q} onChange={e=>setQ(e.target.value)}/>
      <select value={st} onChange={e=>setSt(e.target.value)}>
        <option value="open">Open</option>
        <option value="blocked">Blocked — waiting on someone else</option>
        <option value="needsyou">Needs you</option>
        <option value="skipped">Skipped</option>
        <option value="done">Done</option>
        <option value="all">Everything</option></select>
      {isMgr && <MultiPick allLabel="Everyone" value={who} onChange={setWho} options={peopleOpts}/>}
      {isMgr && <MultiPick allLabel="Assigned or their own" value={origin} onChange={setOrigin} options={ORIGIN_OPTS}/>}
      {filtered && <button className="btn sm" onClick={clearAll}>Clear filters</button>}
    </div>
    {filtered && <div className="note" style={{marginBottom:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{flex:1}}>
        A filter is on, and it stays on next time you open this screen.
        {origin.length===1 && origin[0]==="delegated" ? " You're looking at what you handed out \u2014 work people set for themselves is hidden." : ""}
      </span>
      <button className="btn sm" onClick={clearAll}>Show everything</button>
    </div>}
    <TaskTable list={list} people={people} today={today} setOpen={ctx.opener(list)} isMgr={isMgr} empty="No tasks match."
      cols={searching
        ? (isMgr?["who","title","matched","snippet","status","due"]:["title","matched","snippet","status","due"])
        : (isMgr?["who","title","status","origin","entered","due","updated"]:["title","status","origin","entered","due","updated"])}/>
  </>;
}

// One table for every list in the app. `cols` picks the columns; `actions` adds a
// right-hand cell of buttons; rows open the drawer unless `actions` says otherwise.
function TaskTable({list,people,today,setOpen,cols,isMgr,empty,actions,why}){
  const [sort,setSort] = useState(null);
  // WATCHED is a plain Set shared across the app, so nudge React when it changes
  const [,bump] = useState(0);
  const canWatch = !!(ME && (ME.role==="owner" || ME.role==="manager"));
  const toggleWatch = async (e,t) => {
    e.stopPropagation();                       // the row opens the task; the eye must not
    const on = !WATCHED.has(t.id);
    if(on) WATCHED.add(t.id); else WATCHED.delete(t.id);
    noteWatch(t, on, ME);
    bump(x=>x+1);
    const {error} = on
      ? await sb.from("task_watchers").insert({task_id:t.id, user_id:ME.id})
      : await sb.from("task_watchers").delete().eq("task_id",t.id).eq("user_id",ME.id);
    if(error){ if(on) WATCHED.delete(t.id); else WATCHED.add(t.id); noteWatch(t, !on, ME); bump(x=>x+1); }
  };
  const whoOf = (t) => ownerName(people, t);
  const finishedAt = (t) => new Date(t.status==="skipped" ? t.updated_at : (t.completed_at || t.updated_at));
  const ago = (d) => { const days=Math.round((Date.now()-d)/86400000);
    return days<=0 ? "today" : days===1 ? "yesterday" : `${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})} (${days}d ago)`; };
  const dueCls = (t) => { if(!t.due_date || CLOSED(t.status)) return ""; return t.due_date < today ? "late" : t.due_date===today ? "today" : ""; };

  const COLS = {
    who:     {label:"Person", cls:"who", val:t=>whoOf(t).toLowerCase(), cell:t=>whoOf(t)},
    title:   {label:"Task", cls:"task", val:t=>t.title.toLowerCase(), cell:t=><>
               {canWatch && (() => {
                 const mine = WATCHED.has(t.id), others = otherWatchers(t);
                 const also = others.length ? watcherNames(others) : "";
                 return <button type="button"
                   className={"weye"+(mine?" on":others.length?" others":"")}
                   onClick={(e)=>toggleWatch(e,t)}
                   title={mine
                     ? (others.length ? `Watching \u2014 so ${also} ${others.length>1?"are":"is"} too. Press to stop`
                                      : "Watching \u2014 press to stop")
                     : (others.length ? `${also} ${others.length>1?"are":"is"} watching this. Press to watch it too`
                                      : "Keep an eye on this one")}>
                   <Eye on={mine || others.length>0}/></button>;
               })()}
               {t.title}
               {(() => {
                 const c = STEP_COUNTS[t.id];
                 if(!c || !c[1]) return null;
                 const [done,total] = c, all = done===total;
                 return <span className="steps-n" title={`${done} of ${total} step${total>1?"s":""} ticked off`}
                   style={all?{color:"var(--ok)"}:null}>{` (${done}/${total})`}</span>;
               })()}
               {t.priority==="high" && <span className="pill high" style={{marginLeft:6}}>High</span>}
               {(t.need_manager||t.need_help) && (() => {
                 const at = ASKEE(t), mine = !!(ME && at === ME.id);
                 const who = mine ? "you" : (at ? String(nameOf(people,at)).split(" ")[0] : "a manager");
                 return <span className="pill" style={{marginLeft:6,background:mine?"#fdecea":"#f1f3f7",color:mine?"var(--red)":"var(--muted)"}}>
                   {mine ? (t.need_help ? "Needs help" : "Needs you") : `Needs ${who}`}</span>;
               })()}
               {t.bd_status==="returned" && <span className="pill" style={{marginLeft:6,background:"#e0ecff",color:"#1f3a7a"}}>Returned to Kathleen's Inbox</span>}
               {LINK_COUNTS[t.id] > 0 && <span className="pill" title="Linked to other tasks"
                 style={{marginLeft:6,background:"#eef3fd",color:"var(--navy)"}}>&#128279; {LINK_COUNTS[t.id]}</span>}
             </>},
    origin:  {label:"Assigned by", cls:"muted", val:t=>DELEGATED(t)?"0":t.asked_by?"1":"2",
              cell:t=>DELEGATED(t)
                    ? (t.created_by===(ME&&ME.id) ? "You assigned" : String(nameOf(people,t.created_by)).split(" ")[0]+" assigned")
                    : t.asked_by
                      ? (ASKEDBYME(t) ? "You asked for it" : String(nameOf(people,t.asked_by)).split(" ")[0]+" asked for it")
                    : t.assignee_id ? (t.assignee_id===(ME&&ME.id) ? "Your own" : "Their own") : "—"},
    status:  {label:"Status", val:t=>(STATUS[t.status]||"").toLowerCase(),
              cell:t=><><span className={"pill "+t.status}>{STATUS[t.status]}</span>
                {t.status==="waiting" && t.waiting_on ? <span className="meta"> on {t.waiting_on}</span> : null}</>},
    entered: {label:"Entered", cls:"num muted hide-sm", val:t=>t.created_at||"", cell:t=>fmtDate(String(t.created_at).slice(0,10))},
    due:     {label:"Due", cls:"num", cellCls:dueCls, val:t=>t.due_date||"9999", cell:t=>t.due_date?fmtDate(t.due_date):"—"},
    updated: {label:"Last update", cls:"num muted hide-sm", val:t=>t.last_update_at||t.updated_at||"", cell:t=>t.last_update_at?fmtWhen(t.last_update_at):"—"},
    finished:{label:"Finished", cls:"num", val:t=>String(+finishedAt(t)).padStart(16,"0"), cell:t=>ago(finishedAt(t))},
    trashed: {label:"Trashed", cls:"num muted", val:t=>t.updated_at||"",
              cell:t=>t.bd_status==="returned" ? `Sent back ${fmtWhen(t.updated_at)}` : fmtWhen(t.updated_at)},
    repeats: {label:"Repeats", cls:"muted", val:t=>recurLabel(t).toLowerCase(), cell:t=>recurLabel(t)},
    unread:  {label:"", cls:"unreadcol", val:t=>t.__unread?"0":"1",
              cell:t=>t.__unread
                ? <span className="newdot" title="You haven't looked at this one yet">New</span>
                : <span className="seendot" title="Already seen">{"\u2713"}</span>},
    matched: {label:"Matched in", cls:"muted", val:t=>String(t.__hit||""), cell:t=>t.__hit||""},
    snippet: {label:"Where", cls:"muted hide-sm", val:t=>String(t.__snippet||""),
              cell:t=><span style={{fontSize:13}}>{t.__snippet||""}</span>},
    why:     {label:"Why", cls:"whycol", val:t=>{const a=why?why(t):attention(t,today); return a?String(a.rank??9):"9";},
              cell:t=>{const a=why?why(t):attention(t,today); return a ? <span className={"why "+a.tone}>{a.why}</span> : null;}},
  };
  const keys = (cols||["who","title","status","due","updated"]).filter(k=>COLS[k] && !(k==="who" && isMgr===false));

  const rows = (() => {
    if(!sort) return list;
    const c = COLS[sort.k]; if(!c) return list;
    return list.slice().sort((a,b)=>{ const x=c.val(a), y=c.val(b);
      return (x<y?-1:x>y?1:0)*sort.dir || String(a.title).localeCompare(String(b.title)); });
  })();

  if(!list.length) return <div className="card"><div className="empty">{empty||"Nothing here."}</div></div>;
  return <div className="card tablewrap">
    <table className="ttable"><thead><tr>
      {keys.map(k=><th key={k} className={COLS[k].cls||""} title="Sort by this column"
        onClick={()=>setSort(sort && sort.k===k ? (sort.dir===1?{k,dir:-1}:null) : {k,dir:1})}>
        {COLS[k].label}{sort && sort.k===k ? <span className="sortmark">{sort.dir===1?"\u25B4":"\u25BE"}</span> : null}</th>)}
      {actions && <th className="num"></th>}
    </tr></thead><tbody>
      {rows.map(t=><tr key={t.id} onClick={()=>setOpen && setOpen(t.id)} style={setOpen?undefined:{cursor:"default"}}
        className={ASKING(t) ? "r-asking" : WATCHED.has(t.id) ? "r-watching" : ""}>
        {keys.map(k=><td key={k} className={[COLS[k].cls||"",COLS[k].cellCls?COLS[k].cellCls(t):""].join(" ").trim()}>{COLS[k].cell(t)}</td>)}
        {actions && <td className="num" onClick={e=>e.stopPropagation()}>{actions(t)}</td>}
      </tr>)}
    </tbody></table>
  </div>;
}

// ---------- employee my day ----------
function MyDay(ctx){
  const {tasks,today,people,update,me} = ctx;
  const mine = tasks.filter(t=>!CLOSED(t.status) && t.assignee_id===me.id);
  const handedUp = tasks.filter(t=>!CLOSED(t.status) && t.created_by===me.id && t.assignee_id!==me.id);
  const flagged = mine.filter(t=>t.need_help || t.need_manager);
  const rest = mine.filter(t=>!flagged.includes(t));
  const dueToday = rest.filter(t=>t.due_date && t.due_date<=today);
  const waiting = rest.filter(t=>t.status==="waiting");
  const review = rest.filter(t=>t.status==="ready_for_review");
  const upcoming = rest.filter(t=>!dueToday.includes(t) && t.status!=="waiting" && t.status!=="ready_for_review");
  const groups = [["Waiting on your manager",flagged],["Due today or overdue",dueToday],["Waiting on someone else",waiting],["Waiting for your manager's review",review],["Upcoming",upcoming],["Handed to your manager",handedUp]];
  return <>
    <div className="h"><h2>My day</h2><span className="sub">{fmtDate(today)} · {mine.length} open</span></div>
    {mine.length===0 && handedUp.length===0 && <div className="card"><div className="empty">Nothing on your plate right now. Tap + Add task to give yourself one.</div></div>}
    {groups.map(([l,list])=> list.length ? <React.Fragment key={l}>
      <div className="section-title">{l} ({list.length})</div>
      {l==="Waiting on your manager" && <div style={{fontSize:13,color:"var(--muted)",margin:"-2px 0 6px"}}>You've asked for help on these. They'll move back once you get a reply — nothing to do in the meantime.</div>}
      <TaskTable list={groupSeries(list).map(g=>g.t)} people={people} today={today} setOpen={ctx.opener(list)}
        isMgr={false} cols={["title","status","origin","entered","due","updated"]}/></React.Fragment> : null)}
  </>;
}

// ---------- assign modal (manager) ----------
function AssignModal(ctx){
  const {people,me,onClose,load,showToast,today,isMgr,parent,prefill,fromMention} = ctx;
  const blank = {title:"",assignee_id:isMgr?"":me.id,due_date:"",priority:"normal",context:parent?parent.context:"",details:"",definition_of_done:"",standing_notes:"",recur_rule:"",recur_day:"",recur_cap:3,asked_by:""};
  const [several,setSeveral] = useState([]);   // extra people to give a copy to
  // Only someone above you can have asked: you cannot put work on a colleague this way.
  const askers = (people||[]).filter(p=>p.active && p.id!==me.id &&
    (p.role==="owner" || p.id===me.manager_id));
  const [steps,setSteps] = useState([]);      // checklist typed while writing the task
  const [stepText,setStepText] = useState("");
  const addStep = () => {
    const lines = stepText.split(/\r?\n/).map(x=>x.replace(/^\s*[-*\u2022]\s*/,"").trim()).filter(Boolean);
    if(!lines.length) return;
    setSteps([...steps, ...lines]); setStepText("");
  };
  const [f,setF] = useState(prefill ? {...blank, ...prefill} : blank); const [ai,setAi] = useState(""); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  // Work goes down or sideways-to-yourself, never up. Putting something on your
  // manager's plate is Need help or a 1:1 mention, which keeps it tied to the task.
  const staff = ctx.isOwner
    ? people.filter(p=>p.active)
    : people.filter(p=>p.active && (p.id===me.id || p.manager_id===me.id));
  const pending = isMgr ? (ctx.invitees||[]) : [];
  const capture = async () => {
    if(!ai.trim()) return; setBusy(true); setErr("");
    try{
      const roster = Object.fromEntries(staff.map(p=>[p.full_name,p.id]));
      const {data,error} = await sb.functions.invoke("ai",{body:{action:"capture",text:ai,roster,today}});
      if(error) throw error; if(data.error) throw new Error(data.error);
      const t = data.task; setF({...blank, ...Object.fromEntries(Object.entries(t).filter(([k,v])=>v!==null && k in blank))});
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  };
  const save = async () => {
    if(!f.title.trim()) { setErr("A task needs a title."); return; }
    if(!several.length && !f.assignee_id) { setErr("Give this to someone — a task with no owner gets forgotten."); return; }
    if(!f.due_date) { setErr("Set a due date. Without one it can never be overdue, so nobody is ever reminded."); return; }
    setBusy(true);
    const byEmail = String(f.assignee_id||"").startsWith("email:") ? f.assignee_id.slice(6) : null;
    const row = {...f, created_by:me.id, asked_by:(f.assignee_id===me.id && f.asked_by) ? f.asked_by : null,
                 assignee_id:byEmail?null:(f.assignee_id||null), assignee_email:byEmail, due_date:f.due_date||null, parent_id:parent?parent.id:null,
                 recur_rule:f.recur_rule||null, recur_day:(!f.recur_rule||f.recur_rule==="daily"||f.recur_rule==="yearly")?null:(parseInt(f.recur_day)||null), recur_cap:Math.max(2, parseInt(f.recur_cap)||3)};
    const targets = several.length ? several : [byEmail ? "email:"+byEmail : row.assignee_id];
    const rows = targets.map(target => String(target||"").startsWith("email:")
      ? {...row, assignee_id:null, assignee_email:String(target).slice(6)}
      : {...row, assignee_id:target||null, assignee_email:null});
    const {data:made, error} = await sb.from("tasks").insert(rows).select("id");
    const firstMade = made && made.length ? made[0].id : null;
    // one job split between people — link the copies so any of them shows the others
    if(!error && made && made.length>1){
      const {error:le} = await sb.rpc("link_many",{p_task:firstMade, p_others:made.slice(1).map(x=>x.id)});
      if(le) showToast("Tasks saved, but they couldn't be linked to each other");
    }
    if(!error && steps.length && made && made.length){
      const stepRows = made.flatMap(t => steps.map((body,i)=>({task_id:t.id, body, position:i, created_by:me.id})));
      const {error:se} = await sb.from("task_steps").insert(stepRows);
      if(se) showToast("Task saved, but the steps didn't: "+se.message);
    }
    setBusy(false);
    if(error){ setErr(error.message); return; }
    await load();
    showToast(rows.length>1 ? `Assigned to ${rows.length} people — their copies are linked to each other`
      : byEmail ? `Saved for ${byEmail} — it'll be waiting when they sign up`
      : `Assigned to ${nameOf(people,row.assignee_id)}`);
    onClose();
    if(firstMade && fromMention){
      const {error:le} = await sb.rpc("mention_became_task",{p_id:fromMention, p_task:firstMade});
      if(le) showToast("Task saved, but it could not be linked to the mention");
    }
    // drop straight into the task so a comment or attachment can go on now
    if(firstMade && rows.length===1 && ctx.setOpen) ctx.setOpen(firstMade, [firstMade]);
  };
  const tone = toneOf("not_started");
  return <div className="modalbg" style={{zIndex:50}} onClick={onClose}><div className="modal"
      style={{"--tab":tone.fg, "--tabwash":tone.bg}} onClick={e=>e.stopPropagation()}>
    <div className="spine">
      <span>{"New task"}</span>
      <span className="spine-sub">{parent ? "linked to another task" : isMgr ? "handing it over" : "yours"}</span>
    </div>
    <h2>{parent ? "Split off a linked task" : isMgr ? "Assign a task" : "Add a task"}</h2>
    {parent && <div className="note" style={{marginBottom:12}}>This becomes its own task, linked back to <b>{parent.title}</b>, with its own owner and due date.{!isMgr && " You can hand it to yourself or to your manager."}</div>}
    {isMgr && <div className="ai">
      <div style={{fontWeight:600,marginBottom:6}}>Or just describe it</div>
      <textarea placeholder='"Ilah needs to get an updated freight quote from Goodman for the Anaheim equipment order by Friday." Or paste an email.' value={ai} onChange={e=>setAi(e.target.value)}/>
      <div className="actions"><button className="btn" disabled={busy||!ai.trim()} onClick={capture}>{busy?"Reading…":"Fill in the form for me"}</button></div>
    </div>}
    <div className="form" style={{marginTop:14}}>
      <label>Task<input autoFocus value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="Get updated freight quote from Goodman"/></label>
      <div className="three">
        <label>Assign to<select value={several.length?"":f.assignee_id} disabled={several.length>0} onChange={e=>setF({...f,assignee_id:e.target.value})}><option value="">{several.length?`${several.length} people selected below`:"Unassigned"}</option>{staff.map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}
          {pending.length>0 && <optgroup label="Invited — not signed up yet">{pending.map(p=><option key={p.email} value={"email:"+p.email}>{p.full_name||p.email}</option>)}</optgroup>}</select></label>
        <label>Due<input type="date" value={f.due_date} onChange={e=>setF({...f,due_date:e.target.value})}/></label>
        <label>Priority<select value={f.priority} onChange={e=>setF({...f,priority:e.target.value})}><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option></select></label>
      </div>
      {/* Writing down your own task? Say if someone asked for it, and it reaches them too. */}
      {!several.length && f.assignee_id === me.id && askers.length>0 &&
        <label>Who asked for this?
          <select value={f.asked_by} onChange={e=>setF({...f,asked_by:e.target.value})}>
            <option value="">Nobody {"\u2014"} it's my own</option>
            {askers.map(a=><option key={a.id} value={a.id}>{a.full_name}</option>)}
          </select>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>
            Say so and it shows on their list as something they asked for, not as your own work.
          </div>
        </label>}
      {isMgr && (staff.length+pending.length)>1 && <div>
        <div className="section-title" style={{marginTop:0}}>Or give the same task to several people</div>
        <div>{[...staff.map(p=>({k:p.id, label:p.full_name})),
               ...pending.map(p=>({k:"email:"+p.email, label:(p.full_name||p.email)+" (not signed up yet)"}))]
          .map(o=><button key={o.k} type="button" className="chip" style={several.includes(o.k)?{background:"var(--navy)",color:"#fff",borderColor:"var(--navy)"}:{}}
            onClick={()=>setSeveral(several.includes(o.k)?several.filter(x=>x!==o.k):[...several,o.k])}>{o.label}</button>)}</div>
        {several.length>0 && <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>Each person gets their own copy with its own progress and due date, and the copies are linked to each other so you can see them together. Tap a name again to remove them.</div>}
      </div>}
      <label>Details<textarea value={f.details} onChange={e=>setF({...f,details:e.target.value})}/></label>
      <div>
        <div className="section-title" style={{marginTop:0}}>Steps {steps.length?`(${steps.length})`:""}</div>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:6}}>A checklist inside the task — no separate cards, no separate owner. Paste a list and each line becomes a step.</div>
        {steps.map((x,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderTop:"1px solid var(--line)"}}>
          <span style={{color:"var(--muted)",fontSize:13,minWidth:18}}>{i+1}.</span>
          <span style={{flex:1}}>{x}</span>
          <button type="button" className="btn q" style={{padding:"0 6px",color:"var(--muted)"}} onClick={()=>setSteps(steps.filter((_,j)=>j!==i))}>×</button>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <textarea value={stepText} onChange={e=>setStepText(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); addStep(); } }}
            placeholder="Add a step, then Enter" rows={1}
            style={{flex:1,border:"1px solid var(--line)",borderRadius:8,padding:"9px 11px",minHeight:42,resize:"vertical"}}/>
          <button type="button" className="btn sm" onClick={addStep} disabled={!stepText.trim()}>Add</button>
        </div>
      </div>
      <Recur f={f} setF={setF}/>
        {err && <div className="err">{err}</div>}
      <div className="actions"><button className="btn" onClick={onClose}>Cancel</button><button className="btn p" disabled={busy} onClick={save}>{isMgr?"Assign":"Add"}</button></div>
    </div>
  </div></div>;
}

// ---------- task detail modal ----------
function TaskModal(ctx){
  const {task:t,people,me,isMgr,update,trash,onClose,showToast,addSub,tasks,setOpen,today,queueIds} = ctx;
  const queue = (queueIds||[]).filter(id=>tasks.some(x=>x.id===id));
  const at = queue.indexOf(t.id);
  const go = (delta) => { const n = queue[at+delta]; if(n){ setOpen(n, queue); coverIfInMeeting(n); } };
  const iCreated = t.created_by===me.id;
  // Answering an ask belongs to the person it points at. The owner also picks up an ask
  // with nobody above to answer it, so a flag can never get stranded.
  const mayAnswer = isMgr && (ASKING(t) || !ASKEE(t));
  // you may reshape a task (dates, owner, title, trash) only if it's yours to reshape:
  // you created it, you're the owner, or it came up from someone who reports to you
  const creatorProfile = people.find(p=>p.id===t.created_by);
  const canReshape = iCreated || me.role==="owner" || !t.assignee_id
    || (isMgr && creatorProfile && creatorProfile.manager_id===me.id);
  const children = tasks.filter(c=>c.parent_id===t.id);
  const parent = t.parent_id ? tasks.find(p=>p.id===t.parent_id) : null;
  const siblings = t.series_id ? tasks.filter(x=>x.series_id===t.series_id && !CLOSED(x.status)).sort((a,b)=>(a.due_date||"").localeCompare(b.due_date||"")) : [];
  const root = t.series_id ? tasks.find(x=>x.id===t.series_id) : null;
  const [skipping,setSkipping] = useState(false);
  const [copying,setCopying] = useState(false);
  const [drop,setDrop] = useState([]);        // holders being taken off it
  const [copyBusy,setCopyBusy] = useState(false);
  const [joining,setJoining] = useState(null);      // "link" | "merge"
  const [joinQ,setJoinQ] = useState("");
  const [joinPick,setJoinPick] = useState([]);   // several at once when linking
  const [joinBusy,setJoinBusy] = useState(false);
  const [links,setLinks] = useState([]);
  // Watching is on the record: whoever can see the task can see you are following it.
  const [watching,setWatching] = useState(()=>WATCHED.has(t.id));
  const [, bumpW] = useState(0);
  useEffect(()=>{ setWatching(WATCHED.has(t.id)); },[t.id]);
  const toggleWatch = async () => {
    const on = !watching;
    setWatching(on);                       // the button answers straight away
    const {error} = on
      ? await sb.from("task_watchers").insert({task_id:t.id, user_id:me.id})
      : await sb.from("task_watchers").delete().eq("task_id",t.id).eq("user_id",me.id);
    if(error){ setWatching(!on); showToast(error.message); return; }
    if(on) WATCHED.add(t.id); else WATCHED.delete(t.id);
    noteWatch(t, on, me); bumpW(x=>x+1);
    showToast(on ? "Watching \u2014 it'll reach your Home and your 1:1, and shows on the task"
                 : "No longer watching it");
  };
  const loadLinks = useCallback(()=>{
    sb.rpc("linked_tasks",{p_task:t.id}).then(({data})=>setLinks(data||[]));
  },[t.id]);
  useEffect(()=>{loadLinks();},[loadLinks]);
  // Whatever is already picked sits at the top, always. Opening this from a suggestion
  // banner pre-picks a task, and the list is capped — so without pinning it, the task
  // she just clicked Merge on could be selected and nowhere on screen.
  const joinable = (() => {
    const q = joinQ.trim().toLowerCase();
    const pool = (tasks||[]).filter(x=>x.id!==t.id && !x.deleted_at && !links.some(l=>l.id===x.id));
    const picked = pool.filter(x=>joinPick.includes(x.id));
    const rest = pool.filter(x=>!joinPick.includes(x.id)
      && (!q || (x.title||"").toLowerCase().includes(q)));
    return [...picked, ...rest.slice(0,40)];
  })();
  const doJoin = async () => {
    if(!joinPick.length) return;
    setJoinBusy(true);
    if(joining==="link"){
      const {data,error} = await sb.rpc("link_many",{p_task:t.id, p_others:joinPick});
      setJoinBusy(false);
      if(error){ showToast(error.message); return; }
      setJoining(null); setJoinPick([]); setJoinQ(""); loadLinks();
      showToast(`Linked to ${data} task${data===1?"":"s"}`);
    } else {
      const {data,error} = await sb.rpc("merge_tasks",{p_from:joinPick[0], p_into:t.id});
      setJoinBusy(false);
      if(error){ showToast(error.message); return; }
      setJoining(null); setJoinPick([]); setJoinQ("");
      await ctx.load(); refresh(); loadLinks();
      showToast(`Merged in — ${data.comments} comment(s), ${data.files} file(s), ${data.steps} step(s) came across`);
    }
  };
  // things that look like the same work — shared order number, or near-identical wording
  const [hints,setHints] = useState([]);
  const loadHints = useCallback(()=>{
    return sb.rpc("related_tasks",{p_task:t.id}).then(({data})=>{ setHints(data||[]); return data||[]; });
  },[t.id]);
  useEffect(()=>{loadHints();},[loadHints,links.length]);
  // Show the cheap answer immediately, then have Claude judge any pair nobody has ruled
  // on yet and refresh. Verdicts are cached for good, so this is quiet after the first
  // look at a task and silent if the call fails \u2014 the wording test still covers it.
  const [judging,setJudging] = useState(false);
  useEffect(()=>{ let live = true;
    (async () => {
      try{
        const {data:cands} = await sb.rpc("link_candidates",{p_task:t.id, p_limit:6});
        if(!live || !cands || !cands.length) return;
        setJudging(true);
        const {data,error} = await sb.functions.invoke("dupecheck",{body:{task_id:t.id}});
        if(live && !error && data && data.ok) await loadHints();
      }catch(e){ /* the wording test is still covering this task */ }
      finally{ if(live) setJudging(false); }
    })();
    return ()=>{ live = false; };
  },[t.id,loadHints]);
  const dismissHint = async (id) => {
    await sb.rpc("dismiss_link",{p_a:t.id, p_b:id});
    loadHints(); showToast("Noted — it won't come up again");
  };
  const linkHint = async (id) => {
    const {error} = await sb.rpc("link_tasks",{p_a:t.id, p_b:id});
    if(error){ showToast(error.message); return; }
    loadLinks(); loadHints(); showToast("Linked");
  };
  const dropLink = async (id) => {
    const {error} = await sb.rpc("unlink_tasks",{p_a:t.id, p_b:id});
    if(error){ showToast(error.message); return; }
    loadLinks(); showToast("Unlinked");
  };
  const [returning,setReturning] = useState(false); const [returnWhy,setReturnWhy] = useState(""); const [returnBusy,setReturnBusy] = useState(false);
  const fromBD = !!t.bd_task_id && t.bd_status==="linked";
  const doReturn = async () => {
    setReturnBusy(true);
    const {data,error} = await sb.functions.invoke("bridge",{body:{action:"return",task_id:t.id,reason:returnWhy}});
    setReturnBusy(false);
    const err = error ? (error.message||"Couldn't reach Kathleen's Inbox") : (data && data.error);
    if(err){ showToast(err); return; }
    setReturning(false); setReturnWhy("");
    onClose(); if(ctx.load) await ctx.load();
    showToast("Back with Kathleen — it's in her Inbox");
  };
  const [steps,setSteps] = useState([]);
  const [newStep,setNewStep] = useState("");
  const loadSteps = useCallback(async ()=>{
    const {data} = await sb.from("task_steps").select("*").eq("task_id",t.id).order("position").order("created_at");
    setSteps(data||[]);
  },[t.id]);
  useEffect(()=>{loadSteps();},[loadSteps]);
  const addStep = async () => {
    if(!newStep.trim()) return;
    const {error} = await sb.from("task_steps").insert({task_id:t.id, body:newStep.trim(), created_by:me.id, position:steps.length});
    if(error){ showToast(error.message); return; }
    setNewStep(""); loadSteps();
  };
  const toggleStep = async (st) => {
    const {error} = await sb.from("task_steps").update({done:!st.done}).eq("id",st.id);
    if(error){ showToast(error.message); return; } loadSteps();
  };
  const removeStep = async (st) => {
    const {error} = await sb.from("task_steps").delete().eq("id",st.id);
    if(error){ showToast(error.message); return; } loadSteps();
  };
  // Inline editing. Escape has to beat the save-on-blur, so a ref carries the intent
  // across the blur that unmounting the input fires.
  const [editId,setEditId]     = useState(null);
  const [editText,setEditText] = useState("");
  const editCancel = useRef(false);
  const beginEdit = (st) => { editCancel.current=false; setEditId(st.id); setEditText(st.body); };
  const saveEdit = async (st) => {
    if(editCancel.current){ editCancel.current=false; return; }
    const body = editText.trim();
    setEditId(null); setEditText("");
    if(!body || body === st.body) return;          // blank is not a delete; that is the x
    setSteps(steps.map(x=>x.id===st.id?{...x,body}:x));
    const {error} = await sb.from("task_steps").update({body}).eq("id",st.id);
    if(error) showToast(error.message);
    loadSteps();
  };
  // Reordering. Pointer events rather than HTML5 drag-and-drop, which does not exist on
  // a touch screen \u2014 this one works with a finger, a mouse or the arrow keys.
  const stepEls = useRef({});
  const [dragId,setDragId]       = useState(null);
  const [dragOrder,setDragOrder] = useState(null);
  const commit = async (order) => {
    if(order.join() === steps.map(x=>x.id).join()) return;
    setSteps(order.map(id=>steps.find(x=>x.id===id)).filter(Boolean));   // show it at once
    const {error} = await sb.rpc("reorder_steps",{p_task:t.id, p_ids:order});
    if(error) showToast(error.message);
    loadSteps();                                                        // then trust the server
  };
  // The live order lives in a ref, not in state: a quick flick can land the first move in
  // the same frame as the press, and state would not have been committed yet.
  const dragRef = useRef(null);
  const startDrag = (e, st) => {
    e.preventDefault();
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
    dragRef.current = {id:st.id, order:steps.map(x=>x.id), y0:e.clientY, armed:false};
    setDragOrder(steps.map(x=>x.id));
  };
  const moveDrag = (e) => {
    const d = dragRef.current; if(!d) return;
    // A grip sits about level with the middle of its own row, so without a dead zone a
    // three-pixel wobble while pressing would swap two steps.
    if(!d.armed){
      if(Math.abs(e.clientY - d.y0) < 6) return;
      d.armed = true; setDragId(d.id);
    }
    const from = d.order.indexOf(d.id); if(from<0) return;
    let target = d.order.length - 1;
    for(let i=0;i<d.order.length;i++){
      const el = stepEls.current[d.order[i]]; if(!el) continue;
      const r = el.getBoundingClientRect();
      if(e.clientY < r.top + r.height/2){ target = i; break; }
    }
    if(target === from) return;
    const next = d.order.slice();
    next.splice(target, 0, next.splice(from,1)[0]);
    d.order = next; setDragOrder(next);
  };
  const endDrag = () => {
    const d = dragRef.current; dragRef.current = null;
    setDragId(null); setDragOrder(null);
    if(d && d.armed) commit(d.order);
  };
  // the same move, without a pointer
  const nudge = (st, delta) => {
    const order = steps.map(x=>x.id);
    const from = order.indexOf(st.id), to = from + delta;
    if(from<0 || to<0 || to>=order.length) return;
    order.splice(to, 0, order.splice(from,1)[0]);
    commit(order);
  };
  const [replying,setReplying] = useState(false);
  const [asking,setAsking] = useState(false);
  const [dating,setDating] = useState(false);
  const [wantDate,setWantDate] = useState("");
  const [wantWhy,setWantWhy] = useState("");
  const askDate = async () => {
    if(!wantDate){ showToast("Pick a date first"); return; }
    const {error} = await sb.rpc("request_due_change",{p_task:t.id, p_date:wantDate, p_reason:wantWhy});
    if(error){ showToast(error.message); return; }
    setDating(false); setWantDate(""); setWantWhy("");
    await ctx.load(); showToast("Asked — they'll get an email");
  };
  const answerDate = async (accept) => {
    const {error} = await sb.rpc("answer_due_change",{p_task:t.id, p_accept:accept, p_note:""});
    if(error){ showToast(error.message); return; }
    await ctx.load(); showToast(accept?"Date moved":"Date kept");
  };
  const [askNote,setAskNote] = useState("");
  const doAsk = async () => {
    const {error} = await sb.rpc("request_help",{p_task:t.id, p_note:askNote});
    if(error){ showToast(error.message); return; }
    setAsking(false); setAskNote("");
    await ctx.load(); showToast("Sent — your manager has been emailed");
  };
  const [replyNote,setReplyNote] = useState("");
  const doReply = async () => {
    const {data,error} = await sb.rpc("resolve_help",{p_task:t.id, p_note:replyNote});
    if(error){ showToast(error.message); return; }
    setReplying(false); setReplyNote("");
    await ctx.load();
    showToast(data && data.emailed ? "Sent — flag cleared" : "Flag cleared");
  };
  const [copyTo,setCopyTo] = useState([]);
  const [copyDue,setCopyDue] = useState("");
  const doCopy = async (holders) => {
    setCopyBusy(true);
    const ids = copyTo.filter(x=>!String(x).startsWith("email:"));
    const mails = copyTo.filter(x=>String(x).startsWith("email:")).map(x=>String(x).slice(6));
    let made = 0, removed = 0, selfDropped = false;
    if(ids.length){
      const {data,error} = await sb.rpc("copy_task_to",{src:t.id, people:ids, new_due:copyDue||null});
      if(error){ setCopyBusy(false); showToast(error.message); return; }
      made += data||0;
    }
    if(mails.length){
      const {data,error} = await sb.rpc("copy_task_to_emails",{src:t.id, emails:mails, new_due:copyDue||null});
      if(error){ setCopyBusy(false); showToast(error.message); return; }
      made += data||0;
    }
    // removals last, so copies exist before this task can drop off
    for(const key of drop){
      const h = (holders||[]).find(x=>x.key===key);
      if(!h) continue;
      const {error} = await sb.from("tasks").update({deleted_at:new Date().toISOString()}).eq("id",h.taskId);
      if(error){ setCopyBusy(false); showToast(error.message); return; }
      removed++;
      if(key==="self") selfDropped = true;
    }
    setCopyBusy(false);
    setCopying(false); setCopyTo([]); setDrop([]); setCopyDue("");
    await ctx.load();
    if(selfDropped){ onClose(); }
    else { refresh(); loadLinks(); }
    showToast([made?`${made} copy${made===1?"":"ies"} made`:null,
               removed?`${removed} moved to Trash`:null].filter(Boolean).join(" \u00b7 ") || "Nothing changed");
  };
  const [skipWhy,setSkipWhy] = useState("");
  const doSkip = async () => {
    const ok = await update(t.id,{status:"skipped",skip_reason:skipWhy||"No reason given",need_manager:false,need_help:false});
    if(ok){ setSkipping(false); setSkipWhy(""); showToast("Skipped — the next one is unaffected"); }
  };
  const [tab,setTab] = useState("activity");
  const [edit,setEdit] = useState(false);
  const [upd,setUpd] = useState(null); // employee update form
  const [comments,setComments] = useState([]); const [hist,setHist] = useState([]); const [files,setFiles]=useState([]);
  const [body,setBody] = useState(""); const [priv,setPriv] = useState(false);
  const fileRef = useRef();
  const refresh = useCallback(async ()=>{
    const [c,h,f] = await Promise.all([
      sb.from("task_comments").select("*").eq("task_id",t.id).order("created_at"),
      sb.from("task_history").select("*").eq("task_id",t.id).order("created_at",{ascending:false}),
      sb.from("task_attachments").select("*").eq("task_id",t.id).is("deleted_at",null).order("created_at"),
    ]);
    setComments(c.data||[]); setHist(h.data||[]); setFiles(f.data||[]);
  },[t.id]);
  useEffect(()=>{refresh();},[refresh, t.updated_at]);

  const addComment = async () => {
    if(!body.trim()) return;
    const {error} = await sb.from("task_comments").insert({task_id:t.id,author_id:me.id,body,is_private:priv});
    if(error){ showToast(error.message); return; }
    setBody(""); refresh();
  };
  const [dragging,setDragging] = useState(false);
  // The page itself will open a dropped file unless every layer cancels the default,
  // which is what makes a drop landing just outside the zone navigate away.
  useEffect(()=>{
    const swallow = (e)=>e.preventDefault();
    window.addEventListener("dragover", swallow);
    window.addEventListener("drop", swallow);
    return ()=>{ window.removeEventListener("dragover", swallow); window.removeEventListener("drop", swallow); };
  },[]);
  const uploadMany = async (list) => {
    const files = Array.from(list||[]).slice(0,10);
    if(!files.length) return;
    let ok = 0; const tooBig = [];
    for(const f of files){
      if(f.size > 25*1024*1024){ tooBig.push(f.name); continue; }
      await upload(f, true); ok++;
    }
    if(tooBig.length) showToast(`Too big (25 MB max): ${tooBig.join(", ")}`);
    else if(ok) showToast(ok===1 ? "Attached" : `Attached ${ok} files`);
  };
  const upload = async (file, quiet) => {
    if(!file) return;
    const path = `${t.id}/${Date.now()}_${file.name}`;
    const {error} = await sb.storage.from("attachments").upload(path,file);
    if(error){ showToast("Upload failed: "+error.message); return; }
    await sb.from("task_attachments").insert({task_id:t.id,uploader_id:me.id,file_name:file.name,storage_path:path,size_bytes:file.size});
    refresh(); if(!quiet) showToast("Attached");
  };
  const removeFile = async (f) => {
    const {error} = await sb.from("task_attachments").update({deleted_at:new Date().toISOString()}).eq("id",f.id);
    if(error){ showToast(error.message); return; }
    refresh(); showToast(`Removed ${f.file_name}`, async ()=>{ await sb.from("task_attachments").update({deleted_at:null}).eq("id",f.id); refresh(); });
  };
  const openFile = async (f) => {
    const {data,error} = await sb.storage.from("attachments").createSignedUrl(f.storage_path,300);
    if(error){ showToast(error.message); return; } window.open(data.signedUrl,"_blank");
  };
  const quick = (patch, msg) => update(t.id,patch).then(ok=>ok&&showToast(msg));
  // Finishing with steps still open is allowed — a checklist is a plan, and plans
  // change — but it should never happen by accident, so say so and make it a choice.
  const [finishing,setFinishing] = useState(null);
  const openSteps = steps.filter(x=>!x.done);
  const finish = (patch, msg) => {
    if(openSteps.length) setFinishing({patch,msg}); else quick(patch,msg);
  };
  const finishNow = async (tickRest) => {
    const f = finishing; setFinishing(null);
    if(!f) return;
    if(tickRest && openSteps.length){
      const {error} = await sb.from("task_steps").update({done:true, done_by:me.id, done_at:new Date().toISOString()})
        .in("id", openSteps.map(x=>x.id));
      if(error){ showToast(error.message); return; }
      loadSteps();
    }
    quick(f.patch, f.msg);
  };
  const histText = (h) => {
    const who = nameOf(people,h.actor_id);
    switch(h.action){
      case "created": return `${who} created this task`;
      case "status": return `${who}: ${STATUS[h.from_value]} → ${STATUS[h.to_value]}`;
      case "due_date": return `${who} changed due date ${fmtDate(h.from_value)} → ${fmtDate(h.to_value)}`;
      case "reassigned": return `${who} reassigned ${nameOf(people,h.from_value)} → ${nameOf(people,h.to_value)}`;
      case "waiting_on": return `${who} set waiting on: ${h.to_value||"(cleared)"}`;
      case "need_manager_on": return `${who} flagged: needs manager`;
      case "need_manager_off": return `${who} cleared the needs-manager flag`;
      case "need_help_on": return `${who} asked for help`;
      case "need_help_off": return `${who} cleared the help flag`;
      case "trashed": return `${who} moved to Trash`;
      case "returned": return `${who} returned it to Kathleen's Inbox${h.to_value?` — ${h.to_value}`:""}`;
      case "restored": return `${who} restored from Trash`;
      case "title": return `${who} renamed: "${h.from_value}" → "${h.to_value}"`;
      default: return `${who}: ${h.action}`;
    }
  };

  const tone = toneOf(t.status);
  return <div className="modalbg" onClick={onClose}><div className="modal detail"
      style={{"--tab":tone.fg, "--tabwash":tone.bg}} onClick={e=>e.stopPropagation()}>
    <div className="spine">
      <span>{STATUS[t.status]}</span>
      <span style={{display:"flex",alignItems:"center",gap:10}}>
        <span className="spine-sub">{ownerName(people,t,{plain:true})}</span>
        {isMgr && (() => {
          const others = otherWatchers(t);
          const also = others.length ? watcherNames(others) : "";
          return <button type="button" className={"eye"+(watching?" on":others.length?" others":"")}
            onClick={toggleWatch}
            title={watching
              ? (others.length ? `Watching this one \u2014 so ${also} ${others.length>1?"are":"is"} too. Press to stop`
                               : "Watching this one \u2014 press to stop")
              : (others.length ? `${also} ${others.length>1?"are":"is"} watching this. Press to watch it too`
                               : "Keep an eye on this one: it reaches your Home and your 1:1 even though it is their own task")}>
            <Eye on={watching || others.length>0} size={17}/></button>;
        })()}
      </span>
    </div>
    {queue.length>1 && at>=0 && <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
      <button className="btn sm" disabled={at<=0} onClick={()=>go(-1)} aria-label="Previous task">←</button>
      <span style={{fontSize:13,color:"var(--muted)"}}>{at+1} of {queue.length}</span>
      <button className="btn sm" disabled={at>=queue.length-1} onClick={()=>go(1)} aria-label="Next task">→</button>
    </div>}
    <h2>{t.title}</h2>
    {watchersOf(t).length>0 && <div className="note" style={{marginBottom:10,display:"flex",gap:8,alignItems:"center"}}>
      <span style={{color:"var(--navy)",display:"inline-flex",flex:"0 0 auto"}}><Eye on={true} size={16}/></span>
      <span>{(() => {
        const ws = watchersOf(t), mine = ws.some(w=>w.id===me.id), others = ws.filter(w=>w.id!==me.id);
        if(mine && !others.length) return "You are watching this task. Whoever can see it can see that.";
        if(mine) return `You and ${watcherNames(others)} are watching this task.`;
        return `${watcherNames(others)} ${others.length>1?"are":"is"} watching this task.`;
      })()}</span>
    </div>}
    <div style={{marginBottom:10}}>
      <span className={"pill "+t.status}>{STATUS[t.status]}</span>{" "}
      {t.priority==="high" && <span className="pill high">High priority</span>}{" "}
      {t.need_manager && <span className="pill high">Needs manager</span>}{" "}
      {t.need_help && <span className="pill high">Help requested</span>}{" "}
      {t.recur_rule && <span className="pill">{recurLabel(t)}</span>}
    </div>
    {siblings.length>1 && <div className="note" style={{marginBottom:10}}>
      <b>{siblings.length} open</b> in this recurring series — {siblings.map(x=>fmtDate(x.due_date)).join(", ")}.
      {siblings.length>=(t.recur_cap||3) ? " That's the cap, so no new ones are being created until some are closed out." : ""}
    </div>}
    {t.requested_due && <div className="note" style={{marginBottom:10,background:"var(--warn-soft)",borderLeft:"3px solid var(--warn)"}}>
      <b>{nameOf(people,t.requested_by)} asked to move this to {fmtDate(t.requested_due)}</b>
      {t.requested_reason ? <div style={{marginTop:4}}>"{t.requested_reason}"</div> : null}
      {(isMgr || t.created_by===me.id) && <div className="actions" style={{justifyContent:"flex-start",marginTop:8}}>
        <button className="btn p" onClick={()=>answerDate(true)}>Accept {fmtDate(t.requested_due)}</button>
        <button className="btn" onClick={()=>answerDate(false)}>Keep {fmtDate(t.due_date)}</button>
      </div>}
    </div>}
    {dating && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>Ask for a new due date</b><div style={{fontSize:13,color:"var(--muted)"}}>It stays due {fmtDate(t.due_date)} until {nameOf(people,t.created_by)} agrees.</div></div>
      <div className="two">
        <label>New date<input type="date" value={wantDate} onChange={e=>setWantDate(e.target.value)}/></label>
      </div>
      <label>Why<textarea value={wantWhy} onChange={e=>setWantWhy(e.target.value)} placeholder="Waiting on the vendor to confirm pricing."/></label>
      <div className="actions"><button className="btn" onClick={()=>{setDating(false);setWantDate("");setWantWhy("");}}>Cancel</button>
        <button className="btn p" onClick={askDate}>Send the request</button></div>
    </div>}
    {parent && <div className="note" style={{marginBottom:10}}>Part of <a href="#" onClick={e=>{e.preventDefault();setOpen(parent.id);}}>{parent.title}</a></div>}

    {asking && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>What do you need?</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>This goes straight to your manager by email, along with the task. Leave it blank if you just need them to take a look.</div></div>
      <label>Your message<textarea autoFocus value={askNote} onChange={e=>setAskNote(e.target.value)} placeholder="Suan has the file locked and I can't pull the numbers — can you get me access, or should I push this to Thursday?"/></label>
      <div className="actions"><button className="btn" onClick={()=>{setAsking(false);setAskNote("");}}>Cancel</button>
        <button className="btn r" onClick={doAsk}>Send to your manager</button></div>
    </div>}
    {finishing && <div className="form card edged edge-warn" style={{padding:14,marginBottom:12}}>
      <b>{openSteps.length} of {steps.length} step{steps.length>1?"s":""} {openSteps.length>1?"are":"is"} still unticked.</b>
      <ul style={{margin:"6px 0 10px 18px",padding:0,color:"var(--muted)",fontSize:13.5}}>
        {openSteps.slice(0,4).map(x=><li key={x.id}>{x.body}</li>)}
        {openSteps.length>4 && <li>{"\u2026 and "}{openSteps.length-4} more</li>}
      </ul>
      <div className="actions">
        <button className="btn" onClick={()=>setFinishing(null)}>Cancel</button>
        <button className="btn" onClick={()=>finishNow(false)}>Finish anyway, leave them</button>
        <button className="btn p" onClick={()=>finishNow(true)}>Tick them all and finish</button>
      </div>
    </div>}
    {skipping && <div className="form card" style={{padding:14,marginBottom:12}}>
      <label>Why are you skipping this one?<input autoFocus value={skipWhy} onChange={e=>setSkipWhy(e.target.value)} placeholder="Holiday, branch closed, not applicable this month…"/></label>
      <div className="actions"><button className="btn" onClick={()=>setSkipping(false)}>Cancel</button><button className="btn p" onClick={doSkip}>Skip this one</button></div>
    </div>}

            </select></label>}

          const ok = await update(t.id,{status:upd.status,waiting_on:upd.status==="waiting"?upd.waiting_on:"",next_action:upd.next_action,expected_completion:upd.expected_completion||null});
          if(ok){ if(upd.note.trim()) await sb.from("task_comments").insert({task_id:t.id,author_id:me.id,body:upd.note,is_private:false}); setUpd(null); refresh(); showToast("Updated"); }

    {replying && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>Reply to {ownerName(people,t,{plain:true})}</b>

      <label>Your reply<textarea autoFocus value={replyNote} onChange={e=>setReplyNote(e.target.value)} placeholder="Call Suan directly, she has the unlock code. Push it to Thursday if you need to."/></label>
      <div className="actions"><button className="btn" onClick={()=>{setReplying(false);setReplyNote("");}}>Cancel</button>
        <button className="btn p" onClick={doReply}>Send &amp; clear flag</button></div>
    </div>}
    {returning && <div className="form card" style={{padding:14,marginBottom:12,borderColor:"#c7d7f5",background:"#f7f9ff"}}>
      <div><b>Return this to Kathleen</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>It goes back to Kathleen's Inbox with your finished steps, comments and files. It closes here once it's with her.</div></div>

      <div className="actions"><button className="btn" disabled={returnBusy} onClick={()=>{setReturning(false);setReturnWhy("");}}>Cancel</button>
        <button className="btn p" disabled={returnBusy} onClick={doReturn}>{returnBusy?"Sending back…":"Return to Kathleen"}</button></div>
    </div>}
    {!joining && hints.length>0 && <div className="note" style={{marginBottom:12,background:"#eef3fd",borderLeft:"3px solid var(--navy)"}}>
      <div style={{fontWeight:600,marginBottom:6,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{flex:1}}>{hints.length===1 ? "This looks like the same work as another task" : `This looks like the same work as ${hints.length} other tasks`}</span>

      {hints.map(h=><div key={h.id} style={{display:"flex",gap:8,alignItems:"flex-start",flexWrap:"wrap",padding:"5px 0",borderTop:"1px solid #dbe3f5"}}>
        <div style={{flex:"1 1 220px"}}>
          <a href="#" style={{color:"var(--navy)",fontWeight:600,textDecoration:"none"}}
             onClick={(e)=>{e.preventDefault(); ctx.setOpen(h.id);}}>{h.title}</a>
          <div className="meta">{h.who||"Unassigned"}{" · "}{h.due_date?`due ${fmtDate(h.due_date)}`:"no date"}
            {" · "}{STATUS[h.status]}{" · "}<b>{h.why}</b></div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn sm" onClick={()=>linkHint(h.id)}>Link</button>
          {(isMgr || iCreated) && !CLOSED(t.status) &&
            <button className="btn sm" onClick={()=>{setJoining("merge"); setJoinPick([h.id]); setJoinQ("");}}>Merge…</button>}
          <button className="btn sm" onClick={()=>dismissHint(h.id)}>Not related</button>
        </div>
      </div>)}
    </div>}
    {joining && <div className="form card" style={{padding:14,marginBottom:12,borderColor:"#c7d7f5",background:"#f7f9ff"}}>
      <div><b>{joining==="link" ? "Link this to another task" : "Merge another task into this one"}</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>
          {joining==="link"
            ? "Both tasks stay, each showing the other. For different work that belongs to the same job. Tick as many as you like."
            : "For the same work that arrived twice. Its comments, files and steps move onto this task and it goes to Trash — restorable, not destroyed."}
        </div></div>
      <input autoFocus value={joinQ} onChange={e=>setJoinQ(e.target.value)} placeholder="Find the other task…"/>
      <div style={{maxHeight:220,overflowY:"auto",border:"1px solid var(--line)",borderRadius:8}}>
        {joinable.length ? joinable.map(x=>{
          const on = joinPick.includes(x.id);
          const hint = hints.find(h=>h.id===x.id);
          return <div key={x.id}
            onClick={()=>setJoinPick(joining==="merge" ? [x.id]
              : on ? joinPick.filter(i=>i!==x.id) : [...joinPick, x.id])}
            style={{padding:"8px 10px",cursor:"pointer",borderTop:"1px solid var(--line)",
                    background:on?"#e7edfb":undefined}}>
            <div style={{fontWeight:on?600:400}}>
              <span style={{color:on?"var(--navy)":"var(--muted)",marginRight:6}}>
                {joining==="link" ? (on?"\u2611":"\u2610") : (on?"\u25c9":"\u25cb")}</span>
              {x.title}</div>
            <div className="meta">{ownerName(people,x)}
              {" · "}{x.due_date?`due ${fmtDate(x.due_date)}`:"no date"}{" · "}{STATUS[x.status]}
              {hint && <span style={{color:"var(--navy)",fontWeight:600}}> · looks related ({hint.why})</span>}</div>
          </div>; })
          : <div className="empty">Nothing matches.</div>}
      </div>
      <div className="actions">
        <button className="btn" disabled={joinBusy} onClick={()=>{setJoining(null);setJoinPick([]);setJoinQ("");}}>Cancel</button>
        <button className="btn p" disabled={!joinPick.length||joinBusy} onClick={doJoin}>
          {joinBusy ? "Working…"
            : joining==="link" ? `Link ${joinPick.length||""} task${joinPick.length===1?"":"s"}`
            : "Merge it in"}</button>
      </div>
    </div>}
    {copying && (() => {
      // Everyone holding this piece of work: this task, plus the copies linked to it.
      // Ticked means they have it. Untick to take it off their list — including your own.
      const copies = links.filter(l=>l.title===t.title);
      const holders = [{key:"self", taskId:t.id, label:(t.assignee_id===me.id?"You":ownerName(people,t,{plain:true}))+" (this task)"},
                       ...copies.map(c=>({key:"copy:"+c.id, taskId:c.id, label:c.who||"Unassigned"}))];
      const heldBy = new Set(copies.map(c=>String(c.who||"").toLowerCase()));
      const free = [
        ...people.filter(p=>p.active && p.id!==t.assignee_id && !heldBy.has(String(p.full_name||"").toLowerCase()))
                 .map(p=>({k:p.id, label:p.full_name})),
        ...(INVITEES||[]).filter(i=>String(i.email).toLowerCase()!==String(t.assignee_email||"").toLowerCase()
                                 && !heldBy.has(String(i.full_name||"").toLowerCase()))
                 .map(i=>({k:"email:"+i.email, label:(i.full_name||i.email)+" (not signed up yet)"}))];
      const dropping = holders.filter(h=>drop.includes(h.key));
      return <div className="form card" style={{padding:14,marginBottom:12}}>
        <div><b>Who has this work</b><div style={{fontSize:13,color:"var(--muted)"}}>

              style={off?{textDecoration:"line-through",color:"var(--red)",borderColor:"#f0c7c7"}

              onClick={()=>setDrop(off?drop.filter(x=>x!==h.key):[...drop,h.key])}>

        </div>}

          <button className="btn" onClick={()=>{setCopying(false);setCopyTo([]);setDrop([]);}}>Cancel</button>
          <button className="btn p" disabled={(!copyTo.length && !drop.length) || copyBusy} onClick={()=>doCopy(holders)}>
            {copyBusy ? "Saving\u2026"
             : copyTo.length && drop.length ? `Add ${copyTo.length}, remove ${drop.length}`
             : copyTo.length ? `Give it to ${copyTo.length} ${copyTo.length===1?"person":"people"}`
             : `Remove ${drop.length} ${drop.length===1?"person":"people"}`}</button>
        </div>
      </div>;
    })()}
    {!edit && !skipping && !asking && !replying && !copying && !returning && !joining && (isMgr || iCreated || t.assignee_id===me.id) &&
     <div className="actions" style={{justifyContent:"flex-start",marginBottom:12}}>
      {mayAnswer && t.status==="ready_for_review" && <button className="btn p" onClick={()=>finish({status:"done",need_manager:false},"Approved and closed")}>Approve — mark done</button>}
      {mayAnswer && t.status==="ready_for_review" && <button className="btn" onClick={()=>quick({status:"working"},"Sent back")}>Send back</button>}
      {mayAnswer && (t.need_manager||t.need_help) && <button className="btn r" onClick={()=>setReplying(true)}>Reply &amp; clear flag</button>}
      {!CLOSED(t.status) && t.assignee_id!==me.id && <button className="btn" onClick={()=>finish({status:"done"},"Marked done")}>Mark done</button>}
      {(isMgr || iCreated) && CLOSED(t.status) && t.bd_status!=="returned" && <button className="btn" onClick={()=>quick({status:"working",skip_reason:null},"Reopened")}>Reopen</button>}
      {t.recur_rule && !CLOSED(t.status) && (isMgr || t.assignee_id===me.id) && <button className="btn" onClick={()=>setSkipping(true)}>Skip this one</button>}
      {isMgr && root && <button className="btn" onClick={()=>update(root.id,{recur_paused:!root.recur_paused}).then(ok=>ok&&showToast(root.recur_paused?"Series resumed":"Series paused — no new ones will be created"))}>{root.recur_paused?"Resume series":"Pause series"}</button>}
      {canReshape && <button className="btn" onClick={()=>setEdit(true)}>{isMgr?"Edit / reassign":"Edit"}</button>}
      {!canReshape && t.assignee_id===me.id && !CLOSED(t.status) && !t.requested_due &&
        <button className="btn" onClick={()=>setDating(true)}>Need more time</button>}

      {!CLOSED(t.status) && <button className="btn" onClick={()=>{setJoining("link");setJoinPick([]);setJoinQ("");}}>Link to another task</button>}
      {(isMgr || iCreated) && !CLOSED(t.status) && <button className="btn" onClick={()=>{setJoining("merge");setJoinPick([]);setJoinQ("");}}>Merge another in</button>}
      {isMgr && (people.filter(p=>p.active && p.id!==t.assignee_id).length + (INVITEES||[]).length)>0 &&
        <button className="btn" onClick={()=>{setCopying(true);setCopyTo([]);setDrop([]);}}>Who has this</button>}
      {fromBD && !CLOSED(t.status) && <button className="btn" style={{color:"#1f3a7a",borderColor:"#c7d7f5"}} onClick={()=>setReturning(true)}>Return to Kathleen</button>}
      {isMgr && CLOSED(t.status) && t.assignee_id!==me.id && !t.seen_at && new Date(t.status==="skipped"?t.updated_at:(t.completed_at||t.updated_at)) > new Date(me.completions_seen_at||0) &&
        <button className="btn" style={{color:"var(--ok)",borderColor:"#bfe3c5"}} onClick={()=>update(t.id,{seen_at:new Date().toISOString()}).then(ok=>ok&&showToast("Seen — one fewer on the Finished count"))}>Mark as seen</button>}
      {canReshape && <button className="btn" style={{color:"var(--red)"}} onClick={()=>trash(t)}>Trash</button>}
    </div>}
    {edit && <EditForm t={t} people={people} isMgr={isMgr} me={me} onCancel={()=>setEdit(false)} onSave={async p=>{ if(await update(t.id,p)){ setEdit(false); showToast("Saved"); } }}/>}

    <div className="panel edge-main"><h3>The task</h3><dl className="kv">

        <span key={l.id}>{i>0?", ":""}
          <a href="#" style={{color:"var(--navy)",fontWeight:600,textDecoration:"none"}}
             onClick={(e)=>{e.preventDefault(); ctx.setOpen(l.id);}}
             title={`${l.who||"Unassigned"} · ${l.due_date?fmtDate(l.due_date):"no date"} · ${STATUS[l.status]}`}>{l.title}</a>
          <button className="btn q" title="Unlink these two"
            style={{padding:"0 4px",color:"var(--muted)"}} onClick={()=>dropLink(l.id)}>&times;</button>
        </span>)}</dd></>}
      <dt>Assigned by</dt><dd>{DELEGATED(t) ? `${nameOf(people,t.created_by)} assigned it` : t.asked_by ? `${nameOf(people,t.asked_by)} asked for it` : t.assignee_id ? "Their own task" : "Not assigned yet"}{t.bd_task_id ? <span style={{marginLeft:8,fontSize:11,fontWeight:700,color:"#1f3a7a",background:"#e0ecff",padding:"1px 7px",borderRadius:7}}>{t.bd_status==="returned"?"returned to Kathleen's Inbox":"from Kathleen's Inbox"}</span> : null}</dd>
      <dt>Assigned to</dt><dd>{t.assignee_id ? nameOf(people,t.assignee_id)

      <dt>Due</dt><dd>{fmtDate(t.due_date)}{t.expected_completion && t.expected_completion!==t.due_date ? ` (expected ${fmtDate(t.expected_completion)})` : ""}</dd>
      {t.status==="waiting" && <><dt>Waiting on</dt><dd>{t.waiting_on||"—"}</dd></>}
      {t.next_action && <><dt>Next action</dt><dd>{t.next_action}</dd></>}
      {t.context && <><dt>Context</dt><dd>{t.context}</dd></>}
      {t.details && <><dt>Details</dt><dd style={{whiteSpace:"pre-wrap"}}>{t.details}</dd></>}
      {t.standing_notes && <><dt>Standing notes</dt><dd style={{whiteSpace:"pre-wrap"}}>{t.standing_notes}{t.recur_rule?<div style={{fontSize:13,color:"var(--muted)"}}>Carried to every occurrence of this recurring task.</div>:null}</dd></>}
      {t.status==="skipped" && t.skip_reason && <><dt>Skipped because</dt><dd>{t.skip_reason}</dd></>}
      {root && root.recur_paused && <><dt>Series</dt><dd>Paused — no new occurrences are being created</dd></>}
      <dt>Last update</dt><dd>{fmtWhen(t.last_update_at)}</dd>
    </dl></div>

    <div className="panel edge-steps"><h3>Steps{steps.length?` — ${steps.filter(x=>x.done).length} of ${steps.length} done`:""}</h3>
      {(() => {
        // You may only move steps you are allowed to move. A mixed list would fail
        // halfway on the server, so offer it only when every step is yours to shift.
        const mayOrder = steps.length>1 && (canReshape || steps.every(x=>x.created_by===me.id));
        const shown = dragOrder ? dragOrder.map(id=>steps.find(x=>x.id===id)).filter(Boolean) : steps;
        return shown.map((st,i)=><div key={st.id} ref={el=>{ stepEls.current[st.id]=el; }}
          className={"steprow"+(dragId===st.id?" dragging":"")}>
          {mayOrder && <button className="grip" aria-label={`Move step ${i+1}, ${st.body}`}
            title="Drag to reorder \u2014 or focus this and use the arrow keys"
            onPointerDown={e=>startDrag(e,st)} onPointerMove={moveDrag}
            onPointerUp={endDrag} onPointerCancel={endDrag}
            onKeyDown={e=>{ if(e.key==="ArrowUp"){ e.preventDefault(); nudge(st,-1); }
                            if(e.key==="ArrowDown"){ e.preventDefault(); nudge(st,1); } }}>
            {"\u283F"}</button>}
          <input type="checkbox" checked={st.done} onChange={()=>toggleStep(st)} style={{width:18,height:18,marginTop:2,flexShrink:0}}/>
          {editId===st.id
            ? <input className="stepedit" autoFocus value={editText}
                onChange={e=>setEditText(e.target.value)}
                onBlur={()=>saveEdit(st)}
                onKeyDown={e=>{
                  if(e.key==="Enter"){ e.preventDefault(); e.currentTarget.blur(); }
                  if(e.key==="Escape"){ e.preventDefault(); editCancel.current=true; setEditId(null); }
                }}/>
            : (canReshape || st.created_by===me.id)
              ? <span className="steptext" tabIndex={0} role="button"
                  title="Click to reword this step"

                  onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); beginEdit(st); } }}
                  style={{textDecoration:st.done?"line-through":"none",color:st.done?"var(--muted)":"inherit"}}>{st.body}</span>
              : <span style={{flex:1,textDecoration:st.done?"line-through":"none",color:st.done?"var(--muted)":"inherit"}}>{st.body}</span>}
          {(canReshape || st.created_by===me.id) && <button className="btn q" style={{padding:"0 4px",color:"var(--muted)"}} title="Remove this step" onClick={()=>removeStep(st)}>×</button>}
        </div>);
      })()}
      {!steps.length && <div style={{color:"var(--muted)",fontSize:14,padding:"8px 0"}}>No steps yet. Break the task into a checklist if that helps — these stay inside this task and never show up as separate cards.</div>}
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <input value={newStep} onChange={e=>setNewStep(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addStep()}

        <button className="btn sm" onClick={addStep} disabled={!newStep.trim()}>Add</button>
      </div>
    </div>
    {children.length>0 && <div className="panel tint edge-linked"><h3>Linked tasks — {children.filter(c=>CLOSED(c.status)).length} of {children.length} done</h3>
      <div className="card" style={{marginBottom:12}}>{children.map(c=><Row key={c.id} t={c} people={people} today={today} setOpen={setOpen} showWho={true} why={c.assignee_id===me.id&&c.status!=="done"?{why:"Yours",tone:"navy"}:null}/>)}</div></div>}

      <button className={tab==="activity"?"on":""} onClick={()=>setTab("activity")}>Comments ({comments.length})</button>

      <button className={tab==="history"?"on":""} onClick={()=>setTab("history")}>History</button>
    </div>
    {tab==="activity" && <div>
      {comments.map(c=><div key={c.id} className={"cmt"+(c.is_private?" priv":"")}><div className="by">{nameOf(people,c.author_id)} · {fmtWhen(c.created_at)}{c.is_private?" · private manager note":""}</div>{richText(c.body)}</div>)}
      <div className="form" style={{marginTop:10}}>
        <textarea value={body} onChange={e=>setBody(e.target.value)} placeholder={priv?"Private note only you can see":"Add a comment"}/>
        <div className="actions" style={{justifyContent:"space-between"}}>
          {isMgr ? <label style={{display:"flex",gap:6,alignItems:"center",fontSize:14}}><input type="checkbox" checked={priv} onChange={e=>setPriv(e.target.checked)} style={{width:"auto"}}/>Private note <span style={{color:"var(--muted)",fontSize:12}}>(only you can see it)</span></label> : <span/>}
          <button className="btn p" onClick={addComment} disabled={!body.trim()}>Post</button>
        </div>
      </div>

    {tab==="files" && <div className="att">
      {files.map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:8}}><a href="#" style={{flex:1}} onClick={e=>{e.preventDefault();openFile(f);}}>{f.file_name} <span style={{color:"var(--muted)",fontSize:12}}>· {nameOf(people,f.uploader_id)}</span></a>
        {(isMgr||f.uploader_id===me.id) && <button className="btn sm" onClick={()=>removeFile(f)}>Remove</button>}</div>)}
      {!files.length && <div className="empty">No attachments yet. Emails, quotes, photos, PDFs — up to 25 MB each.</div>}
      <input type="file" multiple ref={fileRef} style={{display:"none"}}
        onChange={e=>{ uploadMany(e.target.files); e.target.value=""; }}/>
      <div className={"dropzone"+(dragging?" over":"")}
        onClick={()=>fileRef.current.click()}
        onDragEnter={e=>{e.preventDefault(); e.stopPropagation(); setDragging(true);}}
        onDragOver={e=>{e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect="copy"; if(!dragging) setDragging(true);}}
        onDragLeave={e=>{e.preventDefault(); e.stopPropagation(); if(!e.currentTarget.contains(e.relatedTarget)) setDragging(false);}}
        onDrop={e=>{e.preventDefault(); e.stopPropagation(); setDragging(false);
          const dt = e.dataTransfer;
          const files = dt.files && dt.files.length ? dt.files
            : Array.from(dt.items||[]).map(i=>i.kind==="file"?i.getAsFile():null).filter(Boolean);
          uploadMany(files);}}>
        <b style={{pointerEvents:"none"}}>{dragging ? "Drop to attach" : "Drag files here"}</b>
        <div style={{pointerEvents:"none"}}>or click to choose. Emails, quotes, photos, PDFs — up to 25 MB each, ten at a time.</div>
      </div>
    </div>}
    {tab==="history" && <div>{hist.map(h=><div key={h.id} className="hist">{fmtWhen(h.created_at)} — {histText(h)}</div>)}</div>}
    </div>
    <div style={{marginTop:20,paddingTop:14,borderTop:"1px solid var(--line)"}}>
      <button className="btn p" style={{width:"100%"}} onClick={onClose}>Close</button>
    </div>
  </div></div>;
}

function Recur({f,setF}){

    <label>Repeats<select value={f.recur_rule} onChange={e=>setF({...f,recur_rule:e.target.value,recur_day:e.target.value==="weekly"||e.target.value==="monthly"?"1":""})}>
      <option value="">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select></label>
    {(f.recur_rule || f.standing_notes) && <label>Standing notes
        <div style={{fontSize:13,color:"var(--muted)",fontWeight:400,marginBottom:4}}>
          {f.recur_rule ? "Carried to every occurrence, and included in the email each time — where the file lives, who to copy, what caught people out last time."
                        : "This task no longer repeats, so these notes won't carry anywhere. Clear them if they're no longer needed."}
        </div>
        <textarea value={f.standing_notes} onChange={e=>setF({...f,standing_notes:e.target.value})} placeholder="Pull it from GL Analytics, export as PDF, copy Robert." rows={2}/></label>}

    {f.recur_rule==="monthly" && <label>On day<input type="number" min="1" max="31" value={f.recur_day} onChange={e=>setF({...f,recur_day:e.target.value})}/></label>}
    {f.recur_rule==="yearly" && <div style={{fontSize:13,color:"var(--muted)",alignSelf:"end"}}>Same date every year — whatever due date you set above is the anniversary.</div>}
    {f.recur_rule && <label>Flag it for me once this many are open at once<select value={Math.max(2, parseInt(f.recur_cap)||3)} onChange={e=>setF({...f,recur_cap:e.target.value})}>{[2,3,4,5,6].map(n=><option key={n} value={n}>{n} open at once</option>)}</select></label>}
    {f.recur_rule==="yearly" && <div style={{gridColumn:"1 / -1",fontSize:13,color:"var(--muted)"}}>A yearly task appears a month before it's due, not five days — an annual renewal or filing needs more notice than a week.</div>}
    {f.recur_rule && f.recur_rule!=="daily" && f.recur_rule!=="yearly" && <div style={{gridColumn:"1 / -1",fontSize:13,color:"var(--muted)"}}>These appear on schedule — five days before each due date — whether or not the last one got finished.</div>}
    {f.recur_rule==="daily" && <div style={{gridColumn:"1 / -1",fontSize:13,color:"var(--muted)"}}>A daily task rolls forward instead of piling up: the next one appears when this one is closed.</div>}
  </div>;

    const v = m.trim().toLowerCase();

function Trash({trashed,people,today,update,showToast,setOpen,load}){

    if(!window.confirm(`Delete "${t.title}" permanently? Its comments, attachments, and history go with it. There is no undo.`)) return;
    const {data:files} = await sb.storage.from("attachments").list(t.id);
    if(files && files.length) await sb.storage.from("attachments").remove(files.map(f=>`${t.id}/${f.name}`));
    const {error} = await sb.from("tasks").delete().eq("id",t.id);
    if(error){ showToast(error.message); return; }
    await load(); showToast("Deleted permanently");
  };
  return <>
    <div className="h"><h2>Trash</h2><span className="sub">Restore anything here with one tap</span></div>
    <TaskTable list={trashed} people={people} today={today} setOpen={null} empty="Trash is empty."
      cols={["who","title","trashed"]}
