// A section heading that folds. The choice is remembered per browser, so a group you
// never act on stays shut and the ones you work from stay open.
function Fold({label,count,storeKey,defaultOpen=true,edge,children}){
  const key = "td_fold_" + (storeKey||label);
  const [open,setOpen] = useState(()=>{
    try{ const v = localStorage.getItem(key); return v===null ? defaultOpen : v==="1"; }
    catch(e){ return defaultOpen; }
  });
  const toggle = () => { const n = !open; setOpen(n); try{ localStorage.setItem(key, n?"1":"0"); }catch(e){} };
  return <>
    <div className="section-title fold" onClick={toggle} role="button" tabIndex={0}
         aria-expanded={open}
         onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } }}>
      <span className="caret">{open ? "\u25BE" : "\u25B8"}</span>{label}
      <span className="n">{count}</span>
      {!open && <span className="hint">show</span>}
    </div>
    {open ? <div className={edge||""}>{children}</div> : null}
  </>;
}

// ---------- manager home ----------
function ManagerHome(ctx){
  const {tasks,today,people} = ctx;
  const [filter,setFilter] = useState(null);
  const [showTheirs,setShowTheirs] = useState(false);
  // Jump straight to a task from the top of Home. Matches titles and numbers against
  // what is already loaded, so it answers as you type rather than after a round trip.
  const [jump,setJump] = useState("");
  const jumpRef = (() => { const m = jump.trim().match(/^(?:#\s*TD|TD\s*#?|#)?\s*(\d{1,6})$/i); return m ? Number(m[1]) : null; })();
  // Open work only, unless you ask for the rest. The choice sticks, because somebody
  // who wants finished tasks in the box usually wants them tomorrow as well.
  const [jumpDone,setJumpDone] = useState(()=>{
    try{ return localStorage.getItem("td_jump_done")==="1"; }catch(e){ return false; }
  });
  const setJD = (v) => { setJumpDone(v); try{ localStorage.setItem("td_jump_done", v?"1":"0"); }catch(e){} };
  const jumpAll = (() => {
    const q = jump.trim().toLowerCase();
    if(q.length < 2 && jumpRef === null) return [];
    const live = (tasks||[]).filter(x=>!x.deleted_at);
    const byTitle = live.filter(x=>q.length >= 2 && (x.title||"").toLowerCase().includes(q))
      .sort((a,b)=>(CLOSED(a.status)?1:0)-(CLOSED(b.status)?1:0)
                 || String(a.due_date||"9").localeCompare(String(b.due_date||"9")));
    // A number is a task number AND a number. It used to be only the former, so a title
    // with \"1050\" in it could not be found by typing 1050. The task with that number
    // leads; titles carrying it follow.
    const byNumber = jumpRef !== null ? live.filter(x=>x.ref === jumpRef) : [];
    return [...byNumber, ...byTitle.filter(x=>!byNumber.some(r=>r.id===x.id))];
  })();
  const jumpHits   = (jumpDone ? jumpAll : jumpAll.filter(x=>!CLOSED(x.status))).slice(0,8);
  const jumpHidden = jumpDone ? 0 : jumpAll.filter(x=>CLOSED(x.status)).length;
  const goTo = (x) => { setJump(""); ctx.setOpen(x.id, jumpHits.map(h=>h.id)); };
  // Brain Dump, from the same box. The list above stays instant because it filters what is
  // already loaded; this one is two bridge hops away, so it arrives a little behind your
  // typing and is never allowed to hold it up. Three characters rather than two, because
  // every keystroke past that is a round trip.
  const canBD = !!(ME && ME.id === BD_OWNER);
  const [bdHits,setBdHits] = useState([]);
  const bdSeq = useRef(0);
  useEffect(()=>{
    if(!canBD) return;
    const q = jump.trim();
    if(q.length < 3){ setBdHits([]); return; }
    const mine = ++bdSeq.current;
    const timer = setTimeout(()=>{
      sb.functions.invoke("bridge",{body:{action:"search_bd", q, closed:jumpDone}})
        .then(({data,error})=>{
          // a slow answer about something you typed three keystrokes ago must not
          // overwrite the answer about what is in the box now
          if(mine !== bdSeq.current) return;
          setBdHits((!error && data && data.results) ? data.results.slice(0,5) : []);
        })
        .catch(()=>{ if(mine === bdSeq.current) setBdHits([]); });
    }, 300);
    return ()=>clearTimeout(timer);
  },[jump,jumpDone,canBD]);
  const doneLooking = async (t) => {
    const {error} = await UNWATCH(t.id);
    if(error){ ctx.showToast(error.message); return; }
    ctx.showToast(`Stopped watching \u201c${t.title}\u201d`);
    ctx.load();
  };
  const allFlagged = tasks.filter(t=>t.assignee_id!==ctx.me.id).map(t=>({t,a:attention(t,today)})).filter(x=>x.a)
    .sort((x,y)=>x.a.rank-y.a.rank || (x.t.due_date||"9").localeCompare(y.t.due_date||"9"));
  // You press the eye so a task comes to you. So a watched task belongs under Watching
  // and nowhere else \u2014 unless it is actually asking you for something, which outranks the eye.
  const pulled = (x) => WATCHING(x.t) && !ASKING(x.t);
  const yours = (t) => DELEGATEDBYME(t) || ASKEDBYME(t) || ASKING(t) || WATCHING(t);
  const flagged = allFlagged.filter(x=>yours(x.t) && !pulled(x));
  const theirOwn = allFlagged.filter(x=>!yours(x.t));
  const openT = tasks.filter(t=>!CLOSED(t.status) && t.assignee_id!==ctx.me.id && (DELEGATEDBYME(t) || ASKEDBYME(t)));
  const week = new Date(); week.setDate(week.getDate()+7); const weekISO = week.toISOString().slice(0,10);
  const buckets = {
    track: openT.filter(t=>!attention(t,today) && t.status!=="waiting" && (t.assignee_id||t.assignee_email) && t.due_date),
    waiting: openT.filter(t=>t.status==="waiting"),
    week: openT.filter(t=>t.due_date && t.due_date>=today && t.due_date<=weekISO),
    overdue: openT.filter(t=>t.due_date && t.due_date<today),
  };
  const shown = filter ? buckets[filter] : null;
  const mineToDo = tasks.filter(t=>!CLOSED(t.status) && t.assignee_id===ctx.me.id);
  const owned = (t) => t.assignee_id || t.assignee_email;
  const sorting = tasks.filter(t=>!CLOSED(t.status) && (!owned(t) || !t.due_date));
  return <>
    <div className="jumpwrap">
      <input className="jump" value={jump} onChange={e=>setJump(e.target.value)}
        placeholder="Jump to a task — type a word from the title, or its number"
        onKeyDown={e=>{ if(e.key==="Escape") setJump("");
                        if(e.key==="Enter" && jumpHits.length) goTo(jumpHits[0]); }}/>
      {jump.trim() && <div className="jumplist">
        <label className="jumpopt">
          <input type="checkbox" checked={jumpDone} onChange={e=>setJD(e.target.checked)}/>
          <span>Include finished and skipped</span>
        </label>
        {jumpHits.length ? jumpHits.map(x=>
          <button key={x.id} className="jumphit" onClick={()=>goTo(x)}>
            <span className="refsm">#{x.ref}</span>
            <span className="jt">{x.title}</span>
            <span className="meta">{ownerName(people,x)}{" \u00b7 "}{STATUS[x.status]||x.status}
              {x.due_date?` \u00b7 due ${fmtDate(x.due_date)}`:""}</span>
          </button>)
          : <div className="empty" style={{padding:"10px 12px"}}>
              {jumpHidden > 0
                ? (jumpRef !== null
                    ? `Task #${jumpRef} is finished \u2014 tick the box above to open it.`
                    : `${jumpHidden} finished task${jumpHidden>1?"s":""} match, but open work only is on \u2014 tick the box above.`)
                : <>{jumpRef !== null ? `No task #${jumpRef}.` : "Nothing open with that in the title."}
                   {" "}The All tasks search also reads comments and steps.</>}</div>}
        {jumpHits.length>0 && jumpHidden>0 && <div className="jumpfoot">
          {jumpHidden} finished {jumpHidden>1?"ones":"one"} also match{jumpHidden>1?"":"es"}, hidden by the box above.
        </div>}
        {canBD && bdHits.length>0 && <>
          <div className="jumpbd">In Brain Dump</div>
          {bdHits.map(r=>
            <a key={"bd"+r.num} className="jumphit bd" href={BD_URL} target="_blank" rel="noopener noreferrer"
               title="Open Brain Dump">
              <span className="refsm bd">#BD{r.num}</span>
              <span className="jt">{r.title}</span>
              <span className="meta">{[
                r.state==="inbox" ? "In your Inbox" : r.state==="done" ? "Done" : null,
                r.category || null,
                r.withWhom ? `with ${r.withWhom}` : null,
                r.due ? `due ${fmtDate(r.due)}` : null,
              ].filter(Boolean).join(" \u00b7 ")}</span>
            </a>)}
        </>}
      </div>}
    </div>
    {mineToDo.length>0 && <><div className="h"><h2>Assigned to you</h2><span className="sub">{mineToDo.length} — things your team handed up</span></div>
      <TaskTable list={mineToDo} people={people} today={today} setOpen={ctx.opener(mineToDo)} isMgr={false}
        cols={["title","status","origin","due","updated","why"]}
        why={t=>attention(t,today)||(t.created_by!==ctx.me.id?{why:`${nameOf(people,t.created_by)} is waiting on you`,tone:"warn",rank:5}:null)}/></>}
    {theirOwn.length>0 && <div className="note" style={{marginTop:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{flex:1}}>{theirOwn.length} task{theirOwn.length===1?"":"s"} your team set for themselves {theirOwn.length===1?"is":"are"} overdue or stuck. Their list, not yours — but here if you want it.</span>
      <button className="btn sm" onClick={()=>setShowTheirs(!showTheirs)}>{showTheirs?"Hide":"Show"}</button>
    </div>}
    {showTheirs && theirOwn.length>0 && <TaskTable list={theirOwn.map(x=>x.t)} people={people} today={today}
      setOpen={ctx.opener(theirOwn.map(x=>x.t))} cols={["who","title","status","due","why"]}/>}
    <div className="h"><h2>Needs attention</h2><span className="sub">{flagged.length ? `${flagged.length} item${flagged.length>1?"s":""}` : "Nothing — enjoy it"}</span></div>
    {flagged.length
      ? (() => {
          const groups = Object.entries(flagged.reduce((acc,x)=>{
              const g = x.a.group || "Needs a look";
              (acc[g] = acc[g] || []).push(x); return acc;
            },{})).sort((a,b)=>a[1][0].a.rank - b[1][0].a.rank);
          const block = ([label,items]) =>
            <Fold key={label} label={label} count={items.length} edge={GROUP_EDGE[label]||"edge-navy"}>
              <TaskTable list={groupSeries(items.map(x=>x.t)).map(g=>g.t)} people={people} today={today}
                setOpen={ctx.opener(flagged.map(x=>x.t))} cols={["who","title","status","due","updated","why"]}/>
            </Fold>;
          // anything you are watching that no other group has already claimed, so a
          // watched task that needs a decision stays under the decision heading
          const claimed = new Set(flagged.map(x=>x.t.id));
          const watchlist = tasks.filter(t=>!CLOSED(t.status) && WATCHED.has(t.id)
                                            && t.assignee_id!==ctx.me.id && !claimed.has(t.id))
            .sort((a,b)=>(a.due_date||"9").localeCompare(b.due_date||"9"));
          const watchBlock = watchlist.length
            ? <Fold key="__watching" label="Watching" count={watchlist.length} storeKey="watching" edge="edge-navy">
                <TaskTable list={watchlist} people={people} today={today}
                  setOpen={ctx.opener(watchlist)} cols={["who","title","status","due","updated","why"]}
                  why={t=>attention(t,today)}/>
              </Fold>
            : null;
          // Watched work that has closed, held until you say you are done looking.
          const closedWatch = WATCHED_DONE(tasks, null).filter(t=>t.assignee_id!==ctx.me.id);
          const doneBlock = closedWatch.length
            ? <Fold key="__watchdone" label="Finished, and you were watching" count={closedWatch.length}
                    storeKey="watchdone" edge="edge-ok">
                <div className="note" style={{marginBottom:8}}>
                  Closed, but you asked to follow them, so they stay here until you let go.
                </div>
                <TaskTable list={closedWatch} people={people} today={today}
                  setOpen={ctx.opener(closedWatch)} cols={["who","title","finished"]}
                  actions={t=><button className="btn sm" style={{whiteSpace:"nowrap"}}
                    title="Take the eye off it — it drops out of this list"
                    onClick={()=>doneLooking(t)}>Done looking</button>}/>
              </Fold>
            : null;
          const at = groups.findIndex(([label])=>label==="Overdue");
          const out = groups.map(block);
          const extras = [watchBlock, doneBlock].filter(Boolean);
          if(extras.length) out.splice(at<0 ? out.length : at, 0, ...extras);
          return out;
        })()
      : <div className="card"><div className="empty">
          Everything you've delegated is on track. The other {openT.length} open tasks are fine without you.
        </div></div>}
    {sorting.length>0 && <><div className="h"><h2>Needs sorting</h2><span className="sub">{sorting.length} without an owner or a date</span></div>
      <TaskTable list={sorting} people={people} today={today} setOpen={ctx.opener(sorting)}
        cols={["who","title","status","due","why"]}
        why={t=>({why:!owned(t)&&!t.due_date?"No owner, no date":!owned(t)?"No owner":"No due date",tone:"warn",rank:5})}/></>}
    <div className="counts">
      {[["track","On track"],["waiting","Waiting"],["week","Due this week"],["overdue","Overdue"]].map(([k,l])=>
        <button key={k} className={filter===k?"on":""} onClick={()=>setFilter(filter===k?null:k)}><b>{buckets[k].length}</b><span>{l}</span></button>)}
    </div>
    {shown && <TaskTable list={groupSeries(shown).map(g=>g.t)} people={people} today={today}
      setOpen={ctx.opener(shown)} cols={["who","title","status","due","updated"]} empty="Nothing here."/>}
  </>;
}

// ---------- people (manager) ----------
function People(ctx){
  const {tasks,people,today,me,isOwner,isMgr,load,showToast,setMe,invitees} = ctx;
  const [pick,setPick] = useState(null);
  const set = async (p,patch) => {
    const {error} = await sb.from("profiles").update(patch).eq("id",p.id);
    if(error){ showToast(error.message); return; }
    await load(); if(p.id===me.id) setMe(prev=>({...prev,...patch})); showToast("Saved");
  };
  if(pick) return <Agenda personId={pick} people={people} onBack={()=>setPick(null)} showToast={showToast} setOpen={ctx.setOpen} openTaskId={ctx.openTaskId}/>;

  const roster = people.filter(p=>p.id!==me.id && (isOwner || p.manager_id===me.id));
  const roleLabel = (r) => r==="owner" ? "Owner" : r==="manager" ? "Manager" : "Employee";
  return <>
    <div className="h"><h2>People</h2><span className="sub">{roster.length} {roster.length===1?"person":"people"}</span></div>
    <div className="note" style={{marginBottom:10}}>{isOwner
      ? "Everyone with an account. Set each person's role and who they report to — a manager only sees their own reports. Deactivate anyone who leaves; their tasks stay so you can reassign them."
      : roster.length
        ? "The people who report to you. Roles and reporting lines are set by the owner."
        : "Nobody reports to you yet. When the owner points someone at you, they'll show up here with their open work and a 1:1 agenda."}</div>
    <div className="card">{roster.length ? roster.map(p=>{
      const mine = tasks.filter(t=>t.assignee_id===p.id && !CLOSED(t.status));
      const flag = mine.filter(t=>attention(t,today)).length;
      return <div className="person" key={p.id} style={{cursor:"default",flexWrap:"wrap",gap:10}}>
        <div style={{flex:"1 1 200px"}}>
          <b>{p.full_name}</b>{!p.active && <span className="pill" style={{marginLeft:6}}>inactive</span>}
          <div style={{fontSize:13,color:"var(--muted)"}}>{p.email}</div>
          <div style={{fontSize:13,color:"var(--muted)"}}>
            {roleLabel(p.role)}{p.manager_id?` · reports to ${nameOf(people,p.manager_id)}`:" · reports to nobody"}
          </div>
          <div className="stats" style={{marginTop:4}}>
            <span><b>{mine.length}</b> open</span>
            <span><b style={{color:flag?"var(--red)":"inherit"}}>{flag}</b> needing attention</span>
          </div>
          <AltEmails person={p} canEdit={isOwner} showToast={showToast}/>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {isOwner && <>
            <select value={p.role} onChange={e=>set(p,{role:e.target.value})} style={{padding:"6px 8px",borderRadius:8,border:"1px solid var(--line)"}}>
              <option value="employee">Employee</option><option value="manager">Manager</option><option value="owner">Owner</option></select>
            <select value={p.manager_id||""} onChange={e=>set(p,{manager_id:e.target.value||null})} style={{padding:"6px 8px",borderRadius:8,border:"1px solid var(--line)"}}>
              <option value="">Reports to nobody</option>
              {people.filter(x=>x.active && x.id!==p.id && (x.role==="manager"||x.role==="owner")).map(x=><option key={x.id} value={x.id}>Reports to {x.full_name}</option>)}
            </select>
            <button className="btn sm" onClick={()=>set(p,{active:!p.active})}>{p.active?"Deactivate":"Reactivate"}</button>
          </>}
        </div>
      </div>;
    }) : <div className="empty">Nobody else yet. Add someone below and you can assign them work before they even sign up.</div>}</div>
    {isMgr && <Invites invitees={invitees} load={load} showToast={showToast}/>}
    {isOwner && <Access showToast={showToast}/>}
  </>;
}

// A person can send task emails from more than one address — a shared AP or purchasing
// mailbox, an old address, a phone account. Without this, intake sees a stranger and drops it.
function AltEmails({person,invitee,canEdit,showToast}){
  const key = invitee ? {col:"invitee_email", val:String(invitee).toLowerCase()} : {col:"profile_id", val:person.id};
  const [rows,setRows] = useState(null);
  const [adding,setAdding] = useState(false);
  const [addr,setAddr] = useState(""); const [note,setNote] = useState("");
  const load = useCallback(()=>{
    sb.from("person_emails").select("*").eq(key.col,key.val).order("created_at")
      .then(({data,error})=>{ if(error){ showToast(error.message); return; } setRows(data||[]); });
  },[key.col,key.val,showToast]);
  useEffect(()=>{load();},[load]);
  const add = async () => {
    const e = addr.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e)){ showToast("That doesn't look like an email address"); return; }
    const row = invitee ? {invitee_email:key.val, email:e, note:note.trim()||null}
                        : {profile_id:person.id, email:e, note:note.trim()||null};
    const {error} = await sb.from("person_emails").insert(row);
    if(error){ showToast(/duplicate|unique/i.test(error.message) ? "That address is already on somebody" : error.message); return; }
    setAddr(""); setNote(""); setAdding(false); load();
    showToast(invitee ? "Added — it starts working the day they sign up" : "Added — email from there will land as their task");
  };
  const drop = async (r) => {
    const {error} = await sb.from("person_emails").delete().eq("id",r.id);
    if(error){ showToast(error.message); return; }
    load(); showToast("Removed");
  };
  if(!rows) return null;
  return <div style={{marginTop:6}}>
    {rows.length>0 && <div style={{fontSize:13,color:"var(--muted)"}}>
      Also sends from: {rows.map((r,i)=><span key={r.id}>{i>0?", ":""}
        <b>{r.email}</b>{r.note?` (${r.note})`:""}
        {canEdit && <button className="btn q" title="Remove this address"
          style={{padding:"0 4px",color:"var(--muted)"}} onClick={()=>drop(r)}>&times;</button>}</span>)}
      {invitee && <span> — live once they sign up</span>}
    </div>}
    {canEdit && (adding
      ? <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
          <input value={addr} onChange={e=>setAddr(e.target.value)} placeholder="ap@johnstoneoc.com" autoFocus
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } }}
            style={{flex:"1 1 200px",border:"1px solid var(--line)",borderRadius:8,padding:"6px 9px"}}/>
          <input value={note} onChange={e=>setNote(e.target.value)} placeholder="what it is (optional)"
            style={{flex:"1 1 140px",border:"1px solid var(--line)",borderRadius:8,padding:"6px 9px"}}/>
          <button className="btn sm p" onClick={add}>Add</button>
          <button className="btn sm" onClick={()=>{setAdding(false);setAddr("");setNote("");}}>Cancel</button>
        </div>
      : <button className="btn q" style={{padding:"2px 0",color:"var(--navy)",fontSize:13}}
          onClick={()=>setAdding(true)}>+ another email address they send from</button>)}
  </div>;
}

// A dropdown you can tick several things in. The button says what is chosen, so a
// filter that is on never hides behind a closed panel.
function MultiPick({allLabel, options, value, onChange}){
  const [open,setOpen] = useState(false);
  const box = useRef(null);
  useEffect(()=>{
    if(!open) return;
    const away = (e)=>{ if(box.current && !box.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", away);
    return ()=>document.removeEventListener("mousedown", away);
  },[open]);
  const sel = value||[];
  const toggle = (k) => onChange(sel.includes(k) ? sel.filter(x=>x!==k) : [...sel,k]);
  const text = !sel.length ? allLabel
    : sel.length===1 ? ((options.find(o=>o.k===sel[0])||{}).label || "1 selected")
    : `${sel.length} selected`;
  return <div className="multipick" ref={box}>
    <button type="button" className={"mp-btn"+(sel.length?" on":"")} onClick={()=>setOpen(!open)}>
      <span className="mp-text">{text}</span><span className="mp-caret">{open?"\u25B4":"\u25BE"}</span>
    </button>
    {open && <div className="mp-panel">
      {sel.length>0 && <button type="button" className="mp-clear" onClick={()=>onChange([])}>{"Clear \u2014 show all"}</button>}
      {options.map(o=>o.header
        ? <div key={"h"+o.header} className="mp-head">{o.header}</div>
        : <label key={o.k} className="mp-row">
            <input type="checkbox" checked={sel.includes(o.k)} onChange={()=>toggle(o.k)}/>
            <span>{o.label}</span></label>)}
    </div>}
  </div>;
}

// ---------- "what I need from you", as an email you can paste ----------
// Several of the people holding Kathleen's work will never have a login, so the app can
// never be the place they read it. This builds the list as an email she sends herself,
// from her own mailbox: their reply then lands in her inbox like any other, which is the
// one thing Task Depot could not do for them — intake drops a reply from an address with
// no account, so a message sent BY the app would answer into nowhere.
const htmlEsc = (v) => String(v==null?"":v)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// Intake writes the detail line about her in the third person — "Kathleen is requesting
// 10 dumpster signs" — which is right on the task and wrong in an email she is sending.
// Only fires when the line actually opens with her name, and leaves everything else alone.
const firstPerson = (txt, myName) => {
  const full = String(myName||"").trim();
  for(const n of [full, full.split(" ")[0]].filter(Boolean)){
    const m = new RegExp("^" + n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b\\s+(.*)$","is").exec(txt);
    if(!m) continue;
    let rest = m[1];
    if(/^is\s/i.test(rest))  return "I'm " + rest.replace(/^is\s+/i,"");
    if(/^has\s/i.test(rest)) return "I've " + rest.replace(/^has\s+/i,"");
    rest = rest.replace(/^(need|want|request|ask|would like)s\b/i,"$1");
    return "I " + rest.charAt(0).toLowerCase() + rest.slice(1);
  }
  return txt;
};

function NeedList({holderKey,holderLabel,tasks,me,onClose,showToast}){
  const held = (tasks||[]).filter(t=>{
    if(CLOSED(t.status) || t.deleted_at) return false;
    return String(holderKey).startsWith("email:")
      ? t.assignee_email === String(holderKey).slice(6)
      : t.assignee_id === holderKey;
  }).sort((a,b)=> String(a.due_date||"9999").localeCompare(String(b.due_date||"9999"))
                  || String(a.created_at||"").localeCompare(String(b.created_at||"")));

  const [picked,setPicked] = useState(() => new Set(held.map(t=>t.id)));
  const [details,setDetails] = useState(true);
  const first = String(holderLabel||"").trim().split(" ")[0] || "there";
  const [lead,setLead] = useState("You asked what you could help with — here's what I have on my list for you.");
  // The marker that lets a forwarded reply file itself. Intake cuts the email there: above
  // it is new writing, below it is this list coming back round, which must not be read as
  // answers. Visible on purpose — a hidden one gets stripped by mail clients, and it is
  // the same line every support mailbox uses, so nobody will blink at it.
  const [marker,setMarker] = useState(true);
  const MARK = "Reply above this line and I'll file your answers against the right items.";
  const toggle = (id) => setPicked(prev => { const n = new Set(prev);
    if(n.has(id)) n.delete(id); else n.add(id); return n; });
  const chosen = held.filter(t=>picked.has(t.id));

  // Outlook keeps inline styles on tables and throws away almost everything else, so this
  // is built the way the app's other emails are: one table, no flexbox, no stylesheet.
  const buildHtml = () => {
    const rows = chosen.map(t=>{
      const bits = [];
      if(t.created_at) bits.push("Added " + fmtDate(String(t.created_at).slice(0,10)));
      if(t.priority==="high") bits.push("High priority");
      // "Not started" is this app's word for a task nobody has picked up, and it reads as
      // an accusation to somebody who has never seen the app. Only say something useful.
      if(t.status==="waiting") bits.push("Waiting on " + (t.waiting_on || "someone else"));
      const det = details && t.details
        ? '<div style="color:#4a5060;font-size:14px;margin-top:3px">' + htmlEsc(firstPerson(
            String(t.details).split(/\n\s*— from an email forwarded by/)[0].trim(),
            (me&&me.full_name)||"").slice(0,260)) + '</div>'
        : "";
      return '<tr>'
        + '<td style="padding:11px 10px 11px 0;border-top:1px solid #e3e7ee;vertical-align:top;white-space:nowrap">'
        + '<span style="font-family:Consolas,monospace;font-size:13px;font-weight:700;color:#1f3a7a">#TD'
        + htmlEsc(t.ref) + '</span></td>'
        + '<td style="padding:11px 0;border-top:1px solid #e3e7ee;vertical-align:top">'
        + '<div style="font-weight:600;font-size:15px">' + htmlEsc(t.title) + '</div>'
        + det
        + (bits.length ? '<div style="color:#8a909c;font-size:12px;margin-top:4px">' + htmlEsc(bits.join("  ·  ")) + '</div>' : '')
        + '</td></tr>';
    }).join("");
    return '<div style="font-family:Calibri,\'Segoe UI\',Arial,sans-serif;font-size:15px;line-height:1.5;color:#1c1f26;max-width:620px">'
      + (marker ? '<div style="color:#8a909c;font-size:12px;border-bottom:1px solid #e3e7ee;padding-bottom:9px;margin:0 0 14px">'
                  + htmlEsc(MARK) + '</div>' : '')
      + '<p style="margin:0 0 12px">Hi ' + htmlEsc(first) + ',</p>'
      + (lead.trim() ? '<p style="margin:0 0 4px">' + htmlEsc(lead.trim()) + '</p>' : '')
      + '<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;margin:10px 0 16px">'
      + rows + '</table>'
      + '<p style="margin:0 0 12px;color:#4a5060;font-size:14px">Reply to this one and I\'ll update my notes — nothing for you to log in to.</p>'
      + '<p style="margin:0">' + htmlEsc(String((me&&me.full_name)||"").split(" ")[0] || "Thanks") + '</p>'
      + '</div>';
  };
  // the same thing again in plain text, for a mail client that refuses the rich flavour
  const buildText = () => {
    const lines = marker ? [MARK, "", "Hi " + first + ",", ""] : ["Hi " + first + ",", ""];
    if(lead.trim()) lines.push(lead.trim(), "");
    chosen.forEach(t=>{
      lines.push("#TD" + t.ref + "  " + t.title);
      if(details && t.details) lines.push("    " + firstPerson(
        String(t.details).split(/\n\s*— from an email forwarded by/)[0].trim(),
        (me&&me.full_name)||"").slice(0,260).replace(/\s+/g," "));
      const bits = [];
      if(t.created_at) bits.push("Added " + fmtDate(String(t.created_at).slice(0,10)));
      if(t.priority==="high") bits.push("High priority");
      if(t.status==="waiting") bits.push("Waiting on " + (t.waiting_on || "someone else"));
      if(bits.length) lines.push("    " + bits.join("  ·  "));
      lines.push("");
    });
    lines.push("Reply to this one and I'll update my notes — nothing for you to log in to.", "",
               String((me&&me.full_name)||"").split(" ")[0] || "Thanks");
    return lines.join("\n");
  };

  const copy = async () => {
    if(!chosen.length){ showToast("Nothing ticked to copy"); return; }
    const html = buildHtml(), text = buildText();
    try{
      if(navigator.clipboard && window.ClipboardItem){
        await navigator.clipboard.write([new window.ClipboardItem({
          "text/html": new Blob([html],{type:"text/html"}),
          "text/plain": new Blob([text],{type:"text/plain"}),
        })]);
        showToast("Copied — paste it straight into Outlook"); return;
      }
    }catch(e){ /* fall through to the old way */ }
    // Safari and anything older: put it on the page, select it, let execCommand take it
    try{
      const d = document.createElement("div");
      d.setAttribute("contenteditable","true");
      d.style.cssText = "position:fixed;left:-9999px;top:0";
      d.innerHTML = html; document.body.appendChild(d);
      const r = document.createRange(); r.selectNodeContents(d);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      const ok = document.execCommand("copy");
      sel.removeAllRanges(); document.body.removeChild(d);
      showToast(ok ? "Copied — paste it straight into Outlook"
                   : "Your browser would not let go of the clipboard — use Print instead");
    }catch(e){ showToast("Your browser would not let go of the clipboard — use Print instead"); }
  };

  const doPrint = () => {
    if(!chosen.length){ showToast("Nothing ticked to print"); return; }
    const w = window.open("", "_blank", "width=820,height=950");
    if(!w){ showToast("Your browser blocked the print window — allow pop-ups for this site"); return; }
    w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'
      + htmlEsc("For " + holderLabel) + '</title>'
      + '<style>@page{margin:18mm} body{margin:0} tr{page-break-inside:avoid}</style>'
      + '</head><body>' + buildHtml() + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(()=>{ try{ w.print(); }catch(e){} }, 300);
  };

  return <div className="modal" onClick={onClose}>
    <div className="panel edge-navy" style={{maxWidth:980}} onClick={e=>e.stopPropagation()}>
      <div className="spine">
        <h3 style={{margin:0}}>What I need from {holderLabel}</h3>
        <button className="btn q" onClick={onClose}>{"×"}</button>
      </div>
      {!held.length
        ? <div className="empty">{holderLabel} has nothing open right now.</div>
        : <>
          <label style={{display:"block",marginBottom:10}}>
            <span style={{display:"block",fontSize:13,color:"var(--muted)",marginBottom:4}}>Opening line</span>
            <input value={lead} onChange={e=>setLead(e.target.value)}
              placeholder="Leave it blank to go straight into the list"/>
          </label>
          <div className="nl-grid">
            <div>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                <span style={{fontSize:13,color:"var(--muted)",flex:1}}>
                  {chosen.length} of {held.length} included
                </span>
                <button className="btn sm" onClick={()=>setPicked(new Set(held.map(t=>t.id)))}>All</button>
                <button className="btn sm" onClick={()=>setPicked(new Set())}>None</button>
              </div>
              <div className="nl-pick">
                {held.map(t=>{
                  const bits = [];
                  if(t.created_at) bits.push("Added " + fmtDate(String(t.created_at).slice(0,10)));
                  if(t.priority==="high") bits.push("High");
                  if(t.status==="waiting") bits.push("Waiting");
                  return <label key={t.id} className="nl-row">
                    <input type="checkbox" checked={picked.has(t.id)} onChange={()=>toggle(t.id)}/>
                    <span className="nt"><span className="nr">#{t.ref}</span>{" "}{t.title}
                      {bits.length ? <span className="nm">{bits.join("  ·  ")}</span> : null}</span>
                  </label>;
                })}
              </div>
              <label style={{display:"flex",gap:8,alignItems:"center",marginTop:10,fontSize:14}}>
                <input type="checkbox" checked={details} onChange={e=>setDetails(e.target.checked)} style={{width:"auto"}}/>
                Include the detail line under each one
              </label>
              <label style={{display:"flex",gap:8,alignItems:"flex-start",marginTop:7,fontSize:14}}>
                <input type="checkbox" checked={marker} onChange={e=>setMarker(e.target.checked)} style={{width:"auto",marginTop:3}}/>
                <span>Add the reply line at the top
                  <span className="meta" style={{display:"block"}}>
                    Forward their reply in and each answer files itself against its own task.
                    Without it, you would have to forward them one at a time.</span></span>
              </label>
            </div>
            <div>
              <div style={{fontSize:13,color:"var(--muted)",marginBottom:6}}>Exactly what they will see</div>
              <iframe className="nl-frame" title="Preview" srcDoc={
                '<body style="margin:14px">' + buildHtml() + '</body>'}/>
            </div>
          </div>
          <div className="note" style={{marginTop:12,fontSize:13}}>
            Send it from your own mailbox rather than letting Task Depot send it: {first} has no
            account here, so a reply to an app-sent email would be dropped as an unknown sender.
            Replying to yours comes back to your inbox {"''' + D + u'''"} and forwarding that reply in files
            each answer on its own task.
          </div>
          <div className="linkacts" style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn p" onClick={copy}>Copy for email</button>
            <button className="btn" onClick={doPrint}>Print</button>
            <button className="btn q" onClick={onClose}>Close</button>
          </div>
        </>}
    </div>
  </div>;
}

// ---------- all tasks ----------
function AllTasks(ctx){
  const {tasks,people,today,isMgr,me} = ctx;
  // The filters stick. Resetting to "everything" every visit meant narrowing the list
  // was work you redid each time, so nobody did it. The search box deliberately does
  // NOT persist \u2014 coming back to a stale search term reads as missing data.
  const KEY = "td_all_filters_" + ((me&&me.id)||"anon");
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e){ return null; } })();
  const [q,setQ] = useState("");
  // The box used to look only at the title, context and details of tasks already
  // loaded. It now asks the server, which also reads comments, steps, the definition of
  // done and standing notes \u2014 about a fifth of real matches live there. The local
  // test still runs while the answer is on its way, so typing never feels laggy.
  const [found,setFound] = useState(null);
  useEffect(()=>{
    const text = q.trim();
    if(text.length < 2){ setFound(null); return; }
    let live = true;
    const h = setTimeout(async ()=>{
      const {data,error} = await sb.rpc("search_all",{q:text, include_closed:true});
      if(!live) return;
      setFound(error ? new Map() : new Map((data||[]).map(r=>[r.task_id,{hit:r.hit_kind, snippet:r.snippet}])));
    }, 250);
    return ()=>{ live=false; clearTimeout(h); };
  },[q]);
  const searching = q.trim().length >= 2;
  const [st,setSt] = useState(saved ? saved.st : "open");
  // Brain Dump, from this same box. Same debounce as the lookup above, but three
  // characters rather than two: that one reads a table here, this one is two bridge hops
  // away. Blocked and Needs you are Task Depot's own ideas and mean nothing over there,
  // so the block stays out of the way when you are asking either of those questions.
  const canBD = !!(ME && ME.id === BD_OWNER);
  const bdWanted = canBD && ["open","done","skipped","all"].includes(st);
  const [bdHits,setBdHits] = useState([]);
  const [bdErr,setBdErr] = useState("");
  const bdSeq = useRef(0);
  useEffect(()=>{
    const text = q.trim();
    if(!bdWanted || text.length < 3){ setBdHits([]); setBdErr(""); return; }
    const mine = ++bdSeq.current;
    const h = setTimeout(()=>{
      sb.functions.invoke("bridge",{body:{action:"search_bd", q:text, closed: st!=="open"}})
        .then(({data,error})=>{
          // an answer about what you typed a moment ago must not replace the one about
          // what is in the box now
          if(mine !== bdSeq.current) return;
          const why = error ? (error.message||"Couldn't reach Brain Dump") : (data && data.error);
          if(why){ setBdErr(why); setBdHits([]); return; }
          setBdErr(""); setBdHits((data && data.results) || []);
        })
        .catch(()=>{ if(mine===bdSeq.current){ setBdErr("Couldn't reach Brain Dump"); setBdHits([]); } });
    }, 250);
    return ()=>clearTimeout(h);
  },[q,st,bdWanted]);
  const [who,setWho] = useState(saved ? (saved.who||[]) : []);
  // First visit for a manager opens on the work they handed out, which is the question
  // this screen usually answers. Everything else is one tick away and the banner says so.
  const [origin,setOrigin] = useState(saved ? cleanOrigin(saved.origin) : (isMgr ? ["delegated"] : []));
  useEffect(()=>{ try{ localStorage.setItem(KEY, JSON.stringify({st,who,origin})); }catch(e){} },[KEY,st,who,origin]);
  const filtered = st!=="open" || who.length>0 || origin.length>0;
  const clearAll = () => { setSt("open"); setWho([]); setOrigin([]); setQ(""); };
  const peopleOpts = [
    ...people.filter(p=>p.active).map(p=>({k:p.id, label:p.full_name})),
    ...((INVITEES||[]).length ? [{header:"Not signed up yet"}] : []),
    ...(INVITEES||[]).map(i=>({k:"email:"+i.email, label:i.full_name||i.email})),
  ];
  // Narrow the list to one person and you can hand them that list. Everyone with a login
  // and everyone without appears in the same picker, which matters: the people who most
  // need an email are exactly the ones who cannot be sent anywhere else.
  const [needFor,setNeedFor] = useState(null);
  const labelFor = (k) => {
    const hit = peopleOpts.find(o=>o.k===k);
    return (hit && hit.label) || String(k).replace(/^email:/,"");
  };
  // "#42" or a bare number is a task number, not a word to look for in the text
  const asRef = (() => { const m = String(q||"").trim().match(/^(?:#\s*TD|TD\s*#?|#)?\s*(\d{1,6})$/i); return m ? Number(m[1]) : null; })();
  const match = (t) => {
    if(st==="open") return !CLOSED(t.status);
    if(st==="blocked") return !CLOSED(t.status) && t.status==="waiting" && !t.need_help && !t.need_manager;
    if(st==="needsyou") return !CLOSED(t.status) && ASKING_ANY(t)
                                && (ASKING(t) || t.assignee_id===(ME&&ME.id));
    if(st==="done") return t.status==="done";
    if(st==="skipped") return t.status==="skipped";
    return true;
  };
  const openCount = tasks.filter(t=>!CLOSED(t.status)).length;
  // A number in the box used to mean ONLY that task, which quietly made every other number
  // unsearchable: \"1050\" is a GL account, an invoice or a policy long before it is a task
  // reference, and typing one returned nothing at all. Now it means both. The task with
  // that number comes first, whatever its status \u2014 type the number of something finished
  // and you still get it \u2014 and everything carrying the number in its words follows.
  // Typing a person's name is a reasonable way to look for their work, and on a task
  // with several names on it that means all of them, not just whoever owns it.
  const peopleOn = (t) => {
    const h = HELD_BY(t.id);
    return h ? " " + (h.names||[]).join(" ") : " " + ownerName(people, t, {plain:true});
  };
  const matchesText = (t) => !searching ? true
    : found ? found.has(t.id)
    : (t.title+" "+t.context+" "+t.details+peopleOn(t)).toLowerCase()
        .includes(q.trim().toLowerCase());
  const narrowed = tasks.filter(match)
    .filter(t=>!origin.length || origin.includes(startedAs(t)))
    .filter(t=>!who.length || who.some(w => ON_TASK(t, w)))
    .filter(matchesText);
  // the direct hit ignores the filters on purpose: asking for a number by itself is asking
  // to be taken to that task, not to be told it does not match your current view
  const byNumber = asRef !== null ? tasks.filter(t=>t.ref===asRef && !t.deleted_at) : [];
  const list = [...byNumber, ...narrowed.filter(t=>!byNumber.some(r=>r.id===t.id))]
    .map(t=>{ const f = found && found.get(t.id);
              return f ? {...t, __hit:f.hit, __snippet:f.snippet} : t; });
  return <>
    <div className="h"><h2>{isMgr?"All tasks":"All my tasks"}</h2>
      <span className="sub">{list.length} shown{filtered?` of ${openCount} open`:""}</span></div>
    <div className="filters" style={{marginBottom:10}}>
      <input placeholder="Search, or type a task number" value={q} onChange={e=>setQ(e.target.value)}/>
      <select value={st} onChange={e=>setSt(e.target.value)}>
        <option value="open">Open</option>
        <option value="blocked">Waiting — on someone else</option>
        <option value="needsyou">Needs you</option>
        <option value="skipped">Skipped</option>
        <option value="done">Done</option>
        <option value="all">Everything</option></select>
      {isMgr && <MultiPick allLabel="Everyone" value={who} onChange={setWho} options={peopleOpts}/>}
      {isMgr && <MultiPick allLabel="Assigned or their own" value={origin} onChange={setOrigin} options={ORIGIN_OPTS}/>}
      {filtered && <button className="btn sm" onClick={clearAll}>Clear filters</button>}
      {isMgr && who.length===1 && <button className="btn sm p" onClick={()=>setNeedFor(who[0])}
        title="Build the list as an email you can paste into Outlook, or print">
        Make an email for {String(labelFor(who[0])).split(" ")[0]}</button>}
    </div>
    {filtered && <div className="note" style={{marginBottom:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{flex:1}}>
        A filter is on, and it stays on next time you open this screen.
        {origin.length===1 && origin[0]==="delegated" ? " You're looking at what you handed out \u2014 work people set for themselves is hidden." : ""}
      </span>
      <button className="btn sm" onClick={clearAll}>Show everything</button>
    </div>}
    {needFor && <NeedList holderKey={needFor} holderLabel={labelFor(needFor)} tasks={tasks}
      me={me} showToast={ctx.showToast} onClose={()=>setNeedFor(null)}/>}
    <TaskTable list={list} people={people} today={today} setOpen={ctx.opener(list)} isMgr={isMgr} empty="No tasks match."
      cols={searching
        ? (isMgr?["who","title","matched","snippet","status","due"]:["title","matched","snippet","status","due"])
        : (isMgr?["who","title","status","origin","entered","due","updated"]:["title","status","origin","entered","due","updated"])}/>

    {bdWanted && q.trim().length>=3 && (bdHits.length>0 || bdErr) && <div className="bdsec">
      <div className="bdhead">
        <h3>In Brain Dump</h3>
        <span className="meta">{bdErr ? bdErr : `${bdHits.length} match${bdHits.length===1?"":"es"}`}</span>
      </div>
      {bdHits.length>0 && <div className="card">
        {bdHits.map(r=><a key={r.num} className="bdrow" href={BD_URL} target="_blank" rel="noopener noreferrer"
          title="Open Brain Dump">
          <div className="bt"><span className="bn">#BD{r.num}</span>{r.title}</div>
          {r.snippet ? <div className="bs">{r.where}: {r.snippet}</div> : null}
          <div className="bm">{[
            r.state==="inbox" ? "In your Inbox" : r.state==="done" ? "Done" : null,
            r.category || null,
            r.withWhom ? `with ${r.withWhom}` : null,
            r.due ? `due ${fmtDate(r.due)}` : null,
          ].filter(Boolean).join("  \u00b7  ")}</div>
        </a>)}
      </div>}
    </div>}
  </>;
}

// One table for every list in the app. `cols` picks the columns; `actions` adds a
// right-hand cell of buttons; rows open the drawer unless `actions` says otherwise.
function TaskTable({list,people,today,setOpen,cols,isMgr,empty,actions,why}){
  const [sort,setSort] = useState(null);
  // WATCHED is a plain Set shared across the app, so nudge React when it changes
  const [,bump] = useState(0);
  const canWatch = !!(ME && (ME.role==="owner" || ME.role==="manager"));
  const toggleWatch = async (e,t) => {
    e.stopPropagation();                       // the row opens the task; the eye must not
    const on = !WATCHED.has(t.id);
    if(on) WATCHED.add(t.id); else WATCHED.delete(t.id);
    noteWatch(t, on, ME);
    bump(x=>x+1);
    const {error} = on
      ? await sb.from("task_watchers").insert({task_id:t.id, user_id:ME.id})
      : await sb.from("task_watchers").delete().eq("task_id",t.id).eq("user_id",ME.id);
    if(error){ if(on) WATCHED.delete(t.id); else WATCHED.add(t.id); noteWatch(t, !on, ME); bump(x=>x+1); }
  };
  // A job with three people on it is one row with three names, not three rows. The
  // column stays narrow: the owner in full, the rest as a count you can hover.
  const whoOf = (t) => {
    const h = HELD_BY(t.id);
    const base = ownerName(people, t);
    return h ? `${base} +${h.others}` : base;
  };
  const finishedAt = (t) => new Date(t.status==="skipped" ? t.updated_at : (t.completed_at || t.updated_at));
  const ago = (d) => { const days=Math.round((Date.now()-d)/86400000);
    return days<=0 ? "today" : days===1 ? "yesterday" : `${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})} (${days}d ago)`; };
  const dueCls = (t) => { if(!t.due_date || CLOSED(t.status)) return ""; return t.due_date < today ? "late" : t.due_date===today ? "today" : ""; };

  const COLS = {
    who:     {label:"Person", cls:"who", val:t=>whoOf(t).toLowerCase(), cell:t=>whoOf(t)},
    title:   {label:"Task", cls:"task", val:t=>t.title.toLowerCase(), cell:t=><>
               {canWatch && (() => {
                 const mine = WATCHED.has(t.id), others = otherWatchers(t);
                 const also = others.length ? watcherNames(others) : "";
                 return <button type="button"
                   className={"weye"+(mine?" on":others.length?" others":"")}
                   onClick={(e)=>toggleWatch(e,t)}
                   title={mine
                     ? (others.length ? `Watching \u2014 so ${also} ${others.length>1?"are":"is"} too. Press to stop`
                                      : "Watching \u2014 press to stop")
                     : (others.length ? `${also} ${others.length>1?"are":"is"} watching this. Press to watch it too`
                                      : "Keep an eye on this one")}>
                   <Eye on={mine || others.length>0}/></button>;
               })()}
               {t.ref ? <span className="refsm">#{t.ref}</span> : null}
               {t.title}
               {(() => {
                 const c = STEP_COUNTS[t.id];
                 if(!c || !c[1]) return null;
                 const [done,total] = c, all = done===total;
                 return <span className="steps-n" title={`${done} of ${total} step${total>1?"s":""} ticked off`}
                   style={all?{color:"var(--ok)"}:null}>{` (${done}/${total})`}</span>;
               })()}
               {/* Nothing in any table said a task repeats, so a monthly bank rec read as a
                   one-off. A mark rather than a column: it costs no width and turns up on
                   every screen at once, where a column would only help the one it is on. */}
               {t.recur_rule && <span className="recurmk" title={recurLabel(t)}>{"\u21bb"}</span>}
               {t.priority==="high" && <span className="pill high" style={{marginLeft:6}}>High</span>}
               {(t.need_manager||t.need_help) && (() => {
                 const at = ASKEE(t), mine = !!(ME && at === ME.id);
                 const who = mine ? "you" : (at ? String(nameOf(people,at)).split(" ")[0] : "a manager");
                 return <span className="pill" style={{marginLeft:6,background:mine?"#fdecea":"#f1f3f7",color:mine?"var(--red)":"var(--muted)"}}>
                   {mine ? (t.need_help ? "Needs help" : "Needs you") : `Needs ${who}`}</span>;
               })()}
               {GONE_TO_BD(t) && <span className="pill" style={{marginLeft:6,background:"#e0ecff",color:"#1f3a7a"}}>{t.bd_status==="sent"?"Sent to Kathleen's Inbox":"Returned to Kathleen's Inbox"}</span>}
               {(() => { const h = HELD_BY(t.id); if(!h) return null;
                 return <span className="pill shared"
                   title={`On this task: ${(h.names||[]).join(", ")}`}>
                   {h.done} of {h.n} done</span>; })()}
               {LINK_COUNTS[t.id] > 0 && <span className="pill" title="Linked to other tasks"
                 style={{marginLeft:6,background:"#eef3fd",color:"var(--navy)"}}>&#128279; {LINK_COUNTS[t.id]}</span>}
             </>},
    origin:  {label:"Assigned by", cls:"muted", val:t=>DELEGATED(t)?"0":t.asked_by?"1":"2",
              cell:t=>DELEGATED(t)
                    ? (t.created_by===(ME&&ME.id) ? "You assigned" : String(nameOf(people,t.created_by)).split(" ")[0]+" assigned")
                    : t.asked_by
                      ? (ASKEDBYME(t) ? "You asked for it" : String(nameOf(people,t.asked_by)).split(" ")[0]+" asked for it")
                    : t.assignee_id ? (t.assignee_id===(ME&&ME.id) ? "Your own" : "Their own") : "—"},
    status:  {label:"Status", val:t=>(STATUS[t.status]||"").toLowerCase(),
              cell:t=><><span className={"pill "+t.status}>{STATUS[t.status]}</span>
                {t.status==="waiting" && t.waiting_on ? <span className="meta"> on {t.waiting_on}</span> : null}</>},
    entered: {label:"Entered", cls:"num muted hide-sm", val:t=>t.created_at||"", cell:t=>fmtDate(String(t.created_at).slice(0,10))},
    due:     {label:"Due", cls:"num", cellCls:dueCls, val:t=>t.due_date||"9999", cell:t=>t.due_date?fmtDate(t.due_date):"—"},
    updated: {label:"Last update", cls:"num muted hide-sm", val:t=>t.last_update_at||t.updated_at||"", cell:t=>t.last_update_at?fmtWhen(t.last_update_at):"—"},
    finished:{label:"Finished", cls:"num", val:t=>String(+finishedAt(t)).padStart(16,"0"), cell:t=>ago(finishedAt(t))},
    trashed: {label:"Trashed", cls:"num muted", val:t=>t.updated_at||"",
              cell:t=>GONE_TO_BD(t) ? `${t.bd_status==="sent"?"Sent over":"Sent back"} ${fmtWhen(t.updated_at)}` : fmtWhen(t.updated_at)},
    repeats: {label:"Repeats", cls:"muted", val:t=>recurLabel(t).toLowerCase(), cell:t=>recurLabel(t)},
    unread:  {label:"", cls:"unreadcol", val:t=>t.__unread?"0":"1",
              cell:t=>t.__unread
                ? <span className="newdot" title="You haven't looked at this one yet">New</span>
                : <span className="seendot" title="Already seen">{"\u2713"}</span>},
    matched: {label:"Matched in", cls:"muted", val:t=>String(t.__hit||""), cell:t=>t.__hit||""},
    snippet: {label:"Where", cls:"muted hide-sm", val:t=>String(t.__snippet||""),
              cell:t=><span style={{fontSize:13}}>{t.__snippet||""}</span>},
    why:     {label:"Why", cls:"whycol", val:t=>{const a=why?why(t):attention(t,today); return a?String(a.rank??9):"9";},
              cell:t=>{const a=why?why(t):attention(t,today); return a ? <span className={"why "+a.tone}>{a.why}</span> : null;}},
  };
  const keys = (cols||["who","title","status","due","updated"]).filter(k=>COLS[k] && !(k==="who" && isMgr===false));

  const rows = (() => {
    if(!sort) return list;
    const c = COLS[sort.k]; if(!c) return list;
    return list.slice().sort((a,b)=>{ const x=c.val(a), y=c.val(b);
      return (x<y?-1:x>y?1:0)*sort.dir || String(a.title).localeCompare(String(b.title)); });
  })();

  if(!list.length) return <div className="card"><div className="empty">{empty||"Nothing here."}</div></div>;
  return <div className="card tablewrap">
    <table className="ttable"><thead><tr>
      {keys.map(k=><th key={k} className={COLS[k].cls||""} title="Sort by this column"
        onClick={()=>setSort(sort && sort.k===k ? (sort.dir===1?{k,dir:-1}:null) : {k,dir:1})}>
        {COLS[k].label}{sort && sort.k===k ? <span className="sortmark">{sort.dir===1?"\u25B4":"\u25BE"}</span> : null}</th>)}
      {actions && <th className="num"></th>}
    </tr></thead><tbody>
      {rows.map(t=><tr key={t.id} onClick={()=>setOpen && setOpen(t.id, rows)} style={setOpen?undefined:{cursor:"default"}}
        className={ASKING(t) ? "r-asking" : WATCHED.has(t.id) ? "r-watching" : ""}>
        {keys.map(k=><td key={k} className={[COLS[k].cls||"",COLS[k].cellCls?COLS[k].cellCls(t):""].join(" ").trim()}>{COLS[k].cell(t)}</td>)}
        {actions && <td className="num" onClick={e=>e.stopPropagation()}>{actions(t)}</td>}
      </tr>)}
    </tbody></table>
  </div>;
}

// ---------- duplicates (manager) ----------
// The judge has existed for a while but only ever ran when somebody opened a task, and
// its verdicts had nowhere to be seen. This runs it across everything and puts the
// answers where you can act on them.
function Duplicates(ctx){
  const {tasks,people,today,me,showToast,load,setOpen,isOwner,onCount} = ctx;
  const [pairs,setPairs]   = useState(null);
  const [mine,setMine]     = useState(true);
  const [run,setRun]       = useState(null);     // {done,total,found} while sweeping
  const [busy,setBusy]     = useState("");       // id of the pair being acted on

  const refresh = useCallback(async (scopeMine) => {
    const {data,error} = await sb.rpc("duplicate_pairs",{p_mine:scopeMine});
    if(error){ showToast(error.message); return; }
    const list = Array.isArray(data) ? data : [];
    setPairs(list);
    if(scopeMine && onCount) onCount(list.length);
  },[showToast,onCount]);
  useEffect(()=>{ refresh(mine); },[refresh,mine]);

  // Walk every task that still has an unjudged candidate. Each call is one small
  // judgement cached for good, so a second run has almost nothing left to do.
  const sweep = async () => {
    const {data,error} = await sb.rpc("sweep_targets");
    if(error){ showToast(error.message); return; }
    const targets = Array.isArray(data) ? data : [];
    if(!targets.length){
      setRun(null);
      showToast("Nothing new to check \u2014 every pair has already been judged");
      return;
    }
    setRun({done:0,total:targets.length,found:0});
    let found = 0, failed = 0;
    for(let i=0;i<targets.length;i++){
      try{
        const {data:r,error:e} = await sb.functions.invoke("dupecheck",{body:{task_id:targets[i].id}});
        if(e || !r || !r.ok) failed++; else found += (r.same||0);
      }catch(err){ failed++; }
      setRun({done:i+1,total:targets.length,found});
    }
    setRun(null);
    await refresh(mine);
    showToast(failed
      ? `Checked ${targets.length-failed} of ${targets.length} \u2014 ${failed} couldn't be judged, try again in a minute`
      : (found ? `Found ${found} to look at` : "Checked everything \u2014 nothing new looks like a duplicate"));
  };

  const keyOf = (p) => p.a.id + "|" + p.b.id;
  const act = async (p, what) => {
    setBusy(keyOf(p));
    try{
      if(what==="link"){
        const {error} = await sb.rpc("link_many",{p_task:p.a.id, p_others:[p.b.id]});
        if(error) throw error;
        showToast("Linked \u2014 they will show on each other from now on");
      } else if(what==="dismiss"){
        const {error} = await sb.rpc("dismiss_link",{p_a:p.a.id, p_b:p.b.id});
        if(error) throw error;
        showToast("Noted \u2014 you won't be asked about this pair again");
      }
      await refresh(mine); await load();
    }catch(e){ showToast(e.message||String(e)); }
    finally{ setBusy(""); }
  };
  const trash = async (p, side) => {
    const t = side==="a" ? p.a : p.b;
    setBusy(keyOf(p));
    const {error} = await sb.from("tasks").update({deleted_at:new Date().toISOString()}).eq("id",t.id);
    setBusy("");
    if(error){ showToast("Couldn't trash it: "+error.message); return; }
    showToast(`\u201c${t.title}\u201d moved to Trash`, async ()=>{
      await sb.from("tasks").update({deleted_at:null}).eq("id",t.id);
      await refresh(mine); await load();
    });
    await refresh(mine); await load();
  };

  const Side = ({t,p,side}) =>
    <div className="dupside">
      <button className="duptitle" onClick={()=>setOpen(t.id)} title="Open this task">{t.title}</button>
      <div className="meta">
        {t.who || "Unassigned"} {"\u00b7"} {STATUS[t.status]||t.status}
        {t.due ? ` \u00b7 due ${fmtDate(t.due)}` : " \u00b7 no date"}
        {t.by ? ` \u00b7 written by ${String(t.by).split(" ")[0]}` : ""}
      </div>
      <div className="meta">
        added {fmtDate(String(t.created).slice(0,10))}
        {t.steps>0 ? ` \u00b7 ${t.steps} step${t.steps>1?"s":""}` : ""}
        {t.comments>0 ? ` \u00b7 ${t.comments} comment${t.comments>1?"s":""}` : ""}
        {!t.steps && !t.comments ? " \u00b7 nothing on it yet" : ""}
      </div>
      {t.details ? <div className="dupdetail">{t.details}</div> : null}
      <button className="btn sm" disabled={busy===keyOf(p)} onClick={()=>trash(p,side)}
        title="Move this one to Trash — the other stays">Trash this one</button>
    </div>;

  return <>
    <div className="h"><h2>Duplicates</h2>
      <span className="sub">{pairs===null ? "looking\u2026"
        : pairs.length ? `${pairs.length} pair${pairs.length>1?"s":""} to decide on` : "nothing waiting"}</span></div>

    <div className="note" style={{marginBottom:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{flex:1}}>
        Every pair here was judged to be the same work, not just similar wording. Running the
        check reads the tasks nobody has compared yet; each answer is kept, so it gets quicker
        every time.
      </span>
      <select value={mine?"mine":"all"} onChange={e=>setMine(e.target.value==="mine")}
        style={{width:"auto"}}>
        <option value="mine">Work I have a part in</option>
        <option value="all">Everyone's</option>
      </select>
      <button className="btn p" disabled={!!run} onClick={sweep}>
        {run ? `Checking ${run.done} of ${run.total}\u2026` : "Run the check"}</button>
    </div>

    {run && <div className="card" style={{marginBottom:10,padding:"10px 12px"}}>
      <div className="dupbar"><i style={{width:`${Math.round(100*run.done/Math.max(run.total,1))}%`}}/></div>
      <div className="meta" style={{marginTop:6}}>
        Reading each task against the ones it might duplicate. {run.found
          ? `${run.found} found so far.` : "Nothing new so far."} You can leave this page open.
      </div>
    </div>}

    {pairs && pairs.length===0 && !run && <div className="card"><div className="empty">
      No duplicates waiting on you. Press Run the check if tasks have been added since the last sweep.
    </div></div>}

    {pairs && pairs.map(p=><div key={keyOf(p)} className="panel tint edged edge-warn" style={{marginBottom:12}}>
      <h3>Likely the same work</h3>
      {p.why ? <div className="dupwhy">{p.why}</div> : null}
      <div className="duppair">
        <Side t={p.a} p={p} side="a"/>
        <div className="dupvs">vs</div>
        <Side t={p.b} p={p} side="b"/>
      </div>
      <div className="actions" style={{justifyContent:"flex-start",marginTop:10,gap:8}}>
        <button className="btn" disabled={busy===keyOf(p)} onClick={()=>act(p,"link")}
          title="Keep both, but tie them together so each shows on the other">Keep both, link them</button>
        <button className="btn" disabled={busy===keyOf(p)} onClick={()=>act(p,"dismiss")}
          title="They are different work — stop suggesting this pair">Not the same</button>
      </div>
    </div>)}
  </>;
}

// ---------- employee my day ----------
function MyDay(ctx){
  const {tasks,today,people,update,me} = ctx;
  const mine = tasks.filter(t=>!CLOSED(t.status) && t.assignee_id===me.id);
  const handedUp = tasks.filter(t=>!CLOSED(t.status) && t.created_by===me.id && t.assignee_id!==me.id);
  const flagged = mine.filter(t=>t.need_help || t.need_manager);
  const rest = mine.filter(t=>!flagged.includes(t));
  const dueToday = rest.filter(t=>t.due_date && t.due_date<=today);
  const waiting = rest.filter(t=>t.status==="waiting");
  const review = rest.filter(t=>t.status==="ready_for_review");
  const upcoming = rest.filter(t=>!dueToday.includes(t) && t.status!=="waiting" && t.status!=="ready_for_review");
  const groups = [["Waiting on your manager",flagged],["Due today or overdue",dueToday],["Waiting on someone else",waiting],["Waiting for your manager's review",review],["Upcoming",upcoming],["Handed to your manager",handedUp]];
  return <>
    <div className="h"><h2>My day</h2><span className="sub">{fmtDate(today)} · {mine.length} open</span></div>
    {mine.length===0 && handedUp.length===0 && <div className="card"><div className="empty">Nothing on your plate right now. Tap + Add task to give yourself one.</div></div>}
    {groups.map(([l,list])=> list.length ? <React.Fragment key={l}>
      <div className="section-title">{l} ({list.length})</div>
      {l==="Waiting on your manager" && <div style={{fontSize:13,color:"var(--muted)",margin:"-2px 0 6px"}}>You've asked for help on these. They'll move back once you get a reply — nothing to do in the meantime.</div>}
      <TaskTable list={groupSeries(list).map(g=>g.t)} people={people} today={today} setOpen={ctx.opener(list)}
        isMgr={false} cols={["title","status","origin","entered","due","updated"]}/></React.Fragment> : null)}
  </>;
}

// ---------- assign modal (manager) ----------
function AssignModal(ctx){
  const {people,me,onClose,load,showToast,today,isMgr,parent,prefill,fromMention} = ctx;
  const blank = {title:"",assignee_id:isMgr?"":me.id,due_date:"",priority:"normal",context:parent?parent.context:"",details:"",definition_of_done:"",standing_notes:"",recur_rule:"",recur_day:"",recur_cap:3,asked_by:""};
  const [several,setSeveral] = useState([]);   // extra people to give a copy to
  // Only someone above you can have asked: you cannot put work on a colleague this way.
  const askers = (people||[]).filter(p=>p.active && p.id!==me.id &&
    (p.role==="owner" || p.id===me.manager_id));
  const [steps,setSteps] = useState([]);      // checklist typed while writing the task
  const [stepText,setStepText] = useState("");
  const addStep = () => {
    const lines = stepText.split(/\r?\n/).map(x=>x.replace(/^\s*[-*\u2022]\s*/,"").trim()).filter(Boolean);
    if(!lines.length) return;
    setSteps([...steps, ...lines]); setStepText("");
  };
  const [f,setF] = useState(prefill ? {...blank, ...prefill} : blank); const [ai,setAi] = useState(""); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  // Work goes down or sideways-to-yourself, never up. Putting something on your
  // manager's plate is Need help or a 1:1 mention, which keeps it tied to the task.
  const staff = ctx.isOwner
    ? people.filter(p=>p.active)
    : people.filter(p=>p.active && (p.id===me.id || p.manager_id===me.id));
  const pending = isMgr ? (ctx.invitees||[]) : [];
  const capture = async () => {
    if(!ai.trim()) return; setBusy(true); setErr("");
    try{
      const roster = Object.fromEntries(staff.map(p=>[p.full_name,p.id]));
      const {data,error} = await sb.functions.invoke("ai",{body:{action:"capture",text:ai,roster,today}});
      if(error) throw error; if(data.error) throw new Error(data.error);
      const t = data.task; setF({...blank, ...Object.fromEntries(Object.entries(t).filter(([k,v])=>v!==null && k in blank))});
    }catch(e){ setErr(e.message||String(e)); } finally{ setBusy(false); }
  };
  const save = async () => {
    if(!f.title.trim()) { setErr("A task needs a title."); return; }
    if(!several.length && !f.assignee_id) { setErr("Give this to someone — a task with no owner gets forgotten."); return; }
    if(!f.due_date) { setErr("Set a due date. Without one it can never be overdue, so nobody is ever reminded."); return; }
    setBusy(true);
    const byEmail = String(f.assignee_id||"").startsWith("email:") ? f.assignee_id.slice(6) : null;
    const row = {...f, created_by:me.id, asked_by:(f.assignee_id===me.id && f.asked_by) ? f.asked_by : null,
                 assignee_id:byEmail?null:(f.assignee_id||null), assignee_email:byEmail, due_date:f.due_date||null, parent_id:parent?parent.id:null,
                 recur_rule:f.recur_rule||null, recur_day:(!f.recur_rule||f.recur_rule==="daily"||f.recur_rule==="yearly")?null:(parseInt(f.recur_day)||null), recur_cap:Math.max(2, parseInt(f.recur_cap)||3)};
    // Several people on one job is now one task with their names on it, not a task
    // each. The first name is the owner; the rest go on as holders.
    const targets = several.length ? several : [byEmail ? "email:"+byEmail : row.assignee_id];
    const first = targets[0];
    const rows = [String(first||"").startsWith("email:")
      ? {...row, assignee_id:null, assignee_email:String(first).slice(6)}
      : {...row, assignee_id:first||null, assignee_email:null}];
    const {data:made, error} = await sb.from("tasks").insert(rows).select("id");
    const firstMade = made && made.length ? made[0].id : null;
    if(!error && firstMade && targets.length>1){
      let he = null;
      for(const target of targets.slice(1)){
        const mail = String(target||"").startsWith("email:") ? String(target).slice(6) : null;
        const {error:e} = await sb.rpc("add_holder", mail
          ? {p_task:firstMade, p_who:null, p_email:mail} : {p_task:firstMade, p_who:target});
        if(e && !he) he = e;
      }
      if(he) showToast("Task saved, but not everyone could be put on it: "+he.message);
    }
    if(!error && steps.length && made && made.length){
      const stepRows = made.flatMap(t => steps.map((body,i)=>({task_id:t.id, body, position:i, created_by:me.id})));
      const {error:se} = await sb.from("task_steps").insert(stepRows);
      if(se) showToast("Task saved, but the steps didn't: "+se.message);
    }
    setBusy(false);
    if(error){ setErr(error.message); return; }
    await load();
    showToast(targets.length>1 ? `One task, ${targets.length} names on it`
      : byEmail ? `Saved for ${byEmail} — it'll be waiting when they sign up`
      : `Assigned to ${nameOf(people,row.assignee_id)}`);
    onClose();
    if(firstMade && fromMention){
      const {error:le} = await sb.rpc("mention_became_task",{p_id:fromMention, p_task:firstMade});
      if(le) showToast("Task saved, but it could not be linked to the mention");
    }
    // drop straight into the task so a comment or attachment can go on now
    if(firstMade && rows.length===1 && ctx.setOpen) ctx.setOpen(firstMade, [firstMade]);
  };
  const tone = toneOf("not_started");
  return <div className="modalbg" style={{zIndex:50}} onClick={onClose}><div className="modal"
      style={{"--tab":tone.fg, "--tabwash":tone.bg}} onClick={e=>e.stopPropagation()}>
    <div className="spine">
      <span>{"New task"}</span>
      <span className="spine-sub">{parent ? "linked to another task" : isMgr ? "handing it over" : "yours"}</span>
    </div>
    <h2>{parent ? "Split off a linked task" : isMgr ? "Assign a task" : "Add a task"}</h2>
    {parent && <div className="note" style={{marginBottom:12}}>This becomes its own task, linked back to <b>{parent.title}</b>, with its own owner and due date.{!isMgr && " You can hand it to yourself or to your manager."}</div>}
    {isMgr && <div className="ai">
      <div style={{fontWeight:600,marginBottom:6}}>Or just describe it</div>
      <textarea placeholder='"Ilah needs to get an updated freight quote from Goodman for the Anaheim equipment order by Friday." Or paste an email.' value={ai} onChange={e=>setAi(e.target.value)}/>
      <div className="actions"><button className="btn" disabled={busy||!ai.trim()} onClick={capture}>{busy?"Reading…":"Fill in the form for me"}</button></div>
    </div>}
    <div className="form" style={{marginTop:14}}>
      <label>Task<input autoFocus value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="Get updated freight quote from Goodman"/></label>
      <div className="three">
        <label>Assign to<select value={several.length?"":f.assignee_id} disabled={several.length>0} onChange={e=>setF({...f,assignee_id:e.target.value})}><option value="">{several.length?`${several.length} people selected below`:"Unassigned"}</option>{staff.map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}
          {pending.length>0 && <optgroup label="Invited — not signed up yet">{pending.map(p=><option key={p.email} value={"email:"+p.email}>{p.full_name||p.email}</option>)}</optgroup>}</select></label>
        <label>Due<input type="date" value={f.due_date} onChange={e=>setF({...f,due_date:e.target.value})}/></label>
        <label>Priority<select value={f.priority} onChange={e=>setF({...f,priority:e.target.value})}><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option></select></label>
      </div>
      {/* Writing down your own task? Say if someone asked for it, and it reaches them too. */}
      {!several.length && f.assignee_id === me.id && askers.length>0 &&
        <label>Who asked for this?
          <select value={f.asked_by} onChange={e=>setF({...f,asked_by:e.target.value})}>
            <option value="">Nobody {"\u2014"} it's my own</option>
            {askers.map(a=><option key={a.id} value={a.id}>{a.full_name}</option>)}
          </select>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>
            Say so and it shows on their list as something they asked for, not as your own work.
          </div>
        </label>}
      {isMgr && (staff.length+pending.length)>1 && <div>
        <div className="section-title" style={{marginTop:0}}>Or give the same task to several people</div>
        <div>{[...staff.map(p=>({k:p.id, label:p.full_name})),
               ...pending.map(p=>({k:"email:"+p.email, label:(p.full_name||p.email)+" (not signed up yet)"}))]
          .map(o=><button key={o.k} type="button" className="chip" style={several.includes(o.k)?{background:"var(--navy)",color:"#fff",borderColor:"var(--navy)"}:{}}
            onClick={()=>setSeveral(several.includes(o.k)?several.filter(x=>x!==o.k):[...several,o.k])}>{o.label}</button>)}</div>
        {several.length>0 && <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>Each person gets their own copy with its own progress and due date, and the copies are linked to each other so you can see them together. Tap a name again to remove them.</div>}
      </div>}
      <label>Details<textarea value={f.details} onChange={e=>setF({...f,details:e.target.value})}/></label>
      <div>
        <div className="section-title" style={{marginTop:0}}>Steps {steps.length?`(${steps.length})`:""}</div>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:6}}>A checklist inside the task — no separate cards, no separate owner. Paste a list and each line becomes a step.</div>
        {steps.map((x,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderTop:"1px solid var(--line)"}}>
          <span style={{color:"var(--muted)",fontSize:13,minWidth:18}}>{i+1}.</span>
          <span style={{flex:1}}>{x}</span>
          <button type="button" className="btn q" style={{padding:"0 6px",color:"var(--muted)"}} onClick={()=>setSteps(steps.filter((_,j)=>j!==i))}>×</button>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <textarea value={stepText} onChange={e=>setStepText(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); addStep(); } }}
            placeholder="Add a step, then Enter" rows={1}
            style={{flex:1,border:"1px solid var(--line)",borderRadius:8,padding:"9px 11px",minHeight:42,resize:"vertical"}}/>
          <button type="button" className="btn sm" onClick={addStep} disabled={!stepText.trim()}>Add</button>
        </div>
      </div>
      <Recur f={f} setF={setF}/>
        {err && <div className="err">{err}</div>}
      <div className="actions"><button className="btn" onClick={onClose}>Cancel</button><button className="btn p" disabled={busy} onClick={save}>{isMgr?"Assign":"Add"}</button></div>
    </div>
  </div></div>;
}

// ---------- task detail modal ----------
function TaskModal(ctx){
  const {task:t,people,me,isMgr,update,trash,onClose,showToast,addSub,tasks,setOpen,today,queueIds} = ctx;
  const queue = (queueIds||[]).filter(id=>tasks.some(x=>x.id===id));
  const at = queue.indexOf(t.id);
  const go = (delta) => { const n = queue[at+delta]; if(n){ setOpen(n, queue); coverIfInMeeting(n); } };
  const iCreated = t.created_by===me.id;
  // Answering an ask belongs to the person it points at. The owner also picks up an ask
  // with nobody above to answer it, so a flag can never get stranded.
  const mayAnswer = isMgr && (ASKING(t) || !ASKEE(t));
  // you may reshape a task (dates, owner, title, trash) only if it's yours to reshape:
  // you created it, you're the owner, or it came up from someone who reports to you
  const creatorProfile = people.find(p=>p.id===t.created_by);
  const canReshape = iCreated || me.role==="owner" || !t.assignee_id
    || (isMgr && creatorProfile && creatorProfile.manager_id===me.id);
  const children = tasks.filter(c=>c.parent_id===t.id);
  const parent = t.parent_id ? tasks.find(p=>p.id===t.parent_id) : null;
  const siblings = t.series_id ? tasks.filter(x=>x.series_id===t.series_id && !CLOSED(x.status)).sort((a,b)=>(a.due_date||"").localeCompare(b.due_date||"")) : [];
  const root = t.series_id ? tasks.find(x=>x.id===t.series_id) : null;
  const [skipping,setSkipping] = useState(false);
  const [copying,setCopying] = useState(false);
  const [drop,setDrop] = useState([]);        // holders being taken off it
  const [copyBusy,setCopyBusy] = useState(false);
  const [joining,setJoining] = useState(null);      // "link" | "merge"
  const [joinQ,setJoinQ] = useState("");
  const [joinPick,setJoinPick] = useState([]);   // several at once when linking
  const [joinBusy,setJoinBusy] = useState(false);
  const [links,setLinks] = useState([]);
  // Watching is on the record: whoever can see the task can see you are following it.
  const [watching,setWatching] = useState(()=>WATCHED.has(t.id));
  const [, bumpW] = useState(0);
  useEffect(()=>{ setWatching(WATCHED.has(t.id)); },[t.id]);
  const toggleWatch = async () => {
    const on = !watching;
    setWatching(on);                       // the button answers straight away
    const {error} = on
      ? await sb.from("task_watchers").insert({task_id:t.id, user_id:me.id})
      : await sb.from("task_watchers").delete().eq("task_id",t.id).eq("user_id",me.id);
