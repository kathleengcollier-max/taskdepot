    U.dumpText=raw; U.aiBusy=true; render();
    try{
      const out=await callClaude(
        "Clean up this brain dump into a concise list of clear, actionable task lines. "+
        "One task per line. No numbering, no bullets, no preamble or commentary. "+
        "Keep it in the writer's own voice, fix obvious typos, split compound thoughts into separate lines, "+
        "and drop pure filler. Return ONLY the cleaned lines.\n\n---\n"+raw);
      if(out){ U.dumpText=out; toast('Cleaned up ✨'); }
      else { toast('AI returned nothing — left your text as-is'); }
    }catch(err){ toast('AI Cleanup unavailable right now'); }
    U.aiBusy=false; render();
  }

  // ---- AI intake pipeline: preflight -> extract -> match ----
  async function runPreflight(){
    const ta=document.querySelector('[data-dump]');
    const raw=(ta?ta.value:U.dumpText||'').trim();
    if(!raw){ toast('Nothing to process yet'); return; }
    U.dumpText=raw; U.aiBusy=true; render();
    try{
      const out=await callClaude(
        "You are helping turn a personal brain dump into tasks. Review the text below. "+
        "If it is clear enough to parse into tasks, reply with exactly: CLEAR\n"+
        "If some items are genuinely ambiguous (unclear what the task is, who owns it, or a missing critical detail), "+
        "reply with ONLY a JSON array of up to 4 short clarifying questions (strings), no other text. "+
        "Do not ask about trivial things. When in doubt, prefer CLEAR.\n\n---\n"+raw, 600);
      let qs=[];
      const clean=stripFences(out);
      if(!/^CLEAR/i.test(clean) && clean.includes('[')){
        try{ const arr=JSON.parse(clean.slice(clean.indexOf('['), clean.lastIndexOf(']')+1)); if(Array.isArray(arr)) qs=arr.filter(x=>typeof x==='string').slice(0,4); }catch(e){}
      }
      U.aiBusy=false;
      if(qs.length){ U.preQs=qs; U.preAns=''; U.preAnsMap={}; U.dumpStep='preflight'; render(); }
      else { runExtract(); }
    }catch(err){ U.aiBusy=false; toast('AI unavailable — try Quick capture'); render(); }
  }

  async function runExtract(){
    U.aiBusy=true; U.dumpStep='input'; render();
    const cats=S.categories.join(', '); const locs=S.locations.join(', ');
    const today=new Date().toISOString().slice(0,10);
    const answers=(U.preQs||[]).map((q,i)=>{ const a=((U.preAnsMap||{})[i]||'').trim(); return a?`Q: ${q}\nA: ${a}`:null; }).filter(Boolean).join('\n\n');
    try{
      const out=await callClaude(
        "Turn this brain dump into structured items. Return ONLY a JSON array, no preamble, no markdown fences. "+
        "Each object must have these keys: type (\"task\" or \"mention\"), title (concise imperative string), "+
        `category (one of: ${cats}), location (one of: ${locs}), `+
        "delegateTo (the name of the person who should own it if the text clearly implies someone else, otherwise \"KGC\" which means the user herself), "+
        "person (for a mention: the name of the person to bring it up with; otherwise \"\"), "+
        "priority (\"low\", \"medium\", or \"high\"), "+
        "dueDate (\"YYYY-MM-DD\" only if a date is stated or clearly implied, otherwise empty string \"\"), "+
        "subtasks (an array of short step strings, or [] if none). "+
        "A MENTION is something to raise with a person next time you see them rather than a to-do — e.g. \"@Eli: ask about badges\", \"tell Stephen about the shipment\", \"check with Carlos on the trip\". Mark those type=\"mention\" and put the person's name in person. "+
        "SUBTASKS: if one line describes a job that clearly breaks into steps (e.g. \"onboard the new hire — desk, laptop, badge, orientation\", or \"plan the open house\"), keep it as ONE task and put the steps in subtasks rather than creating separate tasks. Only add subtasks when the line genuinely implies steps; otherwise use []. Never give a mention subtasks. "+
        `Today is ${today}. The user refers to herself as KGC, Kathleen, or KC. `+
        "Split genuinely unrelated thoughts into separate items. Keep titles short."+
        (answers?("\n\nThe user answered some clarifying questions; use these to improve accuracy:\n"+answers):"")+
        "\n\n---\n"+U.dumpText);
      let arr=[];
      const clean=stripFences(out);
      try{ arr=JSON.parse(clean.slice(clean.indexOf('['), clean.lastIndexOf(']')+1)); }catch(e){}
      if(!Array.isArray(arr) || !arr.length){ U.aiBusy=false; toast('Could not parse items — try Quick capture'); render(); return; }
      const catSet=new Set(S.categories), locSet=new Set(S.locations);
      const items=arr.map(o=>{
        const isM=o.type==='mention';
        const cat=catSet.has(o.category)?o.category:(isM?'Personal':'Other');
        const loc=locSet.has(o.location)?o.location:'Office';
        const pri=['low','medium','high'].includes(o.priority)?o.priority:'medium';
        const due=validDate(o.dueDate)?o.dueDate:(isM?'':whenDate('week'));
        const subs=(isM||!Array.isArray(o.subtasks))?[]:o.subtasks.map(s=>String(s||'').trim()).filter(Boolean).slice(0,12);
        return { type:isM?'mention':'task', title:String(o.title||'').trim(), category:cat, location:loc,
                 delegateTo:(o.delegateTo&&String(o.delegateTo).trim())||'KGC',
                 person:isM?((o.person&&String(o.person).trim())||(o.delegateTo&&String(o.delegateTo).trim())||''):'',
                 priority:pri, dueDate:due, subtasks:subs, action:'create', dupOf:null, dupId:null };
      }).filter(x=>x.title);
      matchExisting(items);
      U.extracted=items; U.aiBusy=false; U.dumpStep='review'; render();
    }catch(err){ U.aiBusy=false; toast('AI unavailable — try Quick capture'); render(); }
  }

  function nrm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
  // Find an existing open task whose title closely resembles `title` (for duplicate-check-on-add).
  const STOP=new Set(['the','a','an','to','for','of','and','with','on','in','re','about','my','our','your','is','it']);
  function tokset(s){ return new Set(nrm(s).split(' ').filter(w=>w&&!STOP.has(w)).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w)); }
  function findSimilarTask(title, excludeId){
    const a=nrm(title); if(a.length<4) return null;
    const aset=tokset(title);
    let best=null, bestScore=0;
    (S.tasks||[]).forEach(t=>{
      if(t.id===excludeId || t.archived || t.status==='done' || t.type==='mention') return;
      const b=nrm(t.title); if(!b) return;
      let score;
      if(a===b) score=1;
      else if(a.length>6 && b.length>6 && (a.includes(b)||b.includes(a))) score=0.9;
      else { const bset=tokset(t.title); let inter=0; aset.forEach(x=>{if(bset.has(x))inter++;}); const u=aset.size+bset.size-inter; score=u?inter/u:0; }
      if(score>bestScore){ bestScore=score; best=t; }
    });
    return bestScore>=0.55 ? best : null;
  }
  function titleSim(a,b){ a=nrm(a);b=nrm(b); if(!a||!b)return 0; if(a===b)return 1;
    if(a.length>6&&b.length>6&&(a.includes(b)||b.includes(a)))return .9;
    const A=new Set(a.split(' ')),B=new Set(b.split(' ')); let inter=0; A.forEach(x=>{if(B.has(x))inter++;});
    return inter/(A.size+B.size-inter); }
  function matchExisting(items){

    items.forEach(it=>{
      if(it.type==='mention') return;

      existing.forEach(t=>{ const s=titleSim(it.title,t.title); if(s>bs){bs=s;best=t;} });
      if(bs>=0.55 && best){ it.dupOf=best.title; it.dupId=best.id; it.action='skip'; }
    });

  // ---- Feature: full task-list duplicate detection ----
  function dupePool(){
    if(U.dupeScope==='filtered'){ const f=filteredTasks().filter(t=>t.status!=='done'&&!t.archived); if(f.length) return f; }
    return activeTasks().filter(t=>t.status!=='done');
  }
  function computeDupeGroups(){
    const tasks=dupePool();
    const n=tasks.length;
    const norms=tasks.map(t=>{ const s=nrm(t.title); return {s, set:new Set(s.split(' ').filter(Boolean))}; });
    function sim(i,j){ const a=norms[i],b=norms[j]; if(!a.s||!b.s)return 0; if(a.s===b.s)return 1;
      if(a.s.length>6&&b.s.length>6&&(a.s.includes(b.s)||b.s.includes(a.s)))return .9;
      let inter=0; a.set.forEach(x=>{if(b.set.has(x))inter++;}); const u=a.set.size+b.set.size-inter; return u?inter/u:0; }
    const parent=tasks.map((_,i)=>i);
    const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ if(sim(i,j)>=0.6){ parent[find(i)]=find(j); } }
    const map={};
    for(let i=0;i<n;i++){ const r=find(i); (map[r]=map[r]||[]).push(tasks[i].id); }
    return Object.values(map).filter(g=>g.length>1);
  }
  function openDupes(scope){

    U.dupeConsol=null; U.dupeConsolKeep={}; U.dupeConsolSkip={}; U.dupeNest=null; U.dupeRan=false; U.dupeBatch=false;
    U.dupeBusy=false; U.menu=false; U.more=false; U.modal='dupes'; render();

    dupeRefine();

  async function dupeRefine(){
    if(U.dupeBusy) return;                 // don't stack calls
    const tasks=dupePool();
    if(!tasks.length){ U.dupeRan=true; render(); return; }
    const numbered=tasks.map((t,i)=>`${i+1}. ${t.title}`).join('\n');
    U.dupeBusy=true; render();
    try{
      const out=await callClaude(
        "You are tightening a task list. Review the numbered tasks and return ONLY compact JSON of the form "+
        '{"duplicates":[[numbers]],"consolidations":[[numbers]],"nest":[[child,parent]]} .\n'+
        "duplicates = tasks that are the SAME task (repeated or reworded to mean the same thing).\n"+
        "consolidations = a SMALL set of tasks (usually 2, at most 3) that are literally the same piece of work on the same specific object — the same one document, form, account, item number, vendor deal, event, or report — so that finishing one basically means doing the others together. The combined title must still describe ONE concrete task.\n"+
        "nest = pairs where the FIRST task is a step of the SECOND, broader task; write [childNumber, parentNumber]. Prefer nest when one task is clearly a sub-step of another.\n"+
        "STRICT RULE for consolidations and nest: do NOT group tasks merely because they share a person, an owner, a category, a location, a system (Inform, Asana, etc.), or a general theme (marketing, training, pricing, cleanup). 'Both involve Lex', 'both are marketing', 'both are about a printer' is NOT enough. If you are not confident two tasks are the very same work, leave them separate. When in doubt, omit. It is far better to return nothing than to group unrelated tasks.\n"+
        "Each duplicates/consolidations array has 2+ numbers; each nest array has exactly 2. Omit everything with no real overlap. Output only the JSON, nothing else.\n\n"+numbered, 4000);
      const obj=parseDupeJSON(out);
      if(!obj) throw new Error('parse');
      const toIds=g=>(g||[]).map(k=>tasks[k-1]&&tasks[k-1].id).filter(Boolean);
      const dgroups=(obj.duplicates||[]).map(toIds).filter(g=>g.length>1);
      const cgroups=(obj.consolidations||[]).map(toIds).filter(g=>g.length>1);
      const npairs=(obj.nest||[]).map(p=>({child:tasks[p[0]-1]&&tasks[p[0]-1].id, parent:tasks[p[1]-1]&&tasks[p[1]-1].id}))
        .filter(p=>p.child&&p.parent&&p.child!==p.parent);
      U.dupeGroups=dgroups; U.dupeKeep={}; dgroups.forEach((g,i)=>{U.dupeKeep[i]=g[0];});
      U.dupeConsol=cgroups; U.dupeConsolKeep={}; U.dupeConsolSkip={}; cgroups.forEach((g,i)=>{U.dupeConsolKeep[i]=g[0];});
      U.dupeNest=npairs;
      toast(`AI found ${dgroups.length} duplicate · ${cgroups.length} consolidation · ${npairs.length} to fold`);
    }catch(err){ toast('AI couldn’t finish — showing quick matches instead'); }
    U.dupeRan=true; U.dupeBusy=false; render();
  }
  // Parse the refine JSON, tolerating truncation: if the object is cut off,
  // salvage every complete [ ... ] group we can from duplicates/consolidations.
  function parseDupeJSON(out){
    const clean=stripFences(out);
    const start=clean.indexOf('{'); if(start<0) return null;
    const body=clean.slice(start);
    try{ const o=JSON.parse(body.slice(0, body.lastIndexOf('}')+1));
      return {duplicates:(o.duplicates||[]).filter(g=>Array.isArray(g)&&g.length>1),
              consolidations:(o.consolidations||[]).filter(g=>Array.isArray(g)&&g.length>1),
              nest:(o.nest||[]).filter(g=>Array.isArray(g)&&g.length>=2)}; }catch(e){}
    // truncated — recover section by section
    const KEYS=['duplicates','consolidations','nest'];
    const grab=(key)=>{
      const ki=body.indexOf('"'+key+'"'); if(ki<0) return [];
      let seg=body.slice(ki); let cut=seg.length;
      KEYS.forEach(k=>{ if(k!==key){ const oi=seg.indexOf('"'+k+'"'); if(oi>0) cut=Math.min(cut,oi); } });
      seg=seg.slice(0,cut);
      const groups=[]; const re=/\[\s*(\d+(?:\s*,\s*\d+)*)\s*\]/g; let m;
      while((m=re.exec(seg))){ const nums=m[1].split(',').map(x=>+x.trim()).filter(n=>n>0); if(nums.length>=2) groups.push(nums); }
      return groups;
    };
    const dup=grab('duplicates'), con=grab('consolidations'), nest=grab('nest');
    if(!dup.length && !con.length && !nest.length) return null;
    return {duplicates:dup, consolidations:con, nest:nest};
  }

  function snapTasks(ids){ return ids.map(id=>{const t=findTask(id); return t?{id, snap:JSON.parse(JSON.stringify(t))}:null;}).filter(Boolean); }
  function restoreTasks(snaps){ snaps.forEach(s=>{ const t=findTask(s.id); if(t){ Object.keys(t).forEach(k=>delete t[k]); Object.assign(t, s.snap); } }); }
  function foldInto(parent, child){
    if(!parent||!child) return 0;
    (parent.subtasks=parent.subtasks||[]).push({id:uid(),title:child.title,done:child.status==='done',createdAt:new Date().toISOString()});
    (child.subtasks||[]).forEach(s=>{ parent.subtasks.push({id:uid(),title:s.title,done:!!s.done,createdAt:new Date().toISOString()}); });
    if(child.notes && String(child.notes).trim()){

    }

        priority:x.priority, status:'open', workStatus:'working', type:'task', delegateTo:x.delegateTo||'KGC',
        dueDate:x.dueDate||whenDate('week'), createdAt:new Date().toISOString(), completedAt:null, pinned:false, archived:false,
        additionalLocations:[], subtasks:(x.subtasks||[]).map(s=>({id:uid(),title:s,done:false,createdAt:new Date().toISOString()})), logs:[{text:'From Brain Dump (AI)',createdAt:new Date().toISOString()}] });
      nt++;
    });
    S.dumps.unshift({ id:uid(), text:U.dumpText, createdAt:new Date().toISOString(), taskCount:nt+nm });
    resetDump(); persist(); render();
    const parts=[]; if(nt)parts.push(`${nt} task${nt===1?'':'s'}`); if(nm)parts.push(`${nm} mention${nm===1?'':'s'}`); if(ns)parts.push(`${ns} subtask${ns===1?'':'s'}`);
    toast(`Created ${parts.join(' · ')} ✨`);

  function resetDump(){ U.modal=null; U.dumpText=''; U.aiBusy=false; U.dumpStep='input'; U.preQs=[]; U.preAns=''; U.preAnsMap={}; U.extracted=null; U.dupeGroups=null; U.dupeKeep={}; U.dupeBusy=false; U.dupeConsol=null; U.dupeConsolKeep={}; U.dupeConsolSkip={}; }


  function saveDump(){
    const ta=document.querySelector('[data-dump]'); const text=(ta?ta.value:U.dumpText||'').trim();
    if(!text){ resetDump(); render(); return; }
    let created=0; const newIds=[];
    const cat = U.cat || 'Other';
    const loc = U.loc || 'Office';
    const owner = (U.deleg && U.deleg!=='__mine__' && U.deleg!=='__out__') ? U.deleg : 'KGC';
    const ws = (U.status && U.status!=='working') ? U.status : 'working';
    text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
      const nid=uid(); newIds.push(nid);
      S.tasks.unshift({ id:nid, title:line, notes:'', category:cat, location:loc,
        priority:'medium', status:'open', workStatus:ws, type:'task', delegateTo:owner,
        dueDate:whenDate('tomorrow'), createdAt:new Date().toISOString(), completedAt:null, pinned:false, archived:false,
        additionalLocations:[], subtasks:[], logs:[{text:'From Brain Dump',createdAt:new Date().toISOString()}] });
      created++;
    });
    S.dumps.unshift({ id:uid(), text, createdAt:new Date().toISOString(), taskCount:created });
    resetDump(); persist(); render();
    const capMsg = created?`Captured · ${created} task${created===1?'':'s'} created`:'Dump captured';
    if(created>=2){ reviewBatch(newIds, capMsg); }         // a list — check it against everything
    else if(created===1){ const sim=findSimilarTask(S.tasks.find(t=>t.id===newIds[0]).title, newIds[0]);
      if(sim){ toast('Captured — similar to "'+sim.title.slice(0,40)+'". Tap to open', ()=>{ U.drawer={type:'task', id:sim.id}; render(); }); }
      else toast(capMsg); }
    else toast(capMsg);
  }
  // After adding a list, run the same strict review but only surface groups that touch a just-added task.
  async function reviewBatch(newIds, capMsg){
    const idset=new Set(newIds);
    const tasks=activeTasks().filter(t=>t.status!=='done');
    if(tasks.length<2){ toast(capMsg); return; }
    const numbered=tasks.map((t,i)=>`${i+1}. ${t.title}`).join('\n');
    const newNums=tasks.map((t,i)=>idset.has(t.id)?i+1:0).filter(Boolean);
    if(!newNums.length){ toast(capMsg); return; }
    toast(capMsg+' · checking for related tasks…');
    try{
      const out=await callClaude(
        "You are checking freshly added tasks against an existing task list. Return ONLY compact JSON of the form "+
        '{"duplicates":[[numbers]],"consolidations":[[numbers]],"nest":[[child,parent]]} .\n'+
        "duplicates = tasks that are the SAME task (repeated or reworded to mean the same thing).\n"+
        "consolidations = a SMALL set (usually 2, at most 3) that are literally the same piece of work on the same specific object — the same one document, form, account, item number, vendor deal, event, or report.\n"+
        "nest = pairs where the FIRST task is a step of the SECOND, broader task; write [childNumber, parentNumber].\n"+
        "STRICT RULE: never group tasks merely because they share a person, an owner, a category, a system (Inform, Asana…), or a general theme (marketing, training, pricing). If not clearly the same work, leave them separate. When in doubt, omit.\n"+
        "ONLY report a group if it includes at least one of these NEW item numbers: "+newNums.join(', ')+". Do NOT report overlaps that are only among the older items.\n"+
        "Each duplicates/consolidations array has 2+ numbers; each nest array has exactly 2. Output only the JSON, nothing else.\n\n"+numbered, 4000);
      const obj=parseDupeJSON(out); if(!obj) throw new Error('parse');
      const toIds=g=>(g||[]).map(k=>tasks[k-1]&&tasks[k-1].id).filter(Boolean);
      const hasNew=g=>g.some(id=>idset.has(id));
      const dgroups=(obj.duplicates||[]).map(toIds).filter(g=>g.length>1&&hasNew(g));
      const cgroups=(obj.consolidations||[]).map(toIds).filter(g=>g.length>1&&hasNew(g));
      const npairs=(obj.nest||[]).map(p=>({child:tasks[p[0]-1]&&tasks[p[0]-1].id, parent:tasks[p[1]-1]&&tasks[p[1]-1].id}))
        .filter(p=>p.child&&p.parent&&p.child!==p.parent&&(idset.has(p.child)||idset.has(p.parent)));
      const total=dgroups.length+cgroups.length+npairs.length;
      if(!total){ toast(capMsg+' · nothing looked related'); return; }
      // default: keep/parent the EXISTING task so the new item folds into it (she can change it)
      U.dupeGroups=dgroups; U.dupeKeep={}; dgroups.forEach((g,i)=>{ U.dupeKeep[i]=g.find(id=>!idset.has(id))||g[0]; });
      U.dupeConsol=cgroups; U.dupeConsolKeep={}; U.dupeConsolSkip={}; cgroups.forEach((g,i)=>{ U.dupeConsolKeep[i]=g.find(id=>!idset.has(id))||g[0]; });
      U.dupeNest=npairs;
      U.dupeRan=true; U.dupeBusy=false; U.dupeScope='all'; U.dupeBatch=true; U.menu=false; U.more=false; U.modal='dupes'; render();
      toast(`${total} related item${total===1?'':'s'} to review`);
    }catch(err){ toast(capMsg); }
  }

  function exportBackup(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='braindump-backup-'+new Date().toISOString().slice(0,10)+'.json';

  function importBackup(){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); saveSnapshot(); const prev=JSON.parse(JSON.stringify(S));
        S={ tasks:d.tasks||[], lists:d.lists||[], dumps:d.dumps||[],

  async function restoreSnapshot(){

      const raw=localStorage.getItem(KEY_SNAP);
      if(!raw){ toast('No snapshot found yet'); return; }

      { const prev=JSON.parse(JSON.stringify(S)); S=snap.data; normalizeData(); persist(); U.drawer=null; U.modal=null; render();

  async function printPDF(){
    toast('Building PDF…');
    try{
      if(!window.jspdf){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
      const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'pt',format:'letter'});
      const list=filteredTasks(); const pw=doc.internal.pageSize.getWidth(); const ph=doc.internal.pageSize.getHeight();
      let y=54;
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(20); doc.text('Brain Dump — Task List', 48, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120);
      const filt=[U.tab!=='open'?U.tab:'', U.status, U.cat, U.loc, U.deleg&&U.deleg!=='__mine__'&&U.deleg!=='__out__'?U.deleg:(U.deleg==='__out__'?'delegated out':U.deleg==='__mine__'?'mine':''), U.q?('“'+U.q+'”'):''].filter(Boolean).join(' · ');
      y+=18; doc.text(new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+(filt?('   ·   '+filt):'')+'   ·   '+list.length+' tasks', 48, y);
      y+=16; doc.setDrawColor(220); doc.line(48,y,pw-48,y); y+=20;
      doc.setFontSize(10.5);
      list.forEach(t=>{
        if(y>ph-54){ doc.addPage(); y=54; }
        const owner=ownerLabel(t.delegateTo); const m=dueMeta(t.dueDate);
        const meta=[t.category, (t.location&&t.location!=='Office'?t.location:''), owner, m?(fmtDateY(t.dueDate)+(m.diff<0?(' ('+Math.abs(m.diff)+'d overdue)'):'')):'no date', t.workStatus!=='working'?t.workStatus:''].filter(Boolean).join('  ·  ');
        doc.setFont('helvetica','bold'); doc.setTextColor(25);
        const titleLines=doc.splitTextToSize(t.title||'(untitled)', pw-96);
        doc.text(titleLines, 48, y); y+=titleLines.length*14;
        doc.setFont('helvetica','normal'); doc.setTextColor(130); doc.setFontSize(9);
        doc.text(meta, 48, y); y+=8; doc.setFontSize(10.5);
        doc.setDrawColor(238); doc.line(48,y,pw-48,y); y+=14;
      });
      const blob=doc.output('blob'); const url=URL.createObjectURL(blob); const a=document.createElement('a');
      a.href=url; a.download='braindump-tasks-'+new Date().toISOString().slice(0,10)+'.pdf';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
      toast('PDF ready — '+list.length+' tasks');
    }catch(e){ toast('Could not build the PDF'); }
  }

  function normalizeData(){
    (S.tasks||[]).forEach(t=>{
      delete t.stakeholders;
      if(!Array.isArray(t.additionalLocations)) t.additionalLocations = t.additionalLocations? [t.additionalLocations].flat().filter(Boolean) : [];
    });
    delete S.meetings;
    delete S.boards;
    normalizeOwners();
  }
  // Merge case-variants of the same owner name (ilah/Ilah) to one canonical casing,
  // without mangling initialisms (RSP, KGC stay as-is).
  function normalizeOwners(){
    // explicit renames (case-insensitive key)
    const RENAME={'carlos l':'CarlosL','carlos p':'CarlosP'};
    (S.tasks||[]).forEach(t=>{ if(t.delegateTo){ const r=RENAME[String(t.delegateTo).toLowerCase().replace(/\s+/g,' ').trim()]; if(r) t.delegateTo=r; } });
    const count={};
    (S.tasks||[]).forEach(t=>{ const d=t.delegateTo; if(!d)return; const k=String(d).toLowerCase(); (count[k]=count[k]||{})[d]=(count[k][d]||0)+1; });
    const canon={};
    Object.keys(count).forEach(k=>{
      const variants=Object.entries(count[k]); // [name,count]
      variants.sort((a,b)=> b[1]-a[1] || (/[A-Z]/.test(b[0])?1:0)-(/[A-Z]/.test(a[0])?1:0) || b[0].length-a[0].length );
      canon[k]=variants[0][0];
    });
    (S.tasks||[]).forEach(t=>{ if(t.delegateTo){ const c=canon[String(t.delegateTo).toLowerCase()]; if(c) t.delegateTo=c; } });
  }

  /* ================= AUTH + INIT ================= */
  let authMode='signin';
  function showAuth(msg){ document.getElementById('authgate').style.display='flex'; document.getElementById('app').style.display='none';
    if(msg){ const e=document.getElementById('auth-err'); e.textContent=msg; e.style.display='block'; } }
  function hideAuthErr(){ document.getElementById('auth-err').style.display='none'; }

  async function seedNewAccount(){
    // brand-new account: push the baked-in SEED so they start with their data, not empty
    S=JSON.parse(JSON.stringify(SEED)); normalizeData();

    synced={tasks:{},lists:{},dumps:{},settings:''};

  async function loadApp(){
    document.getElementById('authgate').style.display='none';
    document.getElementById('app').style.display='';
    let saved;
    try{ saved=await store.load(); }
    catch(e){ showAuth('Could not reach your data. Check your connection and try again.'); return; }
    if(saved.__empty){ await seedNewAccount(); try{ localStorage.setItem(KEY_SEEN, APP_VERSION); }catch(e){} }
    else { delete saved.__empty; S=saved; normalizeData();
      // backup nag: >72h since last export
      try{ const lb=localStorage.getItem(KEY_BACKUP); const ts=lb?+lb:0; if(!ts || (Date.now()-ts)>72*3600*1000) U.backupNag=true; }catch(e){}

      try{ const sv=localStorage.getItem(KEY_SEEN); if(!sv || sv!==APP_VERSION) U.modal='whatsnew'; }catch(e){}
    }

    render();
  }

  // Re-pull data from Supabase so email-created tasks appear without a manual reload.
  // Guarded so it never clobbers something you're editing.
  let lastRefresh=Date.now();
  async function refreshData(force){
    if(!sb||!authUser||!S) return;
    if(U.drawer||U.modal||saveInFlight||saveT) return;                 // mid-edit or saving
    const ae=document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;      // mid-typing
    if(!force && Date.now()-lastRefresh<8000) return;                   // throttle
    lastRefresh=Date.now();
    try{ const saved=await store.load(); if(saved && !saved.__empty){ delete saved.__empty; S=saved; normalizeData(); render(); } }catch(e){}
  }
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshData(); });
  window.addEventListener('focus', ()=>refreshData());
  setInterval(()=>{ if(document.visibilityState==='visible') refreshData(); }, 60000);

  async function doAuth(){
    const email=document.getElementById('auth-email').value.trim();
    const pass=document.getElementById('auth-pass').value;
    const btn=document.getElementById('auth-go');
    if(!email||!pass){ showAuth('Enter your email and password.'); return; }
    hideAuthErr(); btn.disabled=true; btn.textContent=authMode==='signin'?'Signing in…':'Creating…';
    try{
      let res;
      if(authMode==='signin'){ res=await sb.auth.signInWithPassword({email,password:pass}); }
      else { res=await sb.auth.signUp({email,password:pass}); }
      if(res.error){ showAuth(res.error.message); btn.disabled=false; btn.textContent=authMode==='signin'?'Sign in':'Create account'; return; }
      if(authMode==='signup' && !res.data.session){ showAuth('Account created — check your email to confirm, then sign in.'); authMode='signin'; syncAuthUI(); btn.disabled=false; return; }
      authUser=res.data.user; await loadApp();
    }catch(e){ showAuth('Something went wrong. Try again.'); btn.disabled=false; btn.textContent='Sign in'; }
  }
  function syncAuthUI(){
    const signin=authMode==='signin';
    document.getElementById('auth-go').textContent=signin?'Sign in':'Create account';
    document.getElementById('auth-go').disabled=false;
    document.getElementById('auth-switch').textContent=signin?'Create an account':'Back to sign in';
    document.querySelector('.auth-toggle').childNodes[0].nodeValue=signin?'New here? ':'Have an account? ';
    document.getElementById('auth-pass').setAttribute('autocomplete', signin?'current-password':'new-password');
  }

  (async function(){
    if(!window.supabase){ showAuth('Could not load the sign-in library. Refresh to try again.'); return; }
    sb=window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
    // wire auth screen
    document.getElementById('auth-go').addEventListener('click', doAuth);
    document.getElementById('auth-switch').addEventListener('click', ()=>{ authMode=authMode==='signin'?'signup':'signin'; hideAuthErr(); syncAuthUI(); });
    document.getElementById('auth-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
    document.getElementById('auth-email').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('auth-pass').focus(); });
    // existing session?
    const { data:{ session } }=await sb.auth.getSession();
    if(session){ authUser=session.user; await loadApp(); }
    else { showAuth(); }
  })();
})();
