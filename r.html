<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Depot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3a7a;--red:#c62828;--ok:#2e7d32;--ink:#1c1f26;--muted:#5f6675;--line:#dfe3ea;--paper:#f6f7f9}
*{box-sizing:border-box}
body{font-family:"IBM Plex Sans",'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);margin:0;padding:40px 16px;line-height:1.45}
.b{max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.h{background:var(--navy);color:#fff;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
.h i{display:inline-block;width:10px;height:10px;background:var(--red);transform:rotate(45deg)}
.c{padding:22px}
h1{font-size:20px;margin:0 0 8px}
p{margin:0 0 12px}
.task{color:var(--muted);font-weight:600}
button,.btn{display:inline-block;background:var(--navy);color:#fff;border:0;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
input{padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-right:8px;font-family:inherit}
.tick{width:46px;height:46px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px}
.tick.warn{background:var(--muted)}
a.open{color:var(--navy)}
</style>
</head>
<body>
<div class="b">
  <div class="h"><i></i>Task Depot</div>
  <div class="c" id="c"><p class="task">Just a moment…</p></div>
</div>
<script>
const FN = "https://ikauupqthnwxohhumzlv.supabase.co/functions/v1/respond";
const APP = "https://taskdepot.myjohnstonesupplygroup.com/";
const c = document.getElementById("c");
const esc = s => String(s ?? "").replace(/[<>&"]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[m]));
const token = new URLSearchParams(location.search).get("t");
const openLink = `<p style="margin-top:18px"><a class="open" href="${APP}">Open Task Depot</a></p>`;

function show(html){ c.innerHTML = html + openLink; }
function fail(msg){ show(`<div class="tick warn">!</div><h1>That link no longer works</h1><p>${esc(msg)}</p>`); }

const MSG = {
  on_track: "Thanks — marked as on track. Your manager can see the update.",
  need_help: "Flagged for your manager. They'll see it on their home screen.",
  change_date: "The due date has been updated."
};

async function redeem(newDate){
  try{
    const r = await fetch(FN, {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({ t: token, d: newDate ?? null })
    });
    const data = await r.json();
    if(!data.ok) return fail(data.error || "This link is not valid.");
    if(data.ask_date){
      show(`<h1>Pick a new date</h1><p class="task">${esc(data.title)}</p>
        <p><input type="date" id="d" required> <button id="save">Save</button></p>`);
      document.getElementById("save").onclick = () => {
        const v = document.getElementById("d").value;
        if(!v) return;
        c.innerHTML = '<p class="task">Saving…</p>';
        redeem(v);
      };
      return;
    }
    show(`<div class="tick">✓</div><h1>Got it</h1><p>${esc(MSG[data.purpose] || "Updated.")}</p><p class="task">${esc(data.title)}</p>`);
  }catch(e){
    fail("Couldn't reach Task Depot just now. Try again, or open the app and update it there.");
  }
}

if(!token) fail("That link is incomplete.");
else redeem(null);
</script>
</body>
</html>
