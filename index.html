<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --navy:#1f3a7a; --navy-ink:#152b5c; --red:#c62828; --red-soft:#fdecec;
  --ink:#1c1f26; --muted:#5f6675; --line:#dfe3ea; --paper:#f6f7f9; --white:#fff;
  --ok:#2e7d32; --ok-soft:#e8f4ea; --warn:#b26a00; --warn-soft:#fff4e0;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
h1,h2,h3{margin:0;line-height:1.2}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap}
.brand i{display:inline-block;width:10px;height:10px;background:var(--red);transform:rotate(45deg)}
.nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end;row-gap:4px}
.nav button{background:transparent;border:0;color:#d9e0f0;padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}
.nav button .pin{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px;font-weight:600}
.who{color:#cfd7ea;font-size:13px;white-space:nowrap;flex:0 0 auto;order:9}
.who button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 8px;margin-left:8px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.h h2{font-size:20px;font-weight:600}
.h .sub{color:var(--muted);font-size:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 2px rgba(20,26,40,.05), 0 10px 22px -16px rgba(20,26,40,.3)}
/* a Home group carries the colour of why it needs you, set by its Fold */
.edge-red>.card,.edge-warn>.card,.edge-navy>.card,.edge-ok>.card,.edge-purple>.card,.edge-grey>.card{border-left:4px solid var(--edge,#c3cbdb)}
.attn{border-left:4px solid var(--red)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:#fafbfd}
.row .t{font-weight:500}
.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.row .why{font-size:13px;font-weight:600;color:var(--red);text-align:right}
.row .why.ok{color:var(--ok)} .row .why.warn{color:var(--warn)} .row .why.navy{color:var(--navy)}
.counts{display:flex;gap:0;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:10px}
.counts button{flex:1;border:0;background:transparent;padding:12px 8px;cursor:pointer;border-left:1px solid var(--line);text-align:center}
.counts button:first-child{border-left:0}
.counts b{display:block;font-size:22px;font-weight:600}
.counts span{font-size:12px;color:var(--muted)}
.counts button.on{background:#eef2fa}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:12px;background:#eef0f4;color:var(--muted);font-weight:500}
.pill.not_started{background:#eef0f4} .pill.working{background:#e6edfb;color:var(--navy)} .pill.waiting{background:var(--warn-soft);color:var(--warn)}
.pill.ready_for_review{background:#efe8fb;color:#5b3fa0} .pill.done{background:var(--ok-soft);color:var(--ok)} .pill.skipped{background:#eef0f4;color:var(--muted)}
.pill.high{background:var(--red-soft);color:var(--red)}
.pill.origin{background:#efe9fb;color:#5b3fa0;border:1px solid #d9cdf2;font-weight:600}
.pill.origin.own{background:#e0f2ee;color:#1f6f63;border-color:#bfe3db}
.empty{padding:26px 14px;color:var(--muted);text-align:center}
.btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.q{background:transparent;border-color:transparent;color:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0 4px}
.big button{border:0;border-radius:var(--radius);padding:16px 6px;font-weight:700;font-size:15px;cursor:pointer;color:#fff}
.big .done{background:var(--ok)} .big .upd{background:var(--navy)} .big .blk{background:var(--warn)} .big .help{background:var(--red)}
.big .rev{background:#5b3fa0}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;width:100%}
.form textarea{min-height:84px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.modalbg{position:fixed;inset:0;background:rgba(20,26,40,.45);z-index:40;display:flex;align-items:stretch;justify-content:flex-end;animation:fade .15s ease-out}
/* The drawer reads as a file pulled from a drawer: a coloured spine down the left
   edge in its status's colour, a tinted band at the top so the colour means
   something, and enough shadow that it sits above the page rather than on it. */
.modal{background:var(--paper);width:100%;max-width:560px;height:100%;overflow:auto;
  border-radius:16px 0 0 16px;padding:18px 18px 28px;
  border-left:8px solid var(--tab,var(--navy));
  box-shadow:-18px 0 44px rgba(20,26,40,.28), -1px 0 0 rgba(255,255,255,.7) inset;
  animation:slidein .2s ease-out;padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
/* the band bleeds to the drawer's edges, so it meets the spine with no seam */
.modal .spine{margin:-18px -18px 14px -18px;padding:11px 18px;
  margin-top:calc(-18px - env(safe-area-inset-top,0px));
  padding-top:calc(11px + env(safe-area-inset-top,0px));
  background:var(--tabwash,#eef2fb);border-bottom:1px solid rgba(20,26,40,.08);
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--tab,var(--navy))}
.modal .spine .spine-sub{font-weight:600;letter-spacing:.3px;text-transform:none;
  font-size:12px;color:var(--muted)}
/* the watch toggle lives in the band so it sits in the same place on every drawer */
.modal .spine .eye{background:none;border:0;cursor:pointer;line-height:0;
  padding:3px 5px;border-radius:6px;color:var(--muted);
  display:inline-flex;align-items:center}
.modal .spine .eye svg{display:block}
.modal .spine .eye:hover{background:rgba(20,26,40,.08);color:var(--tab,var(--navy))}
.modal .spine .eye.on{color:var(--tab,var(--navy))}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel.tint{background:#f2f5fb;border-color:#dde4f2}
/* Inside a drawer the blocks sit up off the page, each with its own coloured edge so
   the eye can find a section without reading the headings. The task block borrows the
   status colour the drawer is already wearing. */
.modal .panel,.panel.edged{border-left:4px solid var(--edge,#c3cbdb);border-radius:12px;
  box-shadow:0 1px 2px rgba(20,26,40,.06), 0 10px 22px -14px rgba(20,26,40,.35)}
.edge-red{--edge:var(--red)} .edge-warn{--edge:#c9821f} .edge-navy{--edge:var(--navy)}
.edge-ok{--edge:var(--ok)} .edge-purple{--edge:#5340a3} .edge-grey{--edge:#9aa3b2}
.modal .panel.edge-main{--edge:var(--tab,var(--navy))}
.modal .panel.edge-steps{--edge:#c9821f}
.modal .panel.edge-linked{--edge:#5340a3}
.modal .panel.edge-talk{--edge:#1b6482}
.modal .ai{border-left:4px solid #5340a3;border-radius:12px;
  box-shadow:0 1px 2px rgba(20,26,40,.06), 0 10px 22px -14px rgba(20,26,40,.35)}
.week{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:90px}
.day.today{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.day.weekend{background:#f2f4f7}
.day h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.day h4 b{color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
.chiptask{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--navy);background:#f6f7f9;border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font:inherit;font-size:13px;line-height:1.35}
.chiptask:hover{background:#eef2fa}
.chiptask .who{display:block;font-size:11px;font-weight:700;margin-bottom:2px}
.who-key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;font-size:13px}
.who-key span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.who-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:640px){.week{grid-template-columns:1fr}.day{min-height:0}}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters input{flex:2 1 180px;min-width:140px}
.filters select{flex:1 1 140px;min-width:120px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
@media (max-width:640px){.filters input{flex:1 1 100%}.filters select{flex:1 1 calc(50% - 4px)}}
.panel h3{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:640px){.modal{max-width:100%;border-radius:0;border-left-width:6px}.kv{grid-template-columns:100px 1fr}}
.modal h2{font-size:19px;font-weight:600;margin-bottom:12px}
.modal .x{position:sticky;top:0;float:right;background:#fff;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.detail dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0 0 14px;font-size:14px}
.detail dt{color:var(--muted)} .detail dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0}
.tabs button{border:0;background:transparent;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.cmt{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cmt .by{color:var(--muted);font-size:12px}
.cmt.priv{background:#fffbea;padding:10px;border-radius:8px;border:1px dashed #e6d39a;margin-top:8px}
.cmt.pinned{background:#f4f7ff;border:1px solid #c7d7f5;border-radius:8px;padding:10px;margin-top:8px}
.cmt.pinned.priv{background:#fffbea;border:1px dashed #e6d39a}
.cmt .by{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cmt .pinbtn{margin-left:auto;background:none;border:0;font:inherit;font-size:12px;
  color:var(--muted);cursor:pointer;padding:0 2px;border-radius:5px;white-space:nowrap}
.cmt .pinbtn:hover{color:var(--navy);background:#eef2fa}
.cmt .pinmark{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  color:#1f3a7a;background:#e0ecff;padding:1px 7px;border-radius:7px}
.hist{font-size:13px;color:var(--muted);padding:5px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast button{background:transparent;border:0;color:#9fc0ff;font-weight:600;cursor:pointer}
.ai{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.ai textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.auth{max-width:400px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.auth h1{font-size:24px;font-weight:600;margin-bottom:4px}
.auth p{color:var(--muted);margin:0 0 18px}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:8px;font-size:14px}
.note{background:#eef2fa;color:var(--navy-ink);padding:10px 12px;border-radius:8px;font-size:14px}
.person{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.person:first-child{border-top:0}
.person .stats{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.person .stats b{color:var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0;background:#fff}
.section-title{font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 6px}
.att a{display:block;padding:6px 0;font-size:14px}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:20px 14px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px;transition:border-color .12s,background .12s}
.dropzone b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.dropzone:hover{border-color:var(--navy)}
.dropzone.over{border-color:var(--navy);background:#eef2fa}
@media (max-width:640px){
  body{font-size:16px}
  .top .bar{flex-wrap:wrap;padding:8px 12px;gap:6px}
  .brand{font-size:16px}
  .nav{width:100%;order:3;margin-left:0;gap:6px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
  .nav::-webkit-scrollbar{display:none;width:0;height:0}
  .nav button{background:rgba(255,255,255,.1);padding:8px 12px;border-radius:16px;font-size:14px;min-height:38px}
  .nav button.on{background:#fff;color:var(--navy)}
  .who{margin-left:auto;order:2}
  main{padding:14px 12px 90px}
  .h{flex-wrap:wrap;gap:6px;margin:18px 0 8px}
  .h h2{font-size:19px}
  .btn{min-height:44px;padding:11px 16px}
  .btn.sm{min-height:36px}
  .actions{gap:8px}
  .actions .btn{flex:1 1 auto}
  .row{padding:14px}
  .counts{flex-wrap:wrap}
  .counts button{flex:1 0 45%;border-left:0;border-top:1px solid var(--line)}
  .form input,.form select,.form textarea{font-size:16px;min-height:46px}
  input[type=checkbox]{min-width:22px;min-height:22px}
  .mp-row input[type=checkbox]{width:22px;height:22px;min-width:22px;min-height:22px;max-width:22px}

const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const startedAs = (t) => DELEGATED(t) ? "delegated" : "own";
// The one person with a Brain Dump. The bridge checks this too — this const only decides
// whether the button is drawn, never whether the send is allowed.
const BD_OWNER = "04e1a5b4-dcef-4c56-8f08-e67876786451";
const BD_URL = "https://braindump.kathleengrawcollier.com/";
// a task that has gone home to her Inbox, whichever direction it travelled
const GONE_TO_BD = (t) => t.bd_status === "returned" || t.bd_status === "sent";

const ORIGIN_OPTS = [{k:"delegated", label:"Someone assigned it to them"},
                     {k:"own",       label:"They created it themselves"}];
// a saved filter from the old four-way version would match nothing; drop what is gone
const cleanOrigin = (v) => (v||[]).filter(k=>k==="delegated"||k==="own");
const recurLabel = (t) => !t.recur_rule ? "" : t.recur_rule==="daily" ? "Repeats daily"
  : t.recur_rule==="weekly" ? `Repeats ${DOW[t.recur_day??0]}s`
  : t.recur_rule==="yearly" ? "Repeats yearly"
  : `Repeats monthly on the ${t.recur_day||1}`;
const STATUS = {not_started:"Not started", working:"Working", waiting:"Waiting", ready_for_review:"Ready for review", done:"Done", skipped:"Skipped"};
// The drawer wears the task's status, matching the status pills exactly, so the spine
// and the pill never disagree.
const STATUS_TONE = {
  not_started:      {bg:"#eef0f4", fg:"#4a4f5c"},
  working:          {bg:"#e6edfb", fg:"#1f3a7a"},
  waiting:          {bg:"#fff1e0", fg:"#9a5712"},
  ready_for_review: {bg:"#efe8fb", fg:"#5b3fa0"},
  done:             {bg:"#e3f2e6", fg:"#1f6b33"},
  skipped:          {bg:"#eef0f4", fg:"#5f6675"},
};
const toneOf = (st) => STATUS_TONE[st] || STATUS_TONE.not_started;

// Is anyone being asked at all? Needed where the question is about the task, not about you.
const ASKING_ANY = (t) => !!(t.need_help || t.need_manager || t.status==="ready_for_review");
// Who is being asked. "Need help" and "Needs you" mean "I need my manager", so they
// point at whoever the assignee reports to — not at every manager who can see the task.
// A review goes to whoever is actually waiting on the outcome: the person who asked for
// it, else the person who handed it over, else the assignee's manager.
const ASKEE = (t) => {
  if(!ASKING_ANY(t)) return null;
  // An ask can carry its own address now. Without it, "needs a manager" could only ever
  // resolve to the owner's own manager, so there was no way for anyone further up to say
  // "this one needs me" about work two levels down.
  if(t.need_help || t.need_manager) return t.needs_from || managerOf(t.assignee_id);
  return t.asked_by || (DELEGATED(t) ? t.created_by : managerOf(t.assignee_id));
};
// They are asking YOU, not just working. This outranks who wrote the task down.
const ASKING = (t) => !!(ME && ASKEE(t) === ME.id);
// They typed it in, but you are the one who wanted it. Most of what your team enters in
// a 1:1 is your ask captured by whoever had the keyboard; this is how it reaches you.
const ASKEDBYME = (t) => !!(ME && t.asked_by === ME.id);
// You handed this out. DELEGATED alone only says somebody did, which put work Eliseth
// gave Alexis on Kathleen's Home as though she had handed it out herself.
const DELEGATEDBYME = (t) => !!(ME && t.created_by === ME.id && DELEGATED(t));
// Watched work that has closed. No window on purpose: a watched task stays in front of
// you until you say you are done looking, however long ago it was finished. Covers
// skipped as well as done, so nothing you follow can slip away unnoticed.
const WATCHED_DONE = (tasks, forPerson) => (tasks||[])
  .filter(t => !t.deleted_at && CLOSED(t.status) && WATCHED.has(t.id)
               && (!forPerson || t.assignee_id === forPerson))
  .sort((a,b)=>String(b.completed_at||b.updated_at||"")
                 .localeCompare(String(a.completed_at||a.updated_at||"")));
const UNWATCH = async (id) => {
  if(!ME) return {error:{message:"Not signed in"}};
  const r = await sb.from("task_watchers").delete().eq("task_id",id).eq("user_id",ME.id);
  if(!r.error) WATCHED.delete(id);
  return r;
};
// Somebody is waiting on the outcome, so "Ready for review" means something
const HASAUDIENCE = (t) => !!(t.asked_by || (t.created_by && t.assignee_id && t.created_by !== t.assignee_id));
// the colour each Home group wears, same meanings as the 1:1 agenda
const GROUP_EDGE = {
  "Waiting on a decision from you":"edge-red", "Ready for your review":"edge-navy",
  "Asked you for help":"edge-red",             "Stuck waiting on someone else":"edge-warn",
  "Due now, and gone quiet":"edge-warn",       "Overdue":"edge-red"};
const CLOSED = (st) => st==="done" || st==="skipped";
// Delegated = it belongs to someone other than whoever created it. Covers people
// who haven't signed up yet, where the owner is held as an email address.
const DELEGATED = (t) => !!t.created_by && (
  (!!t.assignee_id && t.assignee_id !== t.created_by) || !!t.assignee_email);
const CHANGELOG = [
  {v:"16.1", d:"October 21, 2026", items:[
    "You can pin a comment to the top of a task. The thing worth remembering about a job is rarely the newest thing said about it \u2014 the account number, the agreed wording, the reason it is being done this way \u2014 and it used to sink as the thread grew. Pin it and it stays on top however much is written after.",
    "Pin a second one and the two sit together, in the order you pinned them rather than the order they were written. Unpin drops a comment back where it belongs in the thread, with its own date intact.",
    "You can pin anything on a task you run, and your own comments anywhere. A pinned private note stays private and stays looking private \u2014 pinning only ever moves it for the one person who can see it.",
  ]},
  {v:"16.0", d:"October 21, 2026", items:[
    "Narrowing a list to one person now finds the work they are on, not just the work they own. Filtering All tasks by Jeff missed the First Co warranty brainstorm he is on, because Stephen happens to be its owner \u2014 the filters still asked \u201cis this their task\u201d when the answer had become \u201cis their name on it\u201d. All tasks, Finished and Week ahead all read it the new way.",
    "Typing somebody\u2019s name into the search box works too, first name or surname, and on a shared task it matches any of the names on it.",
    "Stephen is on two tasks and owns only one of them. Both turn up when you ask for his.",
  ]},
  {v:"15.9", d:"October 21, 2026", items:[
    "The task drawer had twelve buttons in two flat rows, all at the same volume, so Trash looked exactly as ordinary as Update. What you reach for daily stays out front; the nine real-but-rare ones moved into a single More menu \u2014 Edit, Who has this, Link, Merge, Skip this one, Pause series, Mark as seen, and Trash at the bottom behind a divider, in red.",
    "Send to my BD Inbox stays out front. It only ever appears for Kathleen, so burying it would have cost her and helped nobody.",
    "Status now lives on Update and nowhere else. Yesterday\u2019s \u201cI can\u2019t change status\u201d got fixed twice over \u2014 managers gained an Update button and Edit gained a Status field \u2014 and either one alone would have done it. Edit is what the task IS: its name, owner, date, shape. Update is how it is GOING, and it takes a note with the change, so a month later the history says why something went to Waiting.",
    "Update\u2019s status list grew to match: Not started, Working, Waiting, and Ready for review where the task has an audience. Done and Skipped stay off it, because both carry consequences a dropdown would walk straight past.",
    "The Blocked button is gone. It was this same form with Waiting pre-picked \u2014 a button standing in for one option of a dropdown, and the same word-versus-status mismatch you spotted in the All tasks filter.",
  ]},
  {v:"15.8", d:"October 21, 2026", items:[
    "One job with three people on it is now one task with three names on it. It used to be three separate tasks linked to each other \u2014 three rows in every list, three due dates that were always identical anyway, and three comment threads of which only one ever had the conversation in it. On the racking layout, all four comments and both drawings sat on Carlos\u2019s copy, so Stephen could not see the discussion about the drawing he was reviewing.",
    "Everyone on a task gets their own line to tick. The task closes by itself when the last line is ticked, and reopens if anybody unticks theirs. Nobody shares a checkbox \u2014 they share the task.",
    "Pressing Done on a shared task ticks your line, not everybody\u2019s, and tells you who is still to go. Mark done, which a manager gets, still closes the whole thing.",
    "Lists show one row reading \u201cCarlos +1\u201d, with a pill saying how far along it is \u2014 \u201c1 of 2 done\u201d \u2014 and the names on hover.",
    "Who has this adds people to the task instead of minting them a copy each. The owner cannot be taken off there; reassigning the task is how that changes.",
    "Being put on a task now lets you see it, read its thread, open its files and record progress on it \u2014 and nothing else. The task beside it stays as invisible as it was.",
    "The split between \u201cshared\u201d and \u201crelated\u201d links is gone, along with the \u21c4 button for fixing a wrong guess. Of the fourteen links in the system, four were filed under the wrong one of the two and one was two weeks of the same recurring task linked by hand. A distinction that needs a repair button is one the app should not be asking you to make.",
    "Three jobs were merged on the way in: the Comstar pricing review (#66, with Alex, Stephen and Ilah), the racking layout (#150, keeping its comments and drawings) and the First Co warranty brainstorm (#196). The emptied copies are in Trash and can be brought back.",
    "Comstar #66 has gone from Done back to Working. Alex and Stephen finished; Ilah never did. It only read Done because Alex\u2019s copy was the one you happened to open.",
  ]},
  {v:"15.7", d:"October 21, 2026", items:[
    "You can set the status on a task that is not your own. Edit now has a Status field \u2014 Not started, Working, Waiting, and Ready for review where a task has an audience \u2014 with Waiting on beside it when you pick Waiting. Until now the only status controls on somebody else\u2019s task were Mark done and Skip, so there was no way to record that a task of theirs was Working or Waiting without pretending to finish it.",
    "Done and Skipped are deliberately not in that dropdown. Both carry consequences \u2014 the unticked-steps prompt, the question about everyone else holding the same task, a skip reason, an email \u2014 and a dropdown would quietly walk past all of them. They stay on the buttons that handle them properly.",
    "The All tasks filter said \u201cBlocked\u201d for a status the rest of the app calls Waiting. It now reads \u201cWaiting \u2014 on someone else\u201d. Your saved filter is untouched.",
  ]},
  {v:"15.6", d:"October 20, 2026", items:[
    "The 1:1 is a table now, with the due date in its own column. It used to trail the title in grey on every line, which meant reading twelve sentences to find out what was late. You read one column down instead, and overdue is red, today is amber.",
    "Ticking an item off no longer moves it. It stays exactly where it was, struck through, with the tick turned into an arrow to put it back \u2014 and the heading says \u201c(3) \u00b7 2 covered\u201d so a short section is never mistaken for an empty one. Items used to leap to a \u201cCovered in this meeting\u201d block at the foot of the page, which lost your place in the meeting every single time. That block is gone; nothing was lost with it.",
    "Opening a task from the agenda still counts as covering it, so it is struck through where it sits when the drawer closes.",
    "\u201cNeeds me\u201d on somebody else\u2019s task. There was no way to say a task of Alexis\u2019s needed you: the only flag available meant \u201cI need my manager\u201d, so it pointed at Eliseth however it was raised. A flag now carries an address. One click puts the task at the top of your next 1:1 with its owner, under \u201cNeeds Kathleen\u201d, and one click takes it off again.",
    "It is deliberately quiet: no email, and the task\u2019s status and waiting-on line are left exactly as the owner left them, because they are not blocked \u2014 you just want to talk about it. The task\u2019s own history records who flagged it, so the owner can see it without being chased.",
    "Update and Blocked now appear on a report\u2019s task too. Recording progress on somebody\u2019s behalf meant opening the whole edit form; it is two clicks now, the same two they get.",
    "Their own list, what they have handed out and what their people are waiting on are all tables as well, with the same due column \u2014 and the last of those gained a Who column.",
  ]},
  {v:"15.5", d:"October 20, 2026", items:[
    "You can park something on a 1:1 agenda before it is ready to say. Tick \u201cNot yet\u201d when you add it to \u201cWorth mentioning\u201d and it stays yours alone \u2014 it does not appear on their side of the agenda, and it is not counted in what is waiting to be said. Release it when you want it in front of them.",
    "A held item wears a \u201cNot yet\u201d tag on your screen and says \u201conly you can see it\u201d, so there is no guessing whether the other person has seen it. Release is one click on the same line, and you can put it back.",
    "The privacy of it is enforced in the database, not just hidden in the screen \u2014 a held row is not readable by the other person at all, however it is asked for.",
    "Only the person who raised an item can hold or release it, and once an item has been marked as discussed it can no longer be held back.",
  ]},
  {v:"15.4", d:"October 20, 2026", items:[
    "A 1:1 now reads the same to both people in it. It never did: the agenda decided what to show and what to fold by asking who was logged in, so every one of Alexis\u2019s 21 open tasks landed in a different bucket for Kathleen, for Eliseth and for Alexis. Three people, three different meetings.",
    "The fold now follows the pair. A task is judged against the report\u2019s manager, not the reader: 10 of Alexis\u2019s are Eliseth\u2019s and lead the agenda, 5 came down from Kathleen and stay on it marked \u201cfrom Kathleen\u201d, 6 she set herself and fold away. Same fifteen, same six, whoever opens it.",
    "Flagged items group by who is being asked rather than by whether that is you. The item that said \u201cNeeds you\u201d on one screen and \u201cAsked Eli, not you\u201d on the other now says \u201cNeeds Eliseth\u201d on both, with a quiet \u201c(you)\u201d for whoever it belongs to.",
    "Your own view stops being a special case. It used to switch folding off entirely, which is why your screen and your manager\u2019s could never match; now everyone sees the same shape, and Show everything is one click and still remembered per person.",
    "Watching is a mark, not a mover. A task you follow used to be hauled onto the agenda for you alone — an item the other person could not see. It now sits where the pair put it wearing the eye, and the folded block says how many in there you are watching, so nothing hides.",
    "Somebody with nobody above them has no pair, so nothing folds on their 1:1 at all.",
  ]},
  {v:"15.3", d:"October 20, 2026", items:[
    "A repeating task now says so in every list. A small \u21bb sits after the name on All tasks, Home, Finished, Trash, search results and Email intake, and hovering it says which rhythm \u2014 \u201cRepeats monthly on the 30\u201d, \u201cRepeats Tuesdays\u201d. Until now a monthly bank rec was indistinguishable from a one-off unless you opened it or went to the Repeating screen.",
    "A mark rather than a column, on purpose: it costs no width in an already wide table, and it turns up on every screen at once where a column would only have helped the one screen it was added to.",
    "The table had a finished Repeats column built into it all along that nothing ever asked for \u2014 the word appears in none of the app\u2019s eight column lists. It stays unused; the mark does the job better.",
  ]},
  {v:"15.2", d:"October 20, 2026", items:[
    "Searching a number now searches for the number. Typing 1050 used to mean \u201ctask #1050\u201d and nothing else, so when no task had that number you got an empty screen — even though a comment on #TD189 says 1050 and the account is all over your work. A number is a GL account, an invoice or a policy long before it is a task reference, and the box now reads it both ways.",
    "The task with that number still comes first, and still appears whatever its status, so typing the number of something finished takes you to it exactly as before. Everything carrying the number in its words follows underneath.",
    "That direct hit deliberately ignores your filters: asking for a number on its own is asking to be taken to that task, not to be told it does not match the view you happen to have set. The text matches below it respect the filters as usual.",
    "Same fix in the jump bar, which had the identical blind spot — a title with a number in it could not be found by typing that number.",
  ]},
  {v:"15.1", d:"October 13, 2026", items:[
    "Brain Dump results now appear under All tasks, which is where the search box actually lives. In 14.9 they went to the old standalone Search screen — which was folded into All tasks a while back and has not been reachable since, so nobody could have seen them. My mistake: the component still compiled and still passed its tests, because a test that mounts a screen directly proves the screen works, not that you can get to it.",
    "That dead Search component has been deleted rather than left lying about, along with the trashedIds it was the only user of. It is what misled me, and leaving it invites the same mistake again.",
    "The status filter carries across: on Open you get open Brain Dump items, on Done, Skipped or Everything you get those too. Blocked and Needs you are Task Depot\u2019s own ideas with no meaning over there, so the block stays out of the way for those.",
    "Three characters before it asks, and a quarter-second of quiet, matching the lookup this screen already runs. An answer about an older keystroke is discarded rather than replacing what is on screen.",
  ]},
  {v:"15.0", d:"October 13, 2026", items:[
    "The jump bar reaches Brain Dump too. Type three letters and an In Brain Dump group appears under your Task Depot hits, up to five of them, with the number, folder and who has it. The number was the giveaway that this belonged here rather than only on the Search screen.",
    "The list above it stays instant. It filters tasks already loaded in the browser, so it answers as you type; Brain Dump is two bridge hops away and is never allowed to hold that up — it arrives a beat later, underneath.",
    "Three characters rather than two, and a third of a second of quiet before it asks, because every keystroke past that is a round trip. Typing \u201ccleaning\u201d makes one request, not five.",
    "An answer about something you typed three keystrokes ago is thrown away rather than replacing what is on screen now. Without that, a slow reply can overwrite a fast one and you end up looking at results for half a word.",
    "Include finished and skipped applies to both lists, and the same rule as everywhere else holds: only Kathleen sees any of it, refused on the server for anyone else.",
  ]},
  {v:"14.9", d:"October 13, 2026", items:[
    "Search reaches into Brain Dump. Task Depot results come up first, and an In Brain Dump block fills in underneath with the number, where it matched, which folder it is in and who has it. Titles, topics and notes, and a number like #BD879 finds that one.",
    "Only Kathleen sees it, and that is enforced on the server rather than by hiding the box: the bridge refuses the request outright for any other account. Brain Dump is one person\u2019s private list, and the people she shares Task Depot with have no business reading it.",
    "The second search never holds up the first. Brain Dump is two bridge hops away, so Task Depot answers on its own and Brain Dump arrives when it arrives; if it cannot be reached, the reason is shown and this app\u2019s results are untouched.",
    "Groundwork for the other direction went in at the same time — Brain Dump\u2019s search box can now reach Task Depot through the same pair of bridges. The Brain Dump app has to be changed to use it, which is a separate file.",
  ]},
  {v:"14.8", d:"October 13, 2026", items:[
    "Repeating filters by person and by frequency, the same pickers All tasks uses. Either on its own or both together, and the heading says \"5 of 18 shown\" so a narrowed list never passes for the whole list.",
    "Both pickers only offer what is actually there. Three people have repeating work, so the person list names three — not the whole roster with ten names that would return nothing — and Daily stays out of the frequency list until something actually repeats daily. People holding repeating work against an email address, with no login, are in the list like anyone else.",
    "The filters are deliberately forgotten between visits, unlike the ones on All tasks. Everything here fits on one screen, so a filter left on from last week would hide work rather than save you any narrowing.",
    "Sorting still applies to whatever is on screen, so narrowing to one person and sorting by Open now answers \"what is she furthest behind on\" in two clicks.",
  ]},
  {v:"14.7", d:"October 12, 2026", items:[
    "Answers come back by themselves. Forward their reply to the intake address and each answer is filed as a comment on its own task — \"90 - done, Marathon confirmed\" lands on #TD90, \"142 and 133 are both mine\" lands on both. It reads #TD90, TD90 and a plain \"90 -\" at the start of a line.",
    "Nothing is ticked off, closed or reassigned by this. A reply is somebody telling you where things stand, not an instruction, and acting on it is your call — the words are put where you will see them and no further.",
    "The generated email now opens with a quiet \"Reply above this line\" marker, which is what makes the above safe. A forward buries the reply inside the quoted chain, and that chain carries your own list back in with the same numbers against it — without a cut point your task descriptions would be filed back as their answers. Tick box if you would rather not send it.",
    "Guards on the number reading, because a stray one must never hijack an email: at least two numbers have to resolve to tasks you can see, a vendor reference like #1160927B is left alone, and a leading \"10.\" or \"10/12\" is a numbered list and a date, not a task.",
  ]},
  {v:"14.6", d:"October 12, 2026", items:[
    "Make an email for someone. Narrow All tasks to one person and a button appears that turns their list into an email you can paste straight into Outlook, or print. Tick boxes to leave things off, one editable opening line, and a live preview of exactly what they will see.",
    "It works for people who have no login, which is the whole point — eleven of them are holding 38 open tasks between them, and the app was never going to be where they read about it. You send it from your own mailbox so their reply comes back to your inbox; an email sent by Task Depot would be answered into nothing, because intake drops a reply from an address with no account.",
    "It says \"Added Oct 5\" rather than calling anything overdue. Those dates are your own reminders to chase, not deadlines they agreed to, and the email reads like a list rather than a telling-off. Task Depot words like \"Not started\" stay out of it too.",
    "Where the detail line talks about you in the third person — \"Kathleen is requesting 10 dumpster signs\" — it is turned round to \"I'm requesting\" before it goes out. Only when the line opens with your name; everything else is left exactly as written.",
  ]},
  {v:"14.5", d:"October 12, 2026", items:[
    "The drawer's arrows follow the order on your screen. Sorting a table reordered the rows but not the arrows, so after sorting Alexis's tasks by due date the arrows still walked the order the screen had before you sorted it \u2014 which looks like them jumping around at random. Every table now hands its own sorted order to the drawer, and the arrows step through exactly what you are looking at.",
    "Email intake was worse: its rows set no order at all, so the arrows there followed whatever screen you happened to be on last. They now walk that screen's rows, skipping any whose task has been deleted.",
    "Same fix on My day, where grouped recurring tasks meant the arrows stepped through every occurrence rather than the rows actually listed, and on the Linked tasks list in the drawer, which had no order of its own either.",
    "Emailed tasks default to three working days out instead of one. A ! anywhere in the subject means it cannot wait: high priority, and due the next working day. An explicit date in the subject or the body still beats both, and the confirmation you get back says which rule applied.",
  ]},
  {v:"14.4", d:"October 12, 2026", items:[
    "Email intake gets the eye. Same toggle as every other table, so you can start watching something the moment you see it arrived rather than opening the task first. It only appears where there is still a task to follow \u2014 an email that was dropped, or whose task has been deleted for good, has nothing to watch.",
    "And an Assigned to column, sortable like the rest. The owner was already buried in the small print under the task name; now it is a column you can sort on, so \u201cwhat came in for Carlos this week\u201d is one click.",
    "Rows with no task sort to the bottom of that column rather than scattering through it.",
  ]},
  {v:"14.3", d:"October 12, 2026", items:[
    "Send to my BD Inbox is purple \u2014 the same purple a Shared task wears, not a new one. Both say the same sort of thing: this is not simply yours to tick off. The panel it opens matches, so the button and the panel read as one action rather than two.",
  ]},
  {v:"14.2", d:"October 12, 2026", items:[
    "Send to my BD Inbox. A task that was created here can now be handed to your own Brain Dump list, which until now only worked in one direction \u2014 Return to Kathleen needed the task to have come from there in the first place, so anything born in Task Depot had no way home.",
    "What travels: every step with its tick, every comment with who said it and when, and the files. The department comes too. Private notes stay here \u2014 they are yours, and they do not cross.",
    "It lands in your Brain Dump Inbox queue, the same place a forwarded email arrives, so it waits for review rather than dropping straight into the list. The task closes here as Done with a \u201cSent to Kathleen\u2019s Inbox\u201d tag and cannot be reopened, because it lives with you now.",
    "The button only appears on your own screen, and only on a task that has never been across. Nobody else has a Brain Dump, so nobody else is offered one \u2014 and the bridge checks again at the other end rather than trusting the button.",
    "The Task Depot task keeps no link until Brain Dump confirms where it put it, so a failed hand-over leaves the task exactly as it was instead of half-sent.",
  ]},
  {v:"14.1", d:"October 11, 2026", items:[
    "Task numbers are written #TD147 now, not #147. Brain Dump numbers its own tasks from the same small integers, so a bare #147 meant one thing here and a different thing there \u2014 and since yesterday every email from Task Depot led with one. Forwarding such an email to Brain Dump would have filed it onto an unrelated task of the same number, silently. Task Depot #147 is the Tech Gas task; Brain Dump #147 is about shredding.",
    "Every email Task Depot sends now says #TD147, the drawer chip copies #TD147, and the confirmations teach the same form. Brain Dump moves to #BD512 for the same reason.",
    "Nothing you already do breaks. The jump box, the merge picker and the email rule all still take a bare 147, and TD#147 works too. The two parsers reject each other\u2019s prefix for free \u2014 #BD512 wants a digit straight after the #, which B is not \u2014 so a forward can no longer land on the wrong app\u2019s task.",
    "One ambiguity survives on purpose: an email already sitting in your inbox carries a bare number, so forwarding an OLD Task Depot email to Brain Dump can still mis-file. Delete the number from the subject if you forward one of those.",
  ]},
  {v:"14.0", d:"October 11, 2026", items:[
    "The morning digest shows every task\u2019s number beside its name. It was the one email listing twenty things you might need to act on and giving you nothing to type or forward \u2014 now each line reads \u201c#13 Prepare warranty condenser unit\u2026\u201d, with the number greyed so it stays a reference and not part of the name.",
    "The number is on all of them: Assigned to you, the six flagged sections, and stalled repeats. The \u201cWaiting on a first login\u201d rows are people, not tasks, so they stay numberless \u2014 a number there would point at nothing.",
    "The digest footer now says what the numbers are for: forward any line back in with its number at the front of the subject and it files itself against that task.",
  ]},
  {v:"13.9", d:"October 11, 2026", items:[
    "Every email about a task now leads with its number. \u201c#147 Finished: Await Tech Gas answer\u201d instead of \u201cFinished: \u2026\u201d \u2014 so forwarding one straight back in files it against the right task with nothing to look up and nothing to type.",
    "The number is also a row in the task panel of each email, above the due date, and the footer says what it is for: reply to comment, or forward something in with the number at the front of the subject.",
    "Two emails deliberately have no number. The welcome email is about a person, not a task, and the morning digest is about many \u2014 one number on either would point at the wrong thing.",
    "Checked the loop both ways: a notify subject forwarded back in matches, with or without a FW: or RE: in front, and a vendor\u2019s \u201cFW: #1160927B\u201d still does not.",
  ]},
  {v:"13.8", d:"October 11, 2026", items:[
    "The jump box searches open work only. A tick box at the top of the results brings finished and skipped ones back, and the choice sticks \u2014 wanting them today usually means wanting them tomorrow.",
    "A number still finds a finished task, it just tells you first: \"Task #9 is finished \u2014 tick the box above to open it.\" Typing an exact number and being told nothing matches would be a lie.",
    "When open results do show and finished ones are hidden behind them, a line at the bottom says how many, so the filter never quietly swallows the thing you were after.",
  ]},
  {v:"13.7", d:"October 11, 2026", items:[
    "A Shared pill. Every list shows it on a task that is one job in more than one pair of hands, and the drawer names them \u2014 \"Shared with Carlos\" or \"Shared with 2 others\" \u2014 so you can tell before you open anything.",
    "Finishing a shared task asks about the others. It lists each person who still has it open with their number and status, and offers to close theirs as well. Nothing is ticked for you: closing somebody else\u2019s work is a decision, not a default. The button says what it will do \u2014 Finish just mine, or Finish \u2014 yours and 1 more.",
    "It is one question, not two. A task with unticked steps AND other people holding it used to need a second prompt after the first; both now sit in the same panel, steps pre-ticked, copies not.",
    "Fixed a layout bug in that panel: .form label{display:grid} outranked the new class, so each tick box sat on its own line above its wording. The same trap had already been hit once with the filter rows, and there is a comment above the rule now saying so.",
  ]},
  {v:"13.6", d:"October 11, 2026", items:[
    "Every email Task Depot sends back now says who has the task, and its number. \"Added to an existing task\" had been reporting the due date and nothing else \u2014 not the owner, not the number \u2014 which is no use when you are checking that a forward landed where you meant.",
    "Where a task is shared, it names everyone: \"Alex Romero \u2014 also with Stephen Yonke (#67, done), Ilah Estrada (#68)\". Naming only the one copy would be half an answer.",
    "All three confirmations use the same Who has it line, so they answer the question the same way.",
    "The \u21c4 hover said \"Actually a different task \u2014 move to Related\", which reads like an argument rather than a button. It now says what it will do: Make this a shared task, or Make this a separate task. The \u00d7 beside it says Unlink, so it cannot be mistaken for the same thing.",
  ]},
  {v:"13.5", d:"October 11, 2026", items:[
    "The same task in two hands is no longer filed as \"linked\". Who has this makes copies of one piece of work \u2014 Carlos and Stephen both reading the same racking drawing \u2014 while linking joins two different tasks on one job. They were sharing a list and a label, and they answer different questions: has everyone finished, versus is the other half moving.",
    "The drawer has Who has this and Related to as separate lines, each naming the owner, the status and the due date. Who has this says how many are still open: \"1 still open besides this one \u2014 finishing yours does not finish theirs.\" That is the thing worth knowing when you tick yours off.",
    "A \u21c4 on every row moves it to the other list, because only you can tell which a pair really is.",
    "Only certain cases were converted automatically: copies are written in one go, so they share a title, an author and an instant. Anything looser would have mislabelled a real duplicate \u2014 #95 and #96 are two Saturday-hours tasks created three minutes apart, and they are two tasks, not one shared. The racking pair needs the \u21c4.",
    "Copies now join every pair rather than a chain from the first one. Give a task to three people and the second and third could not see each other at all.",
  ]},
  {v:"13.4", d:"October 11, 2026", items:[
    "Fixed: the jump box read \"Jump to a task \\u2014 type a word\u2026\" with the escape code showing. In JSX an escape like that is only read as a character inside code \u2014 in an attribute or in text on the page it is just those six letters. Three more were hiding in button tooltips, and one in the duplicate-checking note, which has been showing \"checking a few more\\u2026\" since the hints were built.",
    "Linked to now names the owner of each linked task in brackets, and carries its number, so you can see whose plate the other half is on without opening it or hovering for the tooltip.",
  ]},
  {v:"13.3", d:"October 11, 2026", items:[
    "A jump box at the top of Home. Type a word from a title or a task number and the matches drop down; click one, or press Enter for the first, and it opens in the drawer. Open work sorts above finished. Escape clears it.",
    "It reads what is already loaded, so it answers as you type rather than after a round trip \u2014 and it says so when nothing matches, pointing at the All tasks search, which also reads comments and steps.",
    "All tasks now sits before Week ahead on the menu.",
    "\u2728 Suggest steps, beside Add a step. It reads the task and everything said on it \u2014 including any email forwarded in \u2014 and proposes the steps it breaks into. Every one arrives ticked; untick what you do not want and add the rest.",
    "It proposes, it never saves on its own. A checklist nobody chose is clutter, and steps written by one person cannot be reworded by whoever has to do them, so a guessed list would leave its owner unable to fix it.",
    "If a task is a single action it says so rather than inventing stages, and it is told the steps already there so it does not repeat them.",
  ]},
  {v:"13.2", d:"October 11, 2026", items:[
    "Merge and Link take a task number. The box only ever read titles, so knowing the number was no help at all \u2014 you still had to remember enough of the wording to find it. Type 137 or #137 and it narrows to that one task.",
    "Every row in the picker shows its number, so you pick up the ones you deal with often just by looking.",
    "Type a number that is not there and it says so, rather than leaving you with a blank list wondering whether you mistyped or the search is broken.",
  ]},
  {v:"13.1", d:"October 11, 2026", items:[
    "Comments read newest first. They were oldest first, so the thing that just happened was at the bottom of the list \u2014 which is the wrong end when you open a task to find out what changed. The timelines inside a comment were already newest first, so the two now agree.",
    "A comment that arrived by merging two tasks says so, with the number and title of the task it came from. Merging already moved comments across with the dates they were written, so they have always sorted into the right place \u2014 but one written before the task it now sits on looked inexplicable. #147 carries a comment from the evening of Oct 10 on a task created at 1:08 the next morning; it now reads \"from #137 Gas supplier changes\".",
    "Older merges were backfilled. A comment older than the task holding it cannot be native to it, and the merge is in that task\u2019s history, which is enough to name where it came from.",
  ]},
  {v:"13.0", d:"October 11, 2026", items:[
    "Every task has a number. Tasks had only ever had the long internal id, so there was nothing a person could say out loud or type. All 147 existing tasks were numbered oldest first, and new ones carry on from there.",
    "Forward an email to tasks@ with #42 at the front of the subject and it is filed against task 42 \u2014 as a comment, with its attachments \u2014 instead of becoming a new task. Replying to a Task Depot email already worked; this is for an email that was never ours, from a vendor or a customer, that belongs on a task you already have.",
    "The number has to lead the subject and has to match a task you are allowed to see. Both guards matter: \"FW: #1160927B\" is a real subject that has already come through here, and it is a vendor\u2019s order number. Checked against all 80 subjects ever received \u2014 none of them would be mistaken for a task number.",
    "Aim at a number that does not exist, or one belonging to somebody else\u2019s work, and it becomes a new task as it always did, with a line in the confirmation saying why.",
    "The number sits at the top of the task, and pressing it copies \u201c#42\u201d ready to paste into a subject line. It also sits quietly in front of the title in every table.",
    "Typing a number into the search box on All tasks goes straight to that task, finished or not \u2014 \"42\" and \"#42\" both work.",
    "Confirmation emails for a new task now tell you its number and how to send more in.",
  ]},
  {v:"12.9", d:"October 11, 2026", items:[
    "A Duplicates tab. The app has been judging whether two tasks are the same work since September, but only ever when somebody opened a task drawer, and the verdicts had nowhere to be seen. Press Run the check and it reads every task nobody has compared yet, showing how far along it is; each answer is kept for good, so the second run has almost nothing left to do.",
    "Each suggestion shows both tasks side by side \u2014 owner, status, due date, who wrote it, when it was added, and whether anything has been done on it \u2014 with the reason it was flagged. The one carrying the comments is usually the one to keep, and now you can see that without opening either.",
    "Four things you can do without leaving the page: trash either one (with an undo), keep both and link them, say they are not the same so the pair never comes back, or click a title to open it.",
    "A count sits on the tab, and the list defaults to work you have a part in \u2014 created, asked for, or watched \u2014 with Everyone\u2019s as the other option.",
    "It only shows pairs where both tasks are still open and neither has been linked or dismissed already, so the list is always things you can actually decide.",
    "It reads only what you are allowed to see. Checked from all three accounts: the same sweep returns 2 pairs to Kathleen, 1 to Eliseth and none to Alexis.",
  ]},
  {v:"12.8", d:"October 10, 2026", items:[
    "No window on watched work any more. A watched task that closed stays in front of you however long ago it was finished \u2014 the 1:1 section was reading the agenda's last-14-days bucket, so anything older had already slipped away. Both screens now read the full list, and nothing leaves until you press Done looking.",
    "Home has the same section, sitting below Watching and above Overdue, with the same Done looking button on each row.",
    "Skipped counts as closed. A watched task that got skipped used to vanish with no way to clear the eye short of hunting down the task; it is in the list now, marked skipped.",
    "One definition of \"watched and closed\" feeds both screens, so Home and the 1:1 cannot drift apart on what belongs there.",
  ]},
  {v:"12.7", d:"October 10, 2026", items:[
    "A watched task that gets finished now has its own heading on the 1:1 \u2014 \"Finished, and you were watching\" \u2014 sitting above the general finished list. It was already in that list, mixed in with everything else they closed and marked in no way at all, which is the same as not being there.",
    "Each one carries a Done looking button. Press it and the eye comes off and the task drops into the finished list with everything else, so you can clear them as you satisfy yourself rather than opening each task to find the eye.",
    "Watching a task has always survived it being finished \u2014 nothing clears the eye when work closes. What changed is that you can now see which finished tasks those were. Two of yours had been in that state since Oct 6 and 7.",
    "The Watching section on Home still only holds open work; a finished one belongs on the 1:1 where you review it, not on the list of what needs you.",
  ]},
  {v:"12.6", d:"October 10, 2026", items:[
    "Reword a step where it sits. Click the text and it becomes a box; Enter or clicking away saves it, Escape throws the change away. No drawer, no edit form.",
    "Saving a blank step does nothing rather than wiping the wording \u2014 removing a step is still the \u00d7.",
    "The text is only clickable where the edit would be allowed, the same rule that governs the \u00d7 and the drag handle. Steps someone else wrote on your task stay theirs to word; you can still tick them off.",
    "Rewording a step no longer starts the task either. Only ticking one off does \u2014 not adding, not moving, not rewording, and not un-ticking.",
  ]},
  {v:"12.5", d:"October 10, 2026", items:[
    "Steps can be put in order. Grab the handle to the left of a step and drag it where it belongs; the rest part around it and the order saves itself. It works with a finger as well as a mouse \u2014 built on pointer events rather than the usual browser drag-and-drop, which does not exist on a touch screen at all.",
    "It also works without either. Tab to a handle and the up and down arrows move that step, so the list can be ordered from the keyboard.",
    "A dead zone of six pixels before a drag begins. A handle sits about level with the middle of its own row, so without one a small wobble while pressing would have swapped two steps and saved it.",
    "Handles only appear where the move would be allowed. Steps someone else wrote on your task stay theirs to word and order \u2014 the same rule that already governed editing them \u2014 so you are never offered a drag that the server would refuse.",
    "Tidying a checklist no longer starts the task. Any change to a step flipped a not-started task to Working, which was right for ticking one off and wrong for moving one. Ticking still starts it.",
    "Positions are renumbered 0 upwards on every task. Some had ties \u2014 \"Set up Vehicle Dashboard\" had two steps claiming the same slot \u2014 which left their order down to chance.",
  ]},
  {v:"12.4", d:"October 10, 2026", items:[
    "A 1:1 with a manager now shows what their own people are waiting on them for, folded away under the sections about their work. Eliseth's agenda carries Alexis's four open asks \u2014 who is waiting, what for, how long it has sat, and the last thing said on it \u2014 so you can offer to unblock one in the meeting rather than hearing about it a fortnight later. It is amber, not red: it is not yours to answer, it is hers.",
    "The section is collapsed until you press Show, and does not appear at all for someone with nobody reporting to them. It reads what you are allowed to see and nothing more \u2014 checked from all three accounts, and every row returned was one that account could already open.",
    "Copy agenda includes it.",
  ]},
  {v:"12.3", d:"October 10, 2026", items:[
    "An ask now knows who it is pointed at. Need help and Needs you were plain yes/no switches \u2014 they recorded that somebody was asking, but not who they were asking \u2014 so every manager who could see the task read them as theirs to answer. Four of Alexis's tasks had been sitting on Kathleen's Home since Oct 8 under \"Waiting on a decision from you\", and all four were Alexis asking Eliseth. They point at the assignee's manager now. A review goes to whoever is actually waiting: the person who asked for it, else the person who handed it over.",
    "Nothing is hidden by the change. Those four move into the collapsed \"their list, not yours \u2014 but here if you want it\" fold on Home, which is where work you have no part in belongs. The Home tab badge had been counting them too, and stops.",
    "The 1:1 agenda splits the same way. An ask pointed at someone else still belongs in the meeting \u2014 it is their open work \u2014 so it stays, under \"Asked Eliseth, not you\" instead of \"Needs you\". The copied text matches.",
    "A row's red Needs you chip reads \"Needs Eliseth\" to anyone who is not the one being asked, in grey. It used to say \"Needs you\" to everybody.",
    "Reply & clear flag, Approve and Send back now belong to the person the ask points at, so you cannot clear a flag that was meant for somebody else. If an ask has nobody above to answer it, the owner still picks it up \u2014 a flag can never get stranded.",
    "Week ahead stops saying \u00b7 needs you on a task that needs someone else, and the Needs you filter on All tasks means asking you, or your own task that is asking somebody.",
    "Delegated meant delegated by anybody. On your Home it has to mean by you \u2014 an overdue task Eliseth handed Alexis was reading as though you had handed it out yourself.",
  ]},
  {v:"12.2", d:"October 10, 2026", items:[
    "The task drawer agrees with it. Its Origin line is Assigned by too, and it now reads an ask \u2014 it used to call a task Eliseth wrote down for you \"Their own task\", which is how the column and the drawer could disagree about the same task.",
    "Assigned by is a column on My day, All my tasks and the Assigned to you list on Home — so you can tell at a glance what somebody handed you from what you set yourself. It reads \"Kathleen assigned\", \"Eliseth asked for it\" or \"Your own\". It was already on All tasks and Finished, under the vaguer heading Origin; it is called Assigned by everywhere now, and it no longer disappears on a phone.",
  ]},
  {v:"12.1", d:"October 10, 2026", items:[
    "The numbers below had fallen behind the badge at the top of the screen. This entry and the ones before it were labelled 11.6 and down while the app itself was already past 12 — the changelog was being numbered by hand and the version by the build. One number now, taken from the build.",
    "\"Who asked for this?\" on a task you write for yourself. Most of what your team types in is your ask captured by whoever had the keyboard \u2014 30 of Eliseth's 42 tasks are ones she entered herself \u2014 and until now every one of those folded away on your agenda. Name the person who asked and it reaches them as theirs to follow, while the task still honestly records who wrote it down. You can only name yourself or someone you report to.",
    "Update now offers Working and Waiting, and nothing else. It used to list all six statuses, which quietly duplicated the Done button and hid Ready for review in a dropdown \u2014 which is how Eliseth found it. Done has its own button, Skip belongs to repeating tasks.",
    "Ready for review is a button of its own now, and only appears when somebody is actually waiting on the outcome \u2014 work handed to you, or work someone asked for. On a task you set for yourself with nobody asking, there is nobody to review it.",
    "A \ud83d\udca1 Idea button sits beside + Assign on every screen, for anyone \u2014 a feature, a rough edge, anything that would make Task Depot better. It goes straight to the idea board that collects ideas from every one of your apps, badged Task Depot, so it is not lost in a chat. The key it uses can only add a note: it cannot read the board, change it, or delete from it.",
    "The daily \"what needs you today\" email is no longer a wall of grey. Each group is a card in the colour it wears on Home \u2014 red for a decision or a plea for help, amber for stuck or gone quiet, navy for yours \u2014 with its own count, and three big numbers across the top. Long groups stop at eight with \"and 25 more\", because thirty-three overdue tasks is a scroll, not a digest.",
    "Finishing a task with steps still unticked now asks first. It names how many and lists them, then gives three ways out: tick them all and finish, finish anyway and leave them unticked as an honest record, or cancel. It does not block you \u2014 a checklist is a plan, and plans change \u2014 it stops it happening without you noticing.",
    "Done means has moved into Details on the 25 open tasks that had one, so criteria your team was given are still in front of them. Closed tasks were left alone and the original text is still stored, so this can be undone.",
    "A task's name carries its step count in every list \u2014 \"15th Corp Statements (4/5)\" \u2014 turning green when the last one is ticked. Eleven tasks have steps and you could not tell from any list which were nearly finished.",
    "Definition of done is gone from the new-task form, the edit form and the task itself. Forty live tasks still have the text saved against them; nothing was deleted, it is just no longer shown, so say the word if you want it folded into Details rather than left sitting there.",
    "The eye is an eye now, lashes and all, instead of \u25c9 \u2014 which was really a radio button wearing a disguise. Hollow pupil means nobody is watching, solid means somebody is, and the colour says whether that somebody is you. Same drawing everywhere it appears: the lists, the task itself, and the 1:1 agenda.",
    "The 1:1 agenda has a Watching section, sitting after Needs you and Not moving and before everything else. A watched task that is overdue or asking you for something stays under those headings \u2014 they outrank the eye, same rule as Home \u2014 so this holds the ones that are simply ticking along, which would otherwise disappear into a catch-all of fourteen.",
    "Watching is no longer private. It used to be a silent eye that only changed what you saw; now anyone who can see a task can see who is following it \u2014 including the person doing the work. The eye in a list goes solid in grey when somebody else is watching and navy when you are, and hovering it names them. The task itself says it in words at the top.",
    "You can still only see watchers on tasks you can already see. Checked from Alexis's account: she sees Eliseth watching her own task, and nothing at all about tasks that are not hers.",
    "\"Split off a linked task\" is parked. It made a brand-new task for someone else hung off this one, and it never sat right \u2014 it was being used to get eyes on a piece of work, which is what the eye is for now. Tasks already split stay exactly as they are, still showing \"Part of\" on both sides, and \"Link to another task\" still relates two tasks that already exist.",
  ]},
  {v:"11.5", d:"October 7, 2026", items:[
    "A 1:1 is a meeting you hold, not a line on the org chart. You can add someone who reports elsewhere \u2014 Alexis reports to Eliseth, but you review the work you have given her together, so she now sits on your 1:1s with a Remove button and an agenda of her own.",
    "The app offers it before you ask: anyone you have live delegated work with and no meeting to review it in shows under \"Worth adding\" with the count, and one press adds them.",
    "A pin can never point upward. A manager pinning their own boss would have been able to read their whole list, so the rule that stops you assigning work upward now covers this too \u2014 enforced when the pin is written and re-checked every time it is read, so a stale one grants nothing.",
    "The other side of the meeting sees it. Their page is now headed \"Your own list\" and says who reviews it \u2014 one list labelled by who asked, rather than two near-identical pages.",
  ]},
  {v:"11.3", d:"October 7, 2026", items:[
    "A task you are watching now always appears under Watching, unless it is actually asking you for something. It used to stand aside for any other group that claimed it, so \"Transfer labels\" \u2014 overdue by a day \u2014 was filed inside a collapsed pile of 33 overdue tasks. The one being watched most closely was the one it hid best.",
    "Watching rows carry a reason, so an overdue one reads \"overdue since Oct 6\" where it sits.",
  ]},
  {v:"11.2", d:"October 7, 2026", items:[
    "Rows that want something from you stand out. A task asking you for help, a decision, or a review gets a red edge and a faint warm tint; one you are watching gets a navy edge. Four rows out of seventy-one are red and two are navy right now, which is the point \u2014 if half the list lit up it would mean nothing.",
    "A row that is both asking and watched shows red. Asking wins, and the solid eye already says you are watching it.",
    "Home has a Watching section, collapsible like the rest, sitting just above Overdue. It holds what you are keeping an eye on that nothing else has already claimed \u2014 so a watched task that needs a decision stays under Waiting on a decision rather than appearing twice. It shows watched work even when nothing is wrong with it, which is the whole reason you put an eye on it.",
  ]},
  {v:"11.1", d:"October 7, 2026", items:[
    "A private note is now the author's alone. It had been readable by the owner and by the note-writer's manager, while the only promise the checkbox ever made was \"emails nobody\" \u2014 so three notes Eli wrote, one of them her own 1:1 notes, were showing on Kathleen's agenda under the heading \"Your private notes\". Closed in all three places it leaked: the task drawer, search, and the agenda. Checked afterwards from every account: Eli sees her three, everyone else sees none.",
    "The checkbox says what it does now \u2014 \"Private note (only you can see it)\" instead of \"Private manager note (emails nobody)\".",
    "Watch a task straight from any list. The eye sits beside the title on every row: faint until you run your eye down the column, solid once it is on. Clicking it never opens the task. The one in the drawer stays for when you are already in there.",
    "Every page has the dimension the 1:1 agenda got: blocks lift off the background on a soft shadow, and on Home each group wears the colour of why it needs you \u2014 red for a decision or a plea for help, amber for stuck or gone quiet, navy for ready to review. Week ahead colours Due today, Overdue and No date the same way.",
  ]},
  {v:"11.0", d:"October 7, 2026", items:[
    "The 1:1 agenda has the same dimension as the drawers: each section lifted on a soft shadow with a coloured edge. The colour carries the meaning rather than decorating it \u2014 red for Needs you, amber for Not moving, navy for everything else in flight, grey for the two folded background blocks, green for what they finished, purple for Worth mentioning. You can find your place in the meeting by colour without reading a heading.",
    "The same treatment is now available to any section in the app, not just the ones inside a drawer.",
  ]},
  {v:"10.9", d:"October 7, 2026", items:[
    "The 1:1 agenda is three sections instead of six, in the order you would actually talk through them: Needs you, Not moving, Everything else on their plate.",
    "Overdue and Waiting on others have become one \u2014 Not moving \u2014 with the reason on each line, \"overdue since Oct 1\" or \"waiting on Jeff\". They were separate sections that overlapped, so a task that was both appeared twice and the agenda looked longer than the work. On Eli's agenda that was happening to the building and forklift oversight task. A task can now only be in one place.",
    "\"They've asked you for\" was misnamed. It never meant things they asked YOU for \u2014 it was tasks they had handed to other people, nine of them on Eli's agenda. It is now \"What Eliseth has handed to other people\", folded away like their own list, because it is background on how much she is delegating rather than something for the two of you to work through.",
    "\"Waiting on you\" is now \"Needs you\", matching the words Home uses for the same thing.",
  ]},
  {v:"10.8", d:"October 7, 2026", items:[
    "One search instead of two. The Search tab is gone and the box on All tasks does its job: it reads comments, steps, the definition of done and standing notes as well as titles and details. That matters \u2014 on real searches here, about a fifth of the hits were in a comment or a step and the old box could not see them. \"Goodman\" found four tasks, now it finds five.",
    "The difference was that the two searched different things and neither could do what the other did. Search looked everywhere but could not be narrowed by person or status; All tasks narrowed well but only read the title and details. Now the box searches everywhere and your filters still apply on top of the results.",
    "While you are searching, the table swaps Origin, Entered and Last update for Matched in and Where, so you can see it was a comment that mentioned Goodman and read the line without opening anything. Clear the box and the usual columns come back.",
    "Typing stays instant: the local test runs while the fuller answer is on its way, so the list never stalls on a keystroke.",
    "Trash moves to the end of the menu, after People, Email intake and Settings.",
  ]},
  {v:"10.7", d:"October 7, 2026", items:[
    "The watch control has a fixed home: the eye at the top right of the drawer's header band, in the same place on every task. It was sitting in the row of buttons, and that row changes from task to task \u2014 Mark done, Return to Kathleen and the rest come and go \u2014 so the button landed wherever the row happened to wrap.",
    "It also did not belong there. Every other button in that row changes the task; watching only changes what you see. Out of the row, it stops looking like something that does anything to the work. Hollow means not watching, filled means watching, and it fills in the task's own colour.",
  ]},
  {v:"10.6", d:"October 7, 2026", items:[
    "Week ahead drops the 14 days option. The grid holds six columns, so a fortnight was always going to spill.",
    "All tasks: Open, Blocked, Needs you, Skipped, Done, Everything \u2014 and Blocked and Needs you no longer overlap. Blocked used to mean \"waiting OR asking you for help\", and since asking for help now sets a task to Waiting, all three flagged tasks were appearing under both. Blocked is now waiting on someone else; anything asking YOU sits under Needs you, where you would look for it.",
  ]},
  {v:"10.5", d:"October 7, 2026", items:[
    "You can put an eye on a task someone set for themselves. Open it and press Watch this: from then on it reaches your Home when it needs attention and leads your 1:1 agenda with them, instead of folding into \"their own list\". Everything built this week has been about getting their own work out of your way \u2014 this is the way back in for the handful you do want to follow.",
    "Watching is yours alone and nobody is told. It changes what you see and nothing else: no email goes out, the owner's view is unchanged, and Eli watching one of Alexis's tasks does not put it in front of you. It is a reading aid, not a flag on somebody's work.",
    "A watched task carries a quiet Watching tag wherever it is listed, and the 1:1 marks it so you know why it is on the agenda. Press the button again to stop.",
    "SDEA is already being watched \u2014 it came up as the test case while I was proving this works. Press the eye on it to turn that off.",
  ]},
  {v:"10.4", d:"October 7, 2026", items:[
    "\"However it started\" is two choices instead of four: someone assigned it to them, or they created it themselves. The old four mixed up who put it on the list with how it arrived, so an emailed task was both \"emailed in\" AND assigned \u2014 picking one quietly hid the other. These two cover every task between them. If you want to find something that arrived by email, Email intake is the place for that.",
    "The Origin column matches: You assigned, Eli assigned, or Their own.",
    "Asking for help puts a task into Waiting, on the person being asked. SDEA and the Santa Ana trash sign both read Working while nobody was working on them \u2014 both were sitting on an unanswered question. Clearing the flag hands it back to Working and clears the waiting note, so nobody has to set the status twice.",
    "A task already waiting on something real keeps that \u2014 flag one that is waiting on Goodman and it still says Goodman, not your manager. And a flagged task still appears under \"Asked you for help\" on Home rather than sinking into \"Stuck waiting on someone else\".",
  ]},
  {v:"10.3", d:"October 7, 2026", items:[
    "A task moves itself to Working the moment somebody actually engages with it \u2014 a person comments, a step is added or ticked, somebody asks for help or a decision, or somebody asks for more time. Circle Backs had seven comments and still read Not started; the SDEA renewal was flagged for help while claiming nobody had touched it. Ten tasks were sitting in that state and have been moved.",
    "The comment an emailed task is born with does not count. Those chain summaries land within seconds of arrival, so anything in a task's first two minutes is treated as part of its arrival rather than as work \u2014 otherwise every forwarded email would have started itself before anyone read it. One rule, and it covers email intake, the Brain Dump bridge and copied tasks together.",
    "Reassigning a task on its own does NOT start it, which is the one place this differs from what was asked. Handing work to somebody new does not mean they have begun it, and Not started is the only thing on the screen that says nobody has picked this up yet. Every other kind of touch starts it, including the flags that made SDEA look wrong.",
  ]},
  {v:"10.2", d:"October 7, 2026", items:[
    "Asking for help reaches Home whoever wrote the task down. Home only ever showed delegated work, so a task someone set for themselves and then flagged Need help never appeared \u2014 it folded into the \"their own list\" line. That is why the Santa Ana trash sign and the SDEA renewal were nowhere to be seen. Anything flagged for help, needing a decision, or ready for your review now sits in Needs attention no matter who created it.",
