function WeekAhead({tasks,people,today,setOpen,opener,me,isMgr}){
  const span = 7;   // six days ahead, which is what the grid has room for
  const [who,setWho] = useState("");
  // a stable colour per person, so the same name is the same colour everywhere here
  const PALETTE = ["#1f3a7a","#c62828","#2e7d32","#5b3fa0","#b26a00","#1f6f63","#8a1c5c","#37474f"];
  const owners = [...new Set(tasks.filter(t=>!CLOSED(t.status)).map(t=>t.assignee_id||t.assignee_email||"none"))];
  const colourOf = (t) => PALETTE[Math.max(0, owners.indexOf(t.assignee_id||t.assignee_email||"none")) % PALETTE.length];
  const nameFor = (t) => t.assignee_id ? nameOf(people,t.assignee_id)
    : t.assignee_email ? ((INVITEES.find(i=>i.email===String(t.assignee_email).toLowerCase())||{}).full_name || t.assignee_email)
    : "Unassigned";

  const mine = tasks.filter(t=>!CLOSED(t.status))
    .filter(t=>!who ? true : String(who).startsWith("email:")
      ? String(t.assignee_email||"").toLowerCase()===who.slice(6) : t.assignee_id===who);

  const days = [];
  for(let i=1;i<span;i++){
    const d = new Date(today+"T00:00:00"); d.setDate(d.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    days.push({iso, d, list: mine.filter(t=>t.due_date===iso)});
  }
  const dueToday = mine.filter(t=>t.due_date===today);
  const overdue = mine.filter(t=>t.due_date && t.due_date < today)
    .sort((a,b)=>(a.due_date||"").localeCompare(b.due_date||""));
  const undated = mine.filter(t=>!t.due_date);
  const later = mine.filter(t=>t.due_date && t.due_date > days[days.length-1].iso);

  const Task = ({t,list}) => <button className="chiptask" style={{borderLeftColor:colourOf(t)}}
      onClick={()=>setOpen(t.id, list.map(x=>x.id))}>
      <span className="who" style={{color:colourOf(t)}}>{nameFor(t).split(" ")[0]}</span>
      {t.title}
      {t.need_help||t.need_manager ? (ASKING(t)
        ? <span style={{color:"var(--red)",fontWeight:700}}> · needs you</span>
        : <span style={{color:"var(--muted)",fontWeight:600}}> · needs {ASKEE(t) ? String(nameOf(people,ASKEE(t))).split(" ")[0] : "a manager"}</span>) : null}
    </button>;

  return <>
    <div className="h"><h2>Week ahead</h2>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {isMgr && <select value={who} onChange={e=>setWho(e.target.value)} style={{padding:"6px 8px",borderRadius:8,border:"1px solid var(--line)"}}>
          <option value="">Everyone</option>
          {people.filter(p=>p.active).map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}
          {(INVITEES||[]).length>0 && <optgroup label="Not signed up yet">
            {INVITEES.map(i=><option key={i.email} value={"email:"+i.email}>{i.full_name||i.email}</option>)}</optgroup>}
        </select>}

      </div></div>

    {isMgr && owners.length>1 && <div className="who-key">
      {owners.map(o=>{ const sample = tasks.find(t=>(t.assignee_id||t.assignee_email||"none")===o); if(!sample) return null;
        return <span key={o}><i style={{background:colourOf(sample)}}/>{nameFor(sample)}</span>; })}
    </div>}

    {dueToday.length>0 && <div className="panel edged edge-navy">
      <h3>Due today {"\u2014"} {dueToday.length}</h3>
      {dueToday.map(t=><Task key={t.id} t={t} list={dueToday}/>)}
    </div>}

    <div className="week">
      {days.map(({iso,d,list})=>{
        const weekend = d.getDay()===0 || d.getDay()===6;
        return <div key={iso} className={"day"+(iso===today?" today":"")+(weekend?" weekend":"")}>
          <h4><b>{d.toLocaleDateString(undefined,{weekday:"short"})} {d.getDate()}</b>
            <span>{iso===today?"today":list.length?`${list.length}`:""}</span></h4>
          {list.length ? list.map(t=><Task key={t.id} t={t} list={list}/>)
            : <div style={{fontSize:13,color:"var(--muted)"}}>—</div>}
        </div>;
      })}
    </div>

    {undated.length>0 && <div className="panel edged edge-grey" style={{marginTop:12}}>
      <h3>No date {"\u2014"} {undated.length}</h3>
      <div style={{fontSize:13,color:"var(--muted)",marginBottom:6}}>Without a date these can never be overdue, so nobody is ever reminded.</div>
      {undated.map(t=><Task key={t.id} t={t} list={undated}/>)}
    </div>}

    {overdue.length>0 && <div className="panel edged edge-red" style={{marginTop:12,background:"var(--red-soft)"}}>
      <h3 style={{color:"var(--red)"}}>Overdue — {overdue.length}</h3>
      <div style={{fontSize:13,color:"var(--muted)",marginBottom:6}}>Already past their date, so they aren't on the calendar above.</div>
      {overdue.map(t=><Task key={t.id} t={t} list={overdue}/>)}
    </div>}

    {later.length>0 && <div style={{marginTop:12,fontSize:14,color:"var(--muted)"}}>
      {later.length} more due after {fmtDate(days[days.length-1].iso)}.</div>}
    {!overdue.length && !undated.length && !dueToday.length && days.every(d=>!d.list.length) &&
      <div className="card" style={{marginTop:12}}><div className="empty">Nothing due in this window.</div></div>}
  </>;
}

function Repeating({showToast,setOpen,tasks,isMgr,update}){
  const [rows,setRows] = useState(null);
  const [sort,setSort] = useState(null);
  const load = useCallback(()=>{ sb.rpc("recurring_overview").then(({data,error})=>{
    if(error){ showToast(error.message); return; } setRows(data||[]); }); },[showToast]);
  useEffect(()=>{load();},[load]);
  const ruleText = (r) => r.rule==="daily" ? "Every day"
    : r.rule==="weekly" ? `Every ${DOW[r.recur_day??0]}`
    : r.rule==="yearly" ? "Every year" 
    : `Monthly on the ${r.recur_day||1}`;
  const catchUp = async (r) => {
    if(!window.confirm(`Skip the ${r.open_count-1} older open one${r.open_count-1===1?"":"s"} of "${r.title}" and keep only the newest? They'll be recorded as skipped, not done.`)) return;
    const {data,error} = await sb.rpc("catch_up_series",{p_series:r.series_id});
    if(error){ showToast(error.message); return; }
    load(); showToast(`Skipped ${data} — you're caught up`);
  };
  const togglePause = async (r) => {
    const ok = await update(r.series_id,{recur_paused:!r.paused});
    if(ok){ load(); showToast(r.paused?"Resumed":"Paused — no new ones will be created"); }
  };
  // Which occurrence to open when a series is clicked: the one that is live now —
  // the oldest still-open, since that is the one running late — and failing that the
  // most recently finished, so there is always something to look at.
  const occurrences = (r) => (tasks||[]).filter(x=>x.series_id===r.series_id && !x.deleted_at);
  const current = (r) => {
    const all = occurrences(r);
    const open = all.filter(x=>!CLOSED(x.status))
                    .sort((a,b)=>String(a.due_date||"9999").localeCompare(String(b.due_date||"9999")));
    if(open.length) return open[0];
    const done = all.filter(x=>CLOSED(x.status))
                    .sort((a,b)=>String(b.completed_at||b.updated_at||"").localeCompare(String(a.completed_at||a.updated_at||"")));
    return done[0] || null;
  };
  const openCurrent = (r) => {
    const t = current(r);
    if(!t){ showToast("The next one hasn't been created yet — nothing to open"); return; }
    // the queue is the whole series, so the drawer arrows step through its history
    const queue = occurrences(r)
      .sort((a,b)=>String(b.due_date||"").localeCompare(String(a.due_date||"")))
      .map(x=>x.id);
    setOpen(t.id, queue);
  };
  if(rows===null) return <div className="empty">Loading…</div>;
  const sval = (r,k) => k==="title" ? String(r.title).toLowerCase() : k==="assignee" ? String(r.assignee||"zz").toLowerCase()
    : k==="rule" ? ruleText(r).toLowerCase() : k==="open_count" ? String(r.open_count).padStart(6,"0")
    : k==="oldest_open" ? (r.oldest_open||"9999") : k==="next" ? ((r.next_dates||[])[0]||"9999") : "";
  const sorted = !sort ? rows : rows.slice().sort((a,b)=>{ const x=sval(a,sort.k), y=sval(b,sort.k);
    return (x<y?-1:x>y?1:0)*sort.dir || String(a.title).localeCompare(String(b.title)); });
  return <>
    <div className="h"><h2>Repeating</h2><span className="sub">{rows.length} recurring task{rows.length===1?"":"s"}</span></div>
    <div className="note" style={{marginBottom:10}}>Click a row to open the one that's live now — the arrows in the drawer then step back through earlier ones. Weekly and monthly tasks appear five days before each due date, whether or not the last one got finished — they stack up rather than disappearing. Daily ones roll forward instead of piling up. Dates below that haven't happened yet are scheduled, not created.</div>
    {rows.length ? <div className="card tablewrap">
      <table className="ttable"><thead><tr>
        {[["title","Task","task"],["assignee","Person","who"],["rule","Repeats","muted"],
          ["open_count","Open now","num"],["oldest_open","Oldest due","num hide-sm"],["next","Coming up","muted hide-sm"]].map(([k,label,cls])=>
          <th key={k} className={cls} title="Sort by this column"
            onClick={()=>setSort(sort && sort.k===k ? (sort.dir===1?{k,dir:-1}:null) : {k,dir:1})}>
            {label}{sort && sort.k===k ? <span className="sortmark">{sort.dir===1?"\u25B4":"\u25BE"}</span> : null}</th>)}
        {isMgr && <th className="num"></th>}
      </tr></thead><tbody>
        {sorted.map(r=>{ const cur = current(r); return <tr key={r.series_id}
          style={{cursor:cur?"pointer":"default"}} onClick={()=>openCurrent(r)}
          title={cur ? (CLOSED(cur.status) ? "Open the most recent one (finished)" : `Open the one due ${fmtDate(cur.due_date)}`) : undefined}>
          <td className="task">{r.title}{r.paused && <span className="pill" style={{marginLeft:6,background:"#eef0f4",color:"var(--muted)"}}>Paused</span>}
            {r.stalled && <span className="pill" style={{marginLeft:6,background:"#fdecea",color:"var(--red)"}}>Behind</span>}</td>
          <td className="who">{r.assignee||"Unassigned"}</td>
          <td className="muted">{ruleText(r)}</td>
          <td className="num" style={r.stalled?{color:"var(--red)",fontWeight:700}:undefined}>{r.open_count}</td>
          <td className="num muted hide-sm">{r.oldest_open?fmtDate(r.oldest_open):"—"}</td>
          <td className="muted hide-sm">{r.paused ? "paused — none scheduled" : ((r.next_dates||[]).map(d=>fmtDate(d)).join(" · ") || "—")}</td>
          {isMgr && <td className="num" onClick={e=>e.stopPropagation()}><span style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
            {r.open_count>1 && <button className="btn sm" onClick={()=>catchUp(r)}>Catch up</button>}
            <button className="btn sm" onClick={()=>togglePause(r)}>{r.paused?"Resume":"Pause"}</button></span></td>}
        </tr>; })}
      </tbody></table>
    </div> : <div className="card"><div className="empty">No repeating tasks yet. Set one up by choosing how often it repeats when you assign it.</div></div>}
  </>;
}

function Search({setOpen,showToast,trashedIds,openTaskId,people,today,isMgr}){
  const [q,setQ] = useState(""); const [closed,setClosed] = useState(false);
  const [rows,setRows] = useState(null); const [busy,setBusy] = useState(false);
  const [ran,setRan] = useState("");
  const run = useCallback(async (term) => {
    const text = (term===undefined ? q : term);
    if(String(text).trim().length<2){ showToast("Type at least two characters"); return; }
    setBusy(true);
    const {data,error} = await sb.rpc("search_all",{q:text, include_closed:closed});
    setBusy(false);
    if(error){ showToast(error.message); return; }
    setRows(data||[]); setRan(String(text));
  },[q,closed,showToast]);
  // results are a snapshot: re-run them when a task drawer closes, so anything you
  // just trashed, finished or retitled in there stops showing the old version
  useEffect(()=>{ if(openTaskId===null && ran) run(ran); },[openTaskId]);   // eslint-disable-line
  const gone = new Set(trashedIds||[]);
  const shown = (rows||[]).filter(r=>!gone.has(r.task_id));
  // reuse the real task rows so the table looks and behaves like All tasks; carry the
  // match detail along on the object so the two search-only columns can read it
  const asTasks = shown.map(r=>{
    const live = (ALL_TASKS||[]).find(x=>x.id===r.task_id);
    const base = live || {id:r.task_id, title:r.title, status:r.status, due_date:r.due_date,
                          assignee_id:null, assignee_email:null, created_at:null, updated_at:null};
    return {...base, __hit:r.hit_kind, __snippet:r.snippet};
  });
  return <>
    <div className="h"><h2>Search</h2><span className="sub">{rows?`${shown.length} result${shown.length===1?"":"s"}`:"Titles, details, comments, steps and your private notes"}</span></div>
    <div className="form" style={{marginBottom:10}}>
      <div style={{display:"flex",gap:8}}>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&run()} placeholder="Goodman, freight quote, Suan…" style={{flex:1}}/>
        <button className="btn p" onClick={()=>run()} disabled={busy}>{busy?"…":"Search"}</button>
      </div>
      <label style={{display:"flex",gap:8,alignItems:"center",fontSize:14,color:"var(--muted)"}}>
        <input type="checkbox" checked={closed} onChange={e=>setClosed(e.target.checked)} style={{width:"auto"}}/>
        Include finished and skipped tasks
      </label>
    </div>
    {rows && <TaskTable list={asTasks} people={people} today={today} isMgr={isMgr}
      setOpen={(id)=>setOpen(id, asTasks.map(x=>x.id))}
      cols={isMgr?["who","title","status","due","matched","snippet"]:["title","status","due","matched","snippet"]}
      empty="Nothing matched. Try a shorter word, or tick the box to include finished tasks."/>}
  </>;
}

function OneOnOnes(ctx){
  const {me,people,showToast,setOpen,openTaskId,isOwner} = ctx;
  const [list,setList] = useState(null);
  const [pick,setPick] = useState(null);
  const [nonce,setNonce] = useState(0);
  const [busy,setBusy] = useState(null);
  useEffect(()=>{ let live=true;
    sb.rpc("my_one_on_ones").then(({data,error})=>{
      if(!live) return;
      if(error){ showToast(error.message); return; }
      setList(data);
    });
    return ()=>{live=false;};
  },[showToast,openTaskId,pick,nonce]);

  // A 1:1 is a meeting you hold, not a line on the org chart. Pin someone who does not
  // report to you but whose delegated work you review together. The server re-checks the
  // rule when it reads the pin, so a pin can never point upward.
  const pin = async (personId, on) => {
    setBusy(personId);
    const {error} = on
      ? await sb.from("one_on_one_pins").insert({owner_id:me.id, person_id:personId})
      : await sb.from("one_on_one_pins").delete().eq("owner_id",me.id).eq("person_id",personId);
    setBusy(null);
    if(error) showToast(error.message);
    else { showToast(on ? "Added to your 1:1s" : "Removed from your 1:1s"); setNonce(n=>n+1); }
  };

  if(pick) return <Agenda personId={pick.id} pairWith={pick.pairWith} withWhom={pick.label} people={people}
    onBack={()=>setPick(null)} showToast={showToast} setOpen={setOpen} openTaskId={openTaskId}
    startTaskFromMention={ctx.startTaskFromMention}/>;
  if(!list) return <div className="empty">Loading…</div>;

  const Row = ({p, label, sub, openAs}) => <div className="person" key={p.id}
      onClick={()=>setPick({id:openAs||p.id, pairWith:p.id, label})} style={{cursor:"pointer"}}>
    <div>
      <b>{p.name}</b>
      <div style={{fontSize:13,color:"var(--muted)"}}>{sub}</div>
      <div className="stats" style={{marginTop:4}}>
        <span><b>{p.open}</b> open</span>
        {p.overdue>0 && <span><b style={{color:"var(--red)"}}>{p.overdue}</b> overdue</span>}
        {p.flagged>0 && <span><b style={{color:"var(--warn)"}}>{p.flagged}</b> waiting on you</span>}
        {p.mentions>0 && <span><b>{p.mentions}</b> to mention</span>}
      </div>
    </div>
    <div style={{display:"flex",gap:6,alignItems:"center"}}>
      {p.pinned && <button className="btn sm" disabled={busy===p.id}
        title="Stop holding a 1:1 with this person"
        onClick={(e)=>{e.stopPropagation(); pin(p.id,false);}}>{busy===p.id?"\u2026":"Remove"}</button>}
      <button className="btn sm p" onClick={(e)=>{e.stopPropagation(); setPick({id:openAs||p.id, pairWith:p.id, label});}}>Open agenda</button>
    </div>
  </div>;

  const team = list.team || [];
  return <>
    <div className="h"><h2>1:1s</h2><span className="sub">{team.length + (list.manager?1:0)} to prepare for</span></div>
    <div className="note" style={{marginBottom:10}}>Each agenda is built from the work itself — finished since last time, overdue, waiting on someone, still open — so there is nothing to write up beforehand.</div>

    {list.manager && <>
      <div className="section-title">Your own list</div>
      <div className="card"><Row p={list.manager} openAs={me.id} label={`with ${list.manager.name}`}
        sub={(list.also_meets||[]).length
          ? `One list, labelled by who asked — ${[list.manager.name].concat((list.also_meets||[]).map(x=>x.name)).map(n=>String(n).split(" ")[0]).join(" and ")} each see it, minus your private notes.`
          : `This is what ${String(list.manager.name).split(" ")[0]} sees when they open yours, minus their private notes.`}/></div>
    </>}

    {(list.suggested||[]).length>0 && <>
      <div className="section-title">Worth adding</div>
      <div className="card edged edge-purple">
        {(list.suggested||[]).map(sgg=>
          <div className="person" key={sgg.id}>
            <div>
              <b>{sgg.name}</b>
              <div style={{fontSize:13,color:"var(--muted)"}}>
                {sgg.open} open task{sgg.open===1?"":"s"} you assigned, and no 1:1 to review {sgg.open===1?"it":"them"} in.
              </div>
            </div>
            <button className="btn sm p" disabled={busy===sgg.id}
              onClick={()=>pin(sgg.id,true)}>{busy===sgg.id?"\u2026":"Add to my 1:1s"}</button>
          </div>)}
      </div>
    </>}

    <div className="section-title">{list.manager ? "Your meetings with your team" : "Your team"}</div>
    <div className="card">{team.length
      ? team.map(p=><Row key={p.id} p={p} label={`with ${p.name}`}
          sub={p.pinned
            ? "You added this meeting — they report elsewhere, but you review your own delegated work together"
            : p.role==="manager" ? "Manager — has their own reports" : "Reports to you"}/>)
      : <div className="empty">{list.manager
          ? ((list.also_meets||[]).length
              ? "Nobody reports to you, so your own list above is all you prepare for."
              : "Nobody reports to you, so this is the only 1:1 you prepare for.")
          : "Nobody reports to you yet." + (isOwner ? " Set reporting lines on the People tab." : "")}</div>}
    </div>
  </>;
}

function Agenda({personId,pairWith,withWhom,people,onBack,showToast,setOpen,openTaskId,startTaskFromMention}){
  // personId = whose work the agenda is about. pairWith = the other person in the meeting,
  // which is who mentions belong to. They differ only when you open your 1:1 with your own manager.
  const other = pairWith || personId;
  const [days,setDays] = useState(14);
  const [a,setA] = useState(null);
  // A 1:1 is about the work the two of you share, so the agenda leads with what you
  // handed them. Their own list and anything a third person gave them folds away —
  // folded, never hidden: if they are behind on your work, the reason is often in there.
  const allKey = "td_1on1_all_" + personId;
  const [showAll,setShowAll] = useState(false);
  const [openTheirs,setOpenTheirs] = useState(false);
  useEffect(()=>{ try{ setShowAll(localStorage.getItem("td_1on1_all_"+personId)==="1"); }
                  catch(e){ setShowAll(false); } setOpenTheirs(false); },[personId]);
  const setAll = (v) => { setShowAll(v); try{ localStorage.setItem(allKey, v?"1":"0"); }catch(e){} };
  useEffect(()=>{ let live=true;
    sb.rpc("one_on_one",{p_person:personId, since_days:days}).then(({data,error})=>{
      if(!live) return;
      if(error){ showToast(error.message); return; }
      setA(data);
    });
    return ()=>{live=false;};
  },[personId,days,showToast,openTaskId]);   // refresh when a task drawer closes
  const asText = () => {
    if(!a) return "";
    const L=[]; L.push(`1:1 — ${a.person} — ${new Date().toLocaleDateString()}`);
    const sec=(t,arr,fmtFn)=>{ if(!arr||!arr.length) return; L.push(""); L.push(t.toUpperCase()); arr.forEach(x=>L.push("  - "+fmtFn(x))); };
    if(mentions && mentions.items.length){ L.push(""); L.push("WORTH MENTIONING"); mentions.items.forEach(x=>L.push(`  - ${x.mentioned?"[said] ":""}${x.body}`)); }
    sec("Needs you",asksMe,x=>`${x.title}${x.note?` — "${x.note}"`:""}`);
    sec(askedWho?`Asked ${askedWho}, not you`:"Asked someone else",asksOther,
        x=>`${x.title}${x.note?` — "${x.note}"`:""}`);
    sec("Not moving",stalled,x=>`${x.title} — ${x.__why}`);
    sec("Everything else on their plate",inFlight,x=>`${x.title}${x.due?` (due ${fmtDate(x.due)})`:""}${x.next?` — next: ${x.next}`:""}`);
    if(theirsLive.length){ L.push(""); L.push(`THEIR OWN LIST (${theirsLive.length}) \u2014 not walked through`);
      theirsLive.forEach(x=>L.push(`  - ${x.title}${x.due?` (due ${fmtDate(x.due)})`:""}`)); }
    sec(`What ${first} has handed to other people`,a.they_asked_you,x=>x.title);
    sec(`What ${first}\u2019s own people are waiting on them for`,downstream,
        x=>`${x.who} \u2014 ${x.title} (${x.flag})${x.note?` \u2014 "${x.note}"`:""}`);
    sec("Your private notes",a.notes,x=>`${x.title}: ${x.body}`);
    sec("Finished, and you were watching",doneWatched,x=>x.title);
    sec(`Finished in the last ${a.since_days} days`,doneRest,x=>x.title);
    return L.join("\n");
  };
  const copy = async () => {
    try{ await navigator.clipboard.writeText(asText()); showToast("Copied — paste it anywhere"); }
    catch(e){ showToast("Couldn't copy on this device"); }
  };
  // What this person's own people are waiting on THEM for. A manager's 1:1 is where you
  // can offer to unblock it; otherwise you hear about it a fortnight later.
  const [downstream,setDownstream] = useState([]);
  const [openDown,setOpenDown] = useState(false);
  useEffect(()=>{ let live=true;
    sb.rpc("reports_waiting_on",{p_person:personId}).then(({data,error})=>{
      if(!live || error) return; setDownstream(Array.isArray(data)?data:[]);
    });
    return ()=>{live=false;};
  },[personId,openTaskId]);
  const [mentions,setMentions] = useState(null);
  const [newMention,setNewMention] = useState("");
  const loadMentions = useCallback(()=>{
    sb.rpc("mentions_for",{p_person:other}).then(({data,error})=>{
      if(error){ showToast(error.message); return; }
      setMentions(data);
    });
  },[other,showToast]);
  useEffect(()=>{ loadMentions(); },[loadMentions,openTaskId]);
  const addMention = async () => {
    const body = newMention.trim();
    if(!body) return;
    const {error} = await sb.rpc("add_mention",{p_for:other, p_body:body});
    if(error){ showToast(error.message); return; }
    setNewMention(""); loadMentions();
  };
  const tickMention = async (id,on) => {
    const {error} = await sb.rpc("mark_mentioned",{p_id:id, p_on:on});
    if(error){ showToast(error.message); return; }
    loadMentions();
  };
  const dropMention = async (id) => {
    const {error} = await sb.rpc("archive_mention",{p_id:id});
    if(error){ showToast(error.message); return; }
    loadMentions(); showToast("Off the list");
  };
  const reload = () => sb.rpc("one_on_one",{p_person:personId, since_days:days})
    .then(({data,error})=>{ if(error){ showToast(error.message); return; } setA(data); });
  // A watched task that gets finished used to vanish into the general finished list,
  // indistinguishable from everything else they closed. It is the one you asked to
  // follow, so it gets its own heading and a way to let go of it once you are satisfied.
  const doneWatched = a ? (a.completed||[]).filter(x=>x.origin==="watched") : [];
  const doneRest    = a ? (a.completed||[]).filter(x=>x.origin!=="watched") : [];
  const stopWatching = async (id, title) => {
    const {error} = await sb.from("task_watchers").delete().eq("task_id",id).eq("user_id",ME.id);
    if(error){ showToast(error.message); return; }
    WATCHED.delete(id);
    showToast(`Stopped watching \u201c${title}\u201d`);
    reload();
  };
  const cover = async (id, on) => {
    if(!id) return;
    const {error} = await sb.rpc("mark_discussed",{p_task:id, p_on:on});
    if(error){ showToast(error.message); return; }
    reload();
  };
  // opening a task from the agenda means you talked about it
  const open = (id, list) => {
    if(!id) return;
    setOpen(id, (list||[]).map(x=>x.id).filter(Boolean));
    coverIfInMeeting(id);
  };
  // while this agenda is on screen, arrowing between tasks also counts as covering them
  useEffect(()=>{ COVERING_FOR = personId; return ()=>{ COVERING_FOR = null; }; },[personId]);
  const reopen = async (id, title) => {
    if(!id) return;
    const {error} = await sb.from("tasks").update({status:"working", completed_at:null}).eq("id",id);
    if(error){ showToast(error.message); return; }
    reload(); showToast(`Reopened — "${String(title).slice(0,40)}" is back on the list`);
  };
  const clearAll = async () => {
    const {error} = await sb.rpc("clear_discussed",{p_person:personId});
    if(error){ showToast(error.message); return; }
    reload(); showToast("Fresh meeting — everything is back on the agenda");
  };
  // anything covered drops out of the live sections and collects at the bottom
  const live = (items) => (items||[]).filter(x=>!x.discussed);
  // the shared agenda: what you gave them. Their own work and anything a third person
  // handed them drops to the folded block, unless this is their own view of the meeting
  // or you have asked to see everything with this particular person.
  const mgrView = !!(a && !a.own_view);
  const grouped = mgrView && !showAll;
  // "above" is work handed straight to them by someone you report to. It stays on the
  // agenda: if your own manager is not meeting them, nobody else is going to review it.
  const ONAGENDA = (o) => o==="mine" || o==="above" || o==="watched";
  const agenda = (items) => grouped ? (items||[]).filter(x=>ONAGENDA(x.origin)) : (items||[]);
  const fromAbove = (x) => x.origin==="above" && x.by
    ? <span className="meta"> {"\u00b7"} from {String(x.by).split(" ")[0]}</span>
    : x.origin==="watched"
    ? <span className="meta" style={{display:"inline-flex",alignItems:"center",gap:4}}>
        {"\u00b7"} <Eye on={true} size={12}/> watching</span> : null;
  // Waiting on you is never folded whatever its origin: a flag, a plea for help or a
  // request to move a date is them asking you, and that IS the meeting.
  const theirsLive = grouped
    ? [...(a.overdue||[]), ...(a.open||[]), ...(a.waiting_on_others||[])]
        .filter(x=>!ONAGENDA(x.origin) && !x.discussed)
    : [];
  const theirsOverdue = grouped
    ? (a.overdue||[]).filter(x=>!ONAGENDA(x.origin) && !x.discussed).length : 0;
  const theirsSelf = theirsLive.filter(x=>x.origin==="self").length;
  const theirsOther = theirsLive.length - theirsSelf;
  const first = String((a&&a.person)||"they").split(" ")[0];
  // Three buckets, in the order you would actually talk through them, and a task can
  // only be in one: what they need from you, what is not moving, everything else.
  const seen = new Set((a&&a.waiting_on_you||[]).map(x=>x.id));
  const bucket = (rows, why) => (rows||[]).filter(x=>{
    if(seen.has(x.id)) return false; seen.add(x.id); return true;
  }).map(x=>({...x, __why: why(x)}));
  const stalled = a ? [
    ...bucket(agenda(a.overdue), x=>`overdue since ${fmtDate(x.due)}`),
    ...bucket(agenda(a.waiting_on_others), x=>x.who ? `waiting on ${x.who}` : "waiting on someone else"),
  ] : [];
  // An ask has an address now. One pointed at somebody else still belongs in the meeting
  // — it is their open work — but not under a heading that says it is waiting on you.
  const asks     = a ? (a.waiting_on_you||[]) : [];
  const asksMe   = asks.filter(x=>!x.askee || (ME && x.askee===ME.id));
  const asksOther= asks.filter(x=>x.askee && !(ME && x.askee===ME.id));
  const askedWho = asksOther.length
    ? String(nameOf(people, asksOther[0].askee)).split(" ")[0] : "";
  const inFlightAll = a ? bucket(agenda(a.open), x=>"") : [];
  // Same rule as Home: a task you are watching gets its own heading, unless it is
  // already asking you or has stalled — those outrank the eye and keep it. Without
  // this, a watched task that is simply ticking along vanishes into the catch-all.
  const watchedFine = inFlightAll.filter(x=>x.origin==="watched");
  const inFlight    = inFlightAll.filter(x=>x.origin!=="watched");
  const [openHanded,setOpenHanded] = useState(false);
  const coveredItems = () => [...(a?.overdue||[]), ...(a?.waiting_on_you||[]), ...(a?.waiting_on_others||[]),
                              ...(a?.open||[]), ...(a?.they_asked_you||[])].filter(x=>x.discussed);
  const Sec = ({title,items,render,edge}) => {
    const rows = live(items);
    if(!rows.length) return null;
    return <div className={"panel edged "+(edge||"edge-navy")}><h3>{title} ({rows.length})</h3>
      <div className="ag"><ul>{rows.map((x,i)=>
        <li key={i} style={x.id?{cursor:"pointer",display:"flex",gap:8,alignItems:"flex-start"}:undefined}>
          {x.id && <button className="btn q" title="Covered — drop it off this agenda"
            style={{padding:"0 4px",color:"var(--muted)",lineHeight:1.3}}
            onClick={(e)=>{e.stopPropagation(); cover(x.id,true);}}>✓</button>}
          <span style={{flex:1}} onClick={()=>open(x.id, rows)} title={x.id?"Open the task":undefined}>{render(x)}</span>
        </li>)}</ul></div></div>;
  };
  if(!a) return <div className="empty">Building the agenda…</div>;
  if(a.error) return <div className="note">That person doesn't report to you.</div>;
  return <>
    <div className="h"><h2>1:1 {withWhom || (a.own_view ? "— mine" : `— ${a.person}`)}</h2>
      <div style={{display:"flex",gap:6}}>
        <select value={days} onChange={e=>setDays(parseInt(e.target.value))} style={{padding:"6px 8px",borderRadius:8,border:"1px solid var(--line)"}}>
          <option value={7}>Last 7 days</option><option value={14}>Last 14 days</option><option value={30}>Last 30 days</option></select>
        {mgrView && <button className="btn sm" onClick={()=>setAll(!showAll)}
          title={showAll ? "Lead with the work you gave them" : "Walk the whole list together"}>
          {showAll ? "Just our work" : "Show everything"}</button>}
        <button className="btn sm" onClick={copy}>Copy</button>
        <button className="btn sm" onClick={()=>window.print()}>Print</button>
        {a.covered_count>0 && <button className="btn sm" onClick={clearAll}>Start a fresh meeting</button>}
        <button className="btn sm" onClick={onBack}>Back</button>
      </div></div>
    <div className="panel edged edge-purple">

function Finished({tasks,people,today,setOpen,me,setMe,showToast,load}){
  const [who,setWho] = useState([]);
  const [range,setRange] = useState("month");
  const [origin,setOrigin] = useState([]);   // how the task started
  const [busy,setBusy] = useState(false);
  const seen = new Date(me.completions_seen_at || 0);
  const finishedAt = (t) => new Date(t.status==="skipped" ? t.updated_at : (t.completed_at || t.updated_at));
  const cutoff = () => {
    const d = new Date();
    if(range==="today"){ d.setHours(0,0,0,0); return d; }
    if(range==="week"){ d.setDate(d.getDate()-7); return d; }
    if(range==="month"){ d.setDate(d.getDate()-30); return d; }
    return new Date(0);
  };
  const list = tasks.filter(t=>CLOSED(t.status) && t.assignee_id!==me.id)
    .filter(t=>!origin.length || origin.includes(startedAs(t)))
    .filter(t=>!who.length || who.some(w => String(w).startsWith("email:")
        ? String(t.assignee_email||"").toLowerCase() === String(w).slice(6)
        : t.assignee_id === w))
    .filter(t=>finishedAt(t) >= cutoff())
    .sort((a,b)=>finishedAt(b)-finishedAt(a));
  const unseen = (t) => finishedAt(t) > seen && !t.seen_at;
  const fresh = list.filter(unseen);
  // everything NOT in the current view and still unread — the pile you want to clear
  // so that what's left in front of you is only what you care about
  const elsewhere = tasks.filter(t=>CLOSED(t.status) && t.assignee_id!==me.id && unseen(t)
                                    && !list.some(x=>x.id===t.id));
  const markIds = async (rows, note) => {
    if(!rows.length) return;
    setBusy(true);
    const now = new Date().toISOString();
    const {error} = await sb.from("tasks").update({seen_at:now}).in("id", rows.map(t=>t.id));
    setBusy(false);
    if(error){ showToast(error.message); return; }
    if(load) await load();
    showToast(note);
  };
  const markSeen = async () => {
    const now = new Date().toISOString();
    const {error} = await sb.from("profiles").update({completions_seen_at:now}).eq("id",me.id);
    if(error){ showToast(error.message); return; }
    setMe(prev=>({...prev, completions_seen_at:now})); showToast("Cleared");
  };
  const when = (t) => {
    const d = finishedAt(t), days = Math.round((Date.now()-d)/86400000);
    const time = d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
    return days<=0 ? "today" : days===1 ? "yesterday" : `${time} (${days} days ago)`;
  };
  return <>
    <div className="h"><h2>Finished</h2></div>
    {(fresh.length>0 || elsewhere.length>0) && <div className="note" style={{marginBottom:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",
        background:"#e3f2e6",borderLeft:"3px solid var(--ok)"}}>
      <span style={{flex:1}}>
        <b>{fresh.length} unread here{elsewhere.length?`, ${elsewhere.length} outside this filter`:""}.</b>{" "}
        Clearing them is what takes the number off the Finished tab.</span>
      {elsewhere.length>0 && <button className="btn" disabled={busy}
        onClick={()=>markIds(elsewhere, `Marked ${elsewhere.length} as seen — the ones in front of you are untouched`)}>
        {elsewhere.length===1 ? "Mark the other one as seen" : `Mark the other ${elsewhere.length} as seen`}</button>}
      {fresh.length>0 && <button className="btn" disabled={busy}
        onClick={()=>markIds(fresh, fresh.length===1?"Marked it as seen":`Marked these ${fresh.length} as seen`)}>
        {fresh.length===1 ? "Mark this one as seen" : `Mark these ${fresh.length} as seen`}</button>}
      <button className="btn p" disabled={busy} onClick={markSeen}>Mark all as seen</button>
    </div>}
    <div className="note" style={{marginBottom:10}}>Everything your team has closed out. Nothing emails you when a task is finished — it just collects here until you look.</div>
    <div className="form three" style={{marginBottom:10}}>
      <MultiPick allLabel="Assigned or their own" value={origin} onChange={setOrigin} options={ORIGIN_OPTS}/>
      <MultiPick allLabel="Everyone" value={who} onChange={setWho} options={[
        ...people.filter(p=>p.id!==me.id).map(p=>({k:p.id, label:p.full_name})),
        ...((INVITEES||[]).length ? [{header:"Not signed up yet"}] : []),
        ...(INVITEES||[]).map(i=>({k:"email:"+i.email, label:i.full_name||i.email}))]}/>
      <select value={range} onChange={e=>setRange(e.target.value)}>
        <option value="today">Finished today</option><option value="week">Last 7 days</option>
        <option value="month">Last 30 days</option><option value="all">Everything</option></select>
    </div>
    <TaskTable list={list.map(t=>({...t, __unread: unseen(t)}))} people={people} today={today}
      setOpen={(id)=>setOpen(id, list.map(x=>x.id))}
      cols={["unread","who","title","status","origin","finished"]} empty="Nothing finished in this window."/>
  </>;
}

function Reports({tasks,people,today,setOpen}){
  const [grain,setGrain] = useState("day");
  const [rows,setRows] = useState(null);
  const [per,setPer] = useState([]);
  const [sort,setSort] = useState("open_now");
  const back = grain==="day" ? 14 : 12;
  useEffect(()=>{ let live=true;
    Promise.all([sb.rpc("task_activity",{grain,back}), sb.rpc("person_activity",{grain,back})])
      .then(([a,b])=>{ if(!live) return; setRows(a.data||[]); setPer(b.data||[]); });
    return ()=>{live=false;};
  },[grain,back]);

  const openNow = tasks.filter(t=>!CLOSED(t.status));
  const overdueNow = openNow.filter(t=>t.due_date && t.due_date<today);
  const done = (rows||[]).reduce((n,r)=>n+r.completed,0);
  const skipped = (rows||[]).reduce((n,r)=>n+r.skipped,0);
  const made = (rows||[]).reduce((n,r)=>n+r.created,0);
  const peak = Math.max(1, ...(rows||[]).map(r=>Math.max(r.created,r.completed)));
  const label = (b) => grain==="day"
    ? new Date(b+"T00:00:00").toLocaleDateString(undefined,{month:"numeric",day:"numeric"})
    : new Date(b+"T00:00:00").toLocaleDateString(undefined,{month:"short"});
  const sorted = [...per].sort((a,b)=> (b[sort]??0)-(a[sort]??0) || a.full_name.localeCompare(b.full_name));
  const cols = [["open_now","Open"],["overdue_now","Overdue"],["completed","Completed"],["skipped","Skipped"]];

  return <>
    <div className="h"><h2>Reports</h2>
      <div style={{display:"flex",gap:6}}>
        <button className={"btn sm"+(grain==="day"?" p":"")} onClick={()=>setGrain("day")}>By day</button>
        <button className={"btn sm"+(grain==="month"?" p":"")} onClick={()=>setGrain("month")}>By month</button>
      </div></div>
    <div className="counts">
      <button style={{cursor:"default"}}><b>{openNow.length}</b><span>Open right now</span></button>
      <button style={{cursor:"default"}}><b style={{color:overdueNow.length?"var(--red)":"inherit"}}>{overdueNow.length}</b><span>Overdue right now</span></button>
      <button style={{cursor:"default"}}><b style={{color:"var(--ok)"}}>{done}</b><span>Completed</span></button>
      <button style={{cursor:"default"}}><b>{skipped}</b><span>Skipped</span></button>
    </div>
    <div className="section-title">{grain==="day"?"Last 14 days":"Last 12 months"} — {made} created, {done} completed</div>
    <div className="card" style={{padding:"16px 14px"}}>
      {rows===null ? <div className="empty">Loading…</div> :
       made+done===0 ? <div className="empty">Nothing recorded in this window yet.</div> :
       <div style={{display:"flex",alignItems:"flex-end",gap:4,height:150,overflowX:"auto"}}>
        {rows.map(r=><div key={r.bucket} style={{flex:"1 0 26px",textAlign:"center"}} title={`${label(r.bucket)} — ${r.created} created, ${r.completed} completed, ${r.skipped} skipped`}>
          <div style={{display:"flex",gap:2,alignItems:"flex-end",height:110,justifyContent:"center"}}>
            <div style={{width:9,height:`${Math.round(r.created/peak*100)}%`,background:"var(--navy)",borderRadius:"2px 2px 0 0",minHeight:r.created?3:0}}/>
            <div style={{width:9,height:`${Math.round(r.completed/peak*100)}%`,background:"var(--ok)",borderRadius:"2px 2px 0 0",minHeight:r.completed?3:0}}/>
          </div>
          <div style={{fontSize:11,color:"var(--muted)",marginTop:4,whiteSpace:"nowrap"}}>{label(r.bucket)}</div>
        </div>)}
       </div>}
      <div style={{marginTop:12,fontSize:13,color:"var(--muted)"}}>
        <span style={{display:"inline-block",width:10,height:10,background:"var(--navy)",marginRight:5}}/>Created
        <span style={{display:"inline-block",width:10,height:10,background:"var(--ok)",margin:"0 5px 0 14px"}}/>Completed
      </div>
    </div>
    <div className="section-title">By person</div>
    <div className="card">
      <div className="person" style={{cursor:"default",background:"#fafbfd"}}>
        <div style={{fontSize:13,color:"var(--muted)",fontWeight:600}}>Name</div>
        <div className="stats">{cols.map(([k,l])=><button key={k} className="btn sm" style={{padding:"2px 8px",fontWeight:sort===k?700:500}} onClick={()=>setSort(k)}>{l}</button>)}</div>
      </div>
      {sorted.length ? sorted.map(p=><div className="person" key={p.person_id} style={{cursor:"default"}}>
        <div><b>{p.full_name}</b></div>
        <div className="stats">
          <span style={{minWidth:54,textAlign:"center"}}><b>{p.open_now}</b></span>
          <span style={{minWidth:54,textAlign:"center"}}><b style={{color:p.overdue_now?"var(--red)":"inherit"}}>{p.overdue_now}</b></span>
          <span style={{minWidth:54,textAlign:"center"}}><b style={{color:"var(--ok)"}}>{p.completed}</b></span>
          <span style={{minWidth:54,textAlign:"center"}}><b>{p.skipped}</b></span>
        </div>
      </div>) : <div className="empty">No one on the team yet.</div>}
    </div>
    <div className="note" style={{marginTop:10}}>Skipped is counted on its own, never as a miss — a holiday or a month that genuinely didn't apply shouldn't look like a failure.</div>
  </>;
}

function IntakeLog({showToast,standalone,setOpen,allTasks,update,people}){
  const [rows,setRows] = useState(null);
  const [alts,setAlts] = useState([]);
  const [limit,setLimit] = useState(standalone?40:12);
  const [sort,setSort] = useState(null);
  useEffect(()=>{ sb.from("inbound_emails").select("*").order("received_at",{ascending:false}).limit(limit)
    .then(({data,error})=>{ if(error){ showToast(error.message); return; } setRows(data||[]); }); },[showToast,limit]);
  useEffect(()=>{ sb.from("person_emails").select("email,profile_id,invitee_email")
    .then(({data})=>setAlts(data||[])); },[]);

  // Who sent it in. People use more than one address — ap@, purchasing@ — so check the
  // alternates as well, otherwise the row says ap@johnstoneoc.com and she has to translate.
  const senderName = (addr) => {
    const e = String(addr||"").toLowerCase();
    if(!e) return "unknown sender";
    const direct = (people||[]).find(p=>String(p.email||"").toLowerCase()===e);
    if(direct) return direct.full_name;
    const inv = (INVITEES||[]).find(i=>String(i.email).toLowerCase()===e);
    if(inv && inv.full_name) return inv.full_name;
    const alt = alts.find(a=>String(a.email).toLowerCase()===e);
    if(alt){
      if(alt.profile_id){
        const p = (people||[]).find(x=>x.id===alt.profile_id);
        if(p) return p.full_name;
      }
      if(alt.invitee_email){
        const i = (INVITEES||[]).find(x=>String(x.email).toLowerCase()===String(alt.invitee_email).toLowerCase());
        if(i && i.full_name) return i.full_name;
      }
    }
    return addr;
  };
  const tone = {created:"var(--ok)", unknown_sender:"var(--warn)", unreadable:"var(--warn)", error:"var(--red)"};
  const label = {created:"Became a task", unknown_sender:"Sender has no account — dropped",
                 unreadable:"Couldn't read it", error:"Something went wrong"};
  // This is a list of emails that arrived, not a list of tasks — the row stays put
  // whatever happens to the task afterwards. So say where that task stands now.
  const taskNow = (r) => {
    if(r.outcome!=="created" || !r.task_id) return null;
    const tk = (allTasks||[]).find(x=>x.id===r.task_id);
    if(!tk) return {state:"gone", text:"the task it made has been deleted permanently", tone:"var(--muted)"};
    if(tk.deleted_at) return {state:"trashed", text:"the task it made is in Trash", tone:"var(--muted)", task:tk};
    if(CLOSED(tk.status)) return {state:"closed", text:`task ${tk.status==="skipped"?"skipped":"done"} — "${tk.title}"`, tone:"var(--muted)", task:tk};
    return {state:"live", text:`"${tk.title}"`, tone:"inherit", task:tk};
  };
  const dropped = (rows||[]).filter(r=>r.outcome!=="created").length;

  const COL = {
    topic: {label:"Topic", cls:"task", val:r=>String(r.subject||"").toLowerCase(),
            cell:r=><>{r.subject||"(no subject)"}
              {r.detail ? <div className="meta" style={{marginTop:2}}>{r.detail}</div> : null}</>},
    became:{label:"Became a task", val:r=>String(r.outcome)+String(r.subject||""),
            cell:r=>{
              if(r.outcome!=="created") return <span style={{color:tone[r.outcome]||"inherit",fontWeight:600}}>
                {label[r.outcome]||r.outcome}</span>;
              const n = taskNow(r);
              if(!n) return <span style={{color:"var(--ok)",fontWeight:600}}>Yes</span>;
              if(n.state==="gone") return <span className="meta">deleted permanently</span>;
              if(n.state==="trashed") return <><span className="meta">in Trash</span>
                {update && <button className="btn q" style={{padding:"0 6px",color:"var(--navy)"}}
                  onClick={(e)=>{e.stopPropagation(); update(r.task_id,{deleted_at:null}).then(ok=>ok&&showToast("Restored"));}}>Restore</button>}</>;
              if(n.state==="closed") return <><span className={"pill "+n.task.status}>{STATUS[n.task.status]}</span>
                <div className="meta" style={{marginTop:2}}>{n.task.title}</div></>;
              return <>{n.task.title}
                <div className="meta" style={{marginTop:2}}>{ownerName(people||[],n.task)} {"·"} {STATUS[n.task.status]}</div></>;
            }},
    sender:{label:"Who emailed it in", cls:"who", val:r=>senderName(r.from_email).toLowerCase(),
            cell:r=><span title={r.from_email||""}>{senderName(r.from_email)}</span>},
    when:  {label:"Arrived", cls:"num muted hide-sm", val:r=>r.received_at||"",
            cell:r=>fmtWhen(r.received_at)},
  };
  const keys = standalone ? ["topic","became","sender","when"] : ["topic","became","sender"];
  const sorted = (() => {
    if(!sort || !COL[sort.k]) return rows||[];
    const c = COL[sort.k];
    return (rows||[]).slice().sort((a,b)=>{ const x=c.val(a), y=c.val(b);
      return (x<y?-1:x>y?1:0)*sort.dir; });
  })();
  const Table = () => <div className="card tablewrap">
    <table className="ttable"><thead><tr>
      {keys.map(k=><th key={k} className={COL[k].cls||""} title="Sort by this column"
        onClick={()=>setSort(sort && sort.k===k ? (sort.dir===1?{k,dir:-1}:null) : {k,dir:1})}>
        {COL[k].label}{sort && sort.k===k ? <span className="sortmark">{sort.dir===1?"▴":"▾"}</span> : null}</th>)}
    </tr></thead><tbody>
      {sorted.map(r=><tr key={r.id}
        onClick={()=>{ if(setOpen&&r.task_id) setOpen(r.task_id); }}
        style={{cursor:(setOpen&&r.task_id)?"pointer":"default"}}
        title={(setOpen&&r.task_id)?"Open the task this made":undefined}>
        {keys.map(k=><td key={k} className={COL[k].cls||""}>{COL[k].cell(r)}</td>)}
      </tr>)}
    </tbody></table>
  </div>;
  return <>
    {standalone
      ? <><div className="h"><h2>Email intake</h2>
            <span className="sub">{rows ? `last ${rows.length}` : ""}{dropped?` · ${dropped} not turned into a task`:""}</span></div>
          <div className="note" style={{marginBottom:10}}>
            Forward a work email to <b>tasks@in.myjohnstonesupplygroup.com</b> and it becomes a task. To, Cc and Bcc all work.
            Put a name first in the subject — "Ilah: get the Goodman quote" — to say who it's for, and a date — "by Friday", "10/9" —
            to set when. With no date it lands on the next working day. Replies on a thread you've already sent in are added to that
            task as a comment; start the subject with "new:" to force a separate one.
            Anything that can't be placed lands in Needs sorting.
            <div style={{marginTop:6}}><b>This is a record of the emails that arrived, not a list of tasks.</b> Rows stay here for good —
            trashing or finishing the task doesn't remove its email. Each row says where that task stands now.</div>
          </div></>
      : <><div className="section-title">Email intake</div>
          <div className="note" style={{marginBottom:10}}>Forward a work email to the Task Depot address and it becomes a task. Put a name first in the subject — "Ilah: get the Goodman quote" — to say who it's for. Anything it can't place lands in Needs sorting.</div></>}
    {rows===null ? <div className="card"><div className="empty">Loading…</div></div>
      : rows.length ? <Table/>
      : <div className="card"><div className="empty">Nothing has come in yet. Once the address is live, forwarded emails show up here.</div></div>}
    {standalone && rows && rows.length>=limit &&
      <button className="btn sm" style={{marginTop:10}} onClick={()=>setLimit(limit+40)}>Show older</button>}
  </>;
}

function Settings({me,setMe,showToast,isMgr}){
  const set = async (patch) => {
    const {error} = await sb.from("profiles").update(patch).eq("id",me.id);
    if(error){ showToast(error.message); return; }
    setMe(prev=>({...prev,...patch})); showToast("Saved");
  };
  const Toggle = ({on,onChange,title,sub}) => <div className="person" style={{cursor:"default"}}>
    <div style={{paddingRight:12}}><b>{title}</b><div style={{fontSize:13,color:"var(--muted)"}}>{sub}</div></div>
    <button className="btn sm" onClick={()=>onChange(!on)}>{on?"On":"Off"}</button>
  </div>;
  return <>
    <div className="h"><h2>Settings</h2><span className="sub">{me.full_name}</span></div>
    <div className="card">
      <Toggle on={me.notify_on_assign} onChange={v=>set({notify_on_assign:v})}
        title="Email me when something is assigned to me"
        sub="Sent right away, with everything you need to start and a one-tap Got it button."/>
      <Toggle on={me.notify_email} onChange={v=>set({notify_email:v})}
        title="Remind me about my tasks"
        sub="A note the day before something is due, and a check-in if a task due soon has gone quiet. Three buttons, one tap, no sign-in."/>
      {isMgr && <Toggle on={me.notify_daily_digest} onChange={v=>set({notify_daily_digest:v})}
        title="Weekday morning digest"
        sub="What needs your decision, what's ready for review, what's overdue, and which recurring tasks have stalled. No email on a quiet day."/>}
    </div>
    <div className="note" style={{marginTop:10}}>Emails go out on weekday mornings. Turning this off doesn't change anything in the app — you'll still see everything when you open it.</div>
  </>;
}

function WhatsNew({onBack}){
  return <>
    <div className="h"><h2>What's new</h2>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <span className="sub">You're on v{APP_VERSION}</span>
        <button className="btn sm" onClick={onBack}>Back</button>
      </div></div>
    {CHANGELOG.map(c=><div className="card" key={c.v} style={{padding:14,marginBottom:10}}>
      <b>v{c.v}</b> <span style={{color:"var(--muted)",fontSize:13}}>· {c.d}</span>
      <ul style={{margin:"8px 0 0",paddingLeft:20}}>{c.items.map((i,k)=><li key={k}>{i}</li>)}</ul>
    </div>)}
  </>;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
