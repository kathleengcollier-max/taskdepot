// ---------- helpers ----------
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtDate = (iso) => { if(!iso) return "—"; const d = new Date(iso+"T00:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const fmtWhen = (ts) => new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const hoursSince = (ts) => (Date.now() - new Date(ts)) / 3600000;
// Comment bodies are plain text with **bold** allowed. Split on the marker rather
// than injecting HTML, so nothing a person types can turn into markup.
function richText(text){
  return String(text ?? "").split("\n").map((line,li)=>
    <React.Fragment key={li}>
      {li>0 && <br/>}
      {line.split(/(\*\*[^*]+\*\*)/g).map((part,i)=>
        part.startsWith("**") && part.endsWith("**") && part.length>4
          ? <b key={i}>{part.slice(2,-2)}</b>
          : <React.Fragment key={i}>{part}</React.Fragment>)}
    </React.Fragment>);
}

const nameOf = (people, id) => (people.find(p=>p.id===id)||{}).full_name || "Unassigned";
// The single answer to "whose task is this?" — an account, somebody invited but not
// signed up, or genuinely nobody. Worth having in one place: nameOf() returns the
// string "Unassigned" for a missing id, which is truthy, so the obvious-looking
// `nameOf(people, t.assignee_id) || t.assignee_email` never reaches the email and
// quietly labels every invited person's work as unassigned.
const ownerName = (people, t, opts) => {
  if(!t) return "Unassigned";
  if(t.assignee_id) return nameOf(people, t.assignee_id);
  if(t.assignee_email){
    const hit = (INVITEES||[]).find(i=>String(i.email).toLowerCase()===String(t.assignee_email).toLowerCase());
    const name = (hit && hit.full_name) || t.assignee_email;
    return (opts && opts.plain) ? name : `${name} (not signed up yet)`;
  }
  return "Unassigned";
};

// Why does this task need attention? Returns {why, tone} or null.
function attention(t, today) {
  if (CLOSED(t.status)) return null;
  const due = t.due_date;
  const overdue = due && due < today ? daysBetween(due, today) : 0;
  const stale = hoursSince(t.last_update_at) / 24;
  // Only the person actually being asked gets told they are being asked. Everyone else
  // falls through to the plain facts below — overdue, stuck — or to nothing at all.
  const asked = ASKING_ANY(t) && ME && ASKEE(t) === ME.id;
  if (asked && t.need_manager) return {why:"Needs you", tone:"", rank:0, group:"Waiting on a decision from you"};
  if (asked && t.status === "ready_for_review") return {why:"Ready for your review", tone:"navy", rank:1, group:"Ready for your review"};
  if (asked && t.need_help) return {why:"Asked for help", tone:"", rank:1.5, group:"Asked you for help"};
  if (overdue) return {why:`Overdue ${overdue} day${overdue>1?"s":""}`, tone:"", rank:5, group:"Overdue"};
  if (t.status === "waiting" && stale >= 3) return {why:`Waiting on ${t.waiting_on||"someone"} ${Math.floor(stale)} days`, tone:"warn", rank:2, group:"Stuck waiting on someone else"};
  if (due && daysBetween(today, due) <= 1 && stale >= 2) return {why: due===today ? "Due today, no update" : "Due tomorrow, no update", tone:"warn", rank:3, group:"Due now, and gone quiet"};
  return null;
}

// ---------- root ----------
function App(){
  const [session, setSession] = useState(undefined);
  const [me, setMe] = useState(null);
  const [recovery, setRecovery] = useState(false);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub} = sb.auth.onAuthStateChange((e,s)=>{ setSession(s); if(e==="PASSWORD_RECOVERY") setRecovery(true); });
    return ()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{
    if(!session){ setMe(null); return; }
    sb.from("profiles").select("*").eq("id",session.user.id).single().then(({data})=>setMe(data));
  },[session]);
  if (session === undefined) return null;
  if (!session) return <Auth/>;
  if (recovery) return <NewPassword onDone={()=>setRecovery(false)}/>;
  if (!me) return <main><div className="empty">Loading your profile…</div></main>;
  if (!me.active) return <main><div className="auth"><h1>Account inactive</h1><p>Ask your manager to reactivate it.</p><button className="btn" onClick={()=>sb.auth.signOut()}>Sign out</button></div></main>;
  return <Shell me={me} setMe={setMe}/>;
}

function Auth(){
  const [mode,setMode] = useState("in"); // in | up | forgot
  const [f,setF] = useState({name:"",email:"",password:""});
  const [err,setErr] = useState(""); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState("");
  const go = async () => {
    setErr(""); setBusy(true);
    try{
      if(mode==="forgot"){ const {error} = await sb.auth.resetPasswordForEmail(f.email,{redirectTo:window.location.origin+window.location.pathname}); if(error) throw error; setMsg("If that email has an account, a reset link is on its way. Tap it on this device to set a new password."); }
      else if(mode==="in"){ const {error} = await sb.auth.signInWithPassword({email:f.email,password:f.password}); if(error) throw error; }
      else { const {data,error} = await sb.auth.signUp({email:f.email,password:f.password,options:{data:{full_name:f.name}}}); if(error) throw error;
             if(!data.session) setMsg("Account created. Check your email to confirm, then sign in."); }
    }catch(e){
      const m = String(e.message||e);
      setErr(/not approved|Database error saving new user/i.test(m)
        ? "That email address isn't approved for this app. Use your company email, or ask Kathleen to approve the address you're using."
        : m);
    } finally{ setBusy(false); }
  };
  return <main><div className="auth">
    <div className="brand" style={{color:"var(--navy)",marginBottom:14}}><i/>{APP_NAME}<span style={{background:"#eef2fa",color:"var(--muted)",fontSize:11,fontWeight:600,padding:"2px 7px",borderRadius:10,marginLeft:4}}>v{APP_VERSION}</span></div>
    <h1>{mode==="in"?"Sign in":mode==="up"?"Create your account":"Reset your password"}</h1>
    <p>{mode==="in"?"Where work gets handed off, not dropped.":mode==="up"?"Use your work email. Your manager sets your role after you join.":"Enter the email you signed up with."}</p>
    <div className="form">
      {mode==="up" && <label>Full name<input value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></label>}
      <label>Email<input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></label>
      {mode!=="forgot" && <label>Password<input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} onKeyDown={e=>e.key==="Enter"&&go()}/></label>}
      {err && <div className="err">{err}</div>}
      {msg && <div className="note">{msg}</div>}
      <button className="btn p" disabled={busy} onClick={go}>{mode==="in"?"Sign in":mode==="up"?"Create account":"Send reset link"}</button>
      <button className="btn q" onClick={()=>{setMode(mode==="in"?"up":"in");setErr("");setMsg("");}}>{mode==="in"?"New here? Create an account":"Back to sign in"}</button>
      {mode==="in" && <button className="btn q" onClick={()=>{setMode("forgot");setErr("");setMsg("");}}>Forgot your password?</button>}
    </div>
  </div></main>;
}

function NewPassword({onDone}){
  const [pw,setPw]=useState(""); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const go = async ()=>{ setBusy(true); setErr(""); const {error} = await sb.auth.updateUser({password:pw}); setBusy(false); if(error) setErr(error.message); else onDone(); };
  return <main><div className="auth"><h1>Set a new password</h1><p>At least 6 characters.</p>
    <div className="form"><label>New password<input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/></label>
    {err && <div className="err">{err}</div>}<button className="btn p" disabled={busy||pw.length<6} onClick={go}>Save password</button></div></div></main>;
}

// ---------- shell: loads data, routes by role ----------
function Shell({me,setMe}){
  const isMgr = me.role === "manager" || me.role === "owner";
  const isOwner = me.role === "owner";
  const [view,setView] = useState(isMgr?"home":"myday");
  const [people,setPeople] = useState([]);
  const [tasks,setTasks] = useState([]);
  const [open,setOpenId] = useState(null);     // task id in the drawer
  const [openList,setOpenList] = useState([]); // the ids it was opened from, for the arrows
  const setOpen = useCallback((id, list) => {
    setOpenId(id);
    if(Array.isArray(list)) setOpenList(list.filter(Boolean));
  },[]);
  // a helper each list uses so the arrows know the running order
  const opener = useCallback((rows) => {
    const ids = (rows||[]).map(r=>r && (r.id || r.task_id)).filter(Boolean);
    return (id) => setOpen(id, ids);
  },[setOpen]);
  const [assign,setAssign] = useState(null); // {parent} when open
  const [idea,setIdea] = useState(false);    // the idea board, one click from any screen
  const [toast,setToast] = useState(null);
  const today = todayISO();

  const [invitees,setInvitees] = useState([]);
  // ---- loading, written so a bad read can never look like an empty account ----
  // Nothing in this app writes a whole-state snapshot, so a failed read cannot
  // overwrite the database. What it CAN do is blank every list on screen, which
  // looks identical to losing everything. So: retry with backoff, treat a
  // suddenly-empty read as suspect once real data has been seen, and on total
  // failure keep what is already on screen rather than replacing it with nothing.
  const [loadState,setLoadState] = useState({ok:true});
  const loadedReal = useRef(false);
  const load = useCallback(async ()=>{
    const attempt = async () => {
      const [pr,tr,inv,lc,wa,wb,sc] = await Promise.all([
        sb.from("profiles").select("*").order("full_name"),
        sb.from("tasks").select("*").order("due_date",{ascending:true,nullsFirst:false}),
        sb.rpc("waiting_on_signup"),
        sb.rpc("link_counts"),
        sb.rpc("my_watched"),
        sb.rpc("watchers_by_task"),
        sb.rpc("step_counts")
      ]);
      if(pr.error || tr.error) throw new Error((tr.error||pr.error).message || "read failed");
      return {p:pr.data||[], t:tr.data||[], inv:(inv&&inv.data)||[], lc:(lc&&lc.data)||{}, wa:(wa&&wa.data)||[], wb:(wb&&wb.data)||{}, sc:(sc&&sc.data)||{}};
    };
    const waits = [0, 300, 900, 1800];
    let why = null;
    for(let i=0;i<waits.length;i++){
      if(waits[i]) await new Promise(r=>setTimeout(r, waits[i]));
      try{
        const got = await attempt();
        // an empty answer, when this session has already seen real data, is far more
        // likely a hiccup than a team that deleted everything in the last minute
        if(got.t.length===0 && loadedReal.current && i < waits.length-1){ why = "came back empty"; continue; }
        setPeople(got.p); setTasks(got.t); setInvitees(got.inv); LINK_COUNTS = got.lc; WATCHED = new Set(got.wa||[]);
        WATCHERS = got.wb || {}; STEP_COUNTS = got.sc || {};
        if(got.t.length>0) loadedReal.current = true;
        setLoadState({ok:true});
        return true;
      }catch(e){ why = e.message || String(e); }
    }
    setLoadState({ok:false, why});     // keep the last good data on screen
    return false;
  },[]);
  useEffect(()=>{ load(); const id=setInterval(load,60000); return ()=>clearInterval(id); },[load]);

  const showToast = (text, undo) => { setToast({text,undo}); setTimeout(()=>setToast(null), undo?8000:3000); };

  const update = async (id, patch) => {
    const {error} = await sb.from("tasks").update(patch).eq("id",id);
    if(error){ showToast("Couldn't save: "+error.message); return false; }
    await load(); return true;
  };
  const trash = async (t) => {
    if(await update(t.id,{deleted_at:new Date().toISOString()})) {
      setOpen(null);
      showToast(`"${t.title}" moved to Trash`, ()=>update(t.id,{deleted_at:null}));
    }
  };

  const live = tasks.filter(t=>!t.deleted_at); ALL_TASKS = live; INVITEES = invitees; ME = me; PEOPLE = people;
  // Search keeps its own results, so it needs to know what has been trashed since
  const trashedIds = tasks.filter(t=>t.deleted_at).map(t=>t.id);
  const openTask = tasks.find(t=>t.id===open);
  // a mention that turns out to need doing: open the assign form with its wording,
  // aimed at the person whose 1:1 it came from, and link the two once it saves
  const startTaskFromMention = useCallback((mention, personId) => {
    setAssign({ parent:null, prefill:{ title: mention.body, assignee_id: personId }, fromMention: mention.id });
  },[]);
  const ctx = {me,people,tasks:live,today,update,trash,load,setOpen,opener,showToast,isMgr,isOwner,invitees,openTaskId:open,startTaskFromMention};

  const attnCount = isMgr ? live.filter(t=>attention(t,today) && (DELEGATEDBYME(t) || ASKEDBYME(t) || ASKING(t) || WATCHING(t) || t.assignee_id===me.id)).length : 0;
  const freshDone = isMgr ? live.filter(t=>CLOSED(t.status) && t.assignee_id!==me.id && !t.seen_at
      && new Date(t.status==="skipped"?t.updated_at:(t.completed_at||t.updated_at)) > new Date(me.completions_seen_at||0)).length : 0;
  const nav = isMgr
    ? [["home","Home",attnCount],["week","Week ahead"],["all","All tasks"],["repeating","Repeating"],["finished","Finished",freshDone],["reports","Reports"],["ones","1:1s"],["people","People"],["intake","Email intake"],["settings","Settings"],["trash","Trash"]]
    : [["myday","My day"],["week","Week ahead"],["all","All my tasks"],["ones","1:1s"],["settings","Settings"]];

  return <>
    <header className="top"><div className="bar">
      <div className="brand"><i/>{APP_NAME}<button onClick={()=>setView("new")} title="What's new" style={{background:"rgba(255,255,255,.16)",border:0,color:"#dbe3f5",font:"inherit",fontSize:11,fontWeight:600,padding:"2px 7px",borderRadius:10,marginLeft:2,cursor:"pointer",letterSpacing:".2px"}}>v{APP_VERSION}</button></div>
      <nav className="nav">{nav.map(([k,l,n])=><button key={k} className={view===k?"on":""} onClick={()=>setView(k)}>{l}{n?<span className="pin">{n}</span>:null}</button>)}</nav>
      <div className="who"><span>{me.full_name}</span><button onClick={()=>sb.auth.signOut()}>Sign out</button></div>
    </div></header>
    <main>
      {!loadState.ok && <div className="note" style={{marginBottom:10,background:"#fdecea",borderLeft:"3px solid var(--red)"}}>
        <b>Couldn't reach the server, so this is the last data that loaded.</b> Nothing has been lost — Task Depot never
        writes your whole list back, so a bad connection can't overwrite anything. It keeps retrying; don't trust the
        numbers on screen until this clears.
        {loadState.why ? <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>({loadState.why})</div> : null}
        <div style={{marginTop:8}}><button className="btn sm" onClick={()=>load()}>Try now</button></div>
      </div>}
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginBottom:-8}}>
        <button className="btn idea" title="Tell Kathleen what would make Task Depot better"
          onClick={()=>setIdea(true)}>{"\ud83d\udca1"} Idea</button>
        <button className="btn p" onClick={()=>setAssign({parent:null})}>{isMgr?"+ Assign":"+ Add task"}</button>
      </div>
      {view==="home" && <ManagerHome {...ctx}/>}
      {view==="people" && isOwner && <People {...ctx} setMe={setMe}/>}
      {view==="ones" && <OneOnOnes {...ctx}/>}
      {view==="all" && <AllTasks {...ctx}/>}
      {view==="trash" && <Trash {...ctx} trashed={tasks.filter(t=>t.deleted_at)}/>}
      {view==="myday" && <MyDay {...ctx}/>}
      {view==="week" && <WeekAhead {...ctx}/>}
      {view==="repeating" && <Repeating {...ctx}/>}
      {view==="finished" && isMgr && <Finished {...ctx} setMe={setMe}/>}
      {view==="reports" && isMgr && <Reports {...ctx}/>}
      {view==="intake" && isMgr && <IntakeLog showToast={showToast} standalone={true} setOpen={setOpen} allTasks={tasks} update={update} people={people}/>}
      {view==="settings" && <Settings me={me} setMe={setMe} showToast={showToast} isMgr={isMgr}/>}
      {view==="new" && <WhatsNew onBack={()=>setView(isMgr?"home":"myday")}/>}
    </main>
    {openTask && <TaskModal {...ctx} task={openTask} queueIds={openList} onClose={()=>setOpenId(null)} addSub={()=>setAssign({parent:openTask})}/>}
    {assign && <AssignModal {...ctx} parent={assign.parent} prefill={assign.prefill} fromMention={assign.fromMention} onClose={()=>setAssign(null)}/>}
    {idea && <IdeaModal me={me} showToast={showToast} onClose={()=>setIdea(false)}/>}
    {toast && <div className="toast">{toast.text}{toast.undo && <button onClick={()=>{toast.undo();setToast(null);}}>Undo</button>}</div>}
  </>;
}

// Collapse a list so each recurring series shows as one line (the oldest open instance)
function groupSeries(list){
  const out=[], seen={};
  for(const t of list){
    if(!t.series_id){ out.push({t,extra:0}); continue; }
    if(seen[t.series_id]!==undefined){ out[seen[t.series_id]].extra++; continue; }
    seen[t.series_id]=out.length; out.push({t,extra:0});
  }
  return out;
}

          ? <><span className="pill origin">{t.created_by===(ME&&ME.id) ? "You assigned" : "From "+nameOf(people,t.created_by).split(" ")[0]}</span>{" "}</>
          : t.asked_by
            ? <><span className="pill origin">{ASKEDBYME(t) ? "You asked for it" : nameOf(people,t.asked_by).split(" ")[0]+" asked for it"}</span>{" "}</>
          : t.assignee_id
            ? <><span className="pill origin own">{t.assignee_id===(ME&&ME.id) ? "Your own" : "Their own"}</span>{" "}</>
            : null}
        {t.priority==="high" && <span className="pill high">High</span>}{" "}
        {t.due_date ? `Due ${fmtDate(t.due_date)}` : "No due date"}
        {t.status==="waiting" && t.waiting_on ? ` · waiting on ${t.waiting_on}` : ""}
        {t.context ? ` · ${t.context}` : ""}
        {t.parent_id ? ` · ↳ ${(allTasks.find(p=>p.id===t.parent_id)||{}).title||"subtask"}` : ""}
        {t.recur_rule ? ` · ${recurLabel(t).toLowerCase()}` : ""}
        {extra>0 ? ` · ${extra+1} open, oldest due ${fmtDate(t.due_date)}` : ""}

      </div>
    </div>
    {a && <div className={"why "+a.tone}>{a.why}</div>}
  </div>;
}

// A section heading that folds. The choice is remembered per browser, so a group you
// never act on stays shut and the ones you work from stay open.
function Fold({label,count,storeKey,defaultOpen=true,edge,children}){
  const key = "td_fold_" + (storeKey||label);
  const [open,setOpen] = useState(()=>{
    try{ const v = localStorage.getItem(key); return v===null ? defaultOpen : v==="1"; }
    catch(e){ return defaultOpen; }
  });
  const toggle = () => { const n = !open; setOpen(n); try{ localStorage.setItem(key, n?"1":"0"); }catch(e){} };
  return <>
    <div className="section-title fold" onClick={toggle} role="button" tabIndex={0}
         aria-expanded={open}
         onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } }}>
      <span className="caret">{open ? "\u25BE" : "\u25B8"}</span>{label}
      <span className="n">{count}</span>
      {!open && <span className="hint">show</span>}
    </div>
    {open ? <div className={edge||""}>{children}</div> : null}
  </>;
}

// ---------- manager home ----------
function ManagerHome(ctx){
  const {tasks,today,people} = ctx;
  const [filter,setFilter] = useState(null);
  const [showTheirs,setShowTheirs] = useState(false);
  const allFlagged = tasks.filter(t=>t.assignee_id!==ctx.me.id).map(t=>({t,a:attention(t,today)})).filter(x=>x.a)
    .sort((x,y)=>x.a.rank-y.a.rank || (x.t.due_date||"9").localeCompare(y.t.due_date||"9"));
  // You press the eye so a task comes to you. So a watched task belongs under Watching
  // and nowhere else \u2014 unless it is actually asking you for something, which outranks the eye.
  const pulled = (x) => WATCHING(x.t) && !ASKING(x.t);
  const yours = (t) => DELEGATEDBYME(t) || ASKEDBYME(t) || ASKING(t) || WATCHING(t);
  const flagged = allFlagged.filter(x=>yours(x.t) && !pulled(x));
  const theirOwn = allFlagged.filter(x=>!yours(x.t));
  const openT = tasks.filter(t=>!CLOSED(t.status) && t.assignee_id!==ctx.me.id && (DELEGATEDBYME(t) || ASKEDBYME(t)));
  const week = new Date(); week.setDate(week.getDate()+7); const weekISO = week.toISOString().slice(0,10);
  const buckets = {
    track: openT.filter(t=>!attention(t,today) && t.status!=="waiting" && (t.assignee_id||t.assignee_email) && t.due_date),
    waiting: openT.filter(t=>t.status==="waiting"),
    week: openT.filter(t=>t.due_date && t.due_date>=today && t.due_date<=weekISO),
    overdue: openT.filter(t=>t.due_date && t.due_date<today),
  };
  const shown = filter ? buckets[filter] : null;
  const mineToDo = tasks.filter(t=>!CLOSED(t.status) && t.assignee_id===ctx.me.id);
  const owned = (t) => t.assignee_id || t.assignee_email;
  const sorting = tasks.filter(t=>!CLOSED(t.status) && (!owned(t) || !t.due_date));
  return <>
    {mineToDo.length>0 && <><div className="h"><h2>Assigned to you</h2><span className="sub">{mineToDo.length} — things your team handed up</span></div>
      <TaskTable list={mineToDo} people={people} today={today} setOpen={ctx.opener(mineToDo)} isMgr={false}
        cols={["title","status","origin","due","updated","why"]}
        why={t=>attention(t,today)||(t.created_by!==ctx.me.id?{why:`${nameOf(people,t.created_by)} is waiting on you`,tone:"warn",rank:5}:null)}/></>}
    {theirOwn.length>0 && <div className="note" style={{marginTop:10,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{flex:1}}>{theirOwn.length} task{theirOwn.length===1?"":"s"} your team set for themselves {theirOwn.length===1?"is":"are"} overdue or stuck. Their list, not yours — but here if you want it.</span>
      <button className="btn sm" onClick={()=>setShowTheirs(!showTheirs)}>{showTheirs?"Hide":"Show"}</button>
    </div>}
    {showTheirs && theirOwn.length>0 && <TaskTable list={theirOwn.map(x=>x.t)} people={people} today={today}
      setOpen={ctx.opener(theirOwn.map(x=>x.t))} cols={["who","title","status","due","why"]}/>}
    <div className="h"><h2>Needs attention</h2><span className="sub">{flagged.length ? `${flagged.length} item${flagged.length>1?"s":""}` : "Nothing — enjoy it"}</span></div>
    {flagged.length
      ? (() => {
          const groups = Object.entries(flagged.reduce((acc,x)=>{
              const g = x.a.group || "Needs a look";
              (acc[g] = acc[g] || []).push(x); return acc;
            },{})).sort((a,b)=>a[1][0].a.rank - b[1][0].a.rank);
          const block = ([label,items]) =>
            <Fold key={label} label={label} count={items.length} edge={GROUP_EDGE[label]||"edge-navy"}>
              <TaskTable list={groupSeries(items.map(x=>x.t)).map(g=>g.t)} people={people} today={today}
                setOpen={ctx.opener(flagged.map(x=>x.t))} cols={["who","title","status","due","updated","why"]}/>
            </Fold>;
          // anything you are watching that no other group has already claimed, so a
          // watched task that needs a decision stays under the decision heading
          const claimed = new Set(flagged.map(x=>x.t.id));
          const watchlist = tasks.filter(t=>!CLOSED(t.status) && WATCHED.has(t.id)
                                            && t.assignee_id!==ctx.me.id && !claimed.has(t.id))
            .sort((a,b)=>(a.due_date||"9").localeCompare(b.due_date||"9"));
          const watchBlock = watchlist.length
            ? <Fold key="__watching" label="Watching" count={watchlist.length} storeKey="watching" edge="edge-navy">
                <TaskTable list={watchlist} people={people} today={today}
                  setOpen={ctx.opener(watchlist)} cols={["who","title","status","due","updated","why"]}
                  why={t=>attention(t,today)}/>
              </Fold>
            : null;
          const at = groups.findIndex(([label])=>label==="Overdue");
          const out = groups.map(block);
          if(watchBlock) out.splice(at<0 ? out.length : at, 0, watchBlock);
          return out;
        })()
      : <div className="card"><div className="empty">
          Everything you've delegated is on track. The other {openT.length} open tasks are fine without you.
        </div></div>}
    {sorting.length>0 && <><div className="h"><h2>Needs sorting</h2><span className="sub">{sorting.length} without an owner or a date</span></div>
      <TaskTable list={sorting} people={people} today={today} setOpen={ctx.opener(sorting)}
        cols={["who","title","status","due","why"]}
        why={t=>({why:!owned(t)&&!t.due_date?"No owner, no date":!owned(t)?"No owner":"No due date",tone:"warn",rank:5})}/></>}
    <div className="counts">
      {[["track","On track"],["waiting","Waiting"],["week","Due this week"],["overdue","Overdue"]].map(([k,l])=>
        <button key={k} className={filter===k?"on":""} onClick={()=>setFilter(filter===k?null:k)}><b>{buckets[k].length}</b><span>{l}</span></button>)}
    </div>
    {shown && <TaskTable list={groupSeries(shown).map(g=>g.t)} people={people} today={today}
      setOpen={ctx.opener(shown)} cols={["who","title","status","due","updated"]} empty="Nothing here."/>}
  </>;
}

    if(error){ showToast(error.message); return; }

  const roster = people.filter(p=>p.id!==me.id && (isOwner || p.manager_id===me.id));

      const mine = tasks.filter(t=>t.assignee_id===p.id && !CLOSED(t.status));
      const flag = mine.filter(t=>attention(t,today)).length;
      return <div className="person" key={p.id} style={{cursor:"default",flexWrap:"wrap",gap:10}}>
        <div style={{flex:"1 1 200px"}}>
          <b>{p.full_name}</b>{!p.active && <span className="pill" style={{marginLeft:6}}>inactive</span>}
          <div style={{fontSize:13,color:"var(--muted)"}}>{p.email}</div>
          <div style={{fontSize:13,color:"var(--muted)"}}>

          </div>
          <div className="stats" style={{marginTop:4}}>

            </select>
