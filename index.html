      case "need_help_on": return `${who} asked for help`;
      case "need_help_off": return `${who} cleared the help flag`;
      case "trashed": return `${who} moved to Trash`;
      case "returned": return `${who} returned it to Kathleen's Inbox${h.to_value?` — ${h.to_value}`:""}`;
      case "restored": return `${who} restored from Trash`;
      case "title": return `${who} renamed: "${h.from_value}" → "${h.to_value}"`;
      default: return `${who}: ${h.action}`;
    }
  };

  const tone = toneOf(t.status);
  return <div className="modalbg" onClick={onClose}><div className="modal detail"
      style={{"--tab":tone.fg, "--tabwash":tone.bg}} onClick={e=>e.stopPropagation()}>
    <div className="spine">
      <span>{STATUS[t.status]}</span>
      <span style={{display:"flex",alignItems:"center",gap:10}}>
        <span className="spine-sub">{ownerName(people,t,{plain:true})}</span>
        {isMgr && (() => {
          const others = otherWatchers(t);
          const also = others.length ? watcherNames(others) : "";
          return <button type="button" className={"eye"+(watching?" on":others.length?" others":"")}
            onClick={toggleWatch}
            title={watching
              ? (others.length ? `Watching this one \u2014 so ${also} ${others.length>1?"are":"is"} too. Press to stop`
                               : "Watching this one \u2014 press to stop")
              : (others.length ? `${also} ${others.length>1?"are":"is"} watching this. Press to watch it too`
                               : "Keep an eye on this one: it reaches your Home and your 1:1 even though it is their own task")}>
            <Eye on={watching || others.length>0} size={17}/></button>;
        })()}
      </span>
    </div>
    {queue.length>1 && at>=0 && <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
      <button className="btn sm" disabled={at<=0} onClick={()=>go(-1)} aria-label="Previous task">←</button>
      <span style={{fontSize:13,color:"var(--muted)"}}>{at+1} of {queue.length}</span>
      <button className="btn sm" disabled={at>=queue.length-1} onClick={()=>go(1)} aria-label="Next task">→</button>
    </div>}
    <h2>{t.title}</h2>
    {t.ref ? <div className="refline">
      <button className="refchip" title={`Copy "#TD${t.ref}" — put it at the front of a subject line to file an email here`}
        onClick={()=>{ try{ navigator.clipboard.writeText("#TD"+t.ref); showToast(`Copied #TD${t.ref} \u2014 put it at the front of a subject line and forward the email to tasks@`); }
                       catch(e){ showToast("Couldn't copy \u2014 the number is #TD"+t.ref); } }}>
        #{t.ref}</button>
      <span className="meta">Forward an email to tasks@ with #TD{t.ref} at the front of the subject and it lands here. The TD keeps it apart from a Brain Dump number.</span>
    </div> : null}
    {watchersOf(t).length>0 && <div className="note" style={{marginBottom:10,display:"flex",gap:8,alignItems:"center"}}>
      <span style={{color:"var(--navy)",display:"inline-flex",flex:"0 0 auto"}}><Eye on={true} size={16}/></span>
      <span>{(() => {
        const ws = watchersOf(t), mine = ws.some(w=>w.id===me.id), others = ws.filter(w=>w.id!==me.id);
        if(mine && !others.length) return "You are watching this task. Whoever can see it can see that.";
        if(mine) return `You and ${watcherNames(others)} are watching this task.`;
        return `${watcherNames(others)} ${others.length>1?"are":"is"} watching this task.`;
      })()}</span>
    </div>}
    <div style={{marginBottom:10}}>
      <span className={"pill "+t.status}>{STATUS[t.status]}</span>{" "}
      {t.priority==="high" && <span className="pill high">High priority</span>}{" "}
      {heldCount>1 && <span className="pill shared"
        title={"On this task: " + holders.map(h=>h.who).join(", ")}>
        {heldDone} of {heldCount} done</span>}{" "}
      {t.need_manager && !t.needs_from && <span className="pill high">Needs manager</span>}{" "}
      {t.needs_from && <span className="pill high">Needs {String(nameOf(people,t.needs_from)).split(" ")[0]}</span>}{" "}
      {t.need_help && !t.needs_from && <span className="pill high">Help requested</span>}{" "}
      {t.recur_rule && <span className="pill">{recurLabel(t)}</span>}
    </div>
    {siblings.length>1 && <div className="note" style={{marginBottom:10}}>
      <b>{siblings.length} open</b> in this recurring series — {siblings.map(x=>fmtDate(x.due_date)).join(", ")}.
      {siblings.length>=(t.recur_cap||3) ? " That's the cap, so no new ones are being created until some are closed out." : ""}
    </div>}
    {t.requested_due && <div className="note" style={{marginBottom:10,background:"var(--warn-soft)",borderLeft:"3px solid var(--warn)"}}>
      <b>{nameOf(people,t.requested_by)} asked to move this to {fmtDate(t.requested_due)}</b>
      {t.requested_reason ? <div style={{marginTop:4}}>"{t.requested_reason}"</div> : null}
      {(isMgr || t.created_by===me.id) && <div className="actions" style={{justifyContent:"flex-start",marginTop:8}}>
        <button className="btn p" onClick={()=>answerDate(true)}>Accept {fmtDate(t.requested_due)}</button>
        <button className="btn" onClick={()=>answerDate(false)}>Keep {fmtDate(t.due_date)}</button>
      </div>}
    </div>}
    {dating && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>Ask for a new due date</b><div style={{fontSize:13,color:"var(--muted)"}}>It stays due {fmtDate(t.due_date)} until {nameOf(people,t.created_by)} agrees.</div></div>
      <div className="two">
        <label>New date<input type="date" value={wantDate} onChange={e=>setWantDate(e.target.value)}/></label>
      </div>
      <label>Why<textarea value={wantWhy} onChange={e=>setWantWhy(e.target.value)} placeholder="Waiting on the vendor to confirm pricing."/></label>
      <div className="actions"><button className="btn" onClick={()=>{setDating(false);setWantDate("");setWantWhy("");}}>Cancel</button>
        <button className="btn p" onClick={askDate}>Send the request</button></div>
    </div>}
    {parent && <div className="note" style={{marginBottom:10}}>Part of <a href="#" onClick={e=>{e.preventDefault();setOpen(parent.id);}}>{parent.title}</a></div>}

    {asking && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>What do you need?</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>This goes straight to your manager by email, along with the task. Leave it blank if you just need them to take a look.</div></div>
      <label>Your message<textarea autoFocus value={askNote} onChange={e=>setAskNote(e.target.value)} placeholder="Suan has the file locked and I can't pull the numbers — can you get me access, or should I push this to Thursday?"/></label>
      <div className="actions"><button className="btn" onClick={()=>{setAsking(false);setAskNote("");}}>Cancel</button>
        <button className="btn r" onClick={doAsk}>Send to your manager</button></div>
    </div>}
    {flagging && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>What do you want to go through?</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>
          Nothing is emailed and the task stays where it is {"\u2014"} it just leads your next
          1:1 with {ownerName(people,t,{plain:true})}. Leave it blank if you only want it on the agenda.</div></div>
      <label>Your note<textarea autoFocus value={flagNote} onChange={e=>setFlagNote(e.target.value)}
        placeholder="Want to agree the wording before this goes out."/></label>
      <div className="actions"><button className="btn" onClick={()=>{setFlagging(false);setFlagNote("");}}>Cancel</button>
        <button className="btn r" onClick={doFlagMine}>Put it on our agenda</button></div>
    </div>}
    {finishing && <div className="form card edged edge-warn" style={{padding:14,marginBottom:12}}>
      {openSteps.length>0 && <>
        <b>{openSteps.length} of {steps.length} step{steps.length>1?"s":""} {openSteps.length>1?"are":"is"} still unticked.</b>
        <ul style={{margin:"6px 0 8px 18px",padding:0,color:"var(--muted)",fontSize:13.5}}>
          {openSteps.slice(0,4).map(x=><li key={x.id}>{x.body}</li>)}
          {openSteps.length>4 && <li>{"\u2026 and "}{openSteps.length-4} more</li>}
        </ul>
        <label className="finishopt">
          <input type="checkbox" checked={finishing.tick}
            onChange={e=>setFinishing({...finishing, tick:e.target.checked})}/>
          <span>Tick them all off as well</span>
        </label>
      </>}
      {finishing.shared && <>
        <b style={{display:"block",marginTop:openSteps.length?12:0}}>
          {othersOpen.length===0
            ? "You are the last one on this \u2014 ticking yours finishes the task."
            : `${othersOpen.length===1 ? "One other person" : othersOpen.length+" other people"} ${othersOpen.length===1?"is":"are"} still on this task.`}</b>
        <div className="meta" style={{margin:"3px 0 6px"}}>
          {othersOpen.length===0
            ? "Everyone else has already ticked theirs off."
            : <>This ticks your line only. The task closes on its own once the last person ticks theirs
               {"\u2014"} still waiting on {othersOpen.map(h=>h.who).join(", ")}.</>}
        </div>
      </>}
      <div className="actions" style={{marginTop:10}}>
        <button className="btn" onClick={()=>setFinishing(null)}>Cancel</button>
        <button className="btn p" onClick={()=>finishNow()}>
          {finishing.shared && othersOpen.length ? "Tick mine off" : "Finish"}</button>
      </div>
    </div>}
    {skipping && <div className="form card" style={{padding:14,marginBottom:12}}>
      <label>Why are you skipping this one?<input autoFocus value={skipWhy} onChange={e=>setSkipWhy(e.target.value)} placeholder="Holiday, branch closed, not applicable this month…"/></label>
      <div className="actions"><button className="btn" onClick={()=>setSkipping(false)}>Cancel</button><button className="btn p" onClick={doSkip}>Skip this one</button></div>
    </div>}
    {!upd && !skipping && !asking && !flagging && !finishing && isMgr && t.assignee_id!==me.id
      && !CLOSED(t.status) && <div className="big">
      {/* The same shortcuts the owner gets, minus the two that only make sense as
          theirs. Recording progress for somebody meant opening the whole edit form,
          and there was no way at all to say a task needed you. */}
      <button className="upd" onClick={()=>setUpd({status:t.status==="not_started"?"working":t.status,waiting_on:t.waiting_on,next_action:t.next_action,expected_completion:t.expected_completion||"",note:""})}>Update</button>
      {t.needs_from===me.id
        ? <button className="help" title="Take it off your agenda" onClick={dropMyFlag}>Needs me {"\u2713"}</button>
        : <button className="help" onClick={()=>setFlagging(true)}>Needs me</button>}
    </div>}
    {!upd && !skipping && !asking && !flagging && !finishing && t.assignee_id===me.id && !CLOSED(t.status) && <div className="big">
      <button className="done" onClick={()=>finish({status:"done",need_help:false,need_manager:false},"Marked done")}>Done</button>
      <button className="upd" onClick={()=>setUpd({status:t.status==="not_started"?"working":t.status,waiting_on:t.waiting_on,next_action:t.next_action,expected_completion:t.expected_completion||"",note:""})}>Update</button>
      {HASAUDIENCE(t) && t.status!=="ready_for_review" &&
        <button className="rev" title="Hand it back for a check before it counts as done"
          onClick={()=>quick({status:"ready_for_review"},"Sent for review")}>Ready for review</button>}
      <button className="help" onClick={()=>setAsking(true)}>Need help</button>
    </div>}
    {upd && <div className="form card" style={{padding:14,marginBottom:12}}>
      {/* Status lives here and only here. Blocked was this form with Waiting pre-picked,
          which is a button for a dropdown option. Done and Skipped stay off the list:
          both have consequences — the unticked-steps prompt, the question about everyone
          else on the task, a skip reason, an email — that a dropdown would walk past. */}
      <div className="two">
        <label>Status<select autoFocus value={upd.status} onChange={e=>setUpd({...upd,status:e.target.value})}>
          <option value="not_started">Not started</option>
          <option value="working">Working</option>
          <option value="waiting">Waiting</option>
          {HASAUDIENCE(t) && <option value="ready_for_review">Ready for review</option>}
        </select></label>
        <label>Expected completion<input type="date" value={upd.expected_completion} onChange={e=>setUpd({...upd,expected_completion:e.target.value})}/></label>
      </div>
      {upd.status==="waiting" && <label>Waiting on<input value={upd.waiting_on} onChange={e=>setUpd({...upd,waiting_on:e.target.value})} placeholder="Vendor, customer, a coworker, Kathleen…"/></label>}
      <label>Next action<input value={upd.next_action} onChange={e=>setUpd({...upd,next_action:e.target.value})} placeholder="Call Goodman back Thursday"/></label>
      <label>Add a note (optional)<textarea value={upd.note} onChange={e=>setUpd({...upd,note:e.target.value})}/></label>
      <div className="actions"><button className="btn" onClick={()=>setUpd(null)}>Cancel</button>
        <button className="btn p" onClick={async()=>{
          const ok = await update(t.id,{status:upd.status,waiting_on:upd.status==="waiting"?upd.waiting_on:"",next_action:upd.next_action,expected_completion:upd.expected_completion||null});
          if(ok){ if(upd.note.trim()) await sb.from("task_comments").insert({task_id:t.id,author_id:me.id,body:upd.note,is_private:false}); setUpd(null); refresh(); showToast("Updated"); }
        }}>Save update</button></div>
    </div>}

    {replying && <div className="form card" style={{padding:14,marginBottom:12}}>
      <div><b>Reply to {ownerName(people,t,{plain:true})}</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>What you write is added to the task's comments and emailed to them. Leave it blank and they just get a note that you've looked at it.</div></div>
      <label>Your reply<textarea autoFocus value={replyNote} onChange={e=>setReplyNote(e.target.value)} placeholder="Call Suan directly, she has the unlock code. Push it to Thursday if you need to."/></label>
      <div className="actions"><button className="btn" onClick={()=>{setReplying(false);setReplyNote("");}}>Cancel</button>
        <button className="btn p" onClick={doReply}>Send &amp; clear flag</button></div>
    </div>}
    {returning && <div className="form card" style={{padding:14,marginBottom:12,borderColor:"#c7d7f5",background:"#f7f9ff"}}>
      <div><b>Return this to Kathleen</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>It goes back to Kathleen's Inbox with your finished steps, comments and files. It closes here once it's with her.</div></div>
      <label>Why it's coming back (optional)<textarea autoFocus value={returnWhy} onChange={e=>setReturnWhy(e.target.value)} placeholder="Needs her sign-off before I can go further / turned out to be hers / vendor wants the owner…"/></label>
      <div className="actions"><button className="btn" disabled={returnBusy} onClick={()=>{setReturning(false);setReturnWhy("");}}>Cancel</button>
        <button className="btn p" disabled={returnBusy} onClick={doReturn}>{returnBusy?"Sending back…":"Return to Kathleen"}</button></div>
    </div>}
    {sending && <div className="form card" style={{padding:14,marginBottom:12,borderColor:"#cfc3f0",background:"#faf8ff"}}>
      <div><b>Send this to your Brain Dump inbox</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>It arrives in your Inbox queue with its steps, comments and files, keeping the department it has here. It closes in Task Depot once it is with you — finished, not binned.</div></div>
      <label>Why it is moving (optional)<textarea autoFocus value={sendWhy} onChange={e=>setSendWhy(e.target.value)} placeholder="turned out to be mine / needs my own follow-up / parking it with my own list…"/></label>
      <div className="actions"><button className="btn" disabled={sendBusy} onClick={()=>{setSending(false);setSendWhy("");}}>Cancel</button>
        <button className="btn p bd" disabled={sendBusy} onClick={doSend}>{sendBusy?"Sending…":"Send to my BD Inbox"}</button></div>
    </div>}
    {!joining && hints.length>0 && <div className="note" style={{marginBottom:12,background:"#eef3fd",borderLeft:"3px solid var(--navy)"}}>
      <div style={{fontWeight:600,marginBottom:6,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{flex:1}}>{hints.length===1 ? "This looks like the same work as another task" : `This looks like the same work as ${hints.length} other tasks`}</span>
        {judging && <span style={{fontWeight:400,fontSize:13,color:"var(--muted)"}}>checking a few more…</span>}</div>
      {hints.map(h=><div key={h.id} style={{display:"flex",gap:8,alignItems:"flex-start",flexWrap:"wrap",padding:"5px 0",borderTop:"1px solid #dbe3f5"}}>
        <div style={{flex:"1 1 220px"}}>
          <a href="#" style={{color:"var(--navy)",fontWeight:600,textDecoration:"none"}}
             onClick={(e)=>{e.preventDefault(); ctx.setOpen(h.id);}}>{h.title}</a>
          <div className="meta">{h.who||"Unassigned"}{" · "}{h.due_date?`due ${fmtDate(h.due_date)}`:"no date"}
            {" · "}{STATUS[h.status]}{" · "}<b>{h.why}</b></div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn sm" onClick={()=>linkHint(h.id)}>Link</button>
          {(isMgr || iCreated) && !CLOSED(t.status) &&
            <button className="btn sm" onClick={()=>{setJoining("merge"); setJoinPick([h.id]); setJoinQ("");}}>Merge…</button>}
          <button className="btn sm" onClick={()=>dismissHint(h.id)}>Not related</button>
        </div>
      </div>)}
    </div>}
    {joining && <div className="form card" style={{padding:14,marginBottom:12,borderColor:"#c7d7f5",background:"#f7f9ff"}}>
      <div><b>{joining==="link" ? "Link this to another task" : "Merge another task into this one"}</b>
        <div style={{fontSize:13,color:"var(--muted)"}}>
          {joining==="link"
            ? "Both tasks stay, each showing the other. For different work that belongs to the same job. Tick as many as you like."
            : "For the same work that arrived twice. Its comments, files and steps move onto this task and it goes to Trash — restorable, not destroyed."}
        </div></div>
      <input autoFocus value={joinQ} onChange={e=>setJoinQ(e.target.value)} placeholder="Find the other task, or type its number — 137 or #137"/>
      <div style={{maxHeight:220,overflowY:"auto",border:"1px solid var(--line)",borderRadius:8}}>
        {joinable.length ? joinable.map(x=>{
          const on = joinPick.includes(x.id);
          const hint = hints.find(h=>h.id===x.id);
          return <div key={x.id}
            onClick={()=>setJoinPick(joining==="merge" ? [x.id]
              : on ? joinPick.filter(i=>i!==x.id) : [...joinPick, x.id])}
            style={{padding:"8px 10px",cursor:"pointer",borderTop:"1px solid var(--line)",
                    background:on?"#e7edfb":undefined}}>
            <div style={{fontWeight:on?600:400}}>
              <span style={{color:on?"var(--navy)":"var(--muted)",marginRight:6}}>
                {joining==="link" ? (on?"\u2611":"\u2610") : (on?"\u25c9":"\u25cb")}</span>
              {x.ref ? <span className="refsm">#{x.ref}</span> : null}{x.title}</div>
            <div className="meta">{ownerName(people,x)}
              {" · "}{x.due_date?`due ${fmtDate(x.due_date)}`:"no date"}{" · "}{STATUS[x.status]}
              {hint && <span style={{color:"var(--navy)",fontWeight:600}}> · looks related ({hint.why})</span>}</div>
          </div>; })
          : <div className="empty">{joinRef !== null
              ? `No task #${joinRef} that you can merge into this one \u2014 check the number, or search by words instead.`
              : "Nothing matches."}</div>}
      </div>
      <div className="actions">
        <button className="btn" disabled={joinBusy} onClick={()=>{setJoining(null);setJoinPick([]);setJoinQ("");}}>Cancel</button>
        <button className="btn p" disabled={!joinPick.length||joinBusy} onClick={doJoin}>
          {joinBusy ? "Working…"
            : joining==="link" ? `Link ${joinPick.length||""} task${joinPick.length===1?"":"s"}`
            : "Merge it in"}</button>
      </div>
    </div>}
    {copying && (() => {
      const on = new Set(holders.map(h=>h.profile_id).filter(Boolean));
      const onMail = new Set(holders.map(h=>String(h.email||"").toLowerCase()).filter(Boolean));
      const free = [
        ...people.filter(p=>p.active && !on.has(p.id)).map(p=>({k:p.id, label:p.full_name})),
        ...(INVITEES||[]).filter(i=>!onMail.has(String(i.email).toLowerCase()))
             .map(i=>({k:"email:"+i.email, label:(i.full_name||i.email)+" (not signed up yet)"}))];
      const dropping = holders.filter(h=>drop.includes(h.id));
      return <div className="form card" style={{padding:14,marginBottom:12}}>
        <div><b>Who has this work</b><div style={{fontSize:13,color:"var(--muted)"}}>
          One task, however many names are on it {"\u2014"} one due date, one thread, and a line
          each to tick off. The owner cannot be taken off here; reassign the task instead.</div></div>

        <div>
          <div className="section-title" style={{marginTop:0}}>On it now</div>
          <div>{holders.map(h=>{
            const off = drop.includes(h.id);
            return <button key={h.id} type="button" className="chip"
              disabled={h.owner}
              title={h.owner ? "The owner \u2014 reassign the task to change this"
                    : off ? "Will come off the task" : "Tap to take them off"}
              style={h.owner ? {background:"#eef2fa",color:"var(--navy)",borderColor:"#c7d7f5",cursor:"default"}
                   : off ? {textDecoration:"line-through",color:"var(--red)",borderColor:"#f0c7c7"}
                   : {background:"var(--navy)",color:"#fff",borderColor:"var(--navy)"}}
              onClick={()=>{ if(h.owner) return;
                setDrop(off?drop.filter(x=>x!==h.id):[...drop,h.id]); }}>
              {h.owner ? "" : off ? "\u21a9 " : "\u2713 "}{h.who}{h.owner?" (owner)":""}</button>;})}</div>
        </div>

        {free.length>0 && <div>
          <div className="section-title" style={{marginTop:0}}>Also put it on</div>
          <div>{free.map(o=><button key={o.k} type="button" className="chip"
            style={copyTo.includes(o.k)?{background:"var(--navy)",color:"#fff",borderColor:"var(--navy)"}:{}}
            onClick={()=>setCopyTo(copyTo.includes(o.k)?copyTo.filter(x=>x!==o.k):[...copyTo,o.k])}>{o.label}</button>)}</div>
        </div>}

        {dropping.length>0 && <div className="note" style={{background:"var(--red-soft)",color:"var(--red)"}}>
          {dropping.map(d=>d.who).join(", ")} {dropping.length===1?"comes":"come"} off this task.
          The task itself stays where it is.
        </div>}

        <div className="actions">
          <button className="btn" onClick={()=>{setCopying(false);setCopyTo([]);setDrop([]);}}>Cancel</button>
          <button className="btn p" disabled={(!copyTo.length && !drop.length) || copyBusy} onClick={doHolders}>
            {copyBusy ? "Saving\u2026"
             : copyTo.length && drop.length ? `Add ${copyTo.length}, take off ${drop.length}`
             : copyTo.length ? `Put it on ${copyTo.length} more`
             : `Take off ${drop.length}`}</button>
        </div>
      </div>;
    })()}
    {!edit && !skipping && !asking && !replying && !copying && !returning && !sending && !joining && (isMgr || iCreated || t.assignee_id===me.id) &&
     <div className="actions" style={{justifyContent:"flex-start",marginBottom:12}}>
      {/* Out front: whatever this task's state is actually asking of you right now,
          plus the one hand-off that is only ever Kathleen's. */}
      {mayAnswer && t.status==="ready_for_review" && <button className="btn p" onClick={()=>finish({status:"done",need_manager:false},"Approved and closed")}>Approve {"\u2014"} mark done</button>}
      {mayAnswer && t.status==="ready_for_review" && <button className="btn" onClick={()=>quick({status:"working"},"Sent back")}>Send back</button>}
      {mayAnswer && (t.need_manager||t.need_help) && <button className="btn r" onClick={()=>setReplying(true)}>Reply &amp; clear flag</button>}
      {!CLOSED(t.status) && t.assignee_id!==me.id && <button className="btn" onClick={()=>finish({status:"done"},"Mark done")}>Mark done</button>}
      {(isMgr || iCreated) && CLOSED(t.status) && !GONE_TO_BD(t) && <button className="btn" onClick={()=>quick({status:"working",skip_reason:null},"Reopened")}>Reopen</button>}
      {!canReshape && t.assignee_id===me.id && !CLOSED(t.status) && !t.requested_due &&
        <button className="btn" onClick={()=>setDating(true)}>Need more time</button>}
      {fromBD && !CLOSED(t.status) && <button className="btn" style={{color:"#1f3a7a",borderColor:"#c7d7f5"}} onClick={()=>setReturning(true)}>Return to Kathleen</button>}
      {canSendBD && <button className="btn bd"
        title="Hand it to your own list \u2014 steps, comments and files come with it" onClick={()=>setSending(true)}>Send to my BD Inbox</button>}

      <More>
        {canReshape ? <button onClick={()=>setEdit(true)}>{isMgr?"Edit / reassign":"Edit"}</button> : null}
        {isMgr && (people.filter(p=>p.active && p.id!==t.assignee_id).length + (INVITEES||[]).length)>0
          ? <button onClick={()=>{setCopying(true);setCopyTo([]);setDrop([]);}}>Who has this</button> : null}
        {!CLOSED(t.status)
          ? <button onClick={()=>{setJoining("link");setJoinPick([]);setJoinQ("");}}>Link to another task</button> : null}
        {(isMgr || iCreated) && !CLOSED(t.status)
          ? <button onClick={()=>{setJoining("merge");setJoinPick([]);setJoinQ("");}}>Merge another in</button> : null}
        {t.recur_rule && !CLOSED(t.status) && (isMgr || t.assignee_id===me.id)
          ? <button onClick={()=>setSkipping(true)}>Skip this one</button> : null}
        {isMgr && root
          ? <button onClick={()=>update(root.id,{recur_paused:!root.recur_paused}).then(ok=>ok&&showToast(root.recur_paused?"Series resumed":"Series paused \u2014 no new ones will be created"))}>{root.recur_paused?"Resume series":"Pause series"}</button> : null}
        {isMgr && CLOSED(t.status) && t.assignee_id!==me.id && !t.seen_at && new Date(t.status==="skipped"?t.updated_at:(t.completed_at||t.updated_at)) > new Date(me.completions_seen_at||0)
          ? <button onClick={()=>update(t.id,{seen_at:new Date().toISOString()}).then(ok=>ok&&showToast("Seen \u2014 one fewer on the Finished count"))}>Mark as seen</button> : null}
        {canReshape ? <div className="sep"/> : null}
        {canReshape ? <button className="danger" onClick={()=>trash(t)}>Trash</button> : null}
      </More>
    </div>}
    {edit && <EditForm t={t} people={people} isMgr={isMgr} me={me} onCancel={()=>setEdit(false)} onSave={async p=>{ if(await update(t.id,p)){ setEdit(false); showToast("Saved"); } }}/>}

    <div className="panel edge-main"><h3>The task</h3><dl className="kv">
      {(() => {
        // Two kinds of link turned out to be one kind too many: a third of them were
        // filed under the wrong one, which is why there used to be a button for fixing
        // that. The same work in several hands is no longer a link at all — it is one
        // task with several names on it — so what is left here is simply "related".
        const line = (l) =>
          <div key={l.id} className="linkrow">
            <a href="#" onClick={(e)=>{e.preventDefault(); ctx.setOpen(l.id);}}>
              {l.ref ? <span className="refsm">#{l.ref}</span> : null}{l.title}</a>
            <span className="linkwho">({l.who||"Unassigned"}){" \u00b7 "}
              <b className={CLOSED(l.status)?"ok":""}>{STATUS[l.status]||l.status}</b>
              {l.due_date?` \u00b7 due ${fmtDate(l.due_date)}`:""}</span>
            <span className="linkacts">
              <button className="btn q" title="Unlink \u2014 no connection between them at all"
                onClick={()=>dropLink(l.id)}>&times;</button>
            </span>
          </div>;
        return <>
          {heldCount>1 && <><dt>Who has this</dt><dd>
            <div className="meta" style={{marginBottom:5}}>
              One task, {heldCount} people, one due date between them. {heldDone} of {heldCount} ticked off
              {heldDone<heldCount ? " \u2014 it closes when the last one does." : "."}
            </div>
            {holders.map(h=>
              <div key={h.id} className="linkrow">
                <span style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
                  <button className="btn q" style={{padding:"0 4px",color:h.done?"var(--ok)":"var(--muted)",lineHeight:1.3}}
                    title={h.done ? `Ticked off${h.done_at?" ":""}\u2014 tap to put it back` : "Tick this one off"}
                    onClick={()=>tickHolder(h)}>{h.done ? "\u2713" : "\u25cb"}</button>
                  <span style={{textDecoration:h.done?"line-through":undefined,
                                color:h.done?"var(--muted)":undefined}}>
                    {h.who}{h.mine ? " (you)" : ""}
                    {h.owner ? <span className="meta"> {"\u00b7"} owner</span> : null}
                    {!h.signed_up ? <span className="meta"> {"\u00b7"} not signed up yet</span> : null}
                  </span>
                </span>
                {!h.owner && <span className="linkacts">
                  <button className="btn q" title="Take them off this task"
                    onClick={()=>dropHolder(h)}>&times;</button>
                </span>}
              </div>)}
          </dd></>}
          {links.length>0 && <><dt>Related to</dt><dd>
            {links.map(line)}
          </dd></>}
        </>;
      })()}
      <dt>Assigned by</dt><dd>{DELEGATED(t) ? `${nameOf(people,t.created_by)} assigned it` : t.asked_by ? `${nameOf(people,t.asked_by)} asked for it` : t.assignee_id ? "Their own task" : "Not assigned yet"}{t.bd_task_id ? <span style={{marginLeft:8,fontSize:11,fontWeight:700,color:"#1f3a7a",background:"#e0ecff",padding:"1px 7px",borderRadius:7}}>{t.bd_status==="returned"?"returned to Kathleen's Inbox":t.bd_status==="sent"?"sent to Kathleen's Inbox":"from Kathleen's Inbox"}</span> : null}</dd>
      <dt>Assigned to</dt><dd>{t.assignee_id ? nameOf(people,t.assignee_id)
        : t.assignee_email ? `${(INVITEES.find(i=>i.email===String(t.assignee_email).toLowerCase())||{}).full_name || t.assignee_email} — waiting for them to sign up (${t.assignee_email})` : "Unassigned"}{t.assignee_id && t.created_by!==t.assignee_id ? ` · assigned by ${nameOf(people,t.created_by)}` : t.assignee_id ? " · self-assigned" : ""}</dd>
      <dt>Due</dt><dd>{fmtDate(t.due_date)}{t.expected_completion && t.expected_completion!==t.due_date ? ` (expected ${fmtDate(t.expected_completion)})` : ""}</dd>
      {t.status==="waiting" && <><dt>Waiting on</dt><dd>{t.waiting_on||"—"}</dd></>}
      {t.next_action && <><dt>Next action</dt><dd>{t.next_action}</dd></>}
      {t.context && <><dt>Context</dt><dd>{t.context}</dd></>}
      {t.details && <><dt>Details</dt><dd style={{whiteSpace:"pre-wrap"}}>{t.details}</dd></>}
      {t.standing_notes && <><dt>Standing notes</dt><dd style={{whiteSpace:"pre-wrap"}}>{t.standing_notes}{t.recur_rule?<div style={{fontSize:13,color:"var(--muted)"}}>Carried to every occurrence of this recurring task.</div>:null}</dd></>}
      {t.status==="skipped" && t.skip_reason && <><dt>Skipped because</dt><dd>{t.skip_reason}</dd></>}
      {root && root.recur_paused && <><dt>Series</dt><dd>Paused — no new occurrences are being created</dd></>}
      <dt>Last update</dt><dd>{fmtWhen(t.last_update_at)}</dd>
    </dl></div>

    <div className="panel edge-steps"><h3>Steps{steps.length?` — ${steps.filter(x=>x.done).length} of ${steps.length} done`:""}</h3>
      {(() => {
        // You may only move steps you are allowed to move. A mixed list would fail
        // halfway on the server, so offer it only when every step is yours to shift.
        const mayOrder = steps.length>1 && (canReshape || steps.every(x=>x.created_by===me.id));
        const shown = dragOrder ? dragOrder.map(id=>steps.find(x=>x.id===id)).filter(Boolean) : steps;
        return shown.map((st,i)=><div key={st.id} ref={el=>{ stepEls.current[st.id]=el; }}
          className={"steprow"+(dragId===st.id?" dragging":"")}>
          {mayOrder && <button className="grip" aria-label={`Move step ${i+1}, ${st.body}`}
            title="Drag to reorder — or focus this and use the arrow keys"
            onPointerDown={e=>startDrag(e,st)} onPointerMove={moveDrag}
            onPointerUp={endDrag} onPointerCancel={endDrag}
            onKeyDown={e=>{ if(e.key==="ArrowUp"){ e.preventDefault(); nudge(st,-1); }
                            if(e.key==="ArrowDown"){ e.preventDefault(); nudge(st,1); } }}>
            {"\u283F"}</button>}
          <input type="checkbox" checked={st.done} onChange={()=>toggleStep(st)} style={{width:18,height:18,marginTop:2,flexShrink:0}}/>
          {editId===st.id
            ? <input className="stepedit" autoFocus value={editText}
                onChange={e=>setEditText(e.target.value)}
                onBlur={()=>saveEdit(st)}
                onKeyDown={e=>{
                  if(e.key==="Enter"){ e.preventDefault(); e.currentTarget.blur(); }
                  if(e.key==="Escape"){ e.preventDefault(); editCancel.current=true; setEditId(null); }
                }}/>
            : (canReshape || st.created_by===me.id)
              ? <span className="steptext" tabIndex={0} role="button"
                  title="Click to reword this step"
                  onClick={()=>beginEdit(st)}
                  onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); beginEdit(st); } }}
                  style={{textDecoration:st.done?"line-through":"none",color:st.done?"var(--muted)":"inherit"}}>{st.body}</span>
              : <span style={{flex:1,textDecoration:st.done?"line-through":"none",color:st.done?"var(--muted)":"inherit"}}>{st.body}</span>}
          {(canReshape || st.created_by===me.id) && <button className="btn q" style={{padding:"0 4px",color:"var(--muted)"}} title="Remove this step" onClick={()=>removeStep(st)}>×</button>}
        </div>);
      })()}
      {!steps.length && <div style={{color:"var(--muted)",fontSize:14,padding:"8px 0"}}>No steps yet. Break the task into a checklist if that helps — these stay inside this task and never show up as separate cards.</div>}
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <input value={newStep} onChange={e=>setNewStep(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addStep()}
          placeholder="Add a step" style={{flex:1,border:"1px solid var(--line)",borderRadius:8,padding:"8px 10px"}}/>
        <button className="btn sm" onClick={addStep} disabled={!newStep.trim()}>Add</button>
        <button className="btn sm sparkle" onClick={suggest} disabled={suggBusy}
          title="Read this task and what has been said on it, and propose the steps it breaks into">
          {suggBusy ? "Reading\u2026" : "\u2728 Suggest steps"}</button>
      </div>
      {sugg && <div className="suggbox">
        {sugg.steps.length ? <>
          <div className="meta" style={{marginBottom:6}}>
            Proposed from the task and its comments{sugg.why?` \u2014 ${sugg.why}`:""}. Untick anything you don{"\u2019"}t want.
          </div>
          {sugg.steps.map((x,i)=>
            <label key={i} className="suggrow">
              <input type="checkbox" checked={suggPick.includes(i)}
                onChange={()=>setSuggPick(suggPick.includes(i) ? suggPick.filter(j=>j!==i) : [...suggPick,i])}/>
              <span>{x}</span>
            </label>)}
          <div className="actions" style={{marginTop:8}}>
            <button className="btn" onClick={()=>{setSugg(null);setSuggPick([]);}}>Discard</button>
            <button className="btn p" disabled={!suggPick.length||suggBusy} onClick={addSuggested}>
              Add {suggPick.length} step{suggPick.length===1?"":"s"}</button>
          </div>
        </> : <div className="meta">
          Nothing to break down {"\u2014"} {sugg.why || "this reads as a single action."}
          <button className="btn sm" style={{marginLeft:10}} onClick={()=>setSugg(null)}>OK</button>
        </div>}
      </div>}
    </div>
    {children.length>0 && <div className="panel tint edge-linked"><h3>Linked tasks — {children.filter(c=>CLOSED(c.status)).length} of {children.length} done</h3>
      <div className="card" style={{marginBottom:12}}>{children.map(c=><Row key={c.id} t={c} people={people} today={today} setOpen={(id)=>setOpen(id, children.map(x=>x.id))} showWho={true} why={c.assignee_id===me.id&&c.status!=="done"?{why:"Yours",tone:"navy"}:null}/>)}</div></div>}
    <div className="panel edge-talk"><div className="tabs" style={{marginTop:0}}>
      <button className={tab==="activity"?"on":""} onClick={()=>setTab("activity")}>Comments ({comments.length})</button>
      <button className={tab==="files"?"on":""} onClick={()=>setTab("files")}>Attachments ({files.length})</button>
      <button className={tab==="history"?"on":""} onClick={()=>setTab("history")}>History</button>
    </div>
    {tab==="activity" && <div>
      {/* Pinned first, then the rest newest-first as before. The order is computed here
          rather than asked of the server, so a pin moves the moment you click it. */}
      {[...comments].sort((a,b)=>
          (b.pinned_at?1:0)-(a.pinned_at?1:0)
          || (a.pinned_at && b.pinned_at ? String(a.pinned_at).localeCompare(String(b.pinned_at)) : 0)
        ).map(c=><div key={c.id}
          className={"cmt"+(c.is_private?" priv":"")+(c.pinned_at?" pinned":"")}><div className="by">
        {c.pinned_at ? <span className="pinmark">Pinned</span> : null}
        <span>{nameOf(people,c.author_id)} {"\u00b7"} {fmtWhen(c.created_at)}{c.is_private?" \u00b7 private manager note":""}</span>
        {c.merged_from ? (() => {
          const src = (ALL_TASKS||[]).find(x=>x.id===c.merged_from);
          return <span className="frommerge" title="This came across when two tasks were merged, keeping the date it was written">
            {"\u21aa "}{src ? `from #${src.ref} ${src.title}` : "from a merged task"}</span>;
        })() : null}
        {(c.author_id===me.id || isMgr || iCreated) &&
          <button className="pinbtn" title={c.pinned_at
              ? "Let it fall back into the thread"
              : "Keep it at the top of this thread, however much is said after it"}
            onClick={()=>pinComment(c)}>{c.pinned_at ? "Unpin" : "\ud83d\udccc Pin"}</button>}
      </div>{richText(c.body)}</div>)}
      <div className="form" style={{marginTop:10}}>
        <textarea value={body} onChange={e=>setBody(e.target.value)} placeholder={priv?"Private note only you can see":"Add a comment"}/>
        <div className="actions" style={{justifyContent:"space-between"}}>
          {isMgr ? <label style={{display:"flex",gap:6,alignItems:"center",fontSize:14}}><input type="checkbox" checked={priv} onChange={e=>setPriv(e.target.checked)} style={{width:"auto"}}/>Private note <span style={{color:"var(--muted)",fontSize:12}}>(only you can see it)</span></label> : <span/>}
          <button className="btn p" onClick={addComment} disabled={!body.trim()}>Post</button>
        </div>
      </div>
    </div>}
    {tab==="files" && <div className="att">
      {files.map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:8}}><a href="#" style={{flex:1}} onClick={e=>{e.preventDefault();openFile(f);}}>{f.file_name} <span style={{color:"var(--muted)",fontSize:12}}>· {nameOf(people,f.uploader_id)}</span></a>
        {(isMgr||f.uploader_id===me.id) && <button className="btn sm" onClick={()=>removeFile(f)}>Remove</button>}</div>)}
      {!files.length && <div className="empty">No attachments yet. Emails, quotes, photos, PDFs — up to 25 MB each.</div>}
      <input type="file" multiple ref={fileRef} style={{display:"none"}}
        onChange={e=>{ uploadMany(e.target.files); e.target.value=""; }}/>
      <div className={"dropzone"+(dragging?" over":"")}
        onClick={()=>fileRef.current.click()}
        onDragEnter={e=>{e.preventDefault(); e.stopPropagation(); setDragging(true);}}
        onDragOver={e=>{e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect="copy"; if(!dragging) setDragging(true);}}
        onDragLeave={e=>{e.preventDefault(); e.stopPropagation(); if(!e.currentTarget.contains(e.relatedTarget)) setDragging(false);}}
        onDrop={e=>{e.preventDefault(); e.stopPropagation(); setDragging(false);
          const dt = e.dataTransfer;
          const files = dt.files && dt.files.length ? dt.files
            : Array.from(dt.items||[]).map(i=>i.kind==="file"?i.getAsFile():null).filter(Boolean);
          uploadMany(files);}}>
        <b style={{pointerEvents:"none"}}>{dragging ? "Drop to attach" : "Drag files here"}</b>
        <div style={{pointerEvents:"none"}}>or click to choose. Emails, quotes, photos, PDFs — up to 25 MB each, ten at a time.</div>
      </div>
    </div>}
    {tab==="history" && <div>{hist.map(h=><div key={h.id} className="hist">{fmtWhen(h.created_at)} — {histText(h)}</div>)}</div>}
    </div>
    <div style={{marginTop:20,paddingTop:14,borderTop:"1px solid var(--line)"}}>
      <button className="btn p" style={{width:"100%"}} onClick={onClose}>Close</button>
    </div>
  </div></div>;
}

function Recur({f,setF}){
  return <div className="two">
    <label>Repeats<select value={f.recur_rule} onChange={e=>setF({...f,recur_rule:e.target.value,recur_day:e.target.value==="weekly"||e.target.value==="monthly"?"1":""})}>
      <option value="">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select></label>
    {(f.recur_rule || f.standing_notes) && <label>Standing notes
        <div style={{fontSize:13,color:"var(--muted)",fontWeight:400,marginBottom:4}}>
          {f.recur_rule ? "Carried to every occurrence, and included in the email each time — where the file lives, who to copy, what caught people out last time."
                        : "This task no longer repeats, so these notes won't carry anywhere. Clear them if they're no longer needed."}
        </div>
        <textarea value={f.standing_notes} onChange={e=>setF({...f,standing_notes:e.target.value})} placeholder="Pull it from GL Analytics, export as PDF, copy Robert." rows={2}/></label>}
    {f.recur_rule==="weekly" && <label>On<select value={f.recur_day} onChange={e=>setF({...f,recur_day:e.target.value})}>{DOW.map((d,i)=><option key={i} value={i}>{d}</option>)}</select></label>}
    {f.recur_rule==="monthly" && <label>On day<input type="number" min="1" max="31" value={f.recur_day} onChange={e=>setF({...f,recur_day:e.target.value})}/></label>}
    {f.recur_rule==="yearly" && <div style={{fontSize:13,color:"var(--muted)",alignSelf:"end"}}>Same date every year — whatever due date you set above is the anniversary.</div>}
    {f.recur_rule && <label>Flag it for me once this many are open at once<select value={Math.max(2, parseInt(f.recur_cap)||3)} onChange={e=>setF({...f,recur_cap:e.target.value})}>{[2,3,4,5,6].map(n=><option key={n} value={n}>{n} open at once</option>)}</select></label>}
    {f.recur_rule==="yearly" && <div style={{gridColumn:"1 / -1",fontSize:13,color:"var(--muted)"}}>A yearly task appears a month before it's due, not five days — an annual renewal or filing needs more notice than a week.</div>}
    {f.recur_rule && f.recur_rule!=="daily" && f.recur_rule!=="yearly" && <div style={{gridColumn:"1 / -1",fontSize:13,color:"var(--muted)"}}>These appear on schedule — five days before each due date — whether or not the last one got finished.</div>}
    {f.recur_rule==="daily" && <div style={{gridColumn:"1 / -1",fontSize:13,color:"var(--muted)"}}>A daily task rolls forward instead of piling up: the next one appears when this one is closed.</div>}
  </div>;
}

// Twelve buttons at one volume meant Trash looked as ordinary as Update. The three or
// four you reach for daily stay out front; everything real but rare lives in here.
function More({children}){
  const [open,setOpen] = useState(false);
  const box = useRef(null);
  useEffect(()=>{ if(!open) return;
    const away = (e) => { if(box.current && !box.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if(e.key==="Escape") setOpen(false); };
    document.addEventListener("mousedown", away);
    document.addEventListener("keydown", esc);
    return ()=>{ document.removeEventListener("mousedown", away);
                 document.removeEventListener("keydown", esc); };
  },[open]);
  const items = React.Children.toArray(children).filter(Boolean);
  if(!items.length) return null;
  return <span className="moreWrap" ref={box}>
    <button className="btn" aria-haspopup="true" aria-expanded={open}
      onClick={()=>setOpen(!open)}>More {"\u25be"}</button>
    {open && <div className="moreMenu" onClick={()=>setOpen(false)}>{items}</div>}
  </span>;
}

function EditForm({t,people,onCancel,onSave,isMgr,me}){
  const pending = isMgr ? INVITEES : [];
  const [f,setF] = useState({title:t.title,assignee_id:t.assignee_id||(t.assignee_email?"email:"+t.assignee_email:""),due_date:t.due_date||"",priority:t.priority,context:t.context,details:t.details,definition_of_done:t.definition_of_done,standing_notes:t.standing_notes||"",recur_rule:t.recur_rule||"",recur_day:t.recur_day??"",recur_cap:t.recur_cap??3});
  return <div className="form card" style={{padding:14,marginBottom:12}}>
    <label>Task<input value={f.title} onChange={e=>setF({...f,title:e.target.value})}/></label>
    <div className="three">
      <label>Assign to<select value={f.assignee_id} onChange={e=>setF({...f,assignee_id:e.target.value})}><option value="">Unassigned</option>{people.filter(p=>p.active && (me.role==="owner" || p.id===me.id || p.manager_id===me.id)).map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}
      {pending.length>0 && <optgroup label="Invited — not signed up yet">{pending.map(i=><option key={i.email} value={"email:"+i.email}>{i.full_name||i.email}</option>)}</optgroup>}</select></label>
      <label>Due<input type="date" value={f.due_date} onChange={e=>setF({...f,due_date:e.target.value})}/></label>
      <label>Priority<select value={f.priority} onChange={e=>setF({...f,priority:e.target.value})}><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option></select></label>
    </div>
    {/* Status lives on Update, not here. Edit is what the task IS — its name, owner,
        date, shape. Update is how it is GOING, and it takes a note with the change so
        that a month later the history says why it went to Waiting. Both forms setting
        status was one fix too many. */}
    {f.context ? <label>Context
      <div style={{fontSize:13,color:"var(--muted)",fontWeight:400,marginBottom:4}}>No longer asked for on new tasks — clear it if it isn't telling you anything.</div>
      <input value={f.context} onChange={e=>setF({...f,context:e.target.value})}/></label> : null}
    <label>Details<textarea value={f.details} onChange={e=>setF({...f,details:e.target.value})}/></label>
    {(f.recur_rule || f.standing_notes) && <label>Standing notes
      <div style={{fontSize:13,color:"var(--muted)",fontWeight:400,marginBottom:4}}>
        {f.recur_rule ? "Carried to every occurrence, and included in the email each time."
                      : "This task no longer repeats, so these notes won't carry anywhere."}
      </div>
      <textarea value={f.standing_notes} onChange={e=>setF({...f,standing_notes:e.target.value})}/></label>}
    <Recur f={f} setF={setF}/>
    <div className="actions"><button className="btn" onClick={onCancel}>Cancel</button><button className="btn p" onClick={()=>onSave({...f,
      assignee_id:String(f.assignee_id).startsWith("email:")?null:(f.assignee_id||null),
      assignee_email:String(f.assignee_id).startsWith("email:")?f.assignee_id.slice(6):null,
      due_date:f.due_date||null,recur_rule:f.recur_rule||null,recur_day:(f.recur_rule && f.recur_rule!=="daily" && f.recur_rule!=="yearly")?(parseInt(f.recur_day)||null):null,recur_cap:Math.max(2, parseInt(f.recur_cap)||3),
})}>Save</button></div>
  </div>;
}

        <span style={{flex:1}}>{x.email}{x.note?<span style={{color:"var(--muted)",fontSize:13}}> — {x.note}</span>:null}</span>
