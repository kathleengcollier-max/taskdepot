<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Dump</title>
<meta name="app-version" content="4.8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23c8102e'/%3E%3Ctext x='50' y='68' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='800' fill='white' text-anchor='middle'%3EBD%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23c8102e'/%3E%3Ctext x='50' y='68' font-family='Arial,Helvetica,sans-serif' font-size='46' font-weight='800' fill='white' text-anchor='middle'%3EBD%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brain Dump">
<meta name="theme-color" content="#1c2b45">
<style>
  :root{
    --navy:#1c2b45; --navy2:#22345273; --canvas:#eef1f6; --ink:#0f172a;
    --muted:#64748b; --muted2:#94a3b8; --line:#e7ebf1; --line2:#f1f5f9;
    --red:#dc2626; --red-dark:#b91c1c; --white:#fff;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
    --shadow-lg:0 10px 30px rgba(15,23,42,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  .authgate{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#1c2b45,#0f172a);display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
  .auth-logo{width:52px;height:52px;border-radius:14px;background:#dc2626;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .auth-title{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#0f172a}
  .auth-sub{font-size:13px;color:#64748b;margin:6px 0 20px;line-height:1.5}
  .auth-input{width:100%;border:1px solid #e2e8f0;border-radius:10px;padding:12px 13px;font-size:14px;outline:none;margin-bottom:11px;font-family:inherit}
  .auth-input:focus{border-color:#c7d2e6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  .auth-btn{width:100%;background:#dc2626;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:.12s}
  .auth-btn:hover{background:#b91c1c}
  .auth-btn:disabled{opacity:.6;cursor:default}
  .auth-toggle{font-size:12.5px;color:#64748b;margin-top:16px}
  .auth-link{background:none;border:none;color:#dc2626;font-weight:700;font-size:12.5px;cursor:pointer;padding:0}
  .auth-err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:13px;line-height:1.45;text-align:left}
  .saveflash{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:150;font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none}
  .saveflash.ok{background:#dcfce7;color:#166534}
  .saveflash.bad{background:#fef2f2;color:#991b1b}
  body{
    background:var(--canvas); color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid transparent;background-clip:content-box}

  /* ---------- top nav ---------- */
  .nav{background:var(--navy);color:#e2e8f0;position:sticky;top:0;z-index:40}
  .nav-in{display:flex;align-items:center;gap:6px;padding:0 20px;height:60px;max-width:1480px;margin:0 auto}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--red);display:flex;align-items:center;justify-content:center;
        color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 2px 8px rgba(220,38,38,.4);flex:none}
  .wordmark{font-weight:800;letter-spacing:.14em;font-size:13px;color:#fff;margin:0 14px 0 12px;white-space:nowrap}
  .nav-links{display:flex;align-items:center;gap:2px;flex:1;overflow:hidden}
  .nav-link{padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:#b7c2d4;white-space:nowrap;
            display:flex;align-items:center;gap:7px;transition:background .12s,color .12s}
  .nav-link:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-link.active{background:#fff;color:#0f172a;font-weight:600}
  .badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;
         display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .nav-link.active .badge{background:var(--red)}
  .nav-right{display:flex;align-items:center;gap:10px;flex:none}
  .btn-red{background:var(--red);color:#fff;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:9px;
           display:flex;align-items:center;gap:7px;transition:background .12s}
  .btn-red:hover{background:var(--red-dark)}
  .vpill{border:1px solid #3a4a67;color:#8ea0bd;font-size:12px;padding:4px 11px;border-radius:20px;font-weight:600}
  .icon-btn{width:34px;height:34px;border-radius:9px;color:#b7c2d4;display:flex;align-items:center;justify-content:center;font-size:18px}
  .icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}

  /* ---------- page ---------- */
  .wrap{max-width:1480px;margin:0 auto;padding:26px 24px 60px}
  .page-title{font-size:29px;font-weight:800;letter-spacing:-.5px;margin:0}
  .page-sub{color:var(--muted);font-size:14px;margin:5px 0 0}
  .section-h{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-.2px}

  /* ---------- stat cards ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:22px 0}
  .stat{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
        cursor:pointer;transition:transform .12s,box-shadow .12s;border:1px solid transparent}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .stat.on{border-color:var(--ink)}
  .stat .num{font-size:33px;font-weight:800;line-height:1;letter-spacing:-1px}
  .stat .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);margin-top:8px}
  .stat .blob{position:absolute;right:-14px;top:-14px;width:74px;height:74px;border-radius:50%;opacity:.45}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 14px 11px 40px;outline:none;transition:border .12s,box-shadow .12s}
  .search input:focus{border-color:#c7d2e6;box-shadow:0 0 0 3px rgba(59,130,246,.10)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted2)}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:#475569;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .seg button.on{background:var(--ink);color:#fff}
  .seg-n{background:#eef2f7;color:#64748b;font-size:11px;font-weight:800;padding:0 6px;border-radius:8px;min-width:16px;text-align:center}
  .seg button.on .seg-n{background:rgba(255,255,255,.22);color:#fff}
  .sel{position:relative}
  .sel select{appearance:none;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 34px 10px 13px;font-weight:500;outline:none;cursor:pointer}
  .sel select:focus{border-color:#c7d2e6}
  .sel svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted2);pointer-events:none}
  .clear-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:11px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.12s}
  .clear-btn:hover{border-color:#fca5a5;color:#dc2626;background:#fef2f2}
  .qadd{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;margin-bottom:18px;box-shadow:var(--shadow);transition:.12s}
  .qadd:focus-within{border-color:#c7d2e6;box-shadow:0 0 0 3px rgba(59,130,246,.09)}
  .qadd-plus{color:#cbd5e1;display:flex;flex:none}
  .qadd input{flex:1;border:none;outline:none;font-size:14px;padding:7px 0;background:transparent}
  .qadd input::placeholder{color:#a3b1c6}
  .qadd button{background:#0f172a;color:#fff;border-radius:9px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;flex:none}
  .qadd button:hover{background:#1e293b}

  /* ---------- cards grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:18px}
  .tlist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .trow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2);border-left:3px solid var(--ac);cursor:pointer;transition:background .1s}
  .trow:last-child{border-bottom:none}
  .trow:hover{background:#f8fafc}
  .trow.done{opacity:.55}
  .trow.done .trow-title{text-decoration:line-through;color:var(--muted)}
  .trow-check{flex:none;width:21px;height:21px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
  .trow-selbox{flex:none;width:21px;height:21px;border-radius:6px;border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
  .trow-selbox.on{background:#2563eb;border-color:#2563eb}
  .trow-selbox svg{width:13px;height:13px}
  .trow.selmode{cursor:pointer}
  .trow.selon{background:#eff6ff}
  .rev-start.sel-on{background:#1e293b;color:#fff}
  .selhint{font-size:12.5px;color:var(--muted);background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;padding:8px 12px;margin:10px 0}
  .selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;background:#0f172a;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(15,23,42,.35)}
  .selbar-n{font-size:13.5px;font-weight:700}
  .selbar-btns{display:flex;gap:8px}
  .selbar .btn-ghost{color:#cbd5e1;border-color:#334155;background:transparent}
  .selbar .btn-ghost:disabled{opacity:.4}
  .selbar .btn-primary:disabled{opacity:.4}
  .trow-check:hover{border-color:#16a34a;background:#f0fdf4}
  .trow-check.on{background:#16a34a;border-color:#16a34a}
  .trow-check svg{width:12px;height:12px}
  .trow-body{flex:1;min-width:0}
  .trow-title{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .trow-pin{color:#f59e0b;display:inline-flex;flex:none}
  .trow-sub2{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow-pin svg{width:12px;height:12px}
  .trow-meta{display:flex;align-items:center;gap:9px;margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .trow-meta>span{display:inline-flex;align-items:center;gap:3px;flex:none}
  .trow-meta svg{width:11px;height:11px}
  .trow-cat{font-weight:700}
  .trow-badge{background:#eef2f7;color:#64748b;font-weight:700;padding:1px 6px;border-radius:5px;font-size:10.5px}
  .trow-badge.td{background:#e0ecff;color:#1f3a7a;display:inline-flex;align-items:center;gap:4px}
  .trow-badge.td.completed{background:#dcfce7;color:#15803d}
  .trow-badge.td.returned{background:#fef3c7;color:#b45309}
  .trow-badge.td.trashed{background:#fee2e2;color:#b91c1c}
  .td-card{background:linear-gradient(135deg,#eef3ff,#f7f9ff);border:1px solid #c7d7f5;border-radius:13px;padding:12px 14px;margin-bottom:11px}
  .td-card .td-h{display:flex;align-items:center;gap:8px;font-weight:800;color:#1f3a7a;font-size:13px}
  .td-card .td-h .td-logo{width:22px;height:22px;border-radius:6px;background:#1f3a7a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.02em}
  .td-card .td-state{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:#fff;color:#1f3a7a;border:1px solid #c7d7f5}
  .td-card .td-state.completed{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
  .td-card .td-state.returned{color:#b45309;border-color:#fde68a;background:#fffbeb}
  .td-card .td-state.trashed{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
  .td-card .td-line{font-size:13px;color:#334155;margin-top:6px}
  .td-card .td-line b{color:#0f172a}
  .td-card a{color:#1f3a7a;font-weight:700;text-decoration:none}
  .td-why{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:9px;padding:9px 12px;margin-top:8px;font-size:13.5px;color:#0f172a;line-height:1.45}
  .td-why span{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#b45309;margin-top:2px}
  .td-comments{margin-top:9px;background:#fff;border:1px solid #c7d7f5;border-radius:9px;padding:8px 12px}
  .td-ch{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1f3a7a;margin-bottom:4px}
  .td-c{font-size:13px;color:#0f172a;padding:4px 0;border-top:1px solid #eef2f7}
  .td-c:first-of-type{border-top:0}
  .td-c .lt{display:block;font-size:11px;color:#94a3b8;margin-top:1px}
  .trow-sub2.back{color:#b45309;font-weight:600}
  .td-nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eef3ff;border:1px dashed #a9c0ea;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:12.5px;color:#1f3a7a}
  .td-nudge button{margin-left:auto;background:#1f3a7a;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .td-people{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:300px;overflow-y:auto;background:#fff}
  .td-person{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #f1f5f9;cursor:pointer}
  .td-person:first-child{border-top:0}
  .td-person:hover{background:#f8fafc}
  .td-person.on{background:#eef3ff}
  .td-person .dup-radio{margin:0}
  .td-person .td-name{font-weight:600;font-size:13.5px;color:#0f172a}
  .td-person .td-mail{font-size:11.5px;color:#94a3b8}
  .td-person .td-role{margin-left:auto;font-size:10.5px;font-weight:700;color:#64748b;background:#f1f5f9;padding:1px 7px;border-radius:7px;white-space:nowrap}
  .td-person .td-role.invited{color:#b45309;background:#fef3c7}
  .td-travel{font-size:12.5px;color:#475569;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:12px;line-height:1.5}
  .td-travel b{color:#0f172a}
  .td-search{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;margin-bottom:8px}
  .trow-badge.hi{background:#fef2f2;color:#dc2626}
  .trow-pt{color:#94a3b8}
  .trow-reply{color:#16a34a;display:inline-flex}
  .trow-reply svg{width:12px;height:12px}
  .email-body{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.55;color:#334155;white-space:normal;max-height:280px;overflow:auto}
  .email-topic{font-size:14px;font-weight:800;color:var(--navy);line-height:1.4;margin-bottom:8px}
  .email-body b{color:#0f172a;font-weight:700}
  .trow-due{flex:none;font-size:12px;font-weight:700;color:#94a3b8;white-space:nowrap;min-width:74px;text-align:right}
  .trow-due.over{color:#dc2626}
  .trow-due.today{color:#d97706}
  .trow-due.soon{color:#0891b2}
  .trow-due.nodate{color:#cbd5e1;font-weight:500}
  @media(max-width:560px){ .trow-loc,.trow-sub{display:none!important} .trow-due{min-width:0} }
  .trow-emoji{flex:none;font-size:20px;width:28px;text-align:center}
  .trow-listprog{flex:none;font-size:13px;font-weight:800;white-space:nowrap;min-width:44px;text-align:right}
  .trow-mnote{overflow:hidden;text-overflow:ellipsis;max-width:340px}
  .trow-mbtns{display:flex;align-items:center;gap:6px;flex:none}
  .trow-btn{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#64748b;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .trow-btn svg{width:12px;height:12px}
  .trow-btn.said:hover{background:#dcfce7;border-color:#86efac;color:#166534}
  .trow-btn.task:hover{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}
  .trow.mention{border-left-color:#7c3aed}
  .card{background:#fff;border-radius:16px;box-shadow:var(--shadow);border-top:3px solid var(--ac,#64748b);
        padding:17px 18px 15px;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card.done{opacity:.62}
  .card-top{display:flex;gap:12px;align-items:flex-start}
  .card.mention{border-left:3px solid #7c3aed}
  .card-loc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.02em;margin-bottom:9px}
  .card-loc svg{opacity:.9;flex:none}
  .loc-more{opacity:.72;font-weight:800;margin-left:1px}
  .avatar.sm{width:30px;height:30px;border-radius:9px;font-size:11px}
  .badge.alt{background:#7c3aed}
  .badge.grn{background:#16a34a}
  .trow.inbox{border-left-color:#16a34a}
  .trow-mailic{flex:none;color:#16a34a;display:inline-flex}
  .trow-src{color:#16a34a;font-weight:700}
  .trow-nodate{color:#cbd5e1}
  .trow-accept{flex:none;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid #86efac;background:#f0fdf4;color:#166534;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .trow-accept:hover{background:#dcfce7}
  .trow-accept svg{width:12px;height:12px}
  .inbox-accept-all{font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid #86efac;background:#f0fdf4;color:#166534;cursor:pointer}
  .inbox-accept-all:hover{background:#dcfce7}
  .nav-link.active .badge.alt{background:#7c3aed}
  .mention-grp{margin-bottom:26px}
  .mention-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .mention-head b{font-size:15px}
  .mention-n{background:#f3e8ff;color:#7c3aed;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:10px}
  .said-btn{display:inline-flex;align-items:center;gap:5px;background:#7c3aed;color:#fff;border-radius:9px;padding:6px 11px;font-weight:600;font-size:12.5px;cursor:pointer;transition:.12s}
  .said-btn:hover{background:#6d28d9}
  .wb-list{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}

  async function sbLoad(){
    // pull every collection + settings in parallel; reconstruct S
    const out={tasks:[],lists:[],dumps:[]};
    const results=await Promise.all(COLLS.map(([k,tbl])=>sb.from(tbl).select('id,data')));
    for(let i=0;i<COLLS.length;i++){
      const [k]=COLLS[i]; const {data,error}=results[i];
      if(error) throw error;
      out[k]=(data||[]).map(r=>{ synced[k][r.id]=JSON.stringify(r.data); return r.data; });
    }
    const sres=await sb.from('bd_settings').select('data').maybeSingle();
    if(sres.error) throw sres.error;
    const settings=sres.data?sres.data.data:null;
    synced.settings=settings?JSON.stringify(settings):'';
    return {out, settings};
  }

  async function sbSave(){
    if(!sb||!authUser) return;
    const jobs=[];
    // per collection: upsert changed/new rows, delete removed rows
    for(const [k,tbl] of COLLS){
      const arr=S[k]||[];
      const seen=new Set();
      const ups=[];
      for(const item of arr){
        if(!item||!item.id) continue;
        seen.add(item.id);
        const js=JSON.stringify(item);
        if(synced[k][item.id]!==js){ ups.push({id:item.id, user_id:authUser.id, data:item}); }
      }
      if(ups.length) jobs.push(sb.from(tbl).upsert(ups).then(r=>{ if(!r.error) ups.forEach(u=>synced[k][u.id]=JSON.stringify(u.data)); return r; }));
      const gone=Object.keys(synced[k]).filter(id=>!seen.has(id));
      if(gone.length) jobs.push(sb.from(tbl).delete().in('id',gone).then(r=>{ if(!r.error) gone.forEach(id=>delete synced[k][id]); return r; }));
    }
    // settings (locations, categories, selfAliases) as a single row
    const settings={locations:S.locations, categories:S.categories, selfAliases:S.selfAliases};
    const sjs=JSON.stringify(settings);
    if(sjs!==synced.settings){ jobs.push(sb.from('bd_settings').upsert({user_id:authUser.id, data:settings}).then(r=>{ if(!r.error) synced.settings=sjs; return r; })); }
    const res=await Promise.all(jobs);
    const failed=res.find(r=>r&&r.error);
    if(failed) throw failed.error;
    return true;
  }

  function topOwners(n){ const cnt={}; (S.tasks||[]).forEach(t=>{ if(t.delegateTo && !isSelf(t.delegateTo)){ cnt[t.delegateTo]=(cnt[t.delegateTo]||0)+1; } }); return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,n||6).map(x=>x[0]); }
  function ownerKnown(name,exceptId){ if(!name||isSelf(name)) return true; const k=String(name).toLowerCase(); return (S.tasks||[]).some(t=>t.id!==exceptId && t.delegateTo && String(t.delegateTo).toLowerCase()===k); }
  function nameSim(a,b){ a=nrm(a); b=nrm(b); if(!a||!b)return 0; if(a===b)return 1;
    const bg=s=>{const g=[];for(let i=0;i<s.length-1;i++)g.push(s.slice(i,i+2));return g;};
    const A=bg(a),B=bg(b); if(!A.length||!B.length)return 0;
    const m={}; B.forEach(g=>m[g]=(m[g]||0)+1); let inter=0; A.forEach(g=>{if(m[g]>0){inter++;m[g]--;}});
    return 2*inter/(A.length+B.length); }
  function closestOwner(name,exceptId){ let best=null,bs=0; const seen=new Set(); (S.tasks||[]).forEach(t=>{ if(t.id!==exceptId && t.delegateTo){ const kk=String(t.delegateTo).toLowerCase(); if(seen.has(kk))return; seen.add(kk); const s=Math.max(titleSim(name,t.delegateTo),nameSim(name,t.delegateTo)); if(s>bs){bs=s;best=t.delegateTo;} } }); return bs>=0.5?best:null; }

  function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function upcomingFriday(){ const d=today0(); const diff=(5-d.getDay()+7)%7; return addDays(d,diff); } // this week's Friday (today if Fri)
  function whenDate(when){ const t=today0();
    if(when==='clear') return '';
    if(when==='today') return toISO(t);
    if(when==='tomorrow') return toISO(addDays(t,1));
    if(when==='week') return toISO(addDays(t,7));
    if(when==='thisweek') return toISO(upcomingFriday());
    if(when==='nextweek') return toISO(addDays(upcomingFriday(),7));
    if(when==='snooze') return toISO(addDays(t,30));
    return ''; }
  function fmtDate(s){ const d=validDate(s); if(!d) return ''; return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function fmtDateY(s){ const d=validDate(s); if(!d) return ''; const ty=new Date().getFullYear(); const opt={month:'short',day:'numeric'}; if(d.getFullYear()!==ty)opt.year='numeric'; return d.toLocaleDateString('en-US',opt); }
  function fmtLong(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d))return''; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
  function dueMeta(s){
    const d=validDate(s); if(!d) return null;
    const diff=Math.round((d-today0())/MS_DAY);
    let cls='',txt=fmtDate(s);
    if(diff<0){cls='over';txt=Math.abs(diff)+'d overdue';}
    else if(diff===0){cls='today';txt='Today';}
    else if(diff===1){cls='soon';txt='Tomorrow';}
    else if(diff<=7){cls='soon';txt='In '+diff+'d';}
    return {cls,txt,diff};
  }

  /* ---------------- derived counts ---------------- */
  function taskItems(){ return S.tasks.filter(t=>t.type!=='mention'); }
  function activeTasks(){ return taskItems().filter(t=>!t.archived && !t.inbox); }
  function inboxTasks(){ return taskItems().filter(t=>t.inbox && !t.archived && t.status!=='done').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')); }
  function activeMentions(){ return S.tasks.filter(t=>t.type==='mention' && !t.archived && !t.discussedAt && t.status!=='done'); }
  function counts(){
    const a=activeTasks(); const open=a.filter(t=>t.status!=='done');
    let dueToday=0,over=0,upcoming=0,deleg=0,noDate=0;
    open.forEach(t=>{
      const m=dueMeta(t.dueDate);
      if(m){ if(m.diff===0)dueToday++; else if(m.diff<0)over++; else upcoming++; }
      else noDate++;
      if(t.delegateTo && !isSelf(t.delegateTo))deleg++;
    });
    return {active:open.length, dueToday, over, upcoming, deleg, noDate, attention:dueToday+over};
  }

  function filteredTasks(){

      if(U.tab==='done'){ if(t.status!=='done')return false; }
      else if(t.status==='done') return false;
      if(U.deleg==='__mine__' && !isSelf(t.delegateTo)) return false;
      if(U.deleg==='__out__' && isSelf(t.delegateTo)) return false;
      if(U.deleg && U.deleg!=='__mine__' && U.deleg!=='__out__' && t.delegateTo!==U.deleg) return false;
      if(U.status && t.workStatus!==U.status) return false;
      if(U.tab==='attention'){ const m=dueMeta(t.dueDate); if(!m||m.diff>0)return false; }
      if(U.tab==='today'){ const m=dueMeta(t.dueDate); if(!m||m.diff!==0)return false; }
      if(U.tab==='over'){ const m=dueMeta(t.dueDate); if(!m||m.diff>=0)return false; }
      if(U.tab==='upcoming'){ const m=dueMeta(t.dueDate); if(!m||m.diff<=0)return false; }
      if(U.tab==='nodate'){ if(validDate(t.dueDate))return false; }
      if(U.cat && t.category!==U.cat) return false;
      if(U.loc && t.location!==U.loc) return false;
      if(q){ const hay=(t.title+' '+(t.notes||'')+' '+(t.emailBody||'')+' '+(t.delegateTo||'')+' '+(t.location||'')+' '+(t.additionalLocations||[]).join(' ')).toLowerCase(); if(!hay.includes(q))return false; }
      return true;

      const mx=dueMeta(x.dueDate),my=dueMeta(y.dueDate);

      if(mx) return -1; if(my) return 1;
      return (y.createdAt||'').localeCompare(x.createdAt||'');
    });

  /* ================= MENTIONS VIEW ================= */

        <div class="trow-title">${esc(m.title)}</div>

      </div>
    </div>`;

  function mentionsView(){
    const ms=activeMentions();
    const byPerson={};
    ms.forEach(m=>{ const p=(m.delegateTo||'Someone'); (byPerson[p]=byPerson[p]||[]).push(m); });
    const people=Object.keys(byPerson).sort((a,b)=>a.localeCompare(b));
    // everyone who owns open tasks (delegated out) OR has a mention — for the "work with anyone" launcher
    const owners={};
    activeTasks().filter(t=>t.status!=='done' && t.delegateTo && !isSelf(t.delegateTo)).forEach(t=>{ owners[t.delegateTo]=(owners[t.delegateTo]||0)+1; });
    people.forEach(p=>{ if(!isSelf(p)) owners[p]=owners[p]||0; });
    const everyone=Object.keys(owners).sort((a,b)=>a.localeCompare(b));
    return `
    <div class="page-title">Mentions &amp; people</div>
    <div class="page-sub">${ms.length} thing${ms.length===1?'':'s'} to bring up · grouped by person · mark "Said it" when you do</div>
    ${everyone.length?`<div class="ppl-launch"><div class="ppl-launch-h">Work with anyone — pull up their tasks &amp; mentions to log notes live</div>
      <div class="ppl-chips">${everyone.map(p=>`<button class="ppl-chip" data-act="brief" data-person="${esc(p)}"><span class="avatar sm" style="background:#7c3aed">${esc(initials(p))}</span>${esc(p)}${owners[p]?`<span class="ppl-n">${owners[p]}</span>`:''}</button>`).join('')}</div>
    </div>`:''}
    <div style="margin:18px 0 22px"><button class="btn-red" data-act="newmention" style="border-radius:11px">${I.plus}<span>New mention</span></button></div>

      <div class="mention-head"><div class="avatar sm" style="background:#7c3aed">${esc(initials(p))}</div><b>${esc(p)}</b><span class="mention-n">${byPerson[p].length}</span>

  /* ================= WHITEBOARD (apps in development) ================= */

  /* ================= REVIEW MODE ================= */

    const list=filteredTasks();

  }

    if(U.reviewIdx>=U.review.length-1){ U.review=null; U.view='tasks'; render(); toast('Review complete ✦'); }

  }

    const ids=U.review||[]; const total=ids.length; let i=U.reviewIdx;
    if(i>=total){ U.review=null; U.view='tasks'; return tasksView(); }
    const t=findTask(ids[i]);
    if(!t){ reviewAdvance(); return ''; }
    const ac=catColor(t.category); const m=dueMeta(t.dueDate); const subs=t.subtasks||[];
    const done=subs.filter(s=>s.done).length;
    const catOpts=S.categories, locOpts=S.locations;
    const pct=Math.round((i/total)*100);
    return `<div class="rev-wrap">
      <div class="rev-bar-top">
        <button class="rev-exit" data-act="reviewexit">${I.x} Exit review</button>
        <div class="rev-prog"><div class="rev-prog-fill" style="width:${pct}%"></div></div>
        <button class="rev-back" data-act="reviewback" ${i<=0?'disabled':''} title="Back (P or ←)">↑ Back</button>
        <div class="rev-count">${i+1} of ${total}</div>
      </div>
      <div class="rev-stage">
        <div class="rev-card" style="--ac:${ac}">

          </div>
          <div class="rev-meta-grid">
            <div class="field" style="grid-column:1 / -1"><label>Due ${m?`· <span style="${m.diff<0?'color:#dc2626':''}">${esc(m.txt)}</span>`:''}</label><input type="date" data-field="t.dueDate" data-id="${t.id}" value="${validDate(t.dueDate)?t.dueDate:''}"></div>
          </div>
          <div class="rev-date-chips">
            <span class="qc-lbl">Quick date:</span>
            <button data-act="quickdate" data-id="${t.id}" data-when="today">Today</button>
            <button data-act="quickdate" data-id="${t.id}" data-when="week">+1 wk</button>
            <button data-act="quickdate" data-id="${t.id}" data-when="nextweek">Next wk</button>
            <button data-act="quickdate" data-id="${t.id}" data-when="snooze">1 mo</button>
            <button data-act="quickdate" data-id="${t.id}" data-when="clear">Clear</button>
          </div>
          <div class="rev-date-chips">
            <span class="qc-lbl">Category:</span>
            ${catOpts.map(c=>`<button class="${t.category===c?'chip-on':''}" data-act="setcat" data-id="${t.id}" data-val="${esc(c)}" style="${t.category===c?`background:${catColor(c)};border-color:${catColor(c)}`:''}">${esc(c)}</button>`).join('')}
          </div>
          <div class="rev-date-chips">
            <span class="qc-lbl">Location:</span>
            ${locOpts.map(c=>`<button class="${t.location===c?'chip-on':''}" data-act="setloc" data-id="${t.id}" data-val="${esc(c)}" style="${t.location===c?`background:${locColor(c)};border-color:${locColor(c)}`:''}">${esc(c)}</button>`).join('')}
          </div>
          <div class="rev-date-chips">
            <span class="qc-lbl">Owner:</span>
            <button class="${!t.delegateTo?'chip-on':''}" data-act="reassign" data-id="${t.id}" data-who="">Unassigned</button>
            <button class="${isSelf(t.delegateTo)?'chip-on':''}" data-act="reassign" data-id="${t.id}" data-who="KGC">Me</button>
            ${topOwners(6).filter(o=>!isSelf(o)).map(o=>`<button class="${t.delegateTo===o?'chip-on':''}" data-act="reassign" data-id="${t.id}" data-who="${esc(o)}">${esc(o)}</button>`).join('')}
          </div>
          <div class="rev-subs-sec">
            <div class="rev-subs-lbl">Subtasks ${subs.length?`· ${done}/${subs.length}`:''}</div>
            ${subs.map(s=>`<div class="sub-item"><div class="chk ${s.done?'on':''}" data-act="subtoggle" data-id="${t.id}" data-sid="${s.id}">${s.done?I.check:''}</div><span class="${s.done?'sub-done':''}">${esc(s.title)}</span><button class="sub-del" data-act="subdel" data-id="${t.id}" data-sid="${s.id}">×</button></div>`).join('')}
            <div class="addrow"><input placeholder="Add a step…" data-sub-input="${t.id}"><button data-act="subadd" data-id="${t.id}">Add</button></div>

      </div>
      <datalist id="ownerlist">${allOwnerNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>
    </div>`;
  }

  /* ================= DASHBOARD ================= */
  function dashboardView(){
    const c=counts();
    const open=activeTasks().filter(t=>t.status!=='done');
    const hour=new Date().getHours();
    const greet=hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';
    const meName=(S.selfAliases&&S.selfAliases[1])||'there';
    // MY DAY: self tasks overdue or due today
    const mine=open.filter(t=>isSelf(t.delegateTo));
    const myDay=mine.filter(t=>{const m=dueMeta(t.dueDate);return m&&m.diff<=0;}).sort((a,b)=>dueMeta(a.dueDate).diff-dueMeta(b.dueDate).diff);
    const myWeek=mine.filter(t=>{const m=dueMeta(t.dueDate);return m&&m.diff>=1&&m.diff<=7;}).sort((a,b)=>dueMeta(a.dueDate).diff-dueMeta(b.dueDate).diff);
    // THIS WEEK BY PERSON: delegated-out tasks due within a week (incl. overdue)
    const byPerson={};
    open.filter(t=>t.delegateTo && !isSelf(t.delegateTo)).forEach(t=>{const m=dueMeta(t.dueDate); if(m&&m.diff<=7){ (byPerson[t.delegateTo]=byPerson[t.delegateTo]||[]).push(t); }});
    const people=Object.entries(byPerson).map(([p,arr])=>[p,arr.sort((a,b)=>dueMeta(a.dueDate).diff-dueMeta(b.dueDate).diff)])
      .sort((a,b)=>b[1].length-a[1].length);
    const miniRow=t=>{const m=dueMeta(t.dueDate);return `<div class="mini-row"><div class="mini-chk" data-act="toggledone" data-id="${t.id}" title="Mark done">${I.check}</div><span class="mini-t" data-act="open" data-type="task" data-id="${t.id}">${esc(t.title)}</span>${t.delegateTo&&!isSelf(t.delegateTo)?`<span class="mini-own">${esc(ownerLabel(t.delegateTo))}</span>`:''}<span class="due ${m?m.cls:''}" style="font-size:12px">${m?esc(m.txt):''}</span></div>`;};
    return `<div class="page-title">${greet}, ${esc(meName)}</div>
    <div class="page-sub">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} · <b style="color:${c.attention?'#dc2626':'#16a34a'}">${c.attention} need${c.attention===1?'s':''} attention</b>${myDay.length?` · ${myDay.length} on your plate today`:''}</div>
    ${statsHTML()}
    <div class="dash-grid">
      <div class="panel">
        <div class="section-h">On your plate today ${myDay.length?`<span class="badge" style="margin-left:6px">${myDay.length}</span>`:''}</div>
        ${myDay.length?myDay.slice(0,10).map(miniRow).join('')+(myDay.length>10?`<div class="dash-more" data-act="stat" data-stat="attention">+ ${myDay.length-10} more →</div>`:'')
          :`<div class="dash-empty">Nothing of yours overdue or due today ✦</div>`}
      </div>
      <div class="panel">
        <div class="section-h">Your week ahead ${myWeek.length?`<span class="badge alt" style="margin-left:6px">${myWeek.length}</span>`:''}</div>
        ${myWeek.length?myWeek.slice(0,10).map(miniRow).join('')+(myWeek.length>10?`<div class="dash-more" data-act="view" data-view="tasks">+ ${myWeek.length-10} more →</div>`:'')
          :`<div class="dash-empty">Nothing of yours due in the next 7 days.</div>`}
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="section-h">This week, by person <span style="font-weight:500;color:#94a3b8;font-size:12.5px;margin-left:8px">overdue &amp; due within 7 days · click a name to work through their list</span></div>
      ${people.length?`<div class="dash-people">${people.map(([p,arr])=>{
        const over=arr.filter(t=>{const m=dueMeta(t.dueDate);return m&&m.diff<0;}).length;
        return `<div class="dash-person">
          <div class="dash-person-head" data-act="brief" data-person="${esc(p)}">
            <div class="avatar sm" style="background:#7c3aed">${esc(initials(p))}</div>
            <b>${esc(p)}</b><span class="dash-pn">${arr.length}</span>${over?`<span class="dash-po">${over} overdue</span>`:''}
          </div>
          <div class="dash-person-tasks">${arr.slice(0,5).map(t=>{const m=dueMeta(t.dueDate);return `<div class="mini-row"><div class="mini-chk" data-act="toggledone" data-id="${t.id}" title="Mark done">${I.check}</div><span class="mini-t" data-act="open" data-type="task" data-id="${t.id}">${esc(t.title)}</span><span class="due ${m?m.cls:''}" style="font-size:12px">${m?esc(m.txt):''}</span></div>`;}).join('')}${arr.length>5?`<div class="dash-more" data-act="brief" data-person="${esc(p)}">+ ${arr.length-5} more →</div>`:''}</div>
        </div>`;}).join('')}</div>`
        :`<div class="dash-empty">No one has tasks due this week — you're all caught up on delegated work ✦</div>`}
    </div>`;

  /* ================= DRAWERS ================= */
  function taskDrawer(t){
    const ac=catColor(t.category);
    const subs=t.subtasks||[];
    const sel=(field,opts,val)=>`<select data-field="t.${field}" data-id="${t.id}">${opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    const flow=filteredTasks(); const pos=flow.findIndex(x=>x.id===t.id);

          <span>${esc(s.title)}</span>

          <div class="field"><label>Delegated to</label><div class="inp-clear"><input data-field="t.delegateTo" data-id="${t.id}" value="${esc(t.delegateTo||'')}" placeholder="Who owns it?" list="ownerlist" autocomplete="off" ${tdLive(t)?'readonly title="Task Depot owns this while the task is over there"':''}>${t.delegateTo?`<button class="clr-x" data-act="clearowner" data-id="${t.id}" title="Clear owner">×</button>`:''}</div></div>
        </div>

        </div>

          ${t.logs.slice().reverse().map(l=>`<div class="log ${l.user?'usernote':''}">${mdBold(l.text)}<span class="lt">${fmtLong(l.createdAt)}</span></div>`).join('')}</div>`:'<div style="font-size:12.5px;color:#cbd5e1;margin-top:8px">Nothing logged yet.</div>'}

  /* ---------------- Task Depot bridge ---------------- */
  const TD_URL='https://taskdepot.myjohnstonesupplygroup.com/';
  function tdLive(t){ return !!(t.delegated && t.delegated.state==='delegated'); }
  function tdStateShort(t){ const d=t.delegated||{}; return d.state==='completed'?'Done':d.state==='returned'?'Back':d.state==='trashed'?'Trashed':(d.to&&d.to.name?d.to.name.split(' ')[0]:'Sent'); }
  function tdStateText(t){ const d=t.delegated||{};
    if(d.state==='completed') return `Completed in Task Depot by ${d.completedBy||(d.to&&d.to.name)||'them'} · ${fmtLong(d.completedAt||d.lastEventAt||d.sentAt)}`;
    if(d.state==='returned') return `Returned from Task Depot by ${d.returnedBy||'them'} · ${fmtLong(d.returnedAt)}${d.reason?' — '+d.reason:''}`;
    if(d.state==='trashed') return `Trashed in Task Depot · ${fmtLong(d.trashedAt||d.lastEventAt)}`;
    return `In Task Depot with ${(d.to&&d.to.name)||'someone'} since ${fmtLong(d.sentAt)}`; }
  function tdCardHTML(t){ const d=t.delegated; if(!d) return '';
    const st=d.state||'delegated';
    const label={delegated:'In Task Depot',completed:'Finished there',returned:'Returned to you',trashed:'Trashed there'}[st]||'Task Depot';
    const who=(d.to&&d.to.name)||'someone';
    return `<div class="td-card">
      <div class="td-h"><span class="td-logo">TD</span>Task Depot<span class="td-state ${esc(st)}">${esc(label)}</span></div>
      <div class="td-line">Sent to <b>${esc(who)}</b>${d.sentAt?` on ${esc(fmtLong(d.sentAt))}`:''}.</div>
      ${st==='completed'?`<div class="td-line"><b>${esc(d.completedBy||who)}</b> marked it done ${esc(fmtLong(d.completedAt||d.lastEventAt))}.</div>`:''}
      ${st==='returned'?`<div class="td-line"><b>${esc(d.returnedBy||who)}</b> sent it back ${esc(fmtLong(d.returnedAt))}.</div>
        ${d.reason?`<div class="td-why"><span>Why</span>${esc(d.reason)}</div>`:`<div class="td-line" style="color:#64748b">No reason given.</div>`}
        ${tdCommentsHTML(t)}`:''}
      ${st==='trashed'?`<div class="td-line">It was trashed over there ${esc(fmtLong(d.trashedAt||d.lastEventAt))} — nobody is working on it now.</div>`:''}
      <div class="td-line"><a href="${TD_URL}" target="_blank" rel="noopener">Open Task Depot ${I.arrow}</a></div>
    </div>`; }
  // "Eli" ~ "Eliseth Bahena": same first name, or one is a 3+ letter prefix of the other's first name
  function sameFirst(a,b){ const fa=String(a||'').trim().toLowerCase().split(/\s+/)[0], fb=String(b||'').trim().toLowerCase().split(/\s+/)[0]; if(!fa||!fb) return false;
    return fa===fb || (fa.length>=3 && fb.startsWith(fa)) || (fb.length>=3 && fa.startsWith(fb)); }
  function tdCommentsHTML(t){ const cs=(t.logs||[]).filter(l=>/^Task Depot · /.test(l.text||'')); if(!cs.length) return '';
    return `<div class="td-comments"><div class="td-ch">What they said over there</div>${cs.map(l=>`<div class="td-c">${esc(l.text.replace(/^Task Depot · /,''))}<span class="lt">${esc(fmtLong(l.createdAt))}</span></div>`).join('')}</div>`; }
  function tdPerson(name){ if(!name||isSelf(name)) return null; const k=String(name).trim().toLowerCase(); const ppl=U.tdPeople||[];
    return ppl.find(p=>p.name.toLowerCase()===k) || ppl.find(p=>nameSim(name,p.name)>=0.85) || ppl.find(p=>sameFirst(name,p.name)) || null; }
  function tdNudgeHTML(t){ if(t.type!=='task'||t.status==='done'||tdLive(t)) return ''; const p=tdPerson(t.delegateTo); if(!p) return '';
    return `<div class="td-nudge"><span class="td-logo" style="width:20px;height:20px;border-radius:5px;background:#1f3a7a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800">TD</span><span><b>${esc(p.name)}</b> is in Task Depot — hand this over so it lands in their queue?</span><button data-act="sendtd" data-id="${t.id}" data-pick="${esc(p.kind+':'+(p.id||p.email))}">Send it</button></div>`; }
  async function bridgeCall(body){
    const { data:{ session } }=await sb.auth.getSession();
    const res=await fetch(SB_URL+'/functions/v1/bridge',{ method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?session.access_token:''),'apikey':SB_KEY}, body:JSON.stringify(body) });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data&&data.error?data.error:'Task Depot did not answer');
    return data; }
  async function loadTdPeople(force){
    if(!force && U.tdPeople && U.tdPeopleAt && Date.now()-U.tdPeopleAt<10*60*1000) return U.tdPeople;
    try{ const d=await bridgeCall({action:'people'}); U.tdPeople=(d.people||[]).filter(p=>p.kind==='invitee' || String(p.email||'').toLowerCase()!==String(authUser&&authUser.email||'').toLowerCase()); U.tdPeopleAt=Date.now(); }
    catch(e){ U.tdPeopleErr=e.message; }
    return U.tdPeople||[]; }
  function tdKey(p){ return p.kind+':'+(p.id||p.email); }
  // the name she already uses for this person in Brain Dump ("Eli"), not Task Depot's full name
  function bdOwnerName(tdName, current){
    const k=String(tdName||'').trim().toLowerCase(); if(!k) return tdName;
    if(current && !isSelf(current) && (String(current).toLowerCase()===k || nameSim(current,tdName)>=0.5 || sameFirst(current,tdName))) return current;
    const names=allOwnerNames().filter(n=>!isSelf(n));
    return names.find(n=>n.toLowerCase()===k) || names.find(n=>nameSim(n,tdName)>=0.6) || names.find(n=>sameFirst(n,tdName)) || tdName; }
  function tdPeopleListHTML(){
    const q=(U.tdFilter||'').trim().toLowerCase();
    const ppl=(U.tdPeople||[]).filter(p=>!q || p.name.toLowerCase().includes(q) || String(p.email||'').toLowerCase().includes(q));
    if(U.tdPeopleBusy) return `<div style="padding:14px;color:#94a3b8;font-size:13px">Fetching the Task Depot roster…</div>`;
    if(!ppl.length) return `<div style="padding:14px;color:#94a3b8;font-size:13px">${U.tdPeopleErr?esc(U.tdPeopleErr):'Nobody matches.'}</div>`;
    return ppl.map(p=>{ const k=tdKey(p); const on=U.tdPick===k;
      return `<div class="td-person ${on?'on':''}" data-act="tdpick" data-pick="${esc(k)}"><div class="dup-radio ${on?'on blue':''}"></div>
        <div><div class="td-name">${esc(p.name)}</div><div class="td-mail">${esc(p.email||'')}</div></div>
        <span class="td-role ${p.kind==='invitee'?'invited':''}">${p.kind==='invitee'?'invited · not signed up yet':esc(p.role||'')}</span></div>`; }).join(''); }
  async function openSendTd(id, pick){
    const t=findTask(id); if(!t) return;
    U.modal='sendtd'; U.tdTask=id; U.tdFilter=''; U.tdBusy=false; U.tdPeopleBusy=!U.tdPeople; U.tdPick=pick||null; render();
    await loadTdPeople();
    U.tdPeopleBusy=false;
    if(!U.tdPick){ const p=tdPerson(t.delegateTo); if(p) U.tdPick=tdKey(p); }
    if(U.modal==='sendtd') render(); }
  async function sendToTd(){
    const t=findTask(U.tdTask); const p=(U.tdPeople||[]).find(x=>tdKey(x)===U.tdPick);
    if(!t||!p){ toast('Pick who gets it'); return; }
    U.tdBusy=true; render();
    try{
      const res=await bridgeCall({action:'send', taskId:t.id, assignee:{kind:p.kind,id:p.id||null,email:p.email||null,name:p.name}});
      const now=new Date().toISOString();
      t.delegated={ state:'delegated', to:{kind:p.kind,id:p.id||null,email:p.email||null,name:p.name}, tdTaskId:res.tdTaskId, sentAt:now };
      t.delegateTo=bdOwnerName(p.name, t.delegateTo); t.inbox=false; t.hasReply=false;
      t.status='done'; t.completedAt=now;
      addLog(t,`**Sent to Task Depot → ${p.name}**${res.attachments?` · ${res.attachments} file${res.attachments===1?'':'s'} copied`:''}${res.notified?' · they were emailed':(p.kind==='invitee'?' · they will see it when they sign up':'')}`);
      U.modal=null; U.tdBusy=false; U.drawer=null; persist(); render();
      toast(`Sent to ${p.name} in Task Depot`);
    }catch(e){ U.tdBusy=false; render(); toast(e.message||'Could not send'); }
  }
  function listDrawer(l){
    const ac=LISTC[l.color]||'#64748b'; const items=l.items||[];
    return {ac, head:`
      <div class="avatar" style="background:${soft(ac,.16)};color:${ac};font-size:20px">${l.emoji||'📝'}</div>
      <div style="flex:1;min-width:0"><div class="dtitle">${esc(l.title)}</div>
      ${l.description?`<div style="font-size:12.5px;color:#94a3b8;margin-top:3px">${esc(l.description)}</div>`:''}</div>
      <button class="close-x" data-act="close">×</button>`,
      body:`
      <div class="dcard">
      <div class="sub-list">${items.map(i=>`<div class="sub-row ${i.done?'on':''}">
        <div class="chk ${i.done?'on':''}" data-act="listtoggle" data-id="${l.id}" data-sid="${i.id}">${i.done?I.check:''}</div>
        <span>${esc(i.text)}</span>
        <button class="sub-del" data-act="listdel" data-id="${l.id}" data-sid="${i.id}">×</button>
      </div>`).join('')||'<div style="color:#94a3b8;padding:12px 4px">Empty list.</div>'}</div>
      <div class="addrow"><input placeholder="Add an item…" data-list-input="${l.id}"><button data-act="listadd" data-id="${l.id}">Add</button></div>
      </div>`,
      actions:`<button class="act ghost" data-act="close">Close</button>`};
  }
  function mentionDrawer(m){
    const ac='#7c3aed';
    return {ac, head:`
      <div class="avatar" style="background:${ac}">${esc(initials(m.delegateTo||'?'))}</div>
      <div style="flex:1;min-width:0"><input class="dtitle" data-field="t.title" data-id="${m.id}" value="${esc(m.title)}">
      <div style="font-size:12px;color:#94a3b8;margin-top:3px">Mention · bring up with this person</div></div>
      <button class="close-x" data-act="close">×</button>`,
      body:`
      <div class="dcard">
      <div class="field"><label>Person to mention it to</label><input data-field="t.delegateTo" data-id="${m.id}" value="${esc(m.delegateTo||'')}" placeholder="Who?"></div>
      <div class="field"><label>Notes</label><textarea data-field="t.notes" data-id="${m.id}" placeholder="Context…">${esc(m.notes||'')}</textarea></div>
      </div>
      <div style="font-size:11.5px;color:#cbd5e1;margin-top:4px;padding-left:2px">Added ${esc(fmtLong(m.createdAt))}</div>`,
      actions:`
      <button class="act done-btn" data-act="said" data-id="${m.id}">${I.check} Said it</button>
      <button class="act ghost" data-act="mention2task" data-id="${m.id}">${I.arrow} Make it a task</button>
      <button class="act ghost" data-act="archive" data-id="${m.id}">Archive</button>
      <button class="act danger" data-act="del" data-id="${m.id}">Delete</button>`};
  }
  function drawerHTML(){
    if(!U.drawer) return '';
    let d;
    if(U.drawer.type==='task'){ const t=S.tasks.find(x=>x.id===U.drawer.id); if(!t)return''; d=taskDrawer(t); }
    else if(U.drawer.type==='mention'){ const m=S.tasks.find(x=>x.id===U.drawer.id); if(!m)return''; d=mentionDrawer(m); }
    else { const l=S.lists.find(x=>x.id===U.drawer.id); if(!l)return''; d=listDrawer(l); }
    return `<div class="scrim show" data-act="close"></div>
      <div class="drawer show" style="--ac:${d.ac}">
        <div class="drawer-strip"></div>
        <div class="drawer-head">${d.head}</div>
        <div class="drawer-body">${d.body}</div>
        <div class="drawer-actions">${d.actions}</div>
      </div>`;
  }

  /* ================= MODAL (quick add / new task) ================= */
  function modalHTML(){
    if(U.modal==='whatsnew'){
      return `<div class="scrim show" data-act="closewhatsnew"></div><div class="modal"><div class="modal-card">
        <div class="modal-head"><div class="logo" style="width:30px;height:30px;border-radius:8px;font-size:13px">${I.spark}</div><b>What's new</b><span class="vpill" style="margin-left:auto">v${APP_VERSION}</span></div>
        <div class="modal-body scroll-body">
          ${CHANGELOG.map((c,i)=>`<div class="wn-block ${i>0?'old':''}">

        <div class="modal-head"><div class="logo" style="width:30px;height:30px;border-radius:8px;font-size:12px">${I.clock}</div><b>Triage dates</b><button class="close-x" data-act="closemodal" style="margin-left:auto">×</button></div>
        <div class="modal-body scroll-body">

          </div>
          ${list.length?`
            <div class="tri-top">
              <div class="rev-sum">${list.length} task${list.length===1?'':'s'} ${nodateMode?'with no due date':'past due'} · ${sel} selected</div>
              <button class="chip ${allOn?'on':''}" data-act="triageall" style="${allOn?'--cc:#dc2626':''}">${allOn?'Clear all':'Select all'}</button>
            </div>
            ${list.map(t=>{const m=dueMeta(t.dueDate); const on=!!U.triageSel[t.id];
              return `<div class="tri-row ${on?'on':''}" data-act="triagetoggle" data-id="${t.id}">
                <div class="rev-chk ${on?'on':''}">${on?I.check:''}</div>
                <div class="rev-main"><div class="rev-title" style="border:none;padding:0">${esc(t.title)}</div>
                <div class="dup-meta">${esc(ownerLabel(t.delegateTo))} · ${esc(t.category)} · ${m?`<span style="color:#dc2626">${esc(fmtDateY(t.dueDate))} · ${Math.abs(m.diff)}d overdue</span>`:`<span style="color:#94a3b8">no date · added ${esc(fmtLong(t.createdAt))}</span>`}</div></div>
              </div>`;}).join('')}
          `:`<div class="empty" style="margin:10px 0"><b>${nodateMode?'Everything has a date ✨':'Nothing overdue ✨'}</b>${nodateMode?'No undated tasks left to schedule.':'Your dates are all current.'}</div>`}
        </div>
        <div class="modal-foot" style="flex-wrap:wrap;justify-content:flex-start;gap:8px">
          <span style="font-size:12px;color:#94a3b8;font-weight:600;margin-right:auto">${sel} selected · set date to:</span>
          <button class="btn-ghost sm" data-act="closemodal">Done</button>
          ${nodateMode?`
            <button class="btn-ghost sm" data-act="triageapply" data-when="today" ${sel?'':'disabled'}>Today</button>
            <button class="btn-ghost sm" data-act="triageapply" data-when="thisweek" ${sel?'':'disabled'}>This week</button>
            <button class="btn-ghost sm" data-act="triageapply" data-when="nextweek" ${sel?'':'disabled'}>Next week</button>
            <button class="btn-primary sm" data-act="triageapply" data-when="snooze" ${sel?'':'disabled'}>In a month</button>
          `:`
            <button class="btn-ghost sm" data-act="triageapply" data-when="clear" ${sel?'':'disabled'}>Clear date</button>
            <button class="btn-ghost sm" data-act="triageapply" data-when="thisweek" ${sel?'':'disabled'}>This week</button>
            <button class="btn-ghost sm" data-act="triageapply" data-when="nextweek" ${sel?'':'disabled'}>Next week</button>
            <button class="btn-primary sm" data-act="triageapply" data-when="snooze" ${sel?'':'disabled'}>Snooze 1 mo</button>

      const subs=(t.subtasks||[]).length, atts=(t.attachments||[]).length, links=(t.paperTrail||[]).filter(x=>x.kind==='link').length;
      const travels=['title', t.topic?'topic headline':null, t.notes?'notes':null, subs?`${subs} subtask${subs===1?'':'s'}`:null, t.dueDate?'due date':null, 'priority', atts?`${atts} attachment${atts===1?'':'s'}`:null, links?`${links} document link${links===1?'':'s'}`:null].filter(Boolean);
      return `<div class="scrim show" data-act="closemodal"></div><div class="modal"><div class="modal-card">
        <div class="modal-head"><div class="logo" style="width:30px;height:30px;border-radius:8px;font-size:11px;background:#1f3a7a">TD</div><b>Send to Task Depot</b></div>
        <div class="modal-body scroll-body">
          <div class="pf-note" style="margin:0 0 12px"><b>${esc(t.title)}</b><br>Pick who gets it. It lands in their Task Depot queue as a new task from you, and this copy moves to Done with a breadcrumb.</div>
          <input class="td-search" placeholder="Search people…" data-tdfilter value="${esc(U.tdFilter||'')}" autocomplete="off">
          <div class="td-people" data-tdlist>${tdPeopleListHTML()}</div>
          <div class="td-travel"><b>What travels:</b> ${travels.join(', ')}.${t.emailBody?' <b>Stays here:</b> the email history.':''}</div>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" data-act="closemodal" ${U.tdBusy?'disabled':''}>Cancel</button>
          <button class="btn-primary" data-act="tdsend" ${(pick&&!U.tdBusy)?'':'disabled'}>${U.tdBusy?'Sending…':(pick?`Send to ${esc(pick.name.split(' ')[0])}`:'Send')}</button>
        </div>
      </div></div>`;
    }
    if(U.modal==='combine'){
      const ids=Object.keys(U.selIds||{}).filter(k=>U.selIds[k]&&findTask(k));
      const parent=U.combineParent;
      const rowMeta=t=>{const m=dueMeta(t.dueDate);return `${esc(t.category)}${t.location&&t.location!=='Office'?' · '+esc(t.location):''}${m?' · '+esc(fmtDateY(t.dueDate)):' · no date'}`;};
      const foldCount=ids.filter(id=>id!==parent).length;
      return `<div class="scrim show" data-act="closemodal"></div><div class="modal"><div class="modal-card">
        <div class="modal-head"><div class="logo" style="width:30px;height:30px;border-radius:8px;font-size:12px">${I.arrow}</div><b>Combine tasks</b></div>
        <div class="modal-body scroll-body">
          <div class="pf-note" style="margin:0 0 12px">Pick the <b>main task</b> (tap its circle). The other ${foldCount===1?'one folds':foldCount+' fold'} in as subtask${foldCount===1?'':'s'} — nothing is lost.</div>
          <div class="dup-grp consol">
            ${ids.map(id=>{const t=findTask(id); if(!t)return''; const keep=parent===id;
              return `<div class="dup-row ${keep?'keep blue':''}">
                <div class="dup-radio ${keep?'on blue':''}" data-act="combineparent" data-id="${id}"></div>
                <div class="dup-main" data-act="combineparent" data-id="${id}"><div class="dup-title">${esc(t.title)}</div>
                <div class="dup-meta">${rowMeta(t)}${(t.subtasks&&t.subtasks.length)?' · '+t.subtasks.length+' steps':''}</div></div>
                ${keep?`<span class="dup-keeptag" style="color:#0369a1">Main</span>`:`<span class="dup-keeptag" style="color:#94a3b8">folds in</span>`}
              </div>`;}).join('')}
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" data-act="closemodal">Cancel</button>
          <button class="btn-primary" data-act="combineresolve" ${foldCount?'':'disabled'}>Fold ${foldCount||''} into main</button>
        </div>
      </div></div>`;
    }
    if(U.modal==='dupes'){
      const groups=U.dupeGroups||[]; const consol=U.dupeConsol||[];
      const total=groups.reduce((s,g)=>s+g.length,0);
      const refineBtn=`<button class="ai-btn" data-act="duperefine" ${U.dupeBusy?'disabled':''}>${U.dupeBusy?`<span class="spin"></span>Reviewing…`:`${I.spark}${U.dupeRan?'Re-run AI':'Refine with AI'}`}</button>`;
      const rowMeta=t=>{const m=dueMeta(t.dueDate);return `${esc(t.category)}${t.location&&t.location!=='Office'?' · '+esc(t.location):''}${m?' · '+esc(fmtDateY(t.dueDate)):' · no date'}`;};
      const dupSection = groups.length?`
        <div class="dup-h">${I.flag} Duplicates <span class="dup-hn">${groups.length}</span></div>
        ${groups.map((g,gi)=>`<div class="dup-grp">
          ${g.map(id=>{const t=findTask(id); if(!t)return''; const keep=U.dupeKeep[gi]===id;
            return `<div class="dup-row ${keep?'keep':''}" data-act="dupkeep" data-gi="${gi}" data-id="${id}">
              <div class="dup-radio ${keep?'on':''}"></div>
              <div class="dup-main"><div class="dup-title">${esc(t.title)}${dupeInBoth(id)?`<span class="xwarn" title="Also in a consolidation group">${I.flag} also below</span>`:''}</div>
              <div class="dup-meta">${rowMeta(t)}</div></div>
              ${keep?`<span class="dup-keeptag">Keep</span>`:''}
            </div>`;}).join('')}
          <div class="dup-actions">
            <button class="btn-ghost sm" data-act="dupdismiss" data-gi="${gi}">Not duplicates</button>
            <button class="btn-primary sm" data-act="dupresolve" data-gi="${gi}">Keep selected, archive rest</button>
          </div>
        </div>`).join('')}`:'';
      const consolSection = consol.length?`
        <div class="dup-h" style="margin-top:8px">${I.spark} Consolidations <span class="dup-hn" style="background:#e0f2fe;color:#0369a1">${consol.length}</span></div>
        <div class="pf-note" style="margin:-4px 0 12px">Pick one as the parent (tap its circle). The rest fold in as subtasks. Use <b>Skip</b> to leave a task out of the merge, or <b>✓ Done</b> to complete a task on its own.</div>
        ${consol.map((g,gi)=>{const skip=U.dupeConsolSkip[gi]||{}; const mergingCount=g.filter(id=>id!==U.dupeConsolKeep[gi]&&!skip[id]).length; return `<div class="dup-grp consol">
          ${g.map(id=>{const t=findTask(id); if(!t)return''; const keep=U.dupeConsolKeep[gi]===id; const isSkip=!!skip[id];
            return `<div class="dup-row ${keep?'keep blue':''} ${isSkip?'skip':''}">
              <div class="dup-radio ${keep?'on blue':''}" data-act="consolkeep" data-gi="${gi}" data-id="${id}"></div>
              <div class="dup-main" data-act="consolkeep" data-gi="${gi}" data-id="${id}"><div class="dup-title">${esc(t.title)}${dupeInBoth(id)?`<span class="xwarn" title="Also flagged as a duplicate above">${I.flag} also above</span>`:''}</div>
              <div class="dup-meta">${rowMeta(t)}</div></div>
              <div class="dup-rowbtns">
                ${keep?`<span class="dup-keeptag" style="color:#0369a1">Parent</span>`
                  :`<button class="dup-mini ${isSkip?'off':'on'}" data-act="consolskip" data-gi="${gi}" data-id="${id}">${isSkip?'Skipped':'Merging'}</button>
                    <button class="dup-mini done" data-act="consoldone" data-gi="${gi}" data-id="${id}" title="Mark this task complete">${I.check} Done</button>`}
              </div>
            </div>`;}).join('')}
          <div class="dup-actions">
            <button class="btn-ghost sm" data-act="consoldismiss" data-gi="${gi}">Not related</button>
            <button class="btn-primary sm" data-act="consolresolve" data-gi="${gi}" ${mergingCount?'':'disabled'}>Merge ${mergingCount||''} into parent</button>
          </div>
        </div>`;}).join('')}`:'';
      const nest=U.dupeNest||[];
      const nestSection = nest.length?`
        <div class="dup-h" style="margin-top:8px">${I.arrow} Fold into a parent <span class="dup-hn" style="background:#dcfce7;color:#166534">${nest.length}</span></div>
        <div class="pf-note" style="margin:-4px 0 12px">Each task on the left is really a step of a bigger task on the right. Fold it in as a subtask — or flip the direction if it's backwards.</div>
        ${nest.map((p,ni)=>{const c=findTask(p.child), par=findTask(p.parent); if(!c||!par)return''; return `<div class="dup-grp nest">
          <div class="nest-pair">
            <div class="nest-box"><div class="dup-title">${esc(c.title)}</div><div class="dup-meta">${rowMeta(c)}</div></div>
            <div class="nest-arrow">${I.arrow}<span>into</span></div>
            <div class="nest-box parent"><div class="dup-title">${esc(par.title)}</div><div class="dup-meta">${rowMeta(par)}${(par.subtasks&&par.subtasks.length)?' · '+par.subtasks.length+' steps':''}</div></div>
          </div>
          <div class="dup-actions">
            <button class="btn-ghost sm" data-act="nestdismiss" data-ni="${ni}">Not related</button>
            <button class="btn-ghost sm" data-act="nestswap" data-ni="${ni}">⇄ Flip</button>
            <button class="btn-primary sm" data-act="nestresolve" data-ni="${ni}">Fold in as subtask</button>
          </div>
        </div>`;}).join('')}`:'';
      const nothing = !groups.length && !consol.length && !nest.length;
      return `<div class="scrim show" data-act="closemodal"></div><div class="modal"><div class="modal-card">
        <div class="modal-head"><div class="logo" style="width:30px;height:30px;border-radius:8px;font-size:12px">${I.spark}</div><b>${U.dupeBatch?'Related to what you just added':'Cleanup'}</b></div>
        <div class="modal-body scroll-body">
          ${U.dupeBatch?`<div class="pf-note" style="margin:0 0 12px">Your tasks were added. These look related to ones you already have — merge or fold in, or just tap Done to keep them all.</div>`:`<div class="act-seg" style="margin:0 0 12px">
            <button class="${U.dupeScope==='filtered'?'':'on'}" data-act="dupescope" data-scope="all">All open tasks ${activeTasks().filter(t=>t.status!=='done').length}</button>
            <button class="${U.dupeScope==='filtered'?'on':''}" data-act="dupescope" data-scope="filtered">Current filter ${filteredTasks().filter(t=>t.status!=='done'&&!t.archived).length}</button>
          </div>`}
          <div class="dup-top">
            <div class="rev-sum">${U.dupeBusy?'<span class="spin"></span> Reviewing all tasks with AI… (this can take 20–30 seconds)':(nothing?(U.dupeRan?(U.dupeBatch?'Nothing looked related — all set':'AI found no duplicates or overlaps'):'Quick scan found no exact matches'):`${groups.length} duplicate · ${consol.length} consolidation · ${nest.length} to fold`)}</div>
            ${(U.dupeBusy||U.dupeBatch)?'':refineBtn}
          </div>
          ${dupSection}${consolSection}${nestSection}
          ${(nothing&&!U.dupeBusy)?`<div class="empty" style="margin:10px 0"><b>${U.dupeRan?'Looks clean ✨':'Scanning…'}</b>${U.dupeRan?'The AI reviewed every task and didn’t find duplicates or things worth merging.':'Running the AI semantic pass now.'}</div>`:''}
        </div>
        <div class="modal-foot"><button class="btn-ghost" data-act="closemodal">Done</button></div>
      </div></div>`;
    }
    return '';
  }

  /* ================= RENDER ================= */
  function viewHTML(){
    switch(U.view){
      case 'dashboard': return dashboardView();
      case 'attention': U.view='tasks'; U.tab='attention'; return tasksView();
      case 'review': return reviewView();
      case 'lists': return listsView();
      case 'dumps': return dumpsView();
      case 'mentions': return mentionsView();
      case 'inbox': return inboxView();
      default: return tasksView();
    }
  }
  function bannerHTML(){
    if(!U.backupNag) return '';
    return `<div class="nag"><span>${I.flag} It's been a while since your last backup — keep your Brain Dump safe.</span>
      <span class="nag-btns"><button class="nag-x" data-act="exportnag">Back up now</button><button class="nag-dismiss" data-act="dismissnag">Later</button></span></div>`;
  }
  function render(){
    // preserve the open modal's scroll position so in-place actions don't jump to top
    const prevBody=document.querySelector('.modal .scroll-body');
    const prevScroll=prevBody?prevBody.scrollTop:null;
    document.getElementById('app').innerHTML = navHTML()+`<div class="wrap">${bannerHTML()}${viewHTML()}</div>`;
    document.getElementById('overlay').innerHTML = drawerHTML()+modalHTML();
    if(prevScroll!=null){ const nb=document.querySelector('.modal .scroll-body'); if(nb) nb.scrollTop=prevScroll; }
  }

  /* ================= TOAST (with optional undo) ================= */
  let toastT=null, undoFn=null;
  function toast(msg, undo){
    const el=document.getElementById('toast'); undoFn=undo||null;
    el.innerHTML = `<span>${esc(msg)}</span>`+(undo?`<button class="toast-undo" data-act="undo">Undo</button>`:'');
    el.classList.add('show'); clearTimeout(toastT);
    toastT=setTimeout(()=>{ el.classList.remove('show'); undoFn=null; }, undo?6500:2200);
  }

  /* ================= ACTIONS ================= */
  function findTask(id){ return S.tasks.find(t=>t.id===id); }
  function addLog(t,text){ (t.logs=t.logs||[]).push({text,createdAt:new Date().toISOString()}); }
  function addNote(id,text){
    const t=findTask(id); const v=String(text||'').trim(); if(!t||!v) return false;
    (t.logs=t.logs||[]).push({text:v, createdAt:new Date().toISOString(), user:true});
    persist(); return true;
  }
  function recentNotes(days){
    const cut=Date.now()-(days||7)*86400000;
    return (S.tasks||[]).map(t=>({t, notes:(t.logs||[]).filter(l=>l.user && new Date(l.createdAt).getTime()>=cut)}))
      .filter(x=>x.notes.length);
  }
  function personRecap(p){
    const key=String(p).toLowerCase();
    const {mentions,tasks}=personItems(p);
    const ids=new Set([].concat(mentions,tasks).map(x=>x.id));
    const rows=recentNotes(7).filter(x=>ids.has(x.t.id) || String(x.t.delegateTo||'').toLowerCase()===key);
    if(!rows.length) return '';
    const d=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    return `Notes with ${p} — week of ${d}\n\n`+rows.map(x=>
      `${x.t.title}\n`+x.notes.map(n=>`  · ${fmtLong(n.createdAt)} — ${n.text}`).join('\n')
    ).join('\n\n');
  }

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]'); 
    if(U.menu && !e.target.closest('.menu') && !(el&&el.dataset.act==='menu')) { U.menu=false; render(); }
    if(U.more && !e.target.closest('.menu') && !(el&&el.dataset.act==='more')) { U.more=false; render(); }
    if(!el) return;
    const a=el.dataset.act, id=el.dataset.id;
    switch(a){
      case 'view': U.view=el.dataset.view; if(el.dataset.preset){ U.tab=el.dataset.preset; U.status=''; U.deleg=''; U.cat=''; U.loc=''; U.q=''; } U.selMode=false; U.selIds={}; U.menu=false; U.more=false; render(); break;
      case 'menu': U.menu=!U.menu; U.more=false; render(); break;
      case 'more': U.more=!U.more; U.menu=false; render(); break;
      case 'stat':{ U.view='tasks'; const s=el.dataset.stat;
        if(s==='deleg'){ U.deleg='__out__'; U.status=''; U.tab='open'; }
        else { U.deleg=''; U.status=''; U.tab=statTab(s); }
        render(); break; }
      case 'tab': U.tab=(U.tab===el.dataset.tab)?'open':el.dataset.tab; render(); break;
      case 'clearfilters': U.q=''; U.tab='open'; U.cat=''; U.loc=''; U.deleg=''; U.status=''; render(); break;
      case 'open':{ U.drawer={type:el.dataset.type,id}; const ot=findTask(id); if(ot&&ot.hasReply){ ot.hasReply=false; persist(); } render(); break; }
      case 'close': U.drawer=null; render(); break;
      case 'closemodal': resetDump(); render(); break;
      case 'modal': U.modal=el.dataset.modal; if(el.dataset.modal==='dump'){U.dumpText='';U.aiBusy=false;U.dumpStep='input';U.preQs=[];U.preAns='';U.preAnsMap={};U.extracted=null;} render(); break;
      case 'newtask': U.modal="newtask"; U.menu=false; U.more=false; render(); break;
      case 'newmention': U.modal="newmention"; U.menu=false; U.more=false; render(); break;
      case 'said':{ const t=findTask(id); if(t){ t.discussedAt=new Date().toISOString(); t.status='done'; addLog(t,'Said it'); U.drawer=null; persist(); render(); toast('Nice — marked as said'); } break; }
      case 'savemention': saveMention(); break;
      case 'newlist': U.modal='newlist'; U.menu=false; U.more=false; render(); break;
      case 'savelist': saveList(); break;
      case 'toggledone':{ const t=findTask(id); t.status=t.status==='done'?'open':'done'; t.completedAt=t.status==='done'?new Date().toISOString():null; addLog(t,t.status==='done'?'Marked done':'Reopened'); persist(); render(); break; }
      case 'pin':{ const t=findTask(id); t.pinned=!t.pinned; persist(); render(); break; }
      case 'del':{ const idx=S.tasks.findIndex(t=>t.id===id); if(idx<0)break; const rm=S.tasks[idx]; const wasMention=rm&&rm.type==='mention'; S.tasks.splice(idx,1); U.drawer=null; persist(); render(); toast(wasMention?'Mention deleted':'Task deleted', ()=>{ S.tasks.splice(Math.min(idx,S.tasks.length),0,rm); persist(); render(); }); break; }
      case 'subtoggle':{ const t=findTask(id); const s=t.subtasks.find(x=>x.id===el.dataset.sid); s.done=!s.done; s.completedAt=s.done?new Date().toISOString():null; persist(); render(); break; }
      case 'subdel':{ const t=findTask(id); t.subtasks=t.subtasks.filter(x=>x.id!==el.dataset.sid); persist(); render(); break; }
      case 'subadd':{ const inp=document.querySelector(`[data-sub-input="${id}"]`); const v=inp.value.trim(); if(v){ const t=findTask(id); (t.subtasks=t.subtasks||[]).push({id:uid(),title:v,done:false,createdAt:new Date().toISOString()}); persist(); render(); } break; }
      case 'listtoggle':{ const l=S.lists.find(x=>x.id===id); const it=l.items.find(x=>x.id===el.dataset.sid); it.done=!it.done; it.doneAt=it.done?new Date().toISOString():null; persist(); render(); break; }
      case 'listdel':{ const l=S.lists.find(x=>x.id===id); l.items=l.items.filter(x=>x.id!==el.dataset.sid); persist(); render(); break; }
      case 'listadd':{ const inp=document.querySelector(`[data-list-input="${id}"]`); const v=inp.value.trim(); if(v){ const l=S.lists.find(x=>x.id===id); (l.items=l.items||[]).push({id:uid(),text:v,done:false,createdAt:new Date().toISOString()}); persist(); render(); } break; }
      case 'altloc':{ const t=findTask(id); const loc=el.dataset.loc; t.additionalLocations=t.additionalLocations||[]; const i=t.additionalLocations.indexOf(loc); if(i>=0)t.additionalLocations.splice(i,1); else t.additionalLocations.push(loc); persist(); render(); break; }
      case 'aicleanup':{ break; }  /* retired — Process with AI now covers cleanup */
      case 'aiprocess':{ runPreflight(); break; }
      case 'pfback':{ U.dumpStep='input'; render(); break; }
      case 'pfcontinue':{ runExtract(); break; }
      case 'exback':{ U.dumpStep='input'; U.extracted=null; render(); break; }
      case 'extoggle':{ const i=+el.dataset.idx; if(U.extracted&&U.extracted[i]){ U.extracted[i].action=(U.extracted[i].action==='skip')?'create':'skip'; render(); } break; }
      case 'exaction':{ const i=+el.dataset.idx; if(U.extracted&&U.extracted[i]){ U.extracted[i].action=el.dataset.val; render(); } break; }
      case 'exremove':{ const i=+el.dataset.idx; if(U.extracted){ U.extracted.splice(i,1); if(!U.extracted.length){ U.dumpStep='input'; toast('All suggestions cleared'); } render(); } break; }
      case 'extype':{ const i=+el.dataset.idx; const x=U.extracted&&U.extracted[i]; if(x){
        if(x.type==='mention'){ x.type='task'; x.category=(x.category==='Personal')?'Operations':x.category; x.delegateTo='KGC'; if(!validDate(x.dueDate))x.dueDate=whenDate('week'); }
        else { x.type='mention'; x.person=x.person||((x.delegateTo&&!isSelf(x.delegateTo))?x.delegateTo:''); x.dueDate=''; x.subtasks=[]; }
        render(); } break; }
      case 'exsubdel':{ const i=+el.dataset.idx, si=+el.dataset.sidx; const x=U.extracted&&U.extracted[i]; if(x&&x.subtasks){ x.subtasks.splice(si,1); render(); } break; }
      case 'createex':{ createExtracted(); break; }
      case 'finddupes':{ openDupes('all'); break; }
      case 'dupescope':{ openDupes(el.dataset.scope); break; }
      case 'mergeinto':{ U.mergeSrc=id; U.mergeQ=''; U.modal='mergeinto'; render(); break; }
      case 'domerge':{ const parent=findTask(id); const child=findTask(U.mergeSrc);
        if(parent&&child){ const before=snapTasks([parent.id,child.id]); foldInto(parent,child);
          addLog(parent,'Merged in "'+child.title+'"');
          U.modal=null; U.mergeSrc=null; U.drawer={type:'task',id:parent.id}; persist(); render();
          toast('Merged into "'+parent.title.slice(0,28)+'"', ()=>{ restoreTasks(before); U.drawer=null; persist(); render(); });
        } break; }
      case 'triage':{ U.triageSel={}; U.triageMode=el.dataset.mode||'over'; U.menu=false; U.more=false; U.modal='triage'; render(); break; }
      case 'triagemode':{ U.triageMode=el.dataset.mode; U.triageSel={}; render(); break; }
      case 'triagetoggle':{ U.triageSel[id]=!U.triageSel[id]; render(); break; }
      case 'triageall':{ const open=activeTasks().filter(t=>t.status!=='done');
        const list=(U.triageMode==='nodate')?open.filter(t=>!validDate(t.dueDate)):open.filter(t=>{const m=dueMeta(t.dueDate);return m&&m.diff<0;});
        const allOn=list.length>0&&list.every(t=>U.triageSel[t.id]); U.triageSel={}; if(!allOn) list.forEach(t=>U.triageSel[t.id]=true); render(); break; }
      case 'triageapply':{ triageApply(el.dataset.when); break; }
      case 'clearowner':{ const t=findTask(id); if(t){ const prev=t.delegateTo; t.delegateTo=''; addLog(t,'Owner cleared'); persist(); render(); toast('Owner cleared', ()=>{ t.delegateTo=prev; persist(); render(); }); } break; }
      case 'reassign':{ const t=findTask(id); if(t){ const prev=t.delegateTo; const who=el.dataset.who; t.delegateTo=who; addLog(t,who?('Reassigned to '+who):'Owner cleared'); persist(); render(); toast(who?('Reassigned to '+ownerLabel(who)):'Unassigned', ()=>{ t.delegateTo=prev; persist(); render(); }); } break; }
      case 'setcat':{ const t=findTask(id); if(t){ const prev=t.category; t.category=el.dataset.val; persist(); render(); toast('Category: '+el.dataset.val, ()=>{ t.category=prev; persist(); render(); }); } break; }
      case 'setloc':{ const t=findTask(id); if(t){ const prev=t.location; t.location=el.dataset.val; persist(); render(); toast('Location: '+el.dataset.val, ()=>{ t.location=prev; persist(); render(); }); } break; }
      case 'quickdate':{ const t=findTask(id); if(t){ const prev=t.dueDate; t.dueDate=whenDate(el.dataset.when); persist(); render(); toast('Date updated', ()=>{ t.dueDate=prev; persist(); render(); }); } break; }
      case 'startreview':{ startReview(); break; }
      case 'selstart':{ U.selMode=true; U.selIds={}; U.menu=false; U.more=false; render(); break; }
      case 'selcancel':{ U.selMode=false; U.selIds={}; render(); break; }

  async function callClaude(prompt, maxTokens){
    const { data:{ session } }=await sb.auth.getSession();
    const token=session?.access_token;
    const res=await fetch(SB_URL+'/functions/v1/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SB_KEY},
      body:JSON.stringify({ prompt, maxTokens:maxTokens||1200 })
    });
    const data=await res.json();
    if(!res.ok){ throw new Error(data&&data.error?data.error:'AI request failed'); }
    return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  }
  function stripFences(s){ return s.replace(/```json/gi,'').replace(/```/g,'').trim(); }
