<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --navy:#1f3a7a; --navy-ink:#152b5c; --red:#c62828; --red-soft:#fdecec;
  --ink:#1c1f26; --muted:#5f6675; --line:#dfe3ea; --paper:#f6f7f9; --white:#fff;
  --ok:#2e7d32; --ok-soft:#e8f4ea; --warn:#b26a00; --warn-soft:#fff4e0;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
h1,h2,h3{margin:0;line-height:1.2}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top .bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex:0 0 auto;white-space:nowrap}
.brand i{display:inline-block;width:10px;height:10px;background:var(--red);transform:rotate(45deg)}
.nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end;row-gap:4px}
.nav button{background:transparent;border:0;color:#d9e0f0;padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-weight:500}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}
.nav button .pin{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px;font-weight:600}
.who{color:#cfd7ea;font-size:13px;white-space:nowrap;flex:0 0 auto;order:9}
.who button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 8px;margin-left:8px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.h h2{font-size:20px;font-weight:600}
.h .sub{color:var(--muted);font-size:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 2px rgba(20,26,40,.05), 0 10px 22px -16px rgba(20,26,40,.3)}
/* a Home group carries the colour of why it needs you, set by its Fold */
.edge-red>.card,.edge-warn>.card,.edge-navy>.card,.edge-ok>.card,.edge-purple>.card,.edge-grey>.card{border-left:4px solid var(--edge,#c3cbdb)}
.attn{border-left:4px solid var(--red)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.row:first-child{border-top:0}
.row:hover{background:#fafbfd}
.row .t{font-weight:500}
.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.row .why{font-size:13px;font-weight:600;color:var(--red);text-align:right}
.row .why.ok{color:var(--ok)} .row .why.warn{color:var(--warn)} .row .why.navy{color:var(--navy)}
.counts{display:flex;gap:0;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:10px}
.counts button{flex:1;border:0;background:transparent;padding:12px 8px;cursor:pointer;border-left:1px solid var(--line);text-align:center}
.counts button:first-child{border-left:0}
.counts b{display:block;font-size:22px;font-weight:600}
.counts span{font-size:12px;color:var(--muted)}
.counts button.on{background:#eef2fa}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:12px;background:#eef0f4;color:var(--muted);font-weight:500}
.pill.not_started{background:#eef0f4} .pill.working{background:#e6edfb;color:var(--navy)} .pill.waiting{background:var(--warn-soft);color:var(--warn)}
.pill.ready_for_review{background:#efe8fb;color:#5b3fa0} .pill.done{background:var(--ok-soft);color:var(--ok)} .pill.skipped{background:#eef0f4;color:var(--muted)}
.pill.high{background:var(--red-soft);color:var(--red)}
.pill.origin{background:#efe9fb;color:#5b3fa0;border:1px solid #d9cdf2;font-weight:600}
.pill.origin.own{background:#e0f2ee;color:#1f6f63;border-color:#bfe3db}
.empty{padding:26px 14px;color:var(--muted);text-align:center}
.btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.q{background:transparent;border-color:transparent;color:var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0 4px}
.big button{border:0;border-radius:var(--radius);padding:16px 6px;font-weight:700;font-size:15px;cursor:pointer;color:#fff}
.big .done{background:var(--ok)} .big .upd{background:var(--navy)} .big .blk{background:var(--warn)} .big .help{background:var(--red)}
.big .rev{background:#5b3fa0}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;width:100%}
.form textarea{min-height:84px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.four{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.modalbg{position:fixed;inset:0;background:rgba(20,26,40,.45);z-index:40;display:flex;align-items:stretch;justify-content:flex-end;animation:fade .15s ease-out}
/* The drawer reads as a file pulled from a drawer: a coloured spine down the left
   edge in its status's colour, a tinted band at the top so the colour means
   something, and enough shadow that it sits above the page rather than on it. */
.modal{background:var(--paper);width:100%;max-width:560px;height:100%;overflow:auto;
  border-radius:16px 0 0 16px;padding:18px 18px 28px;
  border-left:8px solid var(--tab,var(--navy));
  box-shadow:-18px 0 44px rgba(20,26,40,.28), -1px 0 0 rgba(255,255,255,.7) inset;
  animation:slidein .2s ease-out;padding-top:calc(18px + env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
/* the band bleeds to the drawer's edges, so it meets the spine with no seam */
.modal .spine{margin:-18px -18px 14px -18px;padding:11px 18px;
  margin-top:calc(-18px - env(safe-area-inset-top,0px));
  padding-top:calc(11px + env(safe-area-inset-top,0px));
  background:var(--tabwash,#eef2fb);border-bottom:1px solid rgba(20,26,40,.08);
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--tab,var(--navy))}
.modal .spine .spine-sub{font-weight:600;letter-spacing:.3px;text-transform:none;
  font-size:12px;color:var(--muted)}
/* the watch toggle lives in the band so it sits in the same place on every drawer */
.modal .spine .eye{background:none;border:0;cursor:pointer;line-height:0;
  padding:3px 5px;border-radius:6px;color:var(--muted);
  display:inline-flex;align-items:center}
.modal .spine .eye svg{display:block}
.modal .spine .eye:hover{background:rgba(20,26,40,.08);color:var(--tab,var(--navy))}
.modal .spine .eye.on{color:var(--tab,var(--navy))}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel.tint{background:#f2f5fb;border-color:#dde4f2}
/* Inside a drawer the blocks sit up off the page, each with its own coloured edge so
   the eye can find a section without reading the headings. The task block borrows the
   status colour the drawer is already wearing. */
.modal .panel,.panel.edged{border-left:4px solid var(--edge,#c3cbdb);border-radius:12px;
  box-shadow:0 1px 2px rgba(20,26,40,.06), 0 10px 22px -14px rgba(20,26,40,.35)}
.edge-red{--edge:var(--red)} .edge-warn{--edge:#c9821f} .edge-navy{--edge:var(--navy)}
.edge-ok{--edge:var(--ok)} .edge-purple{--edge:#5340a3} .edge-grey{--edge:#9aa3b2}
.modal .panel.edge-main{--edge:var(--tab,var(--navy))}
.modal .panel.edge-steps{--edge:#c9821f}
.modal .panel.edge-linked{--edge:#5340a3}
.modal .panel.edge-talk{--edge:#1b6482}
.modal .ai{border-left:4px solid #5340a3;border-radius:12px;
  box-shadow:0 1px 2px rgba(20,26,40,.06), 0 10px 22px -14px rgba(20,26,40,.35)}
.week{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:90px}
.day.today{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.day.weekend{background:#f2f4f7}
.day h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.day h4 b{color:var(--ink);font-size:13px;text-transform:none;letter-spacing:0}
.chiptask{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--navy);background:#f6f7f9;border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font:inherit;font-size:13px;line-height:1.35}
.chiptask:hover{background:#eef2fa}
.chiptask .who{display:block;font-size:11px;font-weight:700;margin-bottom:2px}
.who-key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;font-size:13px}
.who-key span{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.who-key i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:640px){.week{grid-template-columns:1fr}.day{min-height:0}}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters input{flex:2 1 180px;min-width:140px}
.filters select{flex:1 1 140px;min-width:120px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
@media (max-width:640px){.filters input{flex:1 1 100%}.filters select{flex:1 1 calc(50% - 4px)}}
.panel h3{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:640px){.modal{max-width:100%;border-radius:0;border-left-width:6px}.kv{grid-template-columns:100px 1fr}}
.modal h2{font-size:19px;font-weight:600;margin-bottom:12px}
.modal .x{position:sticky;top:0;float:right;background:#fff;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.detail dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0 0 14px;font-size:14px}
.detail dt{color:var(--muted)} .detail dd{margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0}
.tabs button{border:0;background:transparent;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.cmt{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.cmt .by{color:var(--muted);font-size:12px}
.cmt.priv{background:#fffbea;padding:10px;border-radius:8px;border:1px dashed #e6d39a;margin-top:8px}
.hist{font-size:13px;color:var(--muted);padding:5px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast button{background:transparent;border:0;color:#9fc0ff;font-weight:600;cursor:pointer}
.ai{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.ai textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.auth{max-width:400px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.auth h1{font-size:24px;font-weight:600;margin-bottom:4px}
.auth p{color:var(--muted);margin:0 0 18px}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:8px;font-size:14px}
.note{background:#eef2fa;color:var(--navy-ink);padding:10px 12px;border-radius:8px;font-size:14px}
.person{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.person:first-child{border-top:0}
.person .stats{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.person .stats b{color:var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;margin:0 6px 6px 0;background:#fff}
.section-title{font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 6px}
.att a{display:block;padding:6px 0;font-size:14px}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:20px 14px;text-align:center;cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px;transition:border-color .12s,background .12s}
.dropzone b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.dropzone:hover{border-color:var(--navy)}
.dropzone.over{border-color:var(--navy);background:#eef2fa}
@media (max-width:640px){
  body{font-size:16px}
  .top .bar{flex-wrap:wrap;padding:8px 12px;gap:6px}
  .brand{font-size:16px}
  .nav{width:100%;order:3;margin-left:0;gap:6px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
  .nav::-webkit-scrollbar{display:none;width:0;height:0}
  .nav button{background:rgba(255,255,255,.1);padding:8px 12px;border-radius:16px;font-size:14px;min-height:38px}
  .nav button.on{background:#fff;color:var(--navy)}
  .who{margin-left:auto;order:2}
  main{padding:14px 12px 90px}
  .h{flex-wrap:wrap;gap:6px;margin:18px 0 8px}
  .h h2{font-size:19px}
  .btn{min-height:44px;padding:11px 16px}
  .btn.sm{min-height:36px}
  .actions{gap:8px}
  .actions .btn{flex:1 1 auto}
  .row{padding:14px}
  .counts{flex-wrap:wrap}
  .counts button{flex:1 0 45%;border-left:0;border-top:1px solid var(--line)}
  .form input,.form select,.form textarea{font-size:16px;min-height:46px}
  input[type=checkbox]{min-width:22px;min-height:22px}
  .mp-row input[type=checkbox]{width:22px;height:22px;min-width:22px;min-height:22px;max-width:22px}
  .person{flex-wrap:wrap}
  .two,.three,.four{grid-template-columns:1fr}
  .detail dl{grid-template-columns:1fr}
  .who span{display:none}
  .row{grid-template-columns:1fr}
  .row .why{text-align:left}
  .counts b{font-size:18px}
  .panel{padding:12px}
  .tabs{overflow-x:auto;white-space:nowrap}
  .tabs button{font-size:14px;padding:10px 12px}
  .modal h2{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.nav,.btn,.h .sub,.note{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:100%}
  .panel{break-inside:avoid;border:1px solid #999}
  .agenda-print{display:block!important}

  {v:"12.7", d:"October 10, 2026", items:[

    "The eye is an eye now, lashes and all, instead of \u25c9 \u2014 which was really a radio button wearing a disguise. Hollow pupil means nobody is watching, solid means somebody is, and the colour says whether that somebody is you. Same drawing everywhere it appears: the lists, the task itself, and the 1:1 agenda.",
    "The 1:1 agenda has a Watching section, sitting after Needs you and Not moving and before everything else. A watched task that is overdue or asking you for something stays under those headings \u2014 they outrank the eye, same rule as Home \u2014 so this holds the ones that are simply ticking along, which would otherwise disappear into a catch-all of fourteen.",
    "Watching is no longer private. It used to be a silent eye that only changed what you saw; now anyone who can see a task can see who is following it \u2014 including the person doing the work. The eye in a list goes solid in grey when somebody else is watching and navy when you are, and hovering it names them. The task itself says it in words at the top.",
    "You can still only see watchers on tasks you can already see. Checked from Alexis's account: she sees Eliseth watching her own task, and nothing at all about tasks that are not hers.",
    "\"Split off a linked task\" is parked. It made a brand-new task for someone else hung off this one, and it never sat right \u2014 it was being used to get eyes on a piece of work, which is what the eye is for now. Tasks already split stay exactly as they are, still showing \"Part of\" on both sides, and \"Link to another task\" still relates two tasks that already exist.",
  ]},
  {v:"11.5", d:"October 7, 2026", items:[
    "A 1:1 is a meeting you hold, not a line on the org chart. You can add someone who reports elsewhere \u2014 Alexis reports to Eliseth, but you review the work you have given her together, so she now sits on your 1:1s with a Remove button and an agenda of her own.",
    "The app offers it before you ask: anyone you have live delegated work with and no meeting to review it in shows under \"Worth adding\" with the count, and one press adds them.",
    "A pin can never point upward. A manager pinning their own boss would have been able to read their whole list, so the rule that stops you assigning work upward now covers this too \u2014 enforced when the pin is written and re-checked every time it is read, so a stale one grants nothing.",
    "The other side of the meeting sees it. Their page is now headed \"Your own list\" and says who reviews it \u2014 one list labelled by who asked, rather than two near-identical pages.",
  ]},
  {v:"11.3", d:"October 7, 2026", items:[
    "A task you are watching now always appears under Watching, unless it is actually asking you for something. It used to stand aside for any other group that claimed it, so \"Transfer labels\" \u2014 overdue by a day \u2014 was filed inside a collapsed pile of 33 overdue tasks. The one being watched most closely was the one it hid best.",
    "Watching rows carry a reason, so an overdue one reads \"overdue since Oct 6\" where it sits.",
  ]},
  {v:"11.2", d:"October 7, 2026", items:[
    "Rows that want something from you stand out. A task asking you for help, a decision, or a review gets a red edge and a faint warm tint; one you are watching gets a navy edge. Four rows out of seventy-one are red and two are navy right now, which is the point \u2014 if half the list lit up it would mean nothing.",
    "A row that is both asking and watched shows red. Asking wins, and the solid eye already says you are watching it.",
    "Home has a Watching section, collapsible like the rest, sitting just above Overdue. It holds what you are keeping an eye on that nothing else has already claimed \u2014 so a watched task that needs a decision stays under Waiting on a decision rather than appearing twice. It shows watched work even when nothing is wrong with it, which is the whole reason you put an eye on it.",
  ]},
  {v:"11.1", d:"October 7, 2026", items:[
    "A private note is now the author's alone. It had been readable by the owner and by the note-writer's manager, while the only promise the checkbox ever made was \"emails nobody\" \u2014 so three notes Eli wrote, one of them her own 1:1 notes, were showing on Kathleen's agenda under the heading \"Your private notes\". Closed in all three places it leaked: the task drawer, search, and the agenda. Checked afterwards from every account: Eli sees her three, everyone else sees none.",
    "The checkbox says what it does now \u2014 \"Private note (only you can see it)\" instead of \"Private manager note (emails nobody)\".",
    "Watch a task straight from any list. The eye sits beside the title on every row: faint until you run your eye down the column, solid once it is on. Clicking it never opens the task. The one in the drawer stays for when you are already in there.",
    "Every page has the dimension the 1:1 agenda got: blocks lift off the background on a soft shadow, and on Home each group wears the colour of why it needs you \u2014 red for a decision or a plea for help, amber for stuck or gone quiet, navy for ready to review. Week ahead colours Due today, Overdue and No date the same way.",
  ]},
  {v:"11.0", d:"October 7, 2026", items:[
    "The 1:1 agenda has the same dimension as the drawers: each section lifted on a soft shadow with a coloured edge. The colour carries the meaning rather than decorating it \u2014 red for Needs you, amber for Not moving, navy for everything else in flight, grey for the two folded background blocks, green for what they finished, purple for Worth mentioning. You can find your place in the meeting by colour without reading a heading.",
    "The same treatment is now available to any section in the app, not just the ones inside a drawer.",
  ]},
  {v:"10.9", d:"October 7, 2026", items:[
    "The 1:1 agenda is three sections instead of six, in the order you would actually talk through them: Needs you, Not moving, Everything else on their plate.",
    "Overdue and Waiting on others have become one \u2014 Not moving \u2014 with the reason on each line, \"overdue since Oct 1\" or \"waiting on Jeff\". They were separate sections that overlapped, so a task that was both appeared twice and the agenda looked longer than the work. On Eli's agenda that was happening to the building and forklift oversight task. A task can now only be in one place.",
    "\"They've asked you for\" was misnamed. It never meant things they asked YOU for \u2014 it was tasks they had handed to other people, nine of them on Eli's agenda. It is now \"What Eliseth has handed to other people\", folded away like their own list, because it is background on how much she is delegating rather than something for the two of you to work through.",
    "\"Waiting on you\" is now \"Needs you\", matching the words Home uses for the same thing.",
  ]},
  {v:"10.8", d:"October 7, 2026", items:[
    "One search instead of two. The Search tab is gone and the box on All tasks does its job: it reads comments, steps, the definition of done and standing notes as well as titles and details. That matters \u2014 on real searches here, about a fifth of the hits were in a comment or a step and the old box could not see them. \"Goodman\" found four tasks, now it finds five.",
    "The difference was that the two searched different things and neither could do what the other did. Search looked everywhere but could not be narrowed by person or status; All tasks narrowed well but only read the title and details. Now the box searches everywhere and your filters still apply on top of the results.",
    "While you are searching, the table swaps Origin, Entered and Last update for Matched in and Where, so you can see it was a comment that mentioned Goodman and read the line without opening anything. Clear the box and the usual columns come back.",
    "Typing stays instant: the local test runs while the fuller answer is on its way, so the list never stalls on a keystroke.",
    "Trash moves to the end of the menu, after People, Email intake and Settings.",
  ]},
  {v:"10.7", d:"October 7, 2026", items:[
    "The watch control has a fixed home: the eye at the top right of the drawer's header band, in the same place on every task. It was sitting in the row of buttons, and that row changes from task to task \u2014 Mark done, Return to Kathleen and the rest come and go \u2014 so the button landed wherever the row happened to wrap.",
    "It also did not belong there. Every other button in that row changes the task; watching only changes what you see. Out of the row, it stops looking like something that does anything to the work. Hollow means not watching, filled means watching, and it fills in the task's own colour.",
  ]},
  {v:"10.6", d:"October 7, 2026", items:[
    "Week ahead drops the 14 days option. The grid holds six columns, so a fortnight was always going to spill.",
    "All tasks: Open, Blocked, Needs you, Skipped, Done, Everything \u2014 and Blocked and Needs you no longer overlap. Blocked used to mean \"waiting OR asking you for help\", and since asking for help now sets a task to Waiting, all three flagged tasks were appearing under both. Blocked is now waiting on someone else; anything asking YOU sits under Needs you, where you would look for it.",
  ]},
  {v:"10.5", d:"October 7, 2026", items:[
    "You can put an eye on a task someone set for themselves. Open it and press Watch this: from then on it reaches your Home when it needs attention and leads your 1:1 agenda with them, instead of folding into \"their own list\". Everything built this week has been about getting their own work out of your way \u2014 this is the way back in for the handful you do want to follow.",
    "Watching is yours alone and nobody is told. It changes what you see and nothing else: no email goes out, the owner's view is unchanged, and Eli watching one of Alexis's tasks does not put it in front of you. It is a reading aid, not a flag on somebody's work.",
    "A watched task carries a quiet Watching tag wherever it is listed, and the 1:1 marks it so you know why it is on the agenda. Press the button again to stop.",
    "SDEA is already being watched \u2014 it came up as the test case while I was proving this works. Press the eye on it to turn that off.",
  ]},
  {v:"10.4", d:"October 7, 2026", items:[
    "\"However it started\" is two choices instead of four: someone assigned it to them, or they created it themselves. The old four mixed up who put it on the list with how it arrived, so an emailed task was both \"emailed in\" AND assigned \u2014 picking one quietly hid the other. These two cover every task between them. If you want to find something that arrived by email, Email intake is the place for that.",
    "The Origin column matches: You assigned, Eli assigned, or Their own.",
    "Asking for help puts a task into Waiting, on the person being asked. SDEA and the Santa Ana trash sign both read Working while nobody was working on them \u2014 both were sitting on an unanswered question. Clearing the flag hands it back to Working and clears the waiting note, so nobody has to set the status twice.",
    "A task already waiting on something real keeps that \u2014 flag one that is waiting on Goodman and it still says Goodman, not your manager. And a flagged task still appears under \"Asked you for help\" on Home rather than sinking into \"Stuck waiting on someone else\".",
  ]},
  {v:"10.3", d:"October 7, 2026", items:[
    "A task moves itself to Working the moment somebody actually engages with it \u2014 a person comments, a step is added or ticked, somebody asks for help or a decision, or somebody asks for more time. Circle Backs had seven comments and still read Not started; the SDEA renewal was flagged for help while claiming nobody had touched it. Ten tasks were sitting in that state and have been moved.",
    "The comment an emailed task is born with does not count. Those chain summaries land within seconds of arrival, so anything in a task's first two minutes is treated as part of its arrival rather than as work \u2014 otherwise every forwarded email would have started itself before anyone read it. One rule, and it covers email intake, the Brain Dump bridge and copied tasks together.",
    "Reassigning a task on its own does NOT start it, which is the one place this differs from what was asked. Handing work to somebody new does not mean they have begun it, and Not started is the only thing on the screen that says nobody has picked this up yet. Every other kind of touch starts it, including the flags that made SDEA look wrong.",
  ]},
  {v:"10.2", d:"October 7, 2026", items:[
    "Asking for help reaches Home whoever wrote the task down. Home only ever showed delegated work, so a task someone set for themselves and then flagged Need help never appeared \u2014 it folded into the \"their own list\" line. That is why the Santa Ana trash sign and the SDEA renewal were nowhere to be seen. Anything flagged for help, needing a decision, or ready for your review now sits in Needs attention no matter who created it.",
    "Claude now judges the related-task suggestions. The wording test stays as a cheap wide net, pulling up to six candidates; Claude decides which are actually the same job and writes the reason in plain English \u2014 \"both are putting clipboards up at the branches\" rather than \"wording is 22% the same\". It catches matches the wording test cannot see, and rules out month-end tasks that only share a label.",
    "Each pair is judged once and the answer is kept, so it costs one small call ever rather than one every time you open a drawer. Pairs it rules out never come back. If the call fails nothing breaks \u2014 the wording test keeps covering that task until the next time you open it.",
  ]},
  {v:"10.1", d:"October 7, 2026", items:[
    "Week ahead is six columns and they are all days ahead of you. Today comes off the grid and sits in its own band above it, where something due today belongs anyway, and No date moves below the calendar instead of taking one of the six slots. Nothing is lost \u2014 the grid just stops overflowing.",
    "Related-task suggestions stop treating a shared label as shared work. \"EOM Task:\" is a filing convention, not a description, and comparing whole titles made every month-end task look like a duplicate of every other one \u2014 five of the fifteen suggestions in the system were EOM siblings matching on a prefix added two days ago. Comparison now ignores a leading label. Five false alarms gone, two real matches found (1050 Bank Rec with EOM Task: Bank recs, and the two voucher tasks), every true match kept.",
  ]},
  {v:"10.0", d:"October 7, 2026", items:[
    "Asking for help now reaches the person who can actually help. It was routed off whoever OWNS the task, on the assumption that the owner is always the one raising their hand \u2014 true when work is handed down, backwards when somebody creates a task, assigns it upward and then flags it. On the Santa Ana trash sign the app decided Kathleen was the one asking and would have emailed Eli. It now follows whoever pressed the button, up their reporting line.",
    "Nobody but the owner can hand a task upward any more. You can give work to yourself or to someone who reports to you; names above you are no longer in the list, and the database refuses it even if something else tries. To put something on your manager's plate, open the task and use Need help, or add it to your 1:1 under Worth mentioning \u2014 both keep it attached to the work it came from instead of starting a new task on their list. Tasks already assigned upward stay where they are and can still be edited.",
    "Pressing Blocked in a task no longer shows a status dropdown offering all six statuses, including Done and Skipped. You already said what the status is by pressing the button \u2014 the panel now states Waiting and puts the cursor straight in \"Waiting on\". Update still offers the full list.",
  ]},
  {v:"9.9", d:"October 6, 2026", items:[
    "The filters on All tasks stick. They used to reset to everything each time, so narrowing the list was work you redid on every visit \u2014 which meant nobody did it. Your choice of status, people and origin is remembered per person now.",
    "It opens on the work you handed out. 74 open tasks become the 42 you assigned; the 21 your team set for themselves and the 11 someone else handed over are one tick away, not gone.",
    "A filter that is on says so. The heading reads \"42 shown of 74 open\", and a line underneath says a filter is on and will stay on, with Show everything beside it. Hiding work quietly is how overdue tasks rot \u2014 this hides nothing without telling you.",
    "The search box deliberately does not stick. Coming back to a stale search term reads as missing data rather than as a filter.",
  ]},
  {v:"9.8", d:"October 6, 2026", items:[
    "Fixed a 1 AM email claiming Alexis had flagged the birthdays-and-anniversaries task. She never touched it. The overnight job that keeps recurring tasks topped up decided the series was falling behind, flagged it for the manager, and the flag sends a \"needs you\" email \u2014 which reads as though the person on the task raised their hand. Eli got the same email.",
    "The cause: that series was set to \"stop and flag me after 1 open at once\", and the backlog test asks whether the number open has reached the cap. One occurrence open IS the normal state of a healthy recurring task, so the alarm was true from the moment the task was created, eleven months before it is due.",
    "A cap of 1 can never mean anything useful, so the minimum is now 2 \u2014 \"tell me when a second one appears before the first is finished\", which is what it was always meant to say. The one series set to 1 has been moved to 2, the false flag is cleared, and the dropdown no longer offers 1. The overnight job also refuses to treat a single open occurrence as a backlog whatever the setting says, so this cannot come back through another door.",
  ]},
  {v:"9.7", d:"October 6, 2026", items:[
    "Work handed down from above stays on the agenda. Yesterday's change folded away anything a third person assigned \u2014 which quietly buried the six tasks Kathleen gave Alexis directly, two of them already overdue, since Kathleen does not hold a 1:1 with Alexis. They had no meeting anywhere. They now sit on Eli's agenda with Alexis, each marked \"from Kathleen\".",
    "The rule: a task assigned by someone you report to is yours to review, because if your own manager is not meeting that person, nobody else will. A task from a peer or someone outside your reporting line stays folded, for awareness. Your own 1:1s are unchanged \u2014 nothing sits above you.",
  ]},
  {v:"9.6", d:"October 6, 2026", items:[
    "Department is gone \u2014 off the task drawer, off the new-task and edit forms, out of the All tasks and Finished columns, and out of both filters. Email intake no longer picks one or names one in the confirmation it sends you.",
    "The drawers keep their colour; they take it from the task's status instead, matching the status pill exactly so the spine and the pill can never disagree. The blocks inside keep their own edges \u2014 Steps amber, Linked tasks purple, comments and history blue.",
  ]},
  {v:"9.5", d:"October 6, 2026", items:[
    "A 1:1 agenda now leads with the work the two of you share. Overdue, Waiting on others and Still open show what you handed them; everything they set for themselves, and anything a third person gave them, folds into one block at the bottom. On Eli's agenda that is the difference between 23 items and 6 \u2014 Still open was fifteen tasks, not one of them yours.",
    "Folded, never hidden. The block says what is in it before you open it \u2014 \"5 Eli set for themselves, 2 handed over by someone else \u2014 2 overdue, nothing waiting on you\" \u2014 so you can skip it knowing what you skipped. One click opens the lot.",
    "Anything they are asking you about jumps the queue whatever its origin. A task they flagged for help, one they need a decision on, or one where they have asked to move the date stays in Waiting on you even if they wrote it themselves. Them asking you is the meeting.",
    "Finished still shows everything they closed, with their own work marked rather than removed. Credit should be generous even where scrutiny is narrow.",
    "Show everything flips any 1:1 back to the full list, and it is remembered per person \u2014 useful for someone new, where you do want to walk the whole thing together.",
    "The same rule works a level down: when Eli opens her 1:1 with Alexis, her agenda is what she gave Alexis, and the tasks you gave Alexis directly sit in the folded block marked with your name, so she is aware without being handed your meeting.",
  ]},
  {v:"9.4", d:"October 5, 2026", items:[
    "The blocks inside a drawer have depth now, the way Brain Dump's do: each sits on a soft shadow with a rounded corner and its own coloured edge \u2014 The task takes the department's colour, Steps amber, Linked tasks purple, and the comments and history block blue. You can find a section by its colour without reading the headings.",
  ]},
  {v:"9.3", d:"October 5, 2026", items:[
    "The drawers have dimension, like Brain Dump's: a coloured spine down the left edge in the task's department colour, a tinted band across the top naming that department and who has it, a rounded outer corner and a deeper shadow, so an open task sits above the page instead of flat on it. The new-task drawer does the same and recolours as you pick a department.",
    "The \"Clear \u2014 show all\" line in the filter dropdowns was printing the dash as raw characters. Fixed.",
  ]},
  {v:"9.2", d:"October 5, 2026", items:[
    "Every task has a Department, using the same nine Kathleen already sorts by in Brain Dump \u2014 Operations, Finance, HR, Facilities, Vendors, Marketing, Sales, Personal, Other. It sits in the drawer, on the new-task and edit forms, as a colour-coded column on All tasks and Finished, and as a filter on both.",
    "All 96 live tasks were sorted into a department up front, so the column is useful from the first time you open it rather than a wall of dashes. Finance 33, Operations 30, Facilities 11, Vendors 8, HR 8, Marketing 5, Other 1. Change any that read wrong \u2014 the edit form has the dropdown.",
    "A task sent over from Kathleen's Inbox keeps the category it had there, and one sent back carries its department home with it.",
    "An email forwarded to tasks@ gets filed under a department by the same AI pass that works out the owner and the date, and the confirmation back to you says which.",
  ]},
  {v:"9.1", d:"October 5, 2026", items:[
    "The tick boxes in \"However it started\" and the people filter are visible again, sitting to the left of each name. They were always in the dropdown \u2014 the page's form styling was sizing them like text fields, so on Finished they came out as empty rounded boxes and on All tasks as a wide blank slab with the label shoved away from it.",
    "All tasks and Finished now show the same four options in the same order, so the two screens read alike.",
  ]},
  {v:"9.0", d:"October 5, 2026", items:[
    "Email intake is a table: Topic, Became a task, Who emailed it in, Arrived \u2014 sortable by any of them, so you can group by sender or read down the ones that never became a task. Who emailed it in shows the person's name, not the address, including the shared ones like ap@ and purchasing@.",
    "An email can now be assigned to someone who hasn't signed up yet. Before this, only the four of you with accounts could be named on an inbound email \u2014 everybody else fell through and the task came back to the sender. That's why the AP aging email you sent with Jeff on the line landed as yours. It now holds against their address and waits for them, exactly like assigning it in the app, and sends them nothing until they sign in. Twelve people became reachable by email this way.",
    "Merge from a \"looks related\" banner shows you the task it picked. The list of tasks to merge is capped, so a pre-picked task further down was selected but off screen \u2014 it looked like the button had done nothing. Whatever is picked now sits at the top of the list with a filled marker.",
    "\"However it started\" says which email route it took: \"Emailed in to tasks@\" for one you forwarded in, \"Sent over from Kathleen's Inbox\" for one pushed across from your own list. Same two words in the Origin column.",
    "Home says \"Needs attention\" rather than \"Needs your attention\".",
  ]},
  {v:"8.9", d:"October 5, 2026", items:[
    "Finished shows which ones you haven't looked at: a red New tag in the first column, a grey tick on the rest. That marker existed before the screen became a table and was lost in the conversion — sorting by that column now brings the unread to the top.",
    "The filters on All tasks and Finished take several choices at once. \"However it started\" and the person list are tick boxes now, so you can look at emailed-in and Inbox tasks together, or two people side by side.",
    "The button names what you picked — one choice shows the name, several show the count — so a filter that's on can't hide behind a closed dropdown.",
  ]},
  {v:"8.8", d:"October 5, 2026", items:[
    "Repeats every year is now an option, for renewals, filings, insurance, licences and anything else that comes round once.",
    "It needs no day setting — the due date you give it is the anniversary. Feb 29 falls back to Feb 28 in a common year, the same way monthly already handles the 30th in February.",
    "A yearly task appears a month ahead rather than five days. Nobody arranges an annual renewal in a week.",
  ]},
  {v:"8.7", d:"October 5, 2026", items:[
    "Repeating: click a row to open the occurrence that's live now — the oldest one still open, since that's the one running late. If they're all finished, it opens the most recent.",
    "The drawer's arrows then step back through that series' earlier occurrences, so you can see how the last few months went without leaving the task.",
    "Catch up and Pause still work as buttons; clicking them doesn't open anything.",
  ]},
  {v:"8.6", d:"October 5, 2026", items:[
    "Data-loss safeguard. A failed read can no longer look like an empty account: loading retries four times with backoff, an empty answer is treated as suspect once real data has been seen this session, and if every attempt fails the last good data stays on screen behind a red banner instead of being replaced by nothing.",
    "Task Depot was never at risk of the overwrite version of this bug — it saves one field of one row at a time and has no demo data to fall back to — but a blip could still blank every list for a minute, which looks exactly the same from where you are sitting.",
    "Profile updates (your role, your notification settings, marking finished work as seen) now merge instead of overwriting, so two changes landing together can't undo each other.",
  ]},
  {v:"8.5", d:"October 5, 2026", items:[
    "\"Copy to others\" is now \"Who has this\" — it shows everyone carrying the work, including you, and you add or remove from one place.",
    "Untick anyone to take it off their list; their copy goes to Trash and can be restored. Untick yourself to hand it over completely and clear it off your own list in the same step.",
    "Removals happen after the copies are made, so the work always exists somewhere before it leaves you.",
  ]},
  {v:"8.4", d:"October 4, 2026", items:[
    "Search results are the same sortable table as All tasks, with two extra columns: what the match was found in, and the matching text.",
    "A task linked to others carries a link pill with the count, in every table — Home, All tasks, Search, Finished, Trash — so you can see at a glance that a task has company.",
    "The task drawer already lists them by name under Linked to; the pill is for spotting it without opening anything.",
  ]},
  {v:"8.3", d:"October 4, 2026", items:[
    "Task Depot now spots work that looks like a task you already have, and says so on the task with Link, Merge and Not related. It reads two signals: a shared order, PO or S/O number, and how close the wording is.",
    "The order number is the strong one — on your own tasks it matched \"Process order 2200961A\" to \"Reconcile PO 2200961A bill\", a pair that shares almost no words.",
    "No AI involved, deliberately: it is instant, costs nothing, and always tells you why it matched so you can judge it in a second. Tasks whose wording differs completely still need a person; that's the next layer if this one proves useful.",
    "\"Not related\" is permanent for that pair — it will never suggest it again.",
    "Link now takes several tasks at once: tick as many as you like and link them in one go.",
    "Copies link themselves. Assigning one task to several people, or copying an open task to others, now links the copies, so opening any of them shows the rest.",
  ]},
  {v:"8.2", d:"October 4, 2026", items:[
    "Fixed: work held by somebody who hasn't signed up yet showed as \"Unassigned\" in the merge and link pickers. It was never unassigned — the name just wasn't being looked up. Every one of those lists now names them.",
    "Whose task it is is now worked out in one place instead of five, so the next screen that asks can't get a different answer.",
  ]},
  {v:"8.1", d:"October 4, 2026", items:[
    "Home: the line about work your team set for themselves now sits straight after Assigned to you, above Needs your attention, instead of being buried near the bottom.",
  ]},
  {v:"8.0", d:"October 4, 2026", items:[
    "Needs your attention is split into sections by why it needs you, and every section folds. Shut one and it stays shut on that browser, so a group you never act on stops taking up the screen.",
    "Order: waiting on a decision from you, ready for your review, asked you for help, stuck waiting on someone else, due now but gone quiet — then overdue at the bottom.",
    "Overdue sits last on purpose. The sections above it are things a few minutes of your time unblocks; overdue is a standing fact you already know about, and it was pushing the actionable work down the page.",
    "Each section still shows the detail in the Why column, so \"Overdue\" tells you by how many days.",
  ]},
  {v:"7.8", d:"October 4, 2026", items:[
    "Finished can be filtered by how the work started — emailed in, assigned in the app, from Kathleen's Inbox, or they set it themselves — with a matching Origin column.",
    "Two new buttons beside the green bar: \"Mark these N as seen\" clears what you're looking at, and \"Mark the other N as seen\" clears everything outside the current filter. So you can show the ones you want to read, clear the rest, and come back to a tab counting only what matters.",
    "\"Mark all as seen\" is still there for the blunt version.",
  ]},
  {v:"7.7", d:"October 4, 2026", items:[
    "Email intake now says where each email's task stands now — its current title, or that it is in Trash, finished, or gone. Trashing a task never removed its email from this list and never will, because the list is the post, not the work. It just looked broken.",
    "A row whose task is in Trash carries a Restore it button, so undoing a wrong trash doesn't mean hunting through Trash.",
    "The page says plainly at the top that it is a record of emails received, not a list of tasks.",
  ]},
  {v:"7.6", d:"October 4, 2026", items:[
    "Fixed: trashing a task you opened from Search left it sitting in the results. The trash worked every time — the list behind it was a snapshot that never refreshed, so it looked like nothing happened.",
    "Search results now re-run when you close a task, so anything you trashed, finished or renamed in there shows its new state instead of the old one.",
  ]},
  {v:"7.5", d:"October 4, 2026", items:[
    "Tasks that came in separately can now be joined, in one of two ways, because they are not the same problem.",
    "Link to another task — both stay, each shows the other, and you can click straight across. For different work that belongs to the same job.",
    "Merge another in — for the same work that arrived twice. Comments, files, steps, subtasks and any links move onto the task you keep; the other goes to Trash, where it can still be restored.",
    "A merge writes a comment on the surviving task saying what came across, so a year from now it is obvious what happened.",
  ]},
  {v:"7.4", d:"October 4, 2026", items:[
    "Search shows one row per task instead of one per match. Five results for two tasks was the search being literal, not five tasks.",
    "Search also names people who have been invited but haven't signed up, rather than calling their work \"Unassigned\".",
    "Email intake is its own tab, with the full set of rules, how far back you want to look, and a click through to the task each email made.",
    "Week ahead: overdue sits below the calendar now, where it reads as a footnote rather than the headline.",
    "Fixed a way the same email thread could make two tasks. Mail doesn't arrive in the order it was written — a forward can land before the reply it quotes — and thread matching only looked one way.",
  ]},
  {v:"7.3", d:"October 4, 2026", items:[
    "Alternate email addresses work for people who haven't signed up yet. Record the shared mailbox now, on the Invited list, and it starts working by itself the day they create an account — nothing to remember later.",
    "On file so far: Eliseth also sends from ap@, Ilah from purchasing@, Bianca from ar@.",
  ]},
  {v:"7.2", d:"October 4, 2026", items:[
    "People can send task emails from more than one address. Add them on the People tab — a shared AP or purchasing mailbox, an old address, a phone account — and mail from there lands as their task instead of being dropped as a stranger.",
    "Those alternates also count on the To or Cc line, so putting the AP mailbox on a forward assigns it to the right person.",
    "All tasks: \"Emailed in\" is its own filter, separate from \"From Kathleen's Inbox\". The first means it arrived at tasks@, the second means it was pushed across from Kathleen's own list — they were being confused for each other, which they would be, sharing one label.",
    "Copy to others now includes people who have been invited but haven't signed up yet, both when assigning and from an open task. Their copy waits for them like any other.",
  ]},
  {v:"7.1", d:"October 1, 2026", items:[
    "Fixed: opening your 1:1 with your own manager said \"That person doesn't report to you.\" It now opens your agenda — your work, your mentions — which is what that meeting is about."
  ]},
  {v:"7.0", d:"October 1, 2026", items:[
    "Every list is now a table — Home, All tasks, Finished, Repeating and Trash. Same columns, same sorting: click a heading once for ascending, again for descending, a third time to go back to the natural order.",
    "The List/Table toggle is gone. Tables everywhere was the point, and a setting you have to remember is one more thing to remember.",
    "On a phone the less important columns (Entered, Last update, Origin) drop out so the ones that matter still fit.",
    "All tasks: \"From Kathleen's Inbox\" is now an option in the origin filter, and the Origin column names it, so you can see at a glance what came out of your own list.",
    "A task you send back to your Inbox now lands in Finished instead of Trash. It was work that got done and handed over, not work that was binned. It carries a \"Returned to Kathleen's Inbox\" tag and can't be reopened here, since it lives with you now."
  ]},
  {v:"6.9", d:"September 30, 2026", items:[
    "Tasks arriving from your own list now read as \"Kathleen's Inbox\" everywhere in the app, rather than \"Brain Dump\" — your team has no reason to know what you call it.",
    "A task you've sent back shows as \"Returned to Kathleen's Inbox\" in Trash, so it's clear it wasn't thrown away.",
    "Worth mentioning now sits at the top of the 1:1 agenda — the things you'd otherwise forget come first, while the tasks are still there to work down.",
    "It is also included when you Copy the agenda.",
    "Finished: a Mark as seen button on each finished task, so you can clear them one at a time as you read them. Mark all as seen still clears the lot.",
    "All tasks has a Table view — Person, Task, Status, Entered, Due, Last update — with sortable columns. The list view is still there; the toggle remembers which you prefer."
  ]},
  {v:"6.8", d:"September 30, 2026", items:[
    "Mentions — things to raise at the next 1:1 that aren't tasks. No due date, no status, nothing chasing anybody. Type it, and it waits on the agenda under \"Worth mentioning\" until it's been said.",
    "They go both ways: your people can raise things for you, which is the point. Whoever raised it is named, and both of you see it before the meeting.",
    "Tick it once you've said it and it drops off. If it turns out to need doing, \"Make it a task\" carries the wording straight into the assign form.",
    "Anything still unsaid after 60 days is marked stale, so the list stays a list rather than a graveyard."
  ]},
  {v:"6.7", d:"September 30, 2026", items:[
    "Tasks can now arrive straight from Kathleen's own list. They look and behave like any other task from her — same assignment email, same steps, same attachments — and carry a small \"from Kathleen's Inbox\" tag on the task.",
    "Return to Kathleen: on one of those tasks, a button hands it straight back to her Inbox with everything you did on it — finished steps, comments and files. Say why if it helps. The task closes here (it moves to Trash) once it's back with her.",
    "Finishing, reopening or reassigning one of these keeps her copy up to date on its own."
  ]},
  {v:"6.6", d:"September 30, 2026", items:[
    "On a 1:1 agenda, what was finished since last time moved to the bottom — the live work you still have to talk through now sits at the top where the meeting starts.",
    "Finished items carry a Reopen button instead of the covered tick, since ticking off something already done means nothing. Reopening puts it back to Working with its due date intact, and notes in the history who reopened it."
  ]},
  {v:"6.5", d:"September 30, 2026", items:[
    "The way to clear the Finished count is now a proper bar across the top of the page — \"7 finished since you last looked\" with a Mark all as seen button — instead of a small button beside the heading that was easy to miss.",
    "Fixed: arrowing from one task to the next inside a 1:1 only marked the first one covered. Every task you step through during a meeting now lands in Covered in this meeting.",
    "Arrows used anywhere else — All tasks, search, your attention list — still leave the covered marks alone."
  ]},
  {v:"6.4", d:"September 30, 2026", items:[
    "One 1:1s tab, and it runs both ways: the meeting with your own manager at the top, the meetings with your people underneath. Each row shows their open work, what's flagged for you, and anything overdue.",
    "People is now the owner's admin screen — roles, reporting lines, invitations, who may sign up. The 1:1 agendas moved to the 1:1s tab.",
    "Covered in the meeting: tick an item off and it drops out of the live agenda instead of bouncing to another section when you change its date. Opening a task from the agenda marks it covered on its own.",
    "The covered items collect at the bottom of the agenda where you can untick any of them, and \"Start a fresh meeting\" clears the lot."
  ]},
  {v:"6.3", d:"September 25, 2026", items:[
    "In a forwarded email chain, the message that is actually new this time is now bold, so it stands apart from the earlier ones repeated underneath it.",
    "Comments render **bold** generally, so you can emphasise a line when you write one yourself."
  ]},
  {v:"6.2", d:"September 23, 2026", items:[
    "Done, Update, Blocked and Need help now appear on your own tasks whatever your role. They were hidden from managers and owners, so there was no way to say a task of your own was Working or Waiting without editing it.",
    "The plain \"Mark done\" button steps aside when those four are showing, so there's one obvious way to finish something rather than two."
  ]},
  {v:"6.1", d:"September 23, 2026", items:[
    "Standing notes now appear below the repeat settings rather than above them, so choosing a repeat no longer shoves the line you're reading down the page.",
    "Fixed drag and drop on attachments. The page was swallowing the file before the task could catch it — dropping now works anywhere on the drop zone, and dropping just outside it no longer opens the file in a new tab."
  ]},
  {v:"6.0", d:"September 23, 2026", items:[
    "The assign form now reads in the order you think in: task, who / when / how urgent, then the option to give the same thing to several people, then the detail.",
    "Saving a new task opens it, so you can add a comment or attach something without hunting for it in a list.",
    "Attachments can be dragged onto the task — drop a file anywhere on the drop zone, or several at once. Clicking still works.",
    "Note on reporting lines: once somebody reports to a manager, that manager sees everything assigned to them, including work assigned by you."
  ]},
  {v:"5.9", d:"September 23, 2026", items:[
    "Dropped the Context box from the assign and edit forms. In practice it was restating the title — \"Test new iPads at hub for JD Deliveries\" with context \"JD Deliveries hub setup and device rollout\" — so it was a field to fill rather than a thing to read.",
    "Nothing is lost: tasks that already have context still show it, and it's still searchable. Forwarded emails no longer generate one.",
    "If grouping several tasks under one piece of work turns out to be useful, that's worth building properly rather than as a free-text box."
  ]},
  {v:"5.8", d:"September 23, 2026", items:[
    "Standing notes only appear once you've set a task to repeat, since that's the only place they do anything. They sit under the repeat settings with a line explaining what they're for.",
    "If a task already has standing notes, the field stays visible even when the repeat is switched off, so nothing you wrote can vanish without you seeing it."
  ]},
  {v:"5.7", d:"September 23, 2026", items:[
    "Steps now belong to whoever set the task. The person doing the work ticks them off and can add steps of their own, but can't delete or reword the ones they were given.",
    "The × only appears on steps you're allowed to remove — your own, or any step on a task you assigned."
  ]},
  {v:"5.6", d:"September 23, 2026", items:[
    "No more scrollbar under the menu. On a wide screen the tabs wrap onto a second line; on a phone they still slide sideways, but the bar itself is gone."
  ]},
  {v:"5.5", d:"September 23, 2026", items:[
    "New Week ahead view: the next seven or fourteen days as columns, each listing what's due that day, with a colour per person so you can see at a glance who's carrying Thursday.",
    "Anything overdue sits in a red band at the top rather than disappearing into the past, and tasks with no date get their own column at the end.",
    "Each day shows a count, and a person's name is tinted the same everywhere in the view. Tap any task to open it.",
    "Employees see the same thing for their own week."
  ]},
  {v:"5.4", d:"September 23, 2026", items:[
    "Managers get My 1:1 too — it was only on the employee menu, so anyone who manages people couldn't see their own agenda with their own manager.",
    "People now lists only the people who actually report to you, instead of everyone with an account. The owner still sees everybody.",
    "The 1:1 agenda button only appears where it will work: on your own reports."
  ]},
  {v:"5.3", d:"September 23, 2026", items:[
    "Every line on a 1:1 agenda opens the task, so you can change a date, leave a comment or answer a request while you're still in the meeting.",
    "The arrows work inside the agenda too — open the first overdue item and step through the rest of that section without going back.",
    "Closing the drawer returns you to the agenda, which refreshes so anything you changed is reflected straight away.",
    "Fixed: asking for more time sent two emails — the date request and a separate needs-a-decision alert. Now just the one, which carries the reason."
  ]},
  {v:"5.2", d:"September 23, 2026", items:[
    "Add the steps while you're writing the task, instead of saving it and going back in. Type a step, press Enter, keep going — they're saved with the task.",
    "Paste a list and it splits into one step per line, so a checklist out of an email or a document comes straight in.",
    "Assign the same task to several people and each copy gets its own set of the steps."
  ]},
  {v:"5.1", d:"September 23, 2026", items:[
    "Who can change a task is now decided by who assigned it, not by job title. A manager can't trash or re-date something you handed them either — they update progress or ask for a new date, same as anyone.",
    "They keep full control of their own tasks, and of anything their own reports hand up to them.",
    "The refusal names who assigned it, so it's obvious who to ask."
  ]},
  {v:"5.0", d:"September 23, 2026", items:[
    "Ask for a new due date. On a task someone else assigned, there's now a \"Need more time\" button — pick a date, say why, and it goes to whoever assigned it. The date doesn't move until they agree.",
    "The manager sees the request on the task with Accept and Keep the date, and either way the answer is posted as a comment so there's a record of it.",
    "Everyone can open their own 1:1 — the same agenda their manager sees, minus the manager's private notes. It's under My 1:1 for employees, and on your own row in People.",
    "Note on trashing: employees already can't trash or re-date work assigned to them. Managers can, for their own reports — so anyone you make a Manager gets that power."
  ]},
  {v:"4.8", d:"September 23, 2026", items:[
    "All tasks: the person filter now lists people you've invited who haven't signed up yet, under \"Not signed up yet\", so you can pull up everything waiting for Jeff or Bianca before they ever log in.",
    "Their tasks were always in the list — there was just no way to filter down to one of them."
  ]},
  {v:"4.7", d:"September 23, 2026", items:[
    "All tasks: the search box and the three filters now sit on one row instead of stacking, so the list starts higher up the screen. On a phone they wrap to two rows rather than four."
  ]},
  {v:"4.6", d:"September 23, 2026", items:[
    "The origin chips have their own colours so they don't blend into the status next to them: teal for a task somebody set themselves, purple for work handed over.",
    "Both carry a thin outline, so at a glance you can tell an origin chip from a status chip even before reading it."
  ]},
  {v:"4.5", d:"September 23, 2026", items:[
    "Fixed: tasks assigned to someone who hasn't signed up yet were dropped from the Home attention list and the counts, because the delegated test only recognised people with accounts.",
    "Where a task came from is now a coloured chip instead of grey text — navy \"From Kathleen\" for work handed to someone, grey \"Their own\" for a task they set themselves.",
    "The chip shows on every task row, including My day, so people can see at a glance which of their tasks came from someone else.",
    "Forwarded emails with nobody named now belong to whoever forwarded them, instead of landing ownerless in Needs sorting."
  ]},
  {v:"4.4", d:"September 23, 2026", items:[
    "Task Depot now works as someone's own to-do list as well as a place to receive work. Anything they wrote for themselves is marked \"their own\"; anything handed to them says who it came from.",
    "Your attention list only covers work that was delegated. Their own overdue tasks are counted separately in a quiet line underneath, which you can expand when you want to look.",
    "The Home counts, the morning digest and the Queue pin all follow the same rule, so their personal list never inflates your numbers.",
    "All tasks has an origin filter: everything, delegated only, or their own only.",
    "If they flag their own task for help, you still hear immediately — that's them asking, not you watching."
  ]},
  {v:"4.3", d:"September 23, 2026", items:[
    "Arrows at the top of an open task step to the previous and next one in whatever list you opened it from — your attention list, All tasks, search results, whichever.",
    "A counter shows where you are, like \"3 of 12\", so you can work straight down a queue without closing and reopening.",
    "The arrows grey out at either end rather than wrapping around."
  ]},
  {v:"4.2", d:"September 23, 2026", items:[
    "Menu reordered: Home, All tasks, Repeating, Finished, Reports, Trash, People, Settings, Search — daily work first, admin at the end.",
    "Forwarded emails with no date now land due the next working day rather than with no date at all, so they can't sit unnoticed. Friday afternoon gives you Monday, not Saturday.",
    "A date in the subject line — \"by 10/3\", \"by Friday\", \"due Oct 3\" — sets the due date and is stripped out of the title.",
    "Put a teammate on the To or Cc line alongside the Task Depot address and the task goes to them. A name at the start of the subject still beats everything."
  ]},
  {v:"4.1", d:"September 23, 2026", items:[
    "Fixed: a task assigned to somebody who hasn't signed up yet showed as having no owner, and sat in Needs sorting as though nobody was on it. It now shows their name and only appears there if it's genuinely missing a date.",
    "Fixed: those people were missing from the dropdown when editing a task, so reassigning to them was impossible. They're listed under \"Invited — not signed up yet,\" same as when you first assign.",
    "Their name is used wherever it's known, instead of the raw email address."
  ]},
  {v:"4.0", d:"September 22, 2026", items:[
    "Email intake. Forward a work email to the Task Depot address and it becomes a task — the AI reads it, works out who it's for and when it's due, and keeps the original message as the details.",
    "Start the subject with a name — \"Ilah: get the Goodman quote\" — to force who it goes to. That beats the AI's reading every time.",
    "Anything it can't place lands unassigned in Needs sorting rather than guessing.",
    "Only people with an account can send in; anything else is dropped silently, because an open address is a spam magnet.",
    "Settings shows the last dozen emails that came in and what happened to each, so a missing task can always be explained."
  ]},
  {v:"3.9", d:"September 22, 2026", items:[
    "People and Team are one tab. Each person shows their open and flagged counts, their role and who they report to, with 1:1 and — for an owner — the role and reporting controls in the same row.",
    "Invitations and the signup allow-list moved to the bottom of that tab, so everything about people is in one place.",
    "What's new lost its tab. Tap the version badge next to the name to read it, and Back returns you where you were."
  ]},
  {v:"3.8", d:"September 22, 2026", items:[
    "Task Depot installs on a phone. Open it in the browser and add it to your home screen — it gets the bus icon and opens full screen, no address bar.",
    "Built for a phone first: the menu scrolls as a row of chips, buttons and checkboxes are big enough to hit with a thumb, and forms stack into one column.",
    "Key actions sit at the bottom of the drawer where your thumb already is, and the drawer respects the notch and home bar.",
    "Reports and the person table scroll sideways on a narrow screen instead of squashing."
  ]},
  {v:"3.7", d:"September 22, 2026", items:[
    "Recurring tasks are never held back now. October's appears whether or not September got done — falling behind is exactly when an obligation shouldn't quietly vanish.",
    "The cap is a warning instead of a gate: past it, the series is marked as behind and flagged, but occurrences keep arriving.",
    "New \"Catch up\" button on the Repeating tab: skips every open occurrence except the newest, with a reason recorded, so a backlog clears in one tap."
  ]},
  {v:"3.6", d:"September 22, 2026", items:[
    "A task now needs an owner and a due date before it'll save. Without a date it can never be overdue and never triggers a reminder, which is how things quietly rot.",
    "New Repeating tab: every recurring task in one place, with the next three dates — including occurrences that haven't been created yet — plus how many are open, the cap, and whether it's stalled or paused.",
    "Fixed: the AI capture box refused owners. It checked for the manager role and the Owner level was added after it was written."
  ]},
  {v:"3.5", d:"September 22, 2026", items:[
    "Search, in its own tab. One box searches task titles, details, context, comments, steps and your own private notes at once, and tells you which of those it matched.",
    "Closed tasks are excluded by default — tick the box to search everything you've ever finished.",
    "New 1:1 agenda: open People, pick someone, and it builds the meeting for you — finished since last time, overdue, waiting on you, waiting on others, still open, what they've asked of you, and your private notes.",
    "Print it, or hit Copy to paste it into an email. Choose 7, 14 or 30 days to cover."
  ]},
  {v:"3.4", d:"September 22, 2026", items:[
    "Task and assign windows are drawers now — they slide in from the right, like the other apps, and close with the button at the bottom or by tapping the shaded area.",
    "Cleaner structure inside a task: real sections with headers, tinted panels and a two-column grid for the facts, instead of one long strip.",
    "\"Hand a piece to someone\" is now \"Split off a linked task\" — it makes a separate task for someone else, linked back to this one.",
    "Buttons appear once, in a single row, and only when you can actually use them. Copy to others is hidden unless there's somebody to copy to."
  ]},
  {v:"3.3", d:"September 22, 2026", items:[
    "New Owner level above manager. Only an owner can change roles, set who reports to whom, or manage who's allowed to sign up — so a manager can't promote themselves or demote you.",
    "Managers are now scoped to their own people. Each person has a \"reports to\", and a manager sees, assigns and reports on their own reports only.",
    "Private manager notes are now visible to the person who wrote them, the owner, and that person's own manager — nobody else.",
    "Help alerts go to the right manager instead of every manager, and the morning digest only covers your own people.",
    "The owner still sees everything."
  ]},
  {v:"3.2", d:"September 22, 2026", items:[
    "Fixed: on a task you both created and own, the buttons appeared twice — two Edits, two \"Hand a piece to someone\", two Trashes. There's one row now.",
    "When you finish something that was handed up to you, the person who asked now gets an email. Work you assign downward still stays quiet — it collects in Finished."
  ]},
  {v:"3.1", d:"September 22, 2026", items:[
    "Need help now asks what you need before it sends. Type a line, hit send, and your manager's alert quotes it — so they can often answer without a round trip.",
    "You can still send it blank if you just need them to look.",
    "Asking for help sends one email, not two: the note rides along with the alert rather than firing its own comment notification."
  ]},
  {v:"3.0", d:"September 22, 2026", items:[
    "Comments now email the other side of the task — if someone asks you a question on a task, you hear about it instead of finding it days later.",
    "Capped at one comment email per task per person per day, so a back-and-forth doesn't fill anyone's inbox.",
    "Private manager notes email nobody, and status changes and completions stay quiet, same as before.",
    "The Close button on a task is navy now instead of grey — easier to find at the bottom of a long task."
  ]},
  {v:"2.9", d:"September 22, 2026", items:[
    "Task Depot has a favicon — a little bus, because a depot is where things get loaded up and sent out.",
    "What's new is now a manager-only tab. Release notes are a conversation between you and me, not something the warehouse needs.",
    "The close button on every window moved from the small × in the corner down to the bottom, next to the buttons your thumb is already near."
  ]},
  {v:"2.8", d:"September 22, 2026", items:[
    "Subtasks split into the two things they were really doing. Steps are a simple checklist inside a task — tick them off as you go, no card, no separate assignee, and they never clutter anyone's list.",
    "Handing a piece to someone else now creates its own linked task, with \"Part of\" showing on both sides, because that genuinely is separate work for a separate person.",
    "A task shows its steps as a checklist, and separately any pieces handed to other people.",
    "Existing subtasks are untouched — they're linked tasks, which is what they'll continue to be."
  ]},
  {v:"2.7", d:"September 22, 2026", items:[
    "A task you've flagged for help now moves into its own \"Waiting on your manager\" section on My Day, instead of sitting in your due list looking like something you should be getting on with.",
    "It moves back to where it belongs the moment your manager replies and clears the flag.",
    "The Blocked filter on All tasks already covered this; My Day now matches."
  ]},
  {v:"2.6", d:"September 22, 2026", items:[
    "Clearing someone's help flag now opens a reply box. Whatever you write is posted as a comment on the task and emailed to them, so asking for help gets an actual answer back instead of silence.",
    "You can clear without writing anything — they just get a short note saying you looked at it.",
    "Private manager notes are unchanged: still visible only to managers, never to the person the task belongs to."
  ]},
  {v:"2.5", d:"September 22, 2026", items:[
    "All tasks now filters by Open, Blocked, Needs you, Done, Skipped, or Everything.",
    "Blocked means waiting on someone else or flagged for help — the things that aren't moving on their own.",
    "Someone asking for help now emails every manager straight away instead of waiting for the morning digest."
  ]},
  {v:"2.4", d:"September 22, 2026", items:[
    "Fixed: opening a task and tapping + Subtask put the new-subtask form behind the task window, so you could see it but not reach Save. It now sits on top, where it belongs."
  ]},
  {v:"2.3", d:"September 22, 2026", items:[
    "One welcome email when someone joins, listing everything already waiting for them with due dates — instead of a separate email per task.",
    "Load someone up over a week and they hear nothing until they sign up. Then they get one tidy message, and normal emails start from that point."
  ]},
  {v:"2.2", d:"September 22, 2026", items:[
    "Assign work to someone before they've signed up. Add them by email on the Team screen, and they appear in the assign list straight away, marked \"not signed up yet.\"",
    "The moment they create their account, everything waiting for them lands in their My Day — so nobody's first login is an empty screen.",
    "Inviting someone also approves their email address for signup, so you don't have to do that separately.",
    "The Team screen shows who's been invited but hasn't joined, and how many tasks are stacked up waiting for each of them.",
    "Their assignment emails go out when they join, not into the void beforehand."
  ]},
  {v:"2.1", d:"September 22, 2026", items:[
    "The version number now shows next to the name in the top bar, so you can tell at a glance whether what you're looking at is the build you just pushed. Tap it to jump to What's new."
  ]},
  {v:"2.0", d:"September 22, 2026", items:[
    "New Finished tab, managers only — everything your team has completed or skipped, newest first, so you can check on something you handed off weeks ago without hunting for it.",
    "A quiet counter on the tab shows how many have been finished since you last looked. No email per completion; it just waits for you.",
    "Tap \"Mark as seen\" to clear the counter when you've read them. Nothing disappears — the full history stays.",
    "Filter by person, and by finished today, this week, this month, or everything.",
    "Skipped items are shown alongside completed ones, labelled and with the reason, so you can tell a holiday from a finish."
  ]},
  {v:"1.9", d:"September 12, 2026", items:[
    "Only company email addresses can create an account. The check runs in the database, not just on the sign-up screen, so it can't be stepped around.",
    "An Access section on the Team screen: approve another domain, or approve one specific outside address (a contractor, a temp, someone at a sister company) with a note about why.",
    "Someone turned away now gets a plain explanation instead of a database error.",
    "The very first account ever created is always allowed, so the app can never lock its own owner out."
  ]},
  {v:"1.8", d:"September 12, 2026", items:[
    "New Reports tab, managers only. Open and completed work by day or by month, with a bar chart of the last 14 days or 12 months.",
    "Totals across the top: open right now, overdue right now, completed in the window, and skipped.",
    "A per-person table showing what each person has open, how much of that is overdue, and what they closed out in the window — sortable by any column.",
    "Every number is clickable context, not a scorecard: skipped is counted separately from completed so a holiday never looks like a miss."
  ]},
  {v:"1.7", d:"September 12, 2026", items:[
    "Assign the same task to several people at once. Tick the names in the assign form and each person gets their own copy — separate due dates, separate progress, no shared checkbox to fight over.",
    "Copy an existing task to other people from the task itself, optionally with a new due date. Useful when one person's version turns out to be everyone's job.",
    "Standing notes. Instructions that ride along with every occurrence of a recurring task — where the file lives, who to call, what tripped people up last time. Edit them on any occurrence and every future one inherits the change.",
    "Comments still belong to the one task they were written on, which is the point: this month's voicemail shouldn't follow you into next month."
  ]},
  {v:"1.6", d:"September 12, 2026", items:[
